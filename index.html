958 are bank coins; 1964 is the dime and quarter cutoff, 1970 the half-dollar cutoff, and 1982 is unrelated."},{"q":"Dimes and quarters are bank coins after what year?","o":["1958","1964","1970","1976"],"a":1,"e":"After 1964 dimes and quarters have no silver; 1958 is the penny cutoff, 1970 the half cutoff, and 1976 is just a bicentennial year."},{"q":"Half dollars are bank coins after what year?","o":["1964","1970","1976","1986"],"a":1,"e":"Half dollars after 1970 are clad; 1964 is the 90 percent cutoff, and 1976 and 1986 are later common years."},{"q":"1964 and earlier dimes, quarters, and halves are:","o":["40 percent silver","90 percent silver","No silver","Pure gold"],"a":1,"e":"1964 and earlier are 90 percent silver; 40 percent applies only to 1965 to 1970 halves, and they are certainly not no-silver or gold."},{"q":"Half dollars dated 1965 to 1970 are:","o":["90 percent silver","40 percent silver","No silver","Gold"],"a":1,"e":"1965 to 1970 halves are 40 percent silver; 90 percent is the 1964-and-earlier figure, and they are neither no-silver nor gold."},{"q":"A real silver dollar weighs about:","o":["12.5 grams","26.7 grams","6.25 grams","2.5 grams"],"a":1,"e":"A real silver dollar is about 26.7 grams; 12.5g is a half, 6.25g a quarter, and 2.5g a dime, so those are far too light."},{"q":"A silver quarter weighs about:","o":["2.5 grams","6.25 grams","12.5 grams","26.7 grams"],"a":1,"e":"A silver quarter is about 6.25 grams; 2.5g is a dime, 12.5g a half, and 26.7g a dollar."},{"q":"A silver dime weighs about:","o":["2.5 grams","6.25 grams","12.5 grams","26.7 grams"],"a":0,"e":"A silver dime is about 2.5 grams; 6.25g is a quarter, 12.5g a half, and 26.7g a dollar."},{"q":"Peace dollar key dates are:","o":["1921-P or 1928-P","1964","1971-D","1885"],"a":0,"e":"Peace dollar keys are 1921-P and 1928-P; no Peace dollars were released for 1964, 1971-D is an Eisenhower, and 1885 is a Morgan year."},{"q":"Which are Morgan dollar key dates?","o":["1921-P only","Any CC mint, 1893-S, 1895-P","1880-O","1900"],"a":1,"e":"Any CC plus 1893-S and 1895-P are the Morgan keys; 1921-P, 1880-O, and 1900 are common dates."},{"q":"Mercury dime key dates are:","o":["1945-S","1916-D and 1921-D","1950-D","1964"],"a":1,"e":"The Mercury keys are 1916-D and 1921-D; 1945-S, 1950-D, and 1964 are common or not even Mercury years."},{"q":"Barber dime key dates include:","o":["1894-S, 1895-O, 1896-S","1932-D","1916","1955"],"a":0,"e":"Barber dime keys include 1894-S, 1895-O, and 1896-S; 1932-D is a Washington quarter, 1916 a transition year, and 1955 a Franklin variety."},{"q":"Washington quarter key dates are:","o":["1965-D","1932-D and 1932-S","1976","1999"],"a":1,"e":"The Washington keys are 1932-D and 1932-S; 1965-D, 1976, and 1999 are common clad years."},{"q":"Standing Liberty quarter key dates are:","o":["1916 and 1921","1932","1964","1900"],"a":0,"e":"Standing Liberty keys are 1916 and 1921; 1932 is the first Washington year, and 1964 and 1900 carry no premium."},{"q":"Walking Liberty half key dates are:","o":["1955","1916 and 1921 all mint marks","1964","1971"],"a":1,"e":"Walking Liberty keys are 1916 and 1921, all mints; 1955 and 1964 are common, and 1971 is not even a Walker."},{"q":"The Franklin half key variety is:","o":["1955/1956 Bugs Bunny","1964","1948","1963"],"a":0,"e":"The Franklin key variety is the 1955/1956 Bugs Bunny; 1964, 1948, and 1963 are ordinary dates."},{"q":"Wheat or steel penny key dates include:","o":["1909-S VDB, 1914-D, 1943-D copper, 1944 steel","1959","1982","2000"],"a":0,"e":"Keys include 1909-S VDB, 1914-D, the 1943-D copper, and the 1944 steel; 1959, 1982, and 2000 are common."},{"q":"The Buffalo nickel key error is:","o":["1937-D three-legged","1913 Liberty","1955 doubled die","1964"],"a":0,"e":"The Buffalo key error is the 1937-D three-legged; the 1913 Liberty and 1955 doubled die belong to other series, and 1964 is not a Buffalo year."},{"q":"What does VDB stand for?","o":["Very Detailed Bronze","Victor David Brenner","Vintage Date Bureau","Value Date Base"],"a":1,"e":"VDB is Victor David Brenner, the designer; the other choices are invented expansions."},{"q":"Jefferson war nickels were made when, and what silver content?","o":["1942 to 1945, 35 percent silver","1965, 40 percent","1900, 90 percent","1971, none"],"a":0,"e":"War nickels are 1942 to 1945 at 35 percent silver; the other pairs use the wrong years and the wrong percentages."},{"q":"10K gold is stamped:","o":["585","417 or 41.7 percent","750","916"],"a":1,"e":"10K is stamped 417; 585 is 14K, 750 is 18K, and 916 is 22K."},{"q":"14K gold is stamped:","o":["417","585 or 58.5 percent","750","916"],"a":1,"e":"14K is stamped 585; 417 is 10K, 750 is 18K, and 916 is 22K."},{"q":"18K gold is stamped:","o":["585","750 or 75 percent","916","417"],"a":1,"e":"18K is stamped 750; 585 is 14K, 916 is 22K, and 417 is 10K."},{"q":"22K gold is stamped:","o":["585","750","916 or 91.6 percent","417"],"a":2,"e":"22K is stamped 916; 585 is 14K, 750 is 18K, and 417 is 10K."},{"q":"Which stamp means REJECT (not solid gold)?","o":["585","750","HGE","417"],"a":2,"e":"HGE is plated, so reject it; 585, 750, and 417 are all real solid-gold karat stamps."},{"q":"Sterling silver is marked:","o":[".925, Sterling, or Ster","EPNS","HGE","417"],"a":0,"e":"Sterling is marked .925, Sterling, or Ster; EPNS and HGE are plated, and 417 is a gold karat."},{"q":"Platinum is marked:","o":["925","PT, Plat, Platinum, or 950","585","HGE"],"a":1,"e":"Platinum is marked PT, Plat, Platinum, or 950; 925 is sterling, 585 is 14K gold, and HGE is plated."},{"q":"Costume jewelry is handled how?","o":["Priced as gold","Bought by the pound and very cheap","Sent to the numismatist","Always rejected"],"a":1,"e":"Costume is bought by the pound and very cheap; it is not priced as gold, sent to the numismatist, or always rejected."},{"q":"Foreign coins should be:","o":["Melted","Sent to the specialist channel for experts","Priced fast","Paid face value"],"a":1,"e":"Send foreign coins to the specialist channel; melting, fast pricing, or paying face value can each destroy or miss value."},{"q":"A possible key date should be:","o":["Melted","Priced fast","Set aside and routed to the numismatist","Rejected"],"a":2,"e":"Set a possible key date aside for the numismatist; never melt it, guess a price, or reject it."},{"q":"A Morgan dollar has a CC mint mark. Correct action?","o":["Price it at melt","Route it to the numismatist, do not price it","Melt it","Pay the 90 percent silver value"],"a":1,"e":"Route it to the numismatist: CC is Carson City, the rarest mint, and the coin can be worth far more than metal. Pricing at melt, melting it, or paying only the 90 percent silver value would all throw away the collector premium."},{"q":"A customer has one 1964 Kennedy half and three 1971 Kennedy halves. The silver?","o":["All 90 percent","The 1964 is 90 percent; the 1971 halves are clad, no silver","All 40 percent","All clad, no silver"],"a":1,"e":"The 1964 is 90 percent and the 1971 halves are clad: the cutoffs are 90 percent through 1964 and clad from 1971 on (1965 to 1970 halves are 40 percent). 'All 90' ignores the date change, 'all 40' applies the wrong middle band, and 'all clad' misses the silver 1964."},{"q":"A 1943 cent is copper-colored and does NOT stick to a magnet. You:","o":["Treat it as a common steel cent","Route it to the numismatist as a possible 1943 copper key","Melt it","Hand it back at face value"],"a":1,"e":"Route it: most 1943 cents are steel and magnetic, so a non-magnetic copper one could be the rare 1943 copper key. Treating it as common steel, melting it, or handing it back at face could give away a major coin."},{"q":"A 1943 cent sticks to a magnet. It is most likely:","o":["A rare copper key","A common steel cent, low value","A 90 percent silver coin","A 1944 steel key"],"a":1,"e":"A common steel cent: 1943 cents were struck in steel, so a magnetic one is the ordinary version. The rare keys are the 1943 copper (non-magnetic) and the 1944 steel; pennies are never silver."},{"q":"Which is the Mercury dime key date?","o":["1917-D","1916-D","1916-S","1945"],"a":1,"e":"1916-D is the key (along with 1921-D), known for its very low mintage. 1917-D and 1916-S are common dates, and 1945 is a late, common year."},{"q":"A silver dollar weighs about 20 grams on your scale. It is:","o":["A real Peace dollar","Likely fake; a real one is about 26.7 grams","A real Morgan dollar","A 40 percent silver dollar"],"a":1,"e":"Likely fake: a genuine Morgan or Peace dollar weighs about 26.7 grams, so 20 grams is well underweight. Calling it a real Peace or Morgan ignores the weight, and there is no standard 40 percent dollar at that weight."},{"q":"An item is stamped .925. It is:","o":["90 percent coin silver","Sterling silver","Platinum","22K gold"],"a":1,"e":"Sterling silver: .925 is the sterling mark (92.5 percent silver). 90 percent is the coin-silver figure but not what .925 denotes, platinum is marked 950 or PT, and 22K gold is marked 916."},{"q":"A gold ring is stamped 750. It is:","o":["10K","14K","18K","22K"],"a":2,"e":"18K: 750 means 75 percent gold, which is 18 karat. 10K is 417, 14K is 585, and 22K is 916, so each of those carries a different stamp."},{"q":"A chain is stamped '1/20 12K GF'. You:","o":["Buy it as 12K solid","Reject it; GF means gold-filled, not solid","Pay half the gold value","Treat it as 14K"],"a":1,"e":"Reject it: GF means gold-filled, a thin gold layer over base metal, and 1/20 tells you how little gold there is. Buying it as solid 12K, paying half the gold value, or calling it 14K all pay for solid gold that is not there."},{"q":"A Jefferson nickel dated 1943 has a large mint mark over the dome. It is:","o":["A common nickel, no silver","A war nickel, 35 percent silver","90 percent silver","40 percent silver"],"a":1,"e":"A war nickel, 35 percent silver: 1942 to 1945 nickels with the large mint mark over Monticello used silver because nickel metal went to the war. A normal nickel has no silver, and 90 or 40 percent are coin-silver bands that do not apply to nickels."},{"q":"VDB stands for:","o":["Victor Daniel Brenner","Victor David Brenner","Vincent David Brenner","Victor David Brunner"],"a":1,"e":"Victor David Brenner, the designer of the Lincoln cent. The others are near-misses on the name (wrong middle name, wrong first name, wrong surname spelling)."},{"q":"A Buffalo nickel famous error is:","o":["1938-D three-legged","1937-D three-legged","1937-S three-legged","1936-D two-legged"],"a":1,"e":"The 1937-D three-legged is the famous error, caused by an over-polished die. The 1938-D and 1937-S are normal coins, and there is no recognized 1936-D two-legged variety."},{"q":"A customer brings a handful of foreign coins. You:","o":["Melt them for silver","Send them to the specialist channel for experts","Pay face value","Reject them outright"],"a":1,"e":"Send them to the specialist channel: foreign coins need expert evaluation. Melting risks destroying a collectible, paying face ignores possible value, and rejecting outright could turn away a real find."},{"q":"An Indian Head penny key date is:","o":["1876","1877","1879","1908-S"],"a":1,"e":"1877 is the key Indian Head date (along with 1909-S), with a famously low mintage. 1876 and 1879 are common, and 1908-S, while better, is not the marquee key the way 1877 is."}],"comp":"Hand the trainee mixed coins and jewelry. They must identify metal, silver eras, key dates, and gold stamps on sight. Pass only at 90 percent accuracy with no costly misses."},{"id":"m2.11","name":"Early and Non-Frequent Coins","passMark":90,"lessonHTML":"<div class=\"outcome\"><b>What you will be able to do</b><br>Recognize the early and unusual United States coins that walk in once in a while, and follow one exact rule so you never under-buy a rarity or overpay on a guess.</div>\n   <p>Most of your day is modern silver and gold. But estates hide older coins that are worth far more than metal, and they do not have a price on the deal sheet. Misjudging one of these is the difference between a routine day and a deal that pays for the whole show. The skill here is not memorizing every value. It is recognizing the coin and following the lookup rule.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>If a coin is early, unusual, or you are not certain, you do not price it from memory and you do not guess. You identify it, then you look it up. Raw coins: eBay sold and completed listings, auction format, recently ended. Graded coins: greysheet wholesale. Post your finding in the team pricing channel, or route it to the numismatist. Condition decides most of the value, so when in doubt, route it.</p></div>\n   <h3>The coins to recognize on sight</h3>\n   <ul>\n     <li><strong>Large cents (1793 to 1857):</strong> big copper cents, much larger than a modern penny. Early dates (1793, 1799, 1804) are major. Always look up or route.</li>\n     <li><strong>Flying Eagle cents (1856 to 1858):</strong> small cent with an eagle in flight. 1856 is a rare pattern. Look up or route.</li>\n     <li><strong>Indian Head cents (1859 to 1909):</strong> common in low grade, but 1877 and 1909-S are keys. Pull the date.</li>\n     <li><strong>Two-cent pieces (1864 to 1873):</strong> the first coin to carry In God We Trust. Always look up.</li>\n     <li><strong>Three-cent pieces:</strong> tiny silver trimes (1851 to 1873) and the larger three-cent nickel (1865 to 1889). Easy to miss because they are small. Look up.</li>\n     <li><strong>Half dimes (1792 to 1873):</strong> tiny silver coins, smaller than a dime. Real silver plus collector value. Look up.</li>\n     <li><strong>Twenty-cent piece (1875 to 1878):</strong> short-lived, looks like a quarter without reeding. Always look up.</li>\n     <li><strong>Pre-1933 US gold:</strong> gold dollars, quarter eagles, half eagles, eagles, double eagles. High value, often well above melt. Route to the numismatist or look up carefully.</li>\n     <li><strong>Type and commemorative coins, and anything foreign or unfamiliar:</strong> if you do not instantly know it, treat it as a lookup.</li>\n   </ul>\n   <h3>The lookup rule, exactly</h3>\n   <ul>\n     <li><strong>Raw (ungraded):</strong> search eBay, filter to <strong>Sold and Completed</strong>, format <strong>Auction</strong> only, and use recently ended results in similar condition. Active or Buy It Now listings are asking prices, not paid prices, so they do not count.</li>\n     <li><strong>Graded (in a PCGS, NGC, or other slab):</strong> use <strong>greysheet wholesale</strong> for the date and grade on the label.</li>\n     <li><strong>Then post it in the team pricing channel</strong> so it is on record and a second set of eyes can confirm before you commit real money.</li>\n     <li><strong>If condition is hard to judge, or the coin is clearly significant, route it to the numismatist instead of pricing it yourself.</strong></li>\n   </ul>\n   <div class=\"standard\"><b>Why this protects your money</b><br>Condition swings these coins wildly. A cleaned or damaged early coin can be worth a fraction of a clean one. Pricing from memory or from active listings is how a closer overpays on a common piece or hands back a rarity. The lookup rule turns a guess into a number you can defend.</div>\n   <h3>Common mistakes</h3>\n   <ul>\n     <li>Pricing from active eBay listings instead of sold and completed auction results.</li>\n     <li>Ignoring condition, cleaning, or damage, which can cut value sharply.</li>\n     <li>Treating an early silver coin as just melt and missing the collector premium.</li>\n     <li>Guessing to look fast instead of posting it to the pricing channel.</li>\n   </ul>","comp":"Lay out three early or non-frequent coins (or photos): one early-dated large cent or two-cent piece, one slabbed graded coin, and one common-looking Indian Head. The trainee must name each coin type and state the exact lookup path for each (raw to eBay sold/completed auction, graded to greysheet, post to the pricing channel or route to the numismatist). Pass only if all three identifications and lookup paths are correct and they never offer a guessed price.","test":[{"q":"A customer sets down a large copper coin almost the size of a half dollar, dated 1799. You:","o":["Pay it as one cent","Identify it as an early large cent and look it up or route it","Melt it for copper","Reject it as foreign"],"a":1,"e":"It is an early large cent and 1799 is a major date, so identify and look it up or route it; paying it as one cent or melting it throws away a rarity, and it is not foreign."},{"q":"You find a small cent with an eagle in flight dated 1857. The correct move is to:","o":["Price it from memory","Treat it as a Flying Eagle cent and look up sold comps or route it","Pay face value","Assume it is fake"],"a":1,"e":"It is a Flying Eagle cent, which carries collector value, so look up recent sold comps or route it; pricing from memory, paying face, or assuming fake all risk a costly miss."},{"q":"For a raw (ungraded) early coin, the right price source is:","o":["Active eBay listings","eBay sold and completed auction results, recently ended","The customer's estimate","A coin magazine from years ago"],"a":1,"e":"Raw coins are priced from eBay sold and completed auction results that ended recently; active listings are asking prices, the customer's estimate is not data, and an old magazine is stale."},{"q":"For a graded coin in a PCGS or NGC slab, you price from:","o":["eBay active listings","Greysheet wholesale for that date and grade","Melt value only","A guess based on how shiny it is"],"a":1,"e":"Graded coins are priced from greysheet wholesale for the exact date and grade; active listings, melt only, or eye appeal alone will misprice it."},{"q":"You identify a real two-cent piece dated 1864. You:","o":["Pay it as two cents","Look it up and post it to the pricing channel","Melt it","Hand it back"],"a":1,"e":"A two-cent piece has collector value, so look it up and post it to the pricing channel; paying two cents, melting, or handing it back ignores the premium."},{"q":"A tiny silver coin smaller than a dime turns out to be a half dime. You should:","o":["Treat it as melt only","Look it up; it has silver and collector value","Reject it as foreign","Pay it as a dime"],"a":1,"e":"A half dime has both silver and collector value, so look it up; melt-only undervalues it, it is not foreign, and it is not a dime."},{"q":"An early coin looks like it was polished bright and shiny. This usually means:","o":["It is worth more","It may be cleaned, which often lowers value, so route or look up carefully","It is automatically fake","It is automatically gem grade"],"a":1,"e":"Bright, polished surfaces often mean a cleaned coin, which usually lowers value, so route or look up carefully; shine does not raise value, prove a fake, or prove gem grade."},{"q":"A customer brings a pre-1933 US gold half eagle. The right action is:","o":["Pay melt and move on","Route to the numismatist or look it up carefully; it often beats melt","Reject it","Treat it as costume"],"a":1,"e":"Pre-1933 US gold often sells well above melt, so route to the numismatist or look it up carefully; paying melt, rejecting, or calling it costume leaves money on the table."},{"q":"You are unsure whether a coin is an early type coin or a common one. You:","o":["Guess high to be safe","Guess low to be safe","Look it up or route it; never guess","Pay melt"],"a":2,"e":"When unsure, look it up or route it and never guess; guessing high overpays, guessing low or paying melt can lose the deal or the rarity."},{"q":"A coin that looks like a quarter but has a smooth (no reeded) edge and a seated figure, dated 1875, is likely a:","o":["Modern quarter","Twenty-cent piece, which is collectible","Foreign coin","Token"],"a":1,"e":"That is the short-lived twenty-cent piece, which is collectible, so look it up; it is not a modern quarter, foreign, or a token."},{"q":"Why use sold and completed auction results rather than active listings?","o":["They look nicer","They show what people actually paid, not just what sellers are asking","They are faster to find","There is no reason"],"a":1,"e":"Sold and completed auction results show what buyers actually paid; active listings are only asking prices, which is not what the coin is worth."},{"q":"After you find a defensible price on an early coin, you:","o":["Keep it to yourself","Post it in the team pricing channel for a second set of eyes","Pay double to be safe","Skip the deal sheet"],"a":1,"e":"Post your finding in the pricing channel so it is on record and confirmed; keeping it to yourself, overpaying, or skipping the sheet all break the process."},{"q":"An Indian Head cent dated 1877 is:","o":["A common date","A key date worth pulling and looking up","Worthless","Always fake"],"a":1,"e":"1877 is a key Indian Head date, so pull it and look it up; it is not common, worthless, or automatically fake."},{"q":"A customer insists their early coin is worth a number they saw on an active listing. You:","o":["Pay that number","Explain active listings are asking prices and price from sold auction comps","Argue and walk away","Refuse to look"],"a":1,"e":"Explain that active listings are asking prices and price from sold auction comps; paying their number, arguing, or refusing to look all hurt the deal or your margin."},{"q":"A tiny silver three-cent coin (a trime) shows up in a jar of change. You:","o":["Spend it","Recognize it as a collectible trime and look it up","Melt it","Pay three cents"],"a":1,"e":"A silver three-cent trime is collectible, so look it up; spending, melting, or paying three cents ignores its value."},{"q":"The single rule that covers all early and unusual coins is:","o":["Always pay melt","Identify, then look up (raw to sold auction, graded to greysheet) or route; never guess","Always reject them","Always pay what the customer asks"],"a":1,"e":"Identify, then look up or route, and never guess; always paying melt, rejecting, or paying the asking number are all wrong defaults."},{"q":"You find what looks like a large cent but the date and details are worn flat. You:","o":["Guess a date and price","Note the wear, look up comps for that worn grade, or route it","Assume top grade","Pay top dollar"],"a":1,"e":"Worn details mean low grade, so look up comps for that condition or route it; guessing, assuming top grade, or paying top dollar misprices a worn coin."},{"q":"A graded coin's slab shows a grade of MS-63. To price it you:","o":["Ignore the grade","Use greysheet wholesale for that exact date and grade","Pay melt","Crack it out first"],"a":1,"e":"Use greysheet wholesale for the exact date and grade on the slab; ignoring the grade, paying melt, or cracking it out all destroy the basis for a fair price."},{"q":"Foreign or unfamiliar old coins should be:","o":["Priced fast","Looked up or routed to the specialist; never guessed","Melted","Paid at face"],"a":1,"e":"Look up or route foreign and unfamiliar coins; pricing fast, melting, or paying face risks destroying or missing value."},{"q":"A whole box of early coins arrives and the customer is waiting. You:","o":["Rush a price for the whole box","Sort and look up or route the significant pieces; do not guess to be fast","Pay melt for everything","Reject the box"],"a":1,"e":"Sort and look up or route the significant pieces rather than rushing; a fast guess, melt-for-all, or rejecting the box all cost money or the deal."},{"q":"The reason early coins are not on the deal sheet is:","o":["They are worthless","Their value depends on date and condition, so each is looked up individually","They are illegal to buy","Nobody collects them"],"a":1,"e":"Their value depends on date and condition, so each is looked up individually; they are not worthless, illegal, or uncollected."},{"q":"You suspect an early gold coin might be a counterfeit. You:","o":["Buy it anyway","Route it to the specialist rather than risk it","Melt it","Pay full gold value"],"a":1,"e":"Route a suspected counterfeit to the specialist; buying anyway, melting, or paying full value risks a costly fake."},{"q":"A common-date Indian Head cent in worn condition is:","o":["A major rarity","Low value, but still looked up if you are unsure","Worth thousands","Pure silver"],"a":1,"e":"A common worn Indian Head is low value, though you still look it up if unsure; it is not a major rarity, worth thousands, or silver (it is copper)."},{"q":"Posting an early-coin price to the team channel mainly helps because:","o":["It slows you down","It records the basis and lets a second person confirm before you commit","It is required by law","It impresses the customer"],"a":1,"e":"It records the basis and lets a second person confirm before money moves; it is not about slowing down, a legal requirement, or impressing anyone."}]},{"id":"m2.2","name":"Testing and Verifying Metal","passMark":90,"lessonHTML":"\n   <div class=\"outcome\"><b>What you'll be able to do</b><br>After this module you can verify gold, silver, and platinum using the magnet test, the scratch test, and the scale, and you will know the one thing you must never do.</div>\n   <h2>Step 1: The Magnet Test (Always First)</h2>\n   <p>Real gold, silver, and platinum are <strong>not magnetic</strong>. If a piece sticks to a strong magnet, it is fake. Test the chain or band itself, not the clasp, because clasps can contain steel springs.</p>\n   <h2>Step 2: The Scratch Test (Jewelry Only)</h2>\n   <p><strong>Never acid-test coins.</strong> Acid permanently destroys collector value. For gold jewelry, scratch the piece on the stone and apply acid in steps: 10K, then 14K, then 18K. If the mark stays at a level, the piece is at least that karat. For silver, the reaction tells you the type: a creamy or milky look means real sterling, while green or fizzing means plated.</p>\n   <h2>Step 3: The Scale</h2>\n   <p>Zero the scale before every batch. Weigh each piece and compare to the known weights from the identification module. Suspiciously light coins are likely fake.</p>\n   <h2>Deductions</h2>\n   <p>You pay for metal, not for stones or non-metal parts. Deduct weight for stones (more for larger stones), and deduct a large share of a pocket watch's weight for the movement and glass. For a sterling set with weighted knife handles, weigh a fork or spoon and multiply rather than weighing the filled knives.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>Magnet first, then scratch (jewelry only), then scale. Never put acid on a coin. These steps in this order protect you from fakes and protect the customer from a wrong call.</div>\n   <div class=\"takeaways\"><h3>Key Takeaways</h3><ul>\n   <li>Test order is magnet first, then scratch (jewelry only), then scale.</li>\n   <li>Real gold, silver, and platinum are not magnetic; if it sticks, it is fake.</li>\n   <li>Test the chain or band, not the clasp, because clasps can hold steel springs.</li>\n   <li>Never acid-test coins; acid destroys collector value permanently.</li>\n   <li>On silver, creamy or milky means real sterling; green or fizzing means plated.</li>\n   <li>Zero the scale before every batch and compare to known weights.</li>\n   <li>Deduct for stones and pocket-watch movements; weigh a fork or spoon for weighted knife sets.</li>\n   </ul></div>","test":[{"q":"What is the first test on suspect metal?","o":["Acid","Magnet","Scale","Loupe"],"a":1,"e":"The magnet is always the fast first screen; acid, the scale, and the loupe come later or not at all on the first pass."},{"q":"Real gold, silver, and platinum react to a magnet how?","o":["Strong pull","No attraction","Repel","Spin"],"a":1,"e":"Real precious metals show no magnetic attraction; they do not pull, repel, or spin."},{"q":"Where do you test a chain with a magnet?","o":["The clasp","The chain or band itself","The tag","The box"],"a":1,"e":"Test the chain itself; clasps can hold steel springs that grab a magnet even on real gold, and the tag or box tells you nothing."},{"q":"Why never acid-test coins?","o":["It is slow","Acid permanently destroys collector value","It is costly","Acid runs out"],"a":1,"e":"Acid permanently destroys a coin's collector value; the reason is not that it is slow, costly, or that acid runs out."},{"q":"On a silver scratch test, creamy or milky means:","o":["Plated","Real sterling","Fake","Gold"],"a":1,"e":"A creamy, milky reaction means real sterling; plated or fake pieces react green or fizz, and gold uses a different test."},{"q":"On a silver scratch test, green or fizzing means:","o":["Real sterling","Plated","Platinum","Pure silver"],"a":1,"e":"Green or fizzing means plated, so do not buy; real sterling, platinum, and pure silver do not react that way."},{"q":"For gold jewelry, you apply acid in this order:","o":["18K, 14K, 10K","10K, 14K, 18K","All at once","Random"],"a":1,"e":"Step up 10K, 14K, 18K so the surviving mark tells the karat; starting at 18K, going random, or all at once gives no clean reading."},{"q":"Before weighing a new batch you must:","o":["Clean the room","Zero the scale","Calibrate yearly only","Nothing"],"a":1,"e":"Zero the scale before every batch; cleaning the room, calibrating only yearly, or doing nothing leaves the weight unreliable."},{"q":"You pay for:","o":["Stones and glass","Metal only","The whole weight always","The box"],"a":1,"e":"You pay for metal only; stones, glass, and non-metal parts are deducted, not paid for."},{"q":"How do you weigh a sterling set with weighted knives?","o":["Weigh the knives directly","Weigh a fork or spoon and multiply","Skip it","Estimate"],"a":1,"e":"Weigh a fork or spoon and multiply, because knife handles are filled with non-silver weighting; weighing knives directly overpays, and skipping or estimating is inaccurate."},{"q":"A suspiciously light coin is:","o":["A bonus","Likely fake","Always real","Worth more"],"a":1,"e":"A suspiciously light coin is likely fake; it is not a bonus, always real, or worth more."},{"q":"The correct full test order is:","o":["Scale, magnet, scratch","Magnet, scratch (jewelry), scale","Scratch, scale, magnet","Acid on everything"],"a":1,"e":"Magnet, then scratch on jewelry only, then scale; leading with the scale or scratch skips the quick screen, and acid on everything destroys coins."},{"q":"A pocket watch deduction accounts for:","o":["The brand","The movement and glass","The strap color","Nothing"],"a":1,"e":"Deduct for the movement and glass since they are not gold; the brand and strap color are not weight, and 'nothing' overpays."},{"q":"Larger stones get:","o":["A smaller deduction","A larger deduction","No deduction","Added value"],"a":1,"e":"Larger stones get a larger weight deduction; a smaller or no deduction overpays, and stones never add metal value."},{"q":"A gold-colored chain sticks to a strong magnet only at the clasp. You:","o":["Reject the whole piece","Test the chain itself, since clasps can hold steel springs","Call it fake","Buy it as 14K without testing"],"a":1,"e":"Test the chain itself: clasps often contain steel springs that grab a magnet even when the gold is real, so the clasp can mislead you. Rejecting or calling it fake on the clasp alone is premature, and buying without testing the gold is reckless."},{"q":"A customer hands you a rare silver dollar to verify. You:","o":["Acid-test it","Never acid-test it; use the magnet and scale","Scratch-test it on the stone","Skip testing"],"a":1,"e":"Never acid-test a coin; use the magnet and scale: acid permanently destroys collector value. Scratching it on the stone damages it the same way, and skipping testing leaves you exposed to fakes."},{"q":"A silver scratch test turns green and fizzes. The piece is:","o":["Real sterling","Plated, do not buy","999 fine","Platinum"],"a":1,"e":"Plated: green or fizzing is the base metal reacting under the plating. Real sterling gives a creamy, milky look, .999 fine is a purity mark not a reaction, and platinum is not judged by this silver test."},{"q":"A silver scratch test leaves a creamy, milky streak. The piece is:","o":["Plated","Real sterling","Fake","Gold"],"a":1,"e":"Real sterling: a creamy, milky reaction is the sign of genuine silver. Plated or fake pieces react green or fizz, and gold is tested with the gold acids, not the silver test."},{"q":"A sterling set has weighted knife handles. You:","o":["Weigh the knives directly","Weigh a fork or spoon and multiply","Skip the set","Estimate by count"],"a":1,"e":"Weigh a fork or spoon and multiply: knife handles are filled with non-silver weighting, so weighing the knives directly overpays for filler. Skipping the set walks away from real silver, and estimating by count is not accurate."},{"q":"A brooch has several set stones. For weight you:","o":["Pay the full weight","Deduct weight for the stones, more for larger ones","Reject it","Weigh the stones as silver"],"a":1,"e":"Deduct for the stones, more for larger ones, because you pay only for metal. Paying full weight or counting the stones as silver overpays, and rejecting a real silver piece over a few stones loses a deal."},{"q":"A solid gold pocket watch case still has the movement in it. You:","o":["Pay the full weight","Deduct a large share for the movement and glass, pay for the gold","Reject it","Pay only for the jewels"],"a":1,"e":"Deduct for the movement and glass and pay for the gold: the case is the gold, the movement and crystal are not. Paying full weight overpays for non-gold parts, rejecting it loses the gold, and the jewels are not what you are buying here."},{"q":"You magnet-test a gold chain at the clasp and it sticks. You:","o":["Reject the chain","Re-test the chain body; clasps can be base metal","Buy it as solid gold","Acid test it on the spot"],"a":1,"e":"Re-test the body, since clasps are often base metal; rejecting on the clasp, assuming solid gold, or jumping to acid is premature."},{"q":"Acid testing is appropriate for:","o":["Coins","Jewelry only, never coins","Both equally","Neither"],"a":1,"e":"Acid test jewelry only and never coins; testing coins damages them and the other answers are wrong."},{"q":"Before weighing an item, the scale should be:","o":["Left as is","Zeroed first","Set to ounces always","Ignored"],"a":1,"e":"Zero the scale first for an accurate weight; leaving it, a fixed unit, or ignoring it gives a wrong figure."},{"q":"A silver scratch test shows a green, fizzing reaction. This means:","o":["Real sterling","Plated, not solid silver","High purity","Platinum"],"a":1,"e":"Green and fizzing indicates plating, not solid silver; a creamy or milky result would suggest real silver."}],"comp":"Have the trainee run the full test order (magnet, scratch on jewelry only, scale zeroed, pennyweight) on sample items and call real versus plated. Pass only if the order and calls are correct and they never acid-test a coin."},{"id":"m2.7","name":"Watches and Diamonds","passMark":85,"lessonHTML":"\n   <div class=\"outcome\"><b>What you'll be able to do</b><br>After this module you can judge a pocket watch by its jewel count, tell a luxury wrist watch from a fashion watch, describe a diamond using the 4 Cs, and know exactly when to route a stone or watch to the specialist.</div>\n   <h2>Pocket Watches: Jewel Counts</h2>\n   <p>The jewel count is stamped on the movement (open the back to read it) and tells you the tier of the watch:</p>\n   <ul>\n   <li><strong>7 jewels:</strong> a standard starter watch, usually lower value.</li>\n   <li><strong>15 to 20 jewels:</strong> a mid-level watch, usually about 50 to 100 dollars.</li>\n   <li><strong>21 jewels and up:</strong> a high-end watch, usually about 100 to 500 dollars.</li>\n   </ul>\n   <p>A solid gold pocket watch case also has melt value. Weigh the case and deduct for the movement and glass, the same way you learned in the testing module.</p>\n   <h2>Luxury Wrist Watches We Buy</h2>\n   <p>These brands hold real value: <strong>Rolex, Patek Philippe, Audemars Piguet, Omega, Cartier, Tudor, Breitling, TAG Heuer, IWC, and Jaeger-LeCoultre</strong>. Any solid gold case of any brand also has melt value. When a luxury or vintage piece looks valuable or you are unsure, route it to the specialist rather than guessing.</p>\n   <h2>Watches We Do NOT Buy</h2>\n   <p>Fashion and quartz brands have little or no resale value: <strong>Fossil, Michael Kors, Invicta, Guess</strong>, and any smartwatch (Apple Watch, Samsung, Fitbit) or replica. The exception is a solid gold case, which is bought for its metal weight regardless of the name.</p>\n   <h2>Diamonds: The 4 Cs</h2>\n   <p>Every diamond is judged on four things:</p>\n   <ul>\n   <li><strong>Carat:</strong> the weight, which is the size. Bigger is rarer and worth more.</li>\n   <li><strong>Cut:</strong> how well it is cut, which controls the sparkle. A better cut is worth more.</li>\n   <li><strong>Color:</strong> graded from D (colorless, best) down toward Z (more yellow or brown). Less color is worth more.</li>\n   <li><strong>Clarity:</strong> how few internal marks (inclusions) it has, from Flawless down to Included. Fewer inclusions is worth more.</li>\n   </ul>\n   <h2>When to Buy and When to Route</h2>\n   <p>Small accent stones set in gold jewelry usually add little value; handle them as part of the jewelry deal and deduct their weight as you learned in testing. For any <strong>loose diamond, any stone roughly half a carat and up, or any certified (graded) stone</strong>, route it to the specialist for valuation. Diamond value swings sharply with grade, so a quick guess at the table can cost a lot.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>Buy what is clearly safe (jewel-count pocket watches, known luxury brands, solid gold cases, small accent stones in jewelry) and route what swings in value (significant or loose or certified diamonds, vintage or uncertain high-end watches) to the specialist. The specialist exists to protect the margin on the items that are easiest to misjudge.</div>\n   <div class=\"takeaways\"><h3>Key Takeaways</h3><ul>\n   <li>Pocket watch jewel counts: 7 is a starter (low value), 15 to 20 is mid level (about 50 to 100 dollars), 21 and up is high end (about 100 to 500 dollars).</li>\n   <li>A solid gold watch case has melt value; weigh it and deduct for the movement and glass.</li>\n   <li>Luxury brands we buy include Rolex, Patek Philippe, Audemars Piguet, Omega, Cartier, Tudor, Breitling, TAG Heuer, IWC, and Jaeger-LeCoultre.</li>\n   <li>We do not buy Fossil, Michael Kors, Invicta, Guess, smartwatches, or replicas, unless the case is solid gold.</li>\n   <li>The diamond 4 Cs are Carat, Cut, Color, and Clarity.</li>\n   <li>Color is best at D (colorless); clarity is best when Flawless with the fewest inclusions.</li>\n   <li>Handle small accent stones within the jewelry deal; route loose, half-carat-and-up, or certified diamonds to the specialist.</li>\n   <li>Route uncertain or vintage high-end watches to the specialist too.</li>\n   </ul></div>","test":[{"q":"Where is the jewel count found?","o":["On the strap","Stamped on the movement","On the glass","On the box"],"a":1,"e":"The jewel count is stamped on the movement, so open the back; it is not on the strap, glass, or box."},{"q":"A 7-jewel pocket watch is:","o":["A high-end watch","A standard starter, lower value","Always over 500 dollars","Not a watch"],"a":1,"e":"7 jewels is a starter, lower-value watch; it is not high-end, always over 500 dollars, or 'not a watch'."},{"q":"A 15 to 20 jewel pocket watch is usually worth:","o":["Nothing","About 50 to 100 dollars","Over 1000 dollars","Face value"],"a":1,"e":"15 to 20 jewels is mid-level at about 50 to 100 dollars; it is not worth nothing, over 1000 dollars, or just face value."},{"q":"A 21-plus jewel pocket watch is usually worth:","o":["Nothing","About 100 to 500 dollars","Exactly 10 dollars","Face value"],"a":1,"e":"21-plus jewels is high end at about 100 to 500 dollars; it is not worth nothing, exactly 10 dollars, or face value."},{"q":"A solid gold watch case is:","o":["Worthless","Bought for its metal weight regardless of brand","Always rejected","Only worth the jewels"],"a":1,"e":"A solid gold case is bought for its melt value no matter the brand; it is not worthless, always rejected, or worth only the jewels."},{"q":"Which is a luxury brand we buy?","o":["Fossil","Rolex","Invicta","Guess"],"a":1,"e":"Rolex is a luxury buy brand; Fossil, Invicta, and Guess are fashion names with little resale."},{"q":"Which watch do we NOT buy (unless solid gold)?","o":["Omega","Cartier","Michael Kors","Patek Philippe"],"a":2,"e":"Michael Kors is fashion, so skip it unless the case is solid gold; Omega, Cartier, and Patek Philippe are luxury buys."},{"q":"A smartwatch like an Apple Watch is:","o":["Bought as luxury","Not bought","Routed to the numismatist","Worth more than Rolex"],"a":1,"e":"A smartwatch is not bought; it is not a luxury piece, a numismatist item, or worth more than a Rolex."},{"q":"What are the diamond 4 Cs?","o":["Carat, Cut, Color, Clarity","Cost, Color, Cut, Carat","Carat, Curve, Color, Clarity","Cut, Class, Color, Carat"],"a":0,"e":"The 4 Cs are Carat, Cut, Color, and Clarity; 'Cost', 'Curve', and 'Class' are not grading factors."},{"q":"Carat measures a diamond's:","o":["Sparkle","Weight (size)","Color","Inclusions"],"a":1,"e":"Carat measures weight, which is the size; sparkle, color, and inclusions are the other Cs of cut, color, and clarity."},{"q":"Diamond color is best at:","o":["Z","D (colorless)","M","Yellow"],"a":1,"e":"Color is best at D, colorless, running down toward Z; M is tinted, Z is the most tinted, and 'yellow' is poor color."},{"q":"Clarity is best when the diamond is:","o":["Heavily included","Flawless with the fewest inclusions","Yellow","Large only"],"a":1,"e":"Clarity is best when nearly flawless with the fewest inclusions; heavy inclusions are worst, yellow is a color issue, and size is carat."},{"q":"Small accent stones in gold jewelry are:","o":["Always routed","Handled within the jewelry deal, weight deducted","Worth more than the gold","Rejected"],"a":1,"e":"Small accent stones are handled in the jewelry deal with their weight deducted; routing every one wastes time, they are not worth more than the gold, and you do not reject the ring over them."},{"q":"A loose or half-carat-and-up or certified diamond should be:","o":["Priced fast at the table","Routed to the specialist","Melted","Rejected"],"a":1,"e":"Route loose, half-carat-plus, or certified diamonds to the specialist; pricing fast at the table, melting, or rejecting risks a costly miss."},{"q":"Why route significant diamonds to the specialist?","o":["It is a rule with no reason","Diamond value swings sharply with grade","To slow down","They are worthless"],"a":1,"e":"Because value swings sharply with grade, a table guess can cost a lot; it is not a rule without reason, a delay tactic, or because they are worthless."},{"q":"A vintage or uncertain high-end watch should be:","o":["Guessed at the table","Routed to the specialist","Rejected","Melted"],"a":1,"e":"Route a vintage or uncertain high-end watch to the specialist; guessing at the table, rejecting, or melting all risk the value."},{"q":"A customer has an Omega and an Apple Watch. You:","o":["Buy both","Buy the Omega, skip the smartwatch","Buy neither","Buy the Apple Watch"],"a":1,"e":"Buy the Omega, skip the smartwatch: Omega is a luxury buy brand, an Apple Watch has no resale here. Buying both treats a smartwatch as luxury, buying neither passes on a real Omega, and buying only the Apple Watch is backwards."},{"q":"A pocket watch movement is stamped 7 jewels. It is:","o":["High end, 100 to 500 dollars","A starter watch, lower value","Over 1000 dollars","Mid level, 50 to 100 dollars"],"a":1,"e":"A starter, lower-value watch: 7 jewels is the entry tier. 15 to 20 jewels is the 50 to 100 dollar mid tier and 21 plus is the 100 to 500 high tier, so the higher-value answers belong to higher jewel counts."},{"q":"A pocket watch movement is stamped 21 jewels. It is usually:","o":["A starter","Mid level, 50 to 100 dollars","High end, about 100 to 500 dollars","Worthless"],"a":2,"e":"High end, about 100 to 500 dollars: 21 and up is the top tier. A starter is 7 jewels, mid level is 15 to 20, and 'worthless' ignores that a high jewel count signals a better watch."},{"q":"A no-name watch has a solid 14K gold case. You:","o":["Reject it because the brand is unknown","Buy it for the melt value of the gold case","Buy it as a luxury piece","Pay only for the jewels"],"a":1,"e":"Buy it for the gold melt value: any solid gold case is worth its metal no matter the brand. Rejecting it over the name leaves real gold on the table, it is not a luxury piece, and the jewels are not what carries the value here."},{"q":"Which is a buy brand?","o":["Fossil","Patek Philippe","Invicta","Guess"],"a":1,"e":"Patek Philippe is a top luxury buy brand. Fossil, Invicta, and Guess are fashion names with little resale unless the case is solid gold."},{"q":"Which do we skip unless the case is solid gold?","o":["Cartier","Michael Kors","Tudor","IWC"],"a":1,"e":"Michael Kors is fashion, so skip it unless the case is solid gold. Cartier, Tudor, and IWC are recognized luxury buy brands."},{"q":"The diamond 4 Cs are:","o":["Carat, Cut, Clarity, Cost","Carat, Cut, Color, Clarity","Carat, Color, Clarity, Curve","Cut, Color, Class, Carat"],"a":1,"e":"Carat, Cut, Color, Clarity are the four grading factors. Cost is a price, not a grade, and 'Curve' and 'Class' are not diamond terms."},{"q":"Which diamond color grade is best (colorless)?","o":["Z","D","M","K"],"a":1,"e":"D is the top, colorless grade; the scale runs D down to Z as more color appears. So Z is the most tinted, and M and K sit in between, all below D."},{"q":"Best clarity means:","o":["The most inclusions","The fewest inclusions, toward Flawless","The biggest carat","The best color"],"a":1,"e":"The fewest inclusions, toward Flawless, defines top clarity. The most inclusions is the worst clarity, and carat and color are different Cs entirely."},{"q":"A customer has a loose 1-carat diamond with a GIA certificate. You:","o":["Price it at the table","Route it to the specialist for valuation","Buy it as an accent stone","Reject it"],"a":1,"e":"Route it to the specialist: a loose, certified, half-carat-and-up stone swings too much in value to guess at the table. Pricing it yourself risks a costly miss, treating a 1-carat as an accent stone undervalues it, and rejecting it passes on a real asset."},{"q":"A gold ring has tiny accent diamonds. You:","o":["Route every stone to the specialist","Handle them in the jewelry deal and deduct stone weight","Pay extra for the diamonds","Reject the ring"],"a":1,"e":"Handle them in the jewelry deal and deduct their weight: small accent stones add little value. Routing every tiny stone wastes the specialist's time, paying extra overvalues them, and rejecting the ring loses the gold."},{"q":"You are unsure about a vintage high-end watch. You:","o":["Guess high","Guess low","Route it to the specialist","Reject it"],"a":2,"e":"Route it to the specialist: uncertain or vintage high-end watches need expert eyes. Guessing high risks overpaying, guessing low risks losing the deal or underpaying, and rejecting it may pass on something valuable."}],"comp":"Give the trainee sample watches and stones. They must sort watches into buy or skip and route any loose, half-carat-and-up, or certified diamond to the specialist. Pass only on correct buy/skip and routing."},{"id":"m2.12","name":"Trading Cards (Baseball and Pokemon)","passMark":90,"lessonHTML":"<div class=\"outcome\"><b>What you will be able to do</b><br>Recognize the vintage and high-value cards worth flagging, and follow one rule: buy only with proof of value, or route to a specialist. Never guess at the table.</div>\n   <p>Cards show up in estates and collections more than people expect, and a single card can be worth more than a tray of coins. You are not expected to be a card grader. You are expected to recognize what might be valuable, refuse to guess, and either prove the value or route it.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>Raw and graded cards can be bought by a closer, but only with <strong>proof of value</strong>: recent eBay sold and completed auction comps for raw, or market and greysheet-style pricing plus the grade and population for graded. Post your finding to the team pricing channel, or route the card to a specialist. No proof, no price. Condition and authenticity decide most of the value, so when in doubt, route it.</div>\n   <h3>Baseball: what to flag</h3>\n   <ul>\n     <li><strong>Pre-war tobacco and gum cards:</strong> T206 era (1909 to 1911), 1933 Goudey (Babe Ruth, Lou Gehrig). High value, often counterfeited. Route or prove.</li>\n     <li><strong>1950s Topps and Bowman:</strong> especially the 1952 Topps Mickey Mantle, and rookie and star cards of Mantle, Mays, Aaron, Clemente, Jackie Robinson, Ted Williams.</li>\n     <li><strong>Vintage Hall of Famers and rookie cards (pre-1980):</strong> stars in clean condition carry strong value.</li>\n     <li><strong>Condition is everything:</strong> centering, corners, edges, and surface. A creased or off-center card is worth a fraction of a sharp one.</li>\n   </ul>\n   <h3>Pokemon: what to flag</h3>\n   <ul>\n     <li><strong>Vintage WOTC era (1999 to 2003):</strong> Base Set, especially <strong>1st Edition</strong> and <strong>Shadowless</strong>, and holographic Charizard, Blastoise, and Venusaur. Also Jungle, Fossil, Team Rocket, and Japanese promos.</li>\n     <li><strong>Sealed product:</strong> sealed booster boxes and packs from these eras are high value. Do not open them.</li>\n     <li><strong>Modern chase cards:</strong> alt arts, special illustration rares, and secret rares can be valuable; look them up.</li>\n     <li><strong>Fakes are everywhere,</strong> especially Charizard and vintage baseball. Bad print, wrong texture, or off weight means route to a specialist.</li>\n   </ul>\n   <h3>Graded cards</h3>\n   <ul>\n     <li>Slabs from <strong>PSA, BGS, CGC, or SGC</strong> carry a grade from 1 to 10. Higher grade means dramatically higher value, and a gem grade can be a large multiple of a raw card.</li>\n     <li>Price graded cards from sold comps for that exact card and grade, and check the population (how many exist at that grade).</li>\n   </ul>\n   <div class=\"standard\"><b>The lookup rule, exactly</b><br>Raw: eBay sold and completed, auction format, recently ended, matched to similar condition. Graded: sold comps for the same card and grade, plus population. Post to the pricing channel or route to a specialist. Never price from active listings, and never price from memory.</div>\n   <h3>Common mistakes</h3>\n   <ul>\n     <li>Guessing a card's value to look knowledgeable.</li>\n     <li>Pricing from active listings instead of sold comps.</li>\n     <li>Ignoring condition or authenticity on a high-value card.</li>\n     <li>Opening sealed product, which destroys its value.</li>\n   </ul>","comp":"Show the trainee a mixed group of cards (or photos): one vintage flag (a 1950s star or a WOTC-era holo Charizard), one graded slab, one common modern card, and one possibly fake high-value card. The trainee must say which to flag, state the proof-of-value path for raw versus graded, identify the sealed or suspicious item correctly, and confirm they would not guess a price. Pass only if every call is correct and they never quote a guessed number.","test":[{"q":"A customer brings a 1952 Topps Mickey Mantle in a sleeve. You:","o":["Quote a price from memory","Recognize it as a major vintage card and pull sold comps or route it","Pay a few dollars","Assume it is fake and reject it"],"a":1,"e":"It is a major vintage card, so pull sold comps or route it; quoting from memory, paying a few dollars, or assuming fake all risk a large miss."},{"q":"For a raw (ungraded) card, proof of value comes from:","o":["Active eBay listings","eBay sold and completed auction comps in similar condition","The customer's word","A price guide from a decade ago"],"a":1,"e":"Raw cards are priced from sold and completed auction comps in similar condition; active listings, the customer's word, and old guides are not what the card actually sells for."},{"q":"A holographic Charizard from the 1999 Base Set, marked 1st Edition, is:","o":["A common modern card","A high-value vintage Pokemon card to flag and prove or route","Worthless","Automatically fake"],"a":1,"e":"A 1st Edition Base Set holo Charizard is a high-value vintage card, so flag and prove it or route it; it is not common, worthless, or automatically fake."},{"q":"A graded PSA 9 card is priced from:","o":["Raw card comps","Sold comps for that exact card and grade, plus population","Melt value","A guess"],"a":1,"e":"Graded cards are priced from sold comps for the same card and grade, with population in mind; raw comps, melt, or a guess will misprice it."},{"q":"A customer has a sealed Pokemon booster box from the early 2000s. You:","o":["Open it to check the cards","Recognize sealed product is high value and do not open it; prove or route","Pay for one pack's worth","Reject it"],"a":1,"e":"Sealed product is high value and opening it destroys that value, so prove or route it sealed; opening, underpaying, or rejecting all lose money."},{"q":"A high-value vintage card has a soft, fuzzy print and feels wrong. You:","o":["Buy it at full value","Route it to a specialist; it may be a counterfeit","Pay half and hope","Ignore the print quality"],"a":1,"e":"Bad print and feel suggest a counterfeit, so route it to a specialist; buying at full value, half-and-hope, or ignoring the signs risks paying for a fake."},{"q":"Condition on a vintage card matters because:","o":["It does not affect value","Centering, corners, edges, and surface can multiply or gut the value","Only the year matters","Only the player matters"],"a":1,"e":"Condition can multiply or gut the value, so it matters as much as the card itself; year and player alone do not set the price."},{"q":"The rule for whether a closer can buy a card is:","o":["Never buy cards","Buy only with proof of value, or route to a specialist","Buy anything that looks old","Buy only graded cards"],"a":1,"e":"A closer can buy with proof of value or route to a specialist; never-buy, buy-anything-old, and graded-only are all wrong."},{"q":"A T206 era (1909 to 1911) baseball card appears. You:","o":["Pay a few dollars","Treat it as a major pre-war card: flag, prove, or route","Assume reprint and reject","Melt it"],"a":1,"e":"Pre-war tobacco-era cards can be very valuable, so flag and prove or route; underpaying, assuming reprint, or melting all risk a costly mistake (and you cannot melt a card)."},{"q":"Why never price a card from active listings?","o":["They are illegal","They show asking prices, not what cards actually sold for","They load slowly","No reason"],"a":1,"e":"Active listings show asking prices, not actual sales; that is why you use sold comps instead."},{"q":"A graded card's label reads BGS 9.5. The grade tells you:","o":["Nothing useful","It is a high grade, which usually means a large premium over raw","It is fake","It is low value"],"a":1,"e":"A 9.5 is a high grade that usually carries a large premium over a raw copy; the grade is very useful, not a sign of fake or low value."},{"q":"A common modern base card in played condition is:","o":["A major find","Low value, set aside or bulk it, do not waste the appointment on it","Worth grading","Worth thousands"],"a":1,"e":"A common modern card in played condition is low value, so set it aside; it is not a major find, grade-worthy, or worth thousands."},{"q":"After you find a defensible card price, you:","o":["Keep it to yourself","Post it to the team pricing channel and confirm before paying","Pay double","Skip the deal sheet"],"a":1,"e":"Post the finding to the pricing channel and confirm before paying; keeping it quiet, overpaying, or skipping the sheet breaks the process."},{"q":"A 1933 Goudey Babe Ruth is offered. The right move is:","o":["Pay a small amount fast","Recognize it as a key pre-war card and prove value or route it","Assume it is a reprint","Ignore it"],"a":1,"e":"It is a key pre-war card, so prove value or route it; paying fast, assuming reprint, or ignoring it all risk a major loss."},{"q":"You are unsure if a Pokemon card is 1st Edition or Shadowless. You:","o":["Guess and price it","Look it up or route it; the variant changes the value a lot","Pay common-card money","Reject it"],"a":1,"e":"The variant changes value sharply, so look it up or route it; guessing, paying common money, or rejecting risks a miss."},{"q":"Population (how many exist at a grade) matters because:","o":["It does not","Scarcer high grades command higher prices","It only matters for coins","It sets the melt value"],"a":1,"e":"Scarcer high grades command higher prices, so population matters; it applies to cards too and has nothing to do with melt."},{"q":"A customer claims their raw card is mint and worth a top-grade price. You:","o":["Pay the top-grade price","Price it from raw sold comps for its actual condition, not a graded price","Argue and walk","Refuse to look"],"a":1,"e":"Price a raw card from raw sold comps for its real condition, not a graded-card price; paying top-grade, arguing, or refusing all hurt the deal or your margin."},{"q":"Vintage Hall of Fame rookie cards in clean condition are:","o":["Always worthless","Often valuable, worth flagging and proving","Only worth melt","Always fake"],"a":1,"e":"Clean vintage Hall of Fame rookies are often valuable, so flag and prove them; they are not worthless, melt-only, or automatically fake."},{"q":"If a card might be valuable but you cannot prove it at the table, you:","o":["Guess high","Guess low","Route it to a specialist","Reject it"],"a":2,"e":"If you cannot prove value, route it to a specialist; guessing high or low risks overpaying or losing it, and rejecting may pass on a real find."},{"q":"The fastest way to lose money on cards is to:","o":["Use sold comps","Route uncertain cards","Guess a price to look knowledgeable","Post to the pricing channel"],"a":2,"e":"Guessing to look knowledgeable is how you lose money; using sold comps, routing, and posting to the channel are all the right habits."},{"q":"A graded slab from PSA, BGS, CGC, or SGC mainly gives you:","o":["Nothing","A verified grade and authenticity to price from","A melt weight","A face value"],"a":1,"e":"A reputable slab gives a verified grade and authenticity you can price from; it is not nothing, a melt weight, or a face value."},{"q":"You see an alt-art or special illustration rare from a modern set. You:","o":["Bulk it as common","Look it up; modern chase cards can be valuable","Open more packs","Reject it"],"a":1,"e":"Modern chase cards like alt arts can be valuable, so look it up; bulking it, opening packs, or rejecting it could miss real value."}]},{"id":"m2.14","name":"Customer Sign-In and the CRM","passMark":85,"lessonHTML":"<div class=\"outcome\"><b>What you will be able to do</b><br>Handle every arriving customer the same way, in-store or at a roadshow: sign them in and either open their existing lead or create one on the spot, so no customer ever falls out of the pipeline.</div>\n   <p>Every person who walks up is either already in the system or about to be. The first thing you do is not pull out a loupe. It is the sign-in and the CRM. This protects follow-up, keeps the pipeline honest, and means a no-buy today can still become a deal next month.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>When a customer arrives, in-store or at a roadshow, you (1) get them signed in, and (2) check the CRM for them. If you find their lead, open it, confirm the details, and move it to the right stage. If there is no lead, create one for them on the spot with their name, phone, and what they brought. There is no third option. Every arrival is a lead.</div>\n   <h3>The arrival flow</h3>\n   <ul>\n     <li><strong>Greet and sign in:</strong> use the sign-in sheet or tablet so arrivals are tracked in order and nobody is missed.</li>\n     <li><strong>Search the CRM</strong> by name or phone. Many walk-ins were set by a setter and already have a lead with notes on what they have.</li>\n     <li><strong>Found a lead:</strong> open it, confirm the name and items, and move the stage to reflect that they have arrived and are in an appointment.</li>\n     <li><strong>No lead:</strong> create the lead right then with name, phone, and a short note of what they brought. This is the same whether you are in the store or on the road.</li>\n     <li><strong>After the appointment:</strong> update the stage to match the outcome (bought, sent to consignment, low value, junk, lost), so the record is true for the next person.</li>\n   </ul>\n   <div class=\"standard\"><b>Why this protects your money</b><br>The pipeline is where future deals live. A customer who does not sell today but is logged with what they have is a follow-up that closes later. A customer who is never entered is gone forever. The sign-in and CRM step is small and it compounds.</div>\n   <h3>Common mistakes</h3>\n   <ul>\n     <li>Diving straight into the items without signing them in or checking the CRM.</li>\n     <li>Skipping lead creation for a walk-in because they did not buy.</li>\n     <li>Leaving the stage wrong after the appointment, so follow-up breaks.</li>\n     <li>Treating roadshow arrivals differently from in-store; the flow is the same.</li>\n   </ul>","comp":"Run a mock arrival. Give the trainee a name and what the customer brought. They must greet and sign the customer in, search the CRM, and either open the existing lead and set the correct stage or create a new lead with name, phone, and items. Then give an outcome (for example, sent to consignment) and have them set the closing stage. Pass only if they always end with the customer correctly in the CRM at the right stage, for both an in-store and a roadshow version.","test":[{"q":"A customer walks up to your table. The first thing you do is:","o":["Start testing their gold","Greet, sign them in, and check the CRM for their lead","Quote a price","Send them away"],"a":1,"e":"Greet, sign in, and check the CRM first; testing, quoting, or sending them away all skip the step that protects the pipeline."},{"q":"You search the CRM and find the customer's existing lead. You:","o":["Ignore it and start fresh","Open it, confirm details, and move it to the arrived or in-appointment stage","Delete it","Leave it untouched"],"a":1,"e":"Open the existing lead, confirm details, and move the stage; starting fresh, deleting, or leaving it untouched corrupts the record."},{"q":"A walk-in has no lead in the CRM. You:","o":["Skip the CRM since they just showed up","Create a lead with their name, phone, and what they brought","Wait until after the deal","Only create one if they buy"],"a":1,"e":"Create the lead on the spot with name, phone, and items; skipping it, waiting, or only logging buyers loses future follow-up."},{"q":"The sign-in and CRM flow at a roadshow is:","o":["Different from in-store","The same as in-store: sign in, check the CRM, open or create the lead","Skipped on the road","Only for big deals"],"a":1,"e":"The flow is the same on the road as in-store; it is not different, skipped, or limited to big deals."},{"q":"A customer does not sell today. You should:","o":["Delete their lead","Update the stage to the real outcome so follow-up works later","Leave the stage as new","Mark them won"],"a":1,"e":"Update the stage to the real outcome so the lead can be followed up; deleting, leaving it new, or marking won all break the record."},{"q":"Why log a walk-in who did not buy?","o":["No reason","A logged lead with their items is a future follow-up; an unlogged one is gone","To slow down","To bill them"],"a":1,"e":"A logged lead is a future deal; an unlogged walk-in is lost forever. It is not busywork or a way to bill anyone."},{"q":"You find two possible leads for the same name. You:","o":["Pick one at random","Confirm with the customer which is theirs by phone or details, then use that one","Create a third","Skip the CRM"],"a":1,"e":"Confirm the right lead by phone or details and use it; picking at random, creating a third, or skipping the CRM corrupts the pipeline."},{"q":"The sign-in sheet or tablet exists to:","o":["Decorate the table","Track arrivals in order so nobody is missed","Replace the CRM","Collect payment"],"a":1,"e":"It tracks arrivals in order so nobody is missed; it is not decoration, a CRM replacement, or a payment tool."},{"q":"After a customer is sent to consignment, the lead stage should be:","o":["Won","Sent to Consignment","New","Junk"],"a":1,"e":"Set it to Sent to Consignment to match the outcome; Won, New, or Junk would misreport what happened."},{"q":"A setter already logged this customer with notes on what they have. You:","o":["Re-key everything from scratch","Open the existing lead and build on the notes","Ignore the notes","Delete and recreate"],"a":1,"e":"Open the existing lead and build on the setter's notes; re-keying, ignoring, or recreating wastes the work and risks errors."},{"q":"Creating a lead for a walk-in should capture, at minimum:","o":["Just a first name","Name, phone, and what they brought","Only the items","Nothing"],"a":1,"e":"Capture name, phone, and items at minimum so the lead is usable; a first name only, items only, or nothing leaves it useless for follow-up."},{"q":"The reason every arrival becomes a lead is:","o":["To pad numbers","So the pipeline is complete and every customer can be followed up","To slow the line","To avoid testing"],"a":1,"e":"So the pipeline is complete and every customer is followable; it is not padding, a delay, or a way to skip testing."},{"q":"If the CRM is slow and a customer is waiting, you:","o":["Skip the CRM entirely","Still sign them in and create or open the lead, even if you finish entry right after","Guess their info later","Turn them away"],"a":1,"e":"Still sign them in and open or create the lead, finishing entry promptly; skipping the CRM, guessing later, or turning them away breaks the pipeline."},{"q":"A customer's lead is in the CRM but the items listed are wrong. You:","o":["Leave the wrong items","Update the lead with the correct items during the appointment","Delete the lead","Create a duplicate"],"a":1,"e":"Update the lead with the correct items so the record is true; leaving it wrong, deleting, or duplicating corrupts the pipeline."},{"q":"Treating the sign-in and CRM step as optional leads to:","o":["Faster, cleaner days","Lost follow-ups and a pipeline that cannot be trusted","Higher pay","Better testing"],"a":1,"e":"Skipping it causes lost follow-ups and an untrustworthy pipeline; it does not make days cleaner, pay higher, or testing better."},{"q":"A customer who bought today should have their lead set to:","o":["New","The closed or won outcome stage","Cold Lead","Junk Lead"],"a":1,"e":"Set a buyer's lead to the closed or won outcome; New, Cold Lead, or Junk Lead would misreport a closed deal."},{"q":"The CRM check happens:","o":["Only for scheduled customers","For every arrival, scheduled or walk-in","Only at the end of the day","Only for big deals"],"a":1,"e":"Check the CRM for every arrival, scheduled or not; limiting it to scheduled, end-of-day, or big deals misses leads."},{"q":"You realize mid-appointment the customer was never signed in. You:","o":["Ignore it","Sign them in and make sure their lead exists before they leave","Start over","Send them home"],"a":1,"e":"Sign them in and ensure the lead exists before they leave; ignoring it, starting over, or sending them home loses the record or the deal."},{"q":"A returning customer from months ago walks in. You:","o":["Create a brand-new lead","Find and reopen their existing lead so the history is intact","Treat them as never seen","Skip the CRM"],"a":1,"e":"Find and reopen the existing lead to keep the history; a new duplicate, treating them as new, or skipping the CRM loses context."},{"q":"The single rule for arrivals is:","o":["Test first, log later","Sign in and either open or create the lead, every time, in-store and on the road","Only log buyers","Log at end of day"],"a":1,"e":"Sign in and open or create the lead every time, everywhere; test-first, buyers-only, or end-of-day logging all break the pipeline."},{"q":"Keeping lead stages accurate after each appointment mainly helps:","o":["No one","The next person and future follow-up, because the record is true","Only the customer","Only management bonuses"],"a":1,"e":"Accurate stages help the next person and future follow-up; it is not pointless, customer-only, or just about bonuses."},{"q":"A walk-in brought only items we do not buy. You still:","o":["Skip the CRM","Log the lead and set it to Junk Lead with a note of what they had","Pretend they never came","Mark them won"],"a":1,"e":"Log the lead and set it to Junk Lead with a note; skipping, pretending, or marking won would falsify the record."}]},{"id":"m2.3","name":"Pricing and Buying (The Deal Sheet)","passMark":85,"lessonHTML":"\n   <div class=\"outcome\"><b>What you'll be able to do</b><br>After this module you can use the deal sheet to build an offer, read the Offer and Total Value, respect the MAX Face ceiling, and complete a clean transaction record.</div>\n   <h2>The Deal Sheet Has Four Tabs</h2>\n   <p>The pricing tool is a spreadsheet with four tabs along the bottom:</p>\n   <ul>\n   <li><strong>CALCULATOR:</strong> this is the only tab you use at the table. You enter what the customer has here.</li>\n   <li><strong>Show Expenses & Info:</strong> holds the live spot prices and the show expenses. Do not edit this unless you are told to.</li>\n   <li><strong>Final Count:</strong> end-of-show reconciliation.</li>\n   <li><strong>Show Totals & Profit:</strong> the master totals page. It is marked \"Do Not Alter This Page\". Never touch it; the calculator pulls its values from here.</li>\n   </ul>\n   <h2>How the Calculator Is Laid Out</h2>\n   <p>Each row is one item type (a coin name and denomination, or a metal like 14K). Reading left to right:</p>\n   <ul>\n   <li><strong>Amount:</strong> what you type in. For coins it is the count. For gold, silver, and platinum it is the weight in <strong>pennyweight (DWT)</strong>.</li>\n   <li><strong>Coin and Item:</strong> the type and denomination, already filled in for you.</li>\n   <li><strong>Face Value:</strong> the coin's face value, already set.</li>\n   <li><strong>Times Face:</strong> the sheet calculates this for you. It is the figure that builds your offer line.</li>\n   <li><strong>Total Value (the F column):</strong> the offer amount for that row, which the sheet works out from Amount, Face, and Times Face.</li>\n   <li><strong>MAX Face:</strong> the most that item is worth to us. This is the ceiling. It comes from the master totals page.</li>\n   </ul>\n   <h2>The Two Numbers at the Top</h2>\n   <ul>\n   <li><strong>Offer:</strong> the sum of all your rows. This is the number you offer the customer.</li>\n   <li><strong>Total Value:</strong> the value of everything at MAX Face. This is the full value basis of the lot.</li>\n   </ul>\n   <p>The gap between the Offer and the Total Value is the room built into the deal. You can negotiate up toward MAX Face, but you never go above MAX Face.</p>\n   <h2>Prices Change Every Hour</h2>\n   <p>For gold, silver, and platinum, the MAX Face values are not fixed. They recalculate automatically from the <strong>spot prices</strong> on the Show Expenses & Info tab, and those update <strong>every hour</strong> based on what we are getting for the metal. Because of this:</p>\n   <ul>\n   <li>Always work from the current sheet for the day, never an old copy.</li>\n   <li>Never quote a metal price from memory; let the live sheet do it.</li>\n   <li>You do not set or change spot prices. Leadership keeps them current.</li>\n   </ul>\n   <h2>Entering a Deal, Step by Step</h2>\n   <ol>\n   <li>Identify and verify each item using the identification and testing modules.</li>\n   <li>Find the matching row on the CALCULATOR tab.</li>\n   <li>Type the Amount: the count for coins, the weight in pennyweight (DWT) for precious metal.</li>\n   <li>Enter collectibles in the collectibles section with their own offer and value.</li>\n   <li>Read the Offer total. That is what you present, in person, never over the phone.</li>\n   <li>Negotiate only up to MAX Face, never above it.</li>\n   </ol>\n   <h2>The Transaction Record</h2>\n   <p>Every closed deal needs a complete record: the customer's identification, their signature, and the itemized list of what was purchased and paid. Keep the deal sheet printout with the record. Accurate records protect the company and are required for second-hand purchases.</p>\n   <h2>If the Numbers Do Not Work</h2>\n   <p>If the customer wants more than MAX Face, do not exceed the ceiling. Offer the alternative path: <strong>consignment</strong>, where the item is sold on auction for them. Move that lead to the Sent to Consignment stage.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>Work only on the CALCULATOR tab, never alter the totals page, and always use the current day's sheet because metal prices change hourly. MAX Face is the ceiling on every item. If a deal cannot work under MAX Face, pivot to consignment rather than forcing it.</div>\n   <div class=\"takeaways\"><h3>Key Takeaways</h3><ul>\n   <li>The deal sheet has four tabs; you work only on the CALCULATOR tab.</li>\n   <li>Never alter the Show Totals & Profit page; the calculator pulls its values from there.</li>\n   <li>Amount is the count for coins and the weight in pennyweight (DWT) for gold, silver, and platinum.</li>\n   <li>The sheet fills in Face Value, Times Face, the row Total Value, and MAX Face for you.</li>\n   <li>Offer is the sum you present; Total Value is the value of everything at MAX Face.</li>\n   <li>MAX Face is the ceiling; negotiate up toward it but never above it.</li>\n   <li>Gold, silver, and platinum MAX Face values come from spot prices that change every hour, so always use the current sheet and never quote metal from memory.</li>\n   <li>You do not set spot prices; leadership keeps them current.</li>\n   <li>Present offers in person, keep a full record (ID, signature, itemized list, printout).</li>\n   <li>If the customer wants more than MAX Face, pivot to consignment (Sent to Consignment stage).</li>\n   </ul></div>","test":[{"q":"How many tabs does the deal sheet have?","o":["One","Two","Four","Ten"],"a":2,"e":"The sheet has four tabs (CALCULATOR, Show Expenses & Info, Final Count, Show Totals & Profit); one, two, or ten is the wrong count."},{"q":"Which tab do you use at the table?","o":["Final Count","CALCULATOR","Show Totals & Profit","Show Expenses & Info"],"a":1,"e":"You enter items on the CALCULATOR tab; Final Count is for closed deals, Show Totals is the locked master, and Show Expenses & Info holds spot prices."},{"q":"The Show Totals & Profit page should be:","o":["Edited each deal","Never altered","Deleted","Printed only"],"a":1,"e":"It is marked Do Not Alter because the calculator pulls from it; editing each deal, deleting it, or 'print only' would break every offer."},{"q":"In the Amount column, for coins you enter:","o":["The weight","The count","The year","The price"],"a":1,"e":"For coins, Amount is the count; weight is for metal, and the year or a price do not go there."},{"q":"In the Amount column, for gold, silver, or platinum you enter:","o":["The count","The weight in pennyweight (DWT)","The year","Nothing"],"a":1,"e":"For metals, Amount is the weight in pennyweight; the count is for coins, and the year or 'nothing' do not belong."},{"q":"Which fields does the sheet fill in for you?","o":["Nothing","Face Value, Times Face, row Total Value, and MAX Face","Only the date","Only the count"],"a":1,"e":"The sheet fills Face Value, Times Face, row Total Value, and MAX Face; you only enter the Amount, so 'nothing', 'only the date', or 'only the count' are wrong."},{"q":"The 'Offer' at the top is:","o":["The ceiling","The number you offer the customer","The spot price","The expenses"],"a":1,"e":"Offer is the sum of your rows, what you present; the ceiling is MAX Face, spot is the metal price, and expenses are separate."},{"q":"The 'Total Value' at the top is:","o":["What you offer","The value of everything at MAX Face","The hotel cost","The count"],"a":1,"e":"Total Value is the full value basis at MAX Face; it is not what you offer, the hotel cost, or the count."},{"q":"MAX Face is:","o":["The opening offer","The ceiling, the most an item is worth to us","The spot price","The weight"],"a":1,"e":"MAX Face is the ceiling you never exceed; the opening offer is lower, spot is an input, and weight is just an entry."},{"q":"You may negotiate:","o":["Above MAX Face for big deals","Up toward MAX Face but never above it","Only at the Offer number","Never"],"a":1,"e":"Negotiate up toward MAX Face but never above it; exceeding it for big deals breaks the rule, staying only at the Offer leaves room unused, and 'never' is wrong."},{"q":"Why do metal values change during the day?","o":["Random chance","Spot prices update every hour","The customer sets them","They do not change"],"a":1,"e":"Metal values change because spot updates hourly; it is not random, customer-set, or unchanging."},{"q":"Where do the spot prices live?","o":["The CALCULATOR tab","The Show Expenses & Info tab","The customer's phone","Nowhere"],"a":1,"e":"Spot prices live on the Show Expenses & Info tab; not the CALCULATOR, the customer's phone, or nowhere."},{"q":"Because prices change hourly you should:","o":["Use any old copy","Always use the current day's sheet","Quote from memory","Guess"],"a":1,"e":"Always use the current day's sheet; an old copy, memory, or a guess will be wrong on metal."},{"q":"Who sets or changes the spot prices?","o":["You","Leadership","The customer","Each buyer"],"a":1,"e":"Leadership sets spot; you, the customer, and individual buyers do not."},{"q":"Collectibles are entered:","o":["In the coin rows","In the collectibles section with their own offer and value","Not at all","On the phone"],"a":1,"e":"Collectibles go in their own section with their own offer and value; not in the coin rows, not skipped, and not over the phone."},{"q":"Offers are presented:","o":["Over the phone","In person","By text","By email"],"a":1,"e":"Offers are presented in person; phone, text, or email quotes set expectations before the items are verified."},{"q":"A complete transaction record includes:","o":["Just a name","ID, signature, itemized list, and the printout","A photo only","Nothing"],"a":1,"e":"A complete record needs ID, signature, an itemized list, and the printout; a name alone, a photo only, or nothing leaves it undocumented."},{"q":"If the customer wants more than MAX Face you:","o":["Exceed the ceiling","Pivot to consignment","Pay anyway","Argue"],"a":1,"e":"If they want more than MAX Face, pivot to consignment; exceeding the ceiling, paying anyway, or arguing all break the rule."},{"q":"A consignment deal moves the lead to which stage?","o":["Junk Lead","Sent to Consignment","Out of State","Won"],"a":1,"e":"It moves to Sent to Consignment; Junk Lead, Out of State, and Won do not fit a consignment."},{"q":"The gap between Offer and Total Value represents:","o":["An error","The room built into the deal","The tax","The shipping"],"a":1,"e":"The gap is the negotiating room up to MAX Face; it is not an error, the tax, or the shipping."},{"q":"Which tab do you enter the customer's items on?","o":["Show Totals & Profit","CALCULATOR","F
