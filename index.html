   id:'m2.4', name:'The Shows Sales Framework (10 Steps)', days:'Days 56 to 68', passMark:80,
   lessonHTML:`
   <div class="outcome"><b>What you'll be able to do</b><br>After this module you can run a full in-person appointment end to end using the 10-step framework and handle the three most common objections.</div>
   <h2>The 10 Steps</h2>
   <ol>
   <li>Clarify why they came in.</li>
   <li>Understand who they are (read the avatar).</li>
   <li>Overview what they have done before (sold items before, other quotes).</li>
   <li>Show why you are the best (the collector's association story).</li>
   <li>Handle obstacles early, before the offer.</li>
   <li>Start the evaluation openly, where the customer can see it.</li>
   <li>Re-check any unanswered concerns.</li>
   <li>Deliver the price clearly and confidently.</li>
   <li>Sale or no sale.</li>
   <li>Get their information before they leave.</li>
   </ol>
   <h2>The First Minute</h2>
   <p>Greet the customer by name, introduce yourself, and build a little rapport. Much of the decision is shaped in the first minute. Avoid politics and religion. Be warm and confident.</p>
   <h2>Delivering the Price</h2>
   <p>State the value clearly, hold a confident and positive tone, and then be quiet and let the customer respond. When they accept and reach to finalize, move the items to your side to complete the handoff.</p>
   <h2>The Three Common Objections</h2>
   <ul>
   <li><strong>"I want to pass it down to my kids":</strong> ask whether the kids actually collect; most do not. Gently reframe to the value of cash today for something the family will use.</li>
   <li><strong>"I need to ask my spouse":</strong> ask who is more knowledgeable, offer to include them by phone, and reassure that a free appraisal with no obligation is easy to say yes to.</li>
   <li><strong>"I researched it, it's worth X":</strong> do not confirm or deny; explain that online listings are usually asking prices, not what collectors actually pay, then walk them through their specific items.</li>
   </ul>
   <h2>Feel, Felt, Found</h2>
   <p>For emotional objections: "I understand how you feel. Others have felt the same. What they found is..." then give a true, helpful outcome.</p>
   <h2>If the Cash Offer Fails</h2>
   <p>On a high-value item where cash does not work, pivot to <strong>consignment</strong> rather than losing the item. Either way, get their information and offer a reason to come back before they leave.</p>
   <div class="standard"><b>Operating Standard</b><br>Follow the 10 steps in order and never skip the evaluation done openly in front of the customer. Transparency builds the trust that closes the deal and earns repeat business.</div>
   <div class="takeaways"><h3>Key Takeaways</h3><ul>
   <li>The framework has 10 steps, from Clarify to Get their information.</li>
   <li>Much of the decision forms in the first minute; greet by name and avoid politics and religion.</li>
   <li>Run the evaluation openly where the customer can see it.</li>
   <li>Deliver the price confidently, then go quiet and let them respond.</li>
   <li>Handle pass-it-down, spouse, and researched-price objections without ever quoting against their number.</li>
   <li>Feel, Felt, Found is the tool for emotional objections.</li>
   <li>If cash fails on a high-value item, pivot to consignment.</li>
   <li>Always get their information before they leave.</li>
   </ul></div>`,
   test:[
    {q:"How many steps are in the framework?",o:["7","8","10","12"],a:2,e:"The framework has ten steps; 7, 8, and 12 are the wrong count."},
    {q:"What is step 1?",o:["Deliver the price","Clarify why they came in","Close","Evaluate"],a:1,e:"Step 1 is clarify why they came in; delivering the price, closing, and evaluating come later."},
    {q:"When is much of the decision shaped?",o:["At the price","In the first minute","At the end","Never"],a:1,e:"Much of the decision is shaped in the first minute; the price moment matters, but it is not at the end or never."},
    {q:"In the first minute you should avoid:",o:["Smiling","Politics and religion","Their name","Eye contact"],a:1,e:"Avoid politics and religion early; smiling, using their name, and eye contact all help, not hurt."},
    {q:"The evaluation should be done:",o:["In a back room","Openly where the customer can see","After they leave","On the phone"],a:1,e:"Run the evaluation openly where they can see; a back room, doing it after they leave, or over the phone looks like hiding something."},
    {q:"After you deliver the price you should:",o:["Keep talking","Go quiet and let them respond","Lower it","Leave"],a:1,e:"State the price, then go quiet; talking past it or lowering it weakens the number, and leaving abandons the close."},
    {q:"For 'pass it down to my kids' you:",o:["Insist they sell all","Ask whether the kids actually collect and reframe to cash value","Mock them","Quote a price"],a:1,e:"Ask whether the kids actually collect, then reframe to cash value; insisting they sell, mocking them, or quoting a price all backfire."},
    {q:"For 'I need to ask my spouse' you:",o:["End the appointment","Ask who is more knowledgeable and offer to include them by phone","Pressure them","Quote a price"],a:1,e:"Ask who is more knowledgeable and offer to include them by phone; ending the appointment, pressuring, or quoting a price loses the deal."},
    {q:"For 'I researched it, it's worth X' you:",o:["Agree to X","Argue lower","Explain online prices are asking prices, not paid prices","Walk away"],a:2,e:"Explain online prices are asking, not paid; agreeing to X, arguing lower, or walking away all hurt the deal."},
    {q:"Feel, Felt, Found is used for:",o:["Pricing math","Emotional objections","Shipping","Scheduling"],a:1,e:"Feel, Felt, Found is for emotional objections; pricing math, shipping, and scheduling are logistics."},
    {q:"If a cash offer fails on a high-value item you:",o:["Lose the item","Pivot to consignment","Pay over the limit","Argue"],a:1,e:"Pivot to consignment rather than losing it; losing the item, paying over the limit, or arguing all fail."},
    {q:"The final step of the framework is:",o:["Deliver the price","Get their information before they leave","Evaluate","Greet"],a:1,e:"Step 10 is get their information before they leave; delivering the price, evaluating, and greeting happen earlier."},
    {q:"When the customer accepts and reaches to finalize you:",o:["Recalculate","Move the items to your side to complete the handoff","Add fees","Pause"],a:1,e:"Move the items to your side to complete the handoff; recalculating, adding fees, or pausing risks unraveling the close."},
    {q:"Which story do you use in step 4?",o:["A discount story","The collector's association story","A pawn shop story","No story"],a:1,e:"Use the collector's association story to show why you are best; a discount, pawn-shop, or no story would undercut the positioning."}
   ]

  {
   id:'m2.9', name:'Handling a Difficult Customer', days:'Days 69 to 73', passMark:80,
   lessonHTML:`
   <div class="outcome"><b>What you'll be able to do</b><br>After this module you can keep a tense table calm, answer suspicion with transparency, and turn a price the customer does not like into a consignment pitch instead of an argument.</div>
   <h2>Your Goal Is Not to Win</h2>
   <p>When a customer gets upset or suspicious, the goal is never to win an argument. The goal is to keep them comfortable, keep the table calm, and keep a path to a deal open. A calm buyer who never argues earns trust even from a skeptical customer.</p>
   <h2>The Two Common Triggers</h2>
   <ul>
   <li><strong>The price is lower than they hoped.</strong> They expected more, so they feel let down or insulted.</li>
   <li><strong>They suspect they are being lowballed.</strong> They do not trust that the number is fair.</li>
   </ul>
   <h2>How to Stay Calm and Build Trust</h2>
   <ul>
   <li>Lower your voice and slow down. Never match their volume.</li>
   <li>Acknowledge the feeling: "I understand, a lot of people expect more, let me show you exactly how we got here."</li>
   <li>Use transparency: walk them through the testing, the weights, and the live sheet so they can see the number is not a guess.</li>
   <li>Never argue, never get defensive, and never insult what they brought.</li>
   <li>Give them a moment of space if they need it.</li>
   </ul>
   <h2>If They Still Do Not Like the Price</h2>
   <p>Do not raise your offer above MAX Face to calm them down. Instead, <strong>pivot to the consignment pitch</strong>: explain that for an item they feel is worth more, selling it at auction may reach collectors who pay more, and we can handle that for them. This turns a dead end into a real option and moves the lead to the Sent to Consignment stage.</p>
   <h2>If a Customer Becomes Hostile</h2>
   <p>If someone becomes threatening or will not calm down, stop selling. Disengage politely, get a manager, and if needed contact security. Stay safe and document what happened. Never escalate it yourself.</p>
   <div class="standard"><b>Operating Standard</b><br>Calm and transparent always beats winning the argument. When the price is the sticking point, never go above MAX Face to please someone; pivot to consignment. If it turns hostile, disengage and get help.</div>
   <div class="takeaways"><h3>Key Takeaways</h3><ul>
   <li>The goal with an upset customer is to stay calm and keep a path open, not to win.</li>
   <li>The two common triggers are a price lower than hoped and a suspicion of being lowballed.</li>

   id:'m2.10', name:'Pitching and Setting Up Consignment', days:'Days 74 to 78', passMark:80,
   lessonHTML:`
   <div class="outcome"><b>What you'll be able to do</b><br>After this module you can explain consignment clearly, pitch it at the right moment, set realistic expectations, and set up the consignment cleanly.</div>
   <h2>What Consignment Is</h2>
   <p>Consignment means we sell the item <strong>for</strong> the customer at auction instead of buying it outright. The customer keeps ownership until it sells, the item is shown to a wide audience of collectors, and the final price is set by bidding. For the right items, this can net the customer more than a cash offer.</p>
   <h2>When to Pitch Consignment</h2>
   <ul>
   <li>When the customer wants more than your cash offer (more than MAX Face).</li>
   <li>When the item is rare or high value and likely to do better in front of collectors.</li>
   <li>When the lead already said they want to sell on auction (a Sent to Consignment lead).</li>
   </ul>
   <h2>How to Pitch It</h2>
   <ul>
   <li>Frame it as a way to get the most for a special item: "For a piece like this, auction can reach collectors who compete for it."</li>
   <li>Explain we handle the work: photography, listing, and putting it in front of the right buyers.</li>
   <li>Set expectations honestly: the final price depends on bidding, and it takes time, unlike instant cash.</li>
   <li>Explain that our fee or commission is taken from the sale, and that the exact terms are set by the consignment agreement (leadership sets the rates).</li>
   </ul>
   <h2>How to Set It Up</h2>
   <ul>
   <li>Itemize exactly what is being consigned.</li>
   <li>Complete and sign the consignment agreement with the customer.</li>
   <li>Tag and store the items securely with the customer's information attached.</li>
   <li>Move the lead to the <strong>Sent to Consignment</strong> stage and note what was taken in.</li>
   </ul>
   <div class="standard"><b>Operating Standard</b><br>Consignment is the answer when a customer wants more than MAX Face or has an item that belongs in front of collectors. Pitch the value honestly, never overpromise a final price, and always set it up with a signed agreement and the lead moved to Sent to Consignment.</div>
   <div class="takeaways"><h3>Key Takeaways</h3><ul>
   <li>Consignment means we sell the item for the customer at auction, not buy it outright.</li>
   <li>The customer keeps ownership until it sells; the final price is set by bidding.</li>
   <li>Pitch it when the customer wants more than MAX Face, the item is rare or high value, or the lead wants auction.</li>
   <li>Frame it as reaching collectors who compete; explain we handle photography, listing, and buyers.</li>
   <li>Set expectations honestly: price depends on bidding and it takes time.</li>
   <li>Our fee comes from the sale; exact terms are in the agreement set by leadership.</li>
   <li>Set up: itemize, sign the agreement, tag and store securely, move the lead to Sent to Consignment.</li>
   </ul></div>`,
   test:[

    {q:"Until the item sells at auction, who owns it?",o:["We do","The customer","The auction house","No one"],a:1,e:"The customer keeps ownership until it sells; not us, not the auction house, and ownership does not vanish."},
    {q:"The final consignment price is set by:",o:["The buyer","Bidding","The customer alone","Spot price"],a:1,e:"Bidding sets the final price; a buyer's offer is the cash path, the customer cannot dictate the hammer, and spot only drives melt."},
    {q:"A good time to pitch consignment is when:",o:["The customer takes the cash offer","The customer wants more than MAX Face","The item is junk","The item is costume"],a:1,e:"Pitch it when they want more than your cash offer; not when they take the cash, and not for junk or costume."},
    {q:"Consignment also fits items that are:",o:["Common bank coins","Rare or high value, better in front of collectors","Plated","Foreign junk"],a:1,e:"It fits rare or high-value items collectors compete for; common bank coins, plated pieces, and foreign junk do not."},

    {q:"What do you tell them we handle?",o:["Nothing","Photography, listing, and putting it in front of buyers","Only storage","Only shipping"],a:1,e:"We handle photography, listing, and the buyer audience; not 'nothing', storage only, or shipping only."},
    {q:"Setting expectations honestly means saying:",o:["The price is guaranteed","The final price depends on bidding and it takes time","It sells instantly","It always sells high"],a:1,e:"Honest expectations: the price depends on bidding and it takes time; guaranteeing a price, an instant sale, or 'always sells high' are overpromises."},
    {q:"The consignment fee or commission:",o:["Does not exist","Comes from the sale, with terms set by the agreement","Is paid upfront by the customer","Is set by the buyer"],a:1,e:"The fee comes from the sale with terms in the agreement; it is not nonexistent, paid upfront by the customer, or set by the buyer."},
    {q:"Setting up a consignment includes:",o:["Just a handshake","Itemize, sign the agreement, tag and store, update the lead stage","Paying cash","Melting items"],a:1,e:"Setup is itemize, sign, tag and store, and update the lead; a handshake, paying cash, or melting are not it."},

   id:'m2.5', name:'Supervised Buying', days:'Days 79 to 88', passMark:80,
   lessonHTML:`
   <div class="outcome"><b>What you'll be able to do</b><br>After this module you can run live appointments on your own with a manager nearby, then fully solo, while hitting your targets.</div>
   <h2>How Supervision Steps Down</h2>
   <p>First, a manager sits with you and steps in only to prevent a real mistake (a missed key date, a skipped test, a deal that breaks the rules). Next, the manager is nearby but not at the table. Finally, you run appointments solo with an end-of-day review.</p>
   <h2>Your Targets</h2>
   <p>You should be closing a strong share of appointments, keeping deals within the pricing rules, and capturing a customer review on every closed deal.</p>
   <h2>The Daily Review</h2>
   <p>Each day, your numbers are reviewed: how many customers you saw, how many you bought from, your average result, reviews captured, and any rule issues. Reporting must be honest; numbers are checked against the records.</p>
   <div class="standard"><b>Operating Standard</b><br>The manager never takes over your appointment; they only prevent a real mistake. You learn by doing. Honest daily numbers are how you and your manager find the next thing to improve.</div>
   <div class="takeaways"><h3>Key Takeaways</h3><ul>
   <li>Supervision steps down: manager at the table, then nearby, then you solo.</li>
   <li>The manager steps in only to prevent a real mistake, never to take over.</li>
   <li>Targets: close a strong share, keep deals within the rules, capture a review on every closed deal.</li>
   <li>Your daily numbers are reviewed and checked against the records.</li>
   <li>Reporting must be honest.</li>
   </ul></div>`,

    {q:"At first, the manager steps in only to:",o:["Take over","Prevent a real mistake","Chat","Critique tone"],a:1,e:"At first the manager steps in only to prevent a real mistake; not to take over, chat, or critique your tone."},

   lessonHTML:`
   <div class="outcome"><b>What you'll be able to do</b><br>After this module you can run buying fully solo and you know exactly what it takes to promote toward a manager track.</div>
   <h2>Run It Solo</h2>
   <p>Run appointments on your own for a stretch of days, keeping your numbers strong and your records clean. Pass a random check of your recent deals with no rule issues.</p>
   <h2>The Promotion Gate</h2>
   <p>To promote toward a manager track, all of these must be true at the same time, held for two months:</p>
   <ul>
   <li>Enough consistent time in the role.</li>
   <li>Strong close rate and healthy deals.</li>
   <li>Strong customer reviews.</li>
   <li>No rule or pricing issues.</li>
   <li>Pass a deal-records check with no issues.</li>
   <li>You have helped train at least one setter (proving you can teach the system, not just run it).</li>
   </ul>
   <p>Then you choose your track: <strong>Roadshow Sales Manager</strong> or <strong>Local Office Manager</strong>. Leadership signs off based on the numbers.</p>
   <div class="standard"><b>Operating Standard</b><br>A manager must be able to teach, not just sell. Helping train a setter is part of the gate because the whole system grows only when good people can replicate themselves.</div>
   <div class="takeaways"><h3>Key Takeaways</h3><ul>
   <li>Run buying solo with strong numbers and clean records.</li>
   <li>Pass a random deal-records check with no rule issues.</li>
   <li>Promotion requires consistency, strong close rate, strong reviews, no rule issues, and a clean records check.</li>
   <li>You must have helped train at least one setter.</li>
   <li>All gates hold for two months; leadership signs off on the numbers.</li>
   <li>You then choose Roadshow Sales Manager or Local Office Manager.</li>
   </ul></div>`,

   <div class="outcome"><b>What you'll be able to do</b><br>After this module you can lead the floor, approve deals within your authority, handle disputes, and close out the show cleanly.</div>
   <h2>Morning Huddle</h2>
   <p>Keep it short. Cover yesterday's result, today's appointments, one reminder, and one quick role-play. End with energy.</p>
   <h2>Approving Deals</h2>
   <ul>
   <li>If a deal stays healthy within the pricing rules, approve it.</li>
   <li>If it is borderline but the customer is likely to return, you may approve it and note why.</li>
   <li>If it breaks the rules, do not approve it; pivot to consignment.</li>
   <li>Unusual or rare items go to the numismatist or specialist regardless of size.</li>
   <li>Deals above your authority go up to leadership.</li>
   </ul>
   <h2>Disputes and Crowd Control</h2>
   <p>Stay calm. Use the camera footage to walk a customer through exactly what happened; transparency settles most disputes. On busy days, greet and set wait-time expectations so no one feels ignored. Document any incident in the team channel.</p>
   <h2>Closing the Show</h2>
   <p>Stop taking new customers near the end, complete the final count, ship the final boxes with tracking, settle the venue, and post a short show summary to the team.</p>

   id:'m3a.4', name:'Roadshow Numbers (P&L)', days:'Days 51 to 65', passMark:80,
   lessonHTML:`
   <div class="outcome"><b>What you'll be able to do</b><br>After this module you can build a simple show profit and loss and write a useful after-action review.</div>
   <h2>The Simple P&L</h2>
   <ul>
   <li><strong>Revenue:</strong> the resale value of everything bought.</li>
   <li><strong>Cost of goods:</strong> what you actually paid sellers.</li>
   <li><strong>Gross profit:</strong> revenue minus cost of goods.</li>
   <li><strong>Direct expenses:</strong> venue, marketing, payroll, travel, supplies, shipping.</li>
   <li><strong>Net result:</strong> gross profit minus direct expenses.</li>
   </ul>
   <p>Flag any expense that runs well over its budget.</p>
   <h2>After-Action Review</h2>
   <p>Within a day or two of the show, write a short review: what worked, what did not (with the real reason), anything unusual, and recommendations for the next show in that area. Include the P&L summary.</p>
   <div class="standard"><b>Operating Standard</b><br>Report the real numbers, including the parts that did not go well. The review is most valuable when it is honest; it feeds directly into planning the next show.</div>
   <div class="takeaways"><h3>Key Takeaways</h3><ul>
   <li>Revenue is the resale value of everything bought.</li>
   <li>Cost of goods is what you paid sellers.</li>
   <li>Gross profit is revenue minus cost of goods.</li>
   <li>Net result is gross profit minus direct expenses (venue, marketing, payroll, travel, supplies, shipping).</li>
   <li>Flag expenses that run well over budget.</li>
   <li>Write a short, honest after-action review within a day or two, including the P&L summary.</li>
   </ul></div>`,

   lessonHTML:`
   <div class="outcome"><b>What you'll be able to do</b><br>After this module you can hire and coach setters, run weekly one-on-ones, and handle underperformance fairly.</div>

   <p>Post the role, screen applicants, interview, and include a short role-play to see how they handle a real call. A final offer needs leadership's sign-off. You can hire setters with that sign-off; hiring or removing buyers and above stays with leadership.</p>
   <h2>Weekly One-on-Ones</h2>
   <p>Meet each person weekly for about half an hour: review their numbers, coach one specific skill, run one quick role-play, and set next week's focus. Write a short note each time.</p>
   <h2>Underperformance</h2>
   <p>If someone misses targets for two weeks, put a clear written improvement plan in place with specific goals and a timeframe. If it is not met, move to removal. Removals are reviewed by leadership.</p>
   <h2>Weekly Team Huddle</h2>
   <p>Once a week, recap last week, set this week's target, give one reminder, run one role-play, and finish on energy.</p>
   <div class="standard"><b>Operating Standard</b><br>Final hiring of setters needs leadership sign-off, and hiring or removing buyers stays with leadership. Underperformance is handled with a written plan first, then a documented decision. This keeps people decisions fair and consistent.</div>

   </ul></div>`,

<script id="engine">const app=document.getElementById('app');
const topbarRight=document.getElementById('topbarRight');
let TEST=null;
const SHOW_CAP=15, FINAL_COUNT=25, FINAL_PASS=85, STALL_DAYS=7;
/* ===== HARD QUESTION BANKS (retakes + finals): stronger distractors + situational ===== */
const HARD={
 'm1.1':[
  {q:"A caller says, 'I have my late mother's jewelry box, not sure what's in it, probably junk.' Which avatar?",o:["Lifelong Collector","Inherited","Duplicate Seller","Curious"],a:1,e:"Inherited is right: items from a relative with the seller unsure of value. It is not Lifelong Collector (they would know their pieces) or Duplicate Seller (an active collector offloading extras), and Curious is someone with no items just asking what something is worth."},
  {q:"A caller insists on a ballpark before booking. What is the correct move?",o:["Give a conservative low range","Refuse a number, get a photo, book the appointment","Give a range, then book","Quote the current spot price"],a:1,e:"Refusing the number and booking is right because any phone figure, even a low range or spot, sets an expectation the buyer cannot honor in person and loses deals. A range or a spot quote is still a phone number, which is the one thing setters never give."},
  {q:"Which item do we BUY?",o:["A gold-filled (GF) chain","Pre-1933 US gold","An EPNS tray","Modern clad quarters"],a:1,e:"Pre-1933 US gold is solid gold, so we buy it. GF is gold-filled (a thin layer, not solid), EPNS is plated silver, and clad quarters have no precious metal, so all three are passes."},
  {q:"A customer brings a tea set marked EPNS. You should:",o:["Buy it as sterling","Not buy it; EPNS is plated, not solid silver","Pay the .925 silver price","Route it to the numismatist"],a:1,e:"Do not buy: EPNS means electroplated nickel silver, a plated coating with no real silver value. Buying it as sterling or paying the .925 price would be paying for silver that is not there, and the numismatist handles coins, not plated holloware."},
  {q:"Why can we pay top of market?",o:["We charge sellers a fee","We sell to private collectors and auction houses","We melt everything ourselves","We pay in store credit"],a:1,e:"Selling to private collectors and auction houses is right: it captures collector value, not just melt, so we can pay more. We do not charge sellers a fee, we do not just melt everything (that would cap us at metal value), and we pay real money, not credit."},
  {q:"A customer lays a Rolex and a Fossil on the table. You:",o:["Buy both as luxury","Buy the Rolex, skip the Fossil unless its case is solid gold","Skip both","Buy the Fossil, skip the Rolex"],a:1,e:"Buy the Rolex and skip the Fossil is right: Rolex is a luxury buy brand, Fossil is fashion with little resale unless its case happens to be solid gold. Buying both treats fashion as luxury, skipping both throws away the Rolex, and buying only the Fossil is backwards."},
  {q:"A diamond is offered loose. What is our minimum size of interest?",o:["Any size","A quarter carat","Half a carat","One carat"],a:2,e:"Half a carat is the stated minimum we buy. Any size or a quarter carat would pull in tiny melee stones with little standalone value, and setting the bar at one carat would turn away plenty of stones we do want."},
  {q:"A fresh lead just appeared in the system. Your first duty is to:",o:["Research the likely coins","Reach out as fast as possible (speed to lead)","Wait for photos","Estimate a price"],a:1,e:"Speed to lead is right because the faster you reach a new lead, the more likely it ever books. Researching coins, waiting for photos, or estimating a price all delay contact, and a setter never prices anyway."}
 ],
 'm1.2':[
  {q:"A seller says they would rather sell their coins on auction. Stage?",o:["Wanting to Buy","Sent to Consignment","Out of State","Won, Deal Closed"],a:1,e:"Sent to Consignment is right: that stage is exactly for sellers who want to sell on auction. Wanting to Buy is for people buying from us, Out of State is about location, and Won is only after a deal closes."},
  {q:"You tried three times, never reached them, and the waiting period passed. Stage?",o:["Lost Lead","Cold Lead","Junk Lead","New"],a:1,e:"Cold Lead is right: it covers leads you could not reach, including those auto-moved after three attempts and a wait. Lost Lead means you reached them but could not close, Junk Lead is about items we do not buy, and New means no outreach has happened yet."},
  {q:"A caller only has post-1965 clad quarters. Stage?",o:["Low Value","Junk Lead","Cold Lead","Sent to Consignment"],a:1,e:"Junk Lead is right because clad quarters are items we do not buy at all. Low Value is for items we would buy but not enough of, Cold Lead is about being unreachable, and Sent to Consignment is for auction sellers."},
  {q:"A caller has two real silver quarters, not enough to justify a visit. Stage?",o:["Junk Lead","Low Value","Lost Lead","Cold Lead"],a:1,e:"Low Value is right: we would buy silver quarters, there is just not enough to be worth it. Junk Lead is for things we never buy, Lost Lead means a deal we could not close, and Cold Lead means unreachable."},
  {q:"A seller is far outside the area and wants to send items in for an offer. Stage?",o:["Out of State","Wanting to Ship","Sent to Consignment","Cold Lead"],a:1,e:"Wanting to Ship is right: it is for out-of-area sellers who will mail items in. Out of State only marks location without the intent to ship, Sent to Consignment is specifically auction, and Cold Lead means you could not reach them."},
  {q:"A scheduled customer did not show. What must the notes contain?",o:["A deposit","A Reason","A photo","A manager name"],a:1,e:"A Reason is right: Reschedule / No-Show requires a reason so the next person understands what happened. A deposit is not part of our process, a photo belongs to scheduling, and a manager name is not what the stage asks for."},
  {q:"A lead is qualified but not yet scheduled. What must you write?",o:["Nothing yet","What they have","The final offer","The spot price"],a:1,e:"Write what they have is right so the next person can act without another call. Leaving it blank breaks follow-up, and setters never write a final offer or a price because that is the buyer's job in person."},
  {q:"A caller wants to buy coins from us, not sell. Stage?",o:["Sent to Consignment","Wanting to Buy","Wanting to Ship","New"],a:1,e:"Wanting to Buy is right: that stage is for people buying from us. Sent to Consignment and Wanting to Ship are both for sellers, and New means a brand-new lead with no outreach."}
 ],
 'm1.3':[
  {q:"Customer: 'Just give me a ballpark.' Best first response with 3A?",o:["Give a low range","Acknowledge the feeling, no number","Ask for the spouse","Quote spot"],a:1,e:"Acknowledge first is right: 3A starts by acknowledging the feeling, with no number. A low range or a spot quote breaks the no-phone-price rule, and asking for the spouse skips the objection in front of you."},
  {q:"What is the correct 3A order?",o:["Ask, Acknowledge, Associate","Acknowledge, Associate, Ask","Associate, Ask, Acknowledge","Ask, Associate, Acknowledge"],a:1,e:"Acknowledge, Associate, Ask is the right order: you settle the feeling, connect them to others like them, then ask for the next step. The other orders ask for the close before you have acknowledged or built any common ground."},
  {q:"Which are high-value trigger words to listen for?",o:["Costume and plated","Gold coins, gold jewelry, large amounts of silver","Clad and junk","Fashion watches"],a:1,e:"Gold and large silver are the high-value triggers that mean go straight to scheduling. Costume, plated, clad, and fashion watches are all items we do not buy, so they are the opposite of a trigger."},
  {q:"For standard items, you route the customer to:",o:["Schedule immediately","Send photos to your line for buyer follow-up","Get a price quote","A manager"],a:1,e:"Photos to your line is right for standard items so the buyer can follow up. Immediate scheduling is reserved for high-value triggers, setters never quote a price, and a manager is not the routing path."},
  {q:"A voicemail should be:",o:["About 5 seconds","About 25 to 30 seconds, number said slowly twice","About 2 minutes","As long as needed"],a:1,e:"25 to 30 seconds with the number said twice is right: long enough to land the message and the callback number, short enough to be heard. Five seconds is too rushed to leave a usable number, and two minutes or open-ended loses the listener."},
  {q:"The two-option close means offering:",o:["Any time they want","Two specific times","One time only","A callback later"],a:1,e:"Two specific times is right because removing open-ended choice raises the show rate. Any time they want invites delay, one time feels like pressure, and a callback just postpones the booking."},
  {q:"Customer: 'I researched it, it's worth X.' Correct response?",o:["Agree to X","Neither confirm nor deny; explain online prices are asking, not paid","Argue it is worth less","Book without addressing it"],a:1,e:"Neither confirm nor deny is right: online listings are asking prices, not what collectors actually pay, so you explain that calmly. Agreeing locks you to their number, arguing it down starts a fight, and ignoring it leaves the objection alive."},
  {q:"Why do scripts say [your line] instead of a number?",o:["It hides the number","Numbers change per setter","It reads faster","It is a rule with no reason"],a:1,e:"Numbers change per setter is the real reason, so each person inserts their own direct line. It is not about hiding the number or reading speed, and it is a deliberate rule, not an arbitrary one."}
 ],
 'm1.4':[
  {q:"A brand-new lead just hit your queue and you also have older follow-ups. Priority?",o:["Finish the follow-ups first","Reach the new lead fast, then follow-ups","Wait for photos on the new one","Research the items first"],a:1,e:"Hit the fresh lead first is right because speed to lead is highest when a lead is brand new. Finishing follow-ups first lets the new lead cool off, and waiting for photos or researching items both delay first contact."},
  {q:"After each contact attempt you should:",o:["Move on silently","Log it so the stage stays accurate","Wait a day","Delete the lead"],a:1,e:"Log every attempt is right so the pipeline stage stays accurate and the next person knows the history. Moving on silently or waiting leaves the record wrong, and deleting the lead throws away a contact you may still close."},
  {q:"You booked an appointment for tomorrow. Best practice?",o:["Do nothing until they arrive","Confirm it to reduce no-shows","Cancel and rebook","Ask for a deposit"],a:1,e:"Confirming is right because a confirmed appointment is far less likely to no-show. Doing nothing leaves the show to chance, canceling and rebooking is pointless, and we do not take deposits."},
  {q:"Mid-call the customer presses again for a price. You:",o:["Give a quick range","Use 3A, no number, get a photo, book","Transfer the call","End the call"],a:1,e:"3A with no number is right: hold the line, get a photo, and book. A quick range still breaks the no-phone-price rule, transferring dodges the job, and ending the call loses the lead."},
  {q:"Why does confirming appointments matter?",o:["It does not","It reduces no-shows and protects the show rate","It slows the day","It avoids photos"],a:1,e:"It reduces no-shows and protects the show rate, which is the whole point. It does matter, it does not slow the day in any meaningful way, and it has nothing to do with avoiding photos."},
  {q:"A productive setter's day is measured most by:",o:["Hours seated","Speed to lead, attempts logged, and appointments confirmed","Longest calls","Number of voicemails only"],a:1,e:"Speed, logged attempts, and confirmed appointments are the real measures because they drive booked, kept appointments. Hours seated and call length measure effort, not results, and voicemails alone do not book anyone."}
 ],
 'm1.5':[
  {q:"During a buyer shadow you should:",o:["Run the appointment","Observe quietly, no interrupting, phone away","Take over the close","Price the items"],a:1,e:"Observe quietly is right: the point of a shadow is to watch the full flow without disrupting it. Running the appointment, taking the close, or pricing items are all the buyer's job, not the shadowing setter's."},
  {q:"Promotion from setter is decided on:",o:["Tenure","Data: numbers and scores","Relationships","Seniority"],a:1,e:"Data is right: promotion is earned on numbers and scores, which keeps it fair. Tenure, relationships, and seniority all reward time or favor rather than proven readiness."},
  {q:"How long must the promotion gates hold?",o:["One day","One week","Two months","One year"],a:2,e:"Two months is right: the gates must hold steady that long to prove consistency, not a single good stretch. One day or one week is too short to be reliable, and a year is longer than the standard requires."},
  {q:"Who signs off on promotion?",o:["A peer","Leadership","HR only","The customer"],a:1,e:"Leadership signs off based on the numbers. A peer has no authority to promote, HR alone does not make the call, and the customer is not involved in promotion."},
  {q:"The recorded role-play is scored by:",o:["The trainee","Leadership","Another setter","No one"],a:1,e:"Leadership scores it to keep the bar objective. A trainee scoring themselves invites bias, another setter is not the authority, and an unscored role-play would not gate anything."},
  {q:"Why is data-based promotion good for you?",o:["It is faster","You only move up when truly ready","It avoids tests","It is cheaper"],a:1,e:"You move up only when truly ready, so you are set up to succeed in the next role. It is not about speed or cost, and it does not avoid tests; the tests are part of the data."}
 ],
 'm2.1':[
  {q:"A Morgan dollar has a CC mint mark. Correct action?",o:["Price it at melt","Route it to the numismatist, do not price it","Melt it","Pay the 90 percent silver value"],a:1,e:"Route it to the numismatist: CC is Carson City, the rarest mint, and the coin can be worth far more than metal. Pricing at melt, melting it, or paying only the 90 percent silver value would all throw away the collector premium."},
  {q:"A customer has one 1964 Kennedy half and three 1971 Kennedy halves. The silver?",o:["All 90 percent","The 1964 is 90 percent; the 1971 halves are clad, no silver","All 40 percent","All clad, no silver"],a:1,e:"The 1964 is 90 percent and the 1971 halves are clad: the cutoffs are 90 percent through 1964 and clad from 1971 on (1965 to 1970 halves are 40 percent). 'All 90' ignores the date change, 'all 40' applies the wrong middle band, and 'all clad' misses the silver 1964."},
  {q:"A 1943 cent is copper-colored and does NOT stick to a magnet. You:",o:["Treat it as a common steel cent","Route it to the numismatist as a possible 1943 copper key","Melt it","Hand it back at face value"],a:1,e:"Route it: most 1943 cents are steel and magnetic, so a non-magnetic copper one could be the rare 1943 copper key. Treating it as common steel, melting it, or handing it back at face could give away a major coin."},
  {q:"A 1943 cent sticks to a magnet. It is most likely:",o:["A rare copper key","A common steel cent, low value","A 90 percent silver coin","A 1944 steel key"],a:1,e:"A common steel cent: 1943 cents were struck in steel, so a magnetic one is the ordinary version. The rare keys are the 1943 copper (non-magnetic) and the 1944 steel; pennies are never silver."},
  {q:"Which is the Mercury dime key date?",o:["1917-D","1916-D","1916-S","1945"],a:1,e:"1916-D is the key (along with 1921-D), known for its very low mintage. 1917-D and 1916-S are common dates, and 1945 is a late, common year."},
  {q:"Walking Liberty half key dates are:",o:["1917 and 1920","1916 and 1921, all mint marks","1916 and 1917","1921 and 1923"],a:1,e:"1916 and 1921, all mints, are the keys for the series. The other pairs mix in common years (1917, 1920, 1923) that carry no key-date premium."},
  {q:"Washington quarter key dates are:",o:["1932-P and 1932-D","1932-D and 1932-S","1934-D and 1932-S","1932-S and 1936-D"],a:1,e:"1932-D and 1932-S are the keys, the low-mintage first-year branch mints. The 1932-P is common, and 1934-D and 1936-D are ordinary dates that do not belong with the keys."},
  {q:"A silver dollar weighs about 20 grams on your scale. It is:",o:["A real Peace dollar","Likely fake; a real one is about 26.7 grams","A real Morgan dollar","A 40 percent silver dollar"],a:1,e:"Likely fake: a genuine Morgan or Peace dollar weighs about 26.7 grams, so 20 grams is well underweight. Calling it a real Peace or Morgan ignores the weight, and there is no standard 40 percent dollar at that weight."},
  {q:"An item is stamped .925. It is:",o:["90 percent coin silver","Sterling silver","Platinum","22K gold"],a:1,e:"Sterling silver: .925 is the sterling mark (92.5 percent silver). 90 percent is the coin-silver figure but not what .925 denotes, platinum is marked 950 or PT, and 22K gold is marked 916."},
  {q:"A gold ring is stamped 750. It is:",o:["10K","14K","18K","22K"],a:2,e:"18K: 750 means 75 percent gold, which is 18 karat. 10K is 417, 14K is 585, and 22K is 916, so each of those carries a different stamp."},
  {q:"A chain is stamped '1/20 12K GF'. You:",o:["Buy it as 12K solid","Reject it; GF means gold-filled, not solid","Pay half the gold value","Treat it as 14K"],a:1,e:"Reject it: GF means gold-filled, a thin gold layer over base metal, and 1/20 tells you how little gold there is. Buying it as solid 12K, paying half the gold value, or calling it 14K all pay for solid gold that is not there."},
  {q:"A Jefferson nickel dated 1943 has a large mint mark over the dome. It is:",o:["A common nickel, no silver","A war nickel, 35 percent silver","90 percent silver","40 percent silver"],a:1,e:"A war nickel, 35 percent silver: 1942 to 1945 nickels with the large mint mark over Monticello used silver because nickel metal went to the war. A normal nickel has no silver, and 90 or 40 percent are coin-silver bands that do not apply to nickels."},
  {q:"VDB stands for:",o:["Victor Daniel Brenner","Victor David Brenner","Vincent David Brenner","Victor David Brunner"],a:1,e:"Victor David Brenner, the designer of the Lincoln cent. The others are near-misses on the name (wrong middle name, wrong first name, wrong surname spelling)."},
  {q:"A Buffalo nickel famous error is:",o:["1938-D three-legged","1937-D three-legged","1937-S three-legged","1936-D two-legged"],a:1,e:"The 1937-D three-legged is the famous error, caused by an over-polished die. The 1938-D and 1937-S are normal coins, and there is no recognized 1936-D two-legged variety."},
  {q:"A customer brings a handful of foreign coins. You:",o:["Melt them for silver","Send them to the specialist channel for experts","Pay face value","Reject them outright"],a:1,e:"Send them to the specialist channel: foreign coins need expert evaluation. Melting risks destroying a collectible, paying face ignores possible value, and rejecting outright could turn away a real find."},
  {q:"An Indian Head penny key date is:",o:["1876","1877","1879","1908-S"],a:1,e:"1877 is the key Indian Head date (along with 1909-S), with a famously low mintage. 1876 and 1879 are common, and 1908-S, while better, is not the marquee key the way 1877 is."}
 ],
 'm2.2':[
  {q:"A gold-colored chain sticks to a strong magnet only at the clasp. You:",o:["Reject the whole piece","Test the chain itself, since clasps can hold steel springs","Call it fake","Buy it as 14K without testing"],a:1,e:"Test the chain itself: clasps often contain steel springs that grab a magnet even when the gold is real, so the clasp can mislead you. Rejecting or calling it fake on the clasp alone is premature, and buying without testing the gold is reckless."},
  {q:"The correct full test order is:",o:["Scale, magnet, scratch","Magnet, scratch (jewelry only), scale","Scratch, scale, magnet","Acid on everything"],a:1,e:"Magnet, then scratch on jewelry only, then scale: the magnet is the fast first screen, the scratch confirms karat on jewelry, and the scale finishes. Leading with the scale or scratch skips the quick screen, and acid on everything would destroy coins."},
  {q:"A customer hands you a rare silver dollar to verify. You:",o:["Acid-test it","Never acid-test it; use the magnet and scale","Scratch-test it on the stone","Skip testing"],a:1,e:"Never acid-test a coin; use the magnet and scale: acid permanently destroys collector value. Scratching it on the stone damages it the same way, and skipping testing leaves you exposed to fakes."},
  {q:"A silver scratch test turns green and fizzes. The piece is:",o:["Real sterling","Plated, do not buy","999 fine","Platinum"],a:1,e:"Plated: green or fizzing is the base metal reacting under the plating. Real sterling gives a creamy, milky look, .999 fine is a purity mark not a reaction, and platinum is not judged by this silver test."},
  {q:"A silver scratch test leaves a creamy, milky streak. The piece is:",o:["Plated","Real sterling","Fake","Gold"],a:1,e:"Real sterling: a creamy, milky reaction is the sign of genuine silver. Plated or fake pieces react green or fizz, and gold is tested with the gold acids, not the silver test."},
  {q:"For gold jewelry, you apply acid in this order:",o:["18K, then 14K, then 10K","10K, then 14K, then 18K","All at once","Random"],a:1,e:"10K, then 14K, then 18K: you step up so the mark surviving each stronger acid tells you the karat. Starting at 18K or going random gives you no clean reading, and all at once tells you nothing."},
  {q:"Before weighing a new batch you must:",o:["Calibrate once a year only","Zero the scale","Weigh, then subtract a guess","Do nothing"],a:1,e:"Zero the scale before every batch so the weight is accurate. Calibrating only yearly lets drift creep in, subtracting a guess is not measuring, and doing nothing risks a stray reading."},
  {q:"A sterling set has weighted knife handles. You:",o:["Weigh the knives directly","Weigh a fork or spoon and multiply","Skip the set","Estimate by count"],a:1,e:"Weigh a fork or spoon and multiply: knife handles are filled with non-silver weighting, so weighing the knives directly overpays for filler. Skipping the set walks away from real silver, and estimating by count is not accurate."},
  {q:"A brooch has several set stones. For weight you:",o:["Pay the full weight","Deduct weight for the stones, more for larger ones","Reject it","Weigh the stones as silver"],a:1,e:"Deduct for the stones, more for larger ones, because you pay only for metal. Paying full weight or counting the stones as silver overpays, and rejecting a real silver piece over a few stones loses a deal."},
  {q:"A solid gold pocket watch case still has the movement in it. You:",o:["Pay the full weight","Deduct a large share for the movement and glass, pay for the gold","Reject it","Pay only for the jewels"],a:1,e:"Deduct for the movement and glass and pay for the gold: the case is the gold, the movement and crystal are not. Paying full weight overpays for non-gold parts, rejecting it loses the gold, and the jewels are not what you are buying here."}
 ],
 'm2.7':[
  {q:"A customer has an Omega and an Apple Watch. You:",o:["Buy both","Buy the Omega, skip the smartwatch","Buy neither","Buy the Apple Watch"],a:1,e:"Buy the Omega, skip the smartwatch: Omega is a luxury buy brand, an Apple Watch has no resale here. Buying both treats a smartwatch as luxury, buying neither passes on a real Omega, and buying only the Apple Watch is backwards."},
  {q:"A pocket watch movement is stamped 7 jewels. It is:",o:["High end, 100 to 500 dollars","A starter watch, lower value","Over 1000 dollars","Mid level, 50 to 100 dollars"],a:1,e:"A starter, lower-value watch: 7 jewels is the entry tier. 15 to 20 jewels is the 50 to 100 dollar mid tier and 21 plus is the 100 to 500 high tier, so the higher-value answers belong to higher jewel counts."},
  {q:"A pocket watch movement is stamped 21 jewels. It is usually:",o:["A starter","Mid level, 50 to 100 dollars","High end, about 100 to 500 dollars","Worthless"],a:2,e:"High end, about 100 to 500 dollars: 21 and up is the top tier. A starter is 7 jewels, mid level is 15 to 20, and 'worthless' ignores that a high jewel count signals a better watch."},
  {q:"A no-name watch has a solid 14K gold case. You:",o:["Reject it because the brand is unknown","Buy it for the melt value of the gold case","Buy it as a luxury piece","Pay only for the jewels"],a:1,e:"Buy it for the gold melt value: any solid gold case is worth its metal no matter the brand. Rejecting it over the name leaves real gold on the table, it is not a luxury piece, and the jewels are not what carries the value here."},
  {q:"Which is a buy brand?",o:["Fossil","Patek Philippe","Invicta","Guess"],a:1,e:"Patek Philippe is a top luxury buy brand. Fossil, Invicta, and Guess are fashion names with little resale unless the case is solid gold."},
  {q:"Which do we skip unless the case is solid gold?",o:["Cartier","Michael Kors","Tudor","IWC"],a:1,e:"Michael Kors is fashion, so skip it unless the case is solid gold. Cartier, Tudor, and IWC are recognized luxury buy brands."},
  {q:"The diamond 4 Cs are:",o:["Carat, Cut, Clarity, Cost","Carat, Cut, Color, Clarity","Carat, Color, Clarity, Curve","Cut, Color, Class, Carat"],a:1,e:"Carat, Cut, Color, Clarity are the four grading factors. Cost is a price, not a grade, and 'Curve' and 'Class' are not diamond terms."},
  {q:"Which diamond color grade is best (colorless)?",o:["Z","D","M","K"],a:1,e:"D is the top, colorless grade; the scale runs D down to Z as more color appears. So Z is the most tinted, and M and K sit in between, all below D."},
  {q:"Best clarity means:",o:["The most inclusions","The fewest inclusions, toward Flawless","The biggest carat","The best color"],a:1,e:"The fewest inclusions, toward Flawless, defines top clarity. The most inclusions is the worst clarity, and carat and color are different Cs entirely."},
  {q:"A customer has a loose 1-carat diamond with a GIA certificate. You:",o:["Price it at the table","Route it to the specialist for valuation","Buy it as an accent stone","Reject it"],a:1,e:"Route it to the specialist: a loose, certified, half-carat-and-up stone swings too much in value to guess at the table. Pricing it yourself risks a costly miss, treating a 1-carat as an accent stone undervalues it, and rejecting it passes on a real asset."},
  {q:"A gold ring has tiny accent diamonds. You:",o:["Route every stone to the specialist","Handle them in the jewelry deal and deduct stone weight","Pay extra for the diamonds","Reject the ring"],a:1,e:"Handle them in the jewelry deal and deduct their weight: small accent stones add little value. Routing every tiny stone wastes the specialist's time, paying extra overvalues them, and rejecting the ring loses the gold."},
  {q:"You are unsure about a vintage high-end watch. You:",o:["Guess high","Guess low","Route it to the specialist","Reject it"],a:2,e:"Route it to the specialist: uncertain or vintage high-end watches need expert eyes. Guessing high risks overpaying, guessing low risks losing the deal or underpaying, and rejecting it may pass on something valuable."}
 ],
 'm2.3':[
  {q:"Which tab do you enter the customer's items on?",o:["Show Totals & Profit","CALCULATOR","Final Count","Show Expenses & Info"],a:1,e:"CALCULATOR is where you build the offer at the table. Show Totals & Profit is the locked master page, Final Count is for logging closed deals, and Show Expenses & Info holds spot prices, not item entry."},
  {q:"The Show Totals & Profit tab is marked Do Not Alter because:",o:["It is decorative","The calculator pulls its values from it","It is the customer copy","It is empty"],a:1,e:"The calculator pulls its values from it, so changing it breaks every offer. It is not decorative or empty, and it is an internal master page, not a customer copy."},
  {q:"For 2 ounces of 14K scrap, what goes in the Amount column?",o:["The count of pieces","The weight in pennyweight (DWT)","The karat number","The price"],a:1,e:"Weight in pennyweight (DWT) for metals: the sheet prices gold by weight. A count is only for coins, the karat is the row you pick, and you never type a price into Amount."},
  {q:"For 12 silver quarters, the Amount is:",o:["The total weight","The count, 12","The face value","The year"],a:1,e:"The count, 12: coins are entered by how many. Weight is for scrap metal, and face value and year are not the Amount field."},
  {q:"The 'Offer' figure at the top is:",o:["The ceiling","What you offer the customer","The spot price","The resale value"],a:1,e:"What you offer the customer, the sum of your rows. The ceiling is MAX Face, the spot price lives on the info tab, and the full resale basis is the Total Value figure, not the Offer."},
  {q:"MAX Face is:",o:["The opening offer","The ceiling you never exceed","The spot price","The weight"],a:1,e:"The ceiling you never exceed, the most an item is worth to us. The opening offer is the lower number you present, spot is the metal price input, and weight is just an entry value."},
  {q:"A customer wants 50 dollars more than MAX Face on a rare coin. You:",o:["Pay it","Do not exceed MAX Face; pivot to consignment","Split the difference","Raise the spot price"],a:1,e:"Hold MAX Face and pivot to consignment: the ceiling exists to protect the deal, and consignment can get them more at auction. Paying over or splitting the difference breaks the ceiling, and you cannot just raise spot to justify it."},
  {q:"Gold values look different than they did this morning. This is because:",o:["The sheet is broken","Spot prices update every hour; use the current sheet","The customer changed them","Values never change"],a:1,e:"Spot updates every hour, so the metal MAX Face recalculates through the day; always use the current sheet. The sheet is not broken, customers cannot change it, and metal values do move."},
  {q:"Who sets the spot prices?",o:["Each buyer","Leadership","The customer","The calculator at random"],a:1,e:"Leadership keeps spot current. Individual buyers do not set it, the customer has no input, and the figures come from real prices, not random numbers."},
  {q:"Besides the printout, a complete record needs:",o:["Nothing","ID, signature, and an itemized list","Just a photo","Just the name"],a:1,e:"ID, signature, and an itemized list make the record complete and compliant. 'Nothing', a photo alone, or just a name all leave the transaction undocumented."},
  {q:"Offers are presented:",o:["By phone","In person","By text","By email"],a:1,e:"In person: the buyer delivers the number face to face. Phone, text, or email quotes set expectations before the items are verified, which is exactly what we avoid."},
  {q:"The gap between Offer and Total Value is:",o:["An error","The negotiating room up to MAX Face","The tax","The shipping"],a:1,e:"The negotiating room up to MAX Face: the offer starts below the value basis, leaving room to move. It is not an error, and tax and shipping are not part of this spread."}
 ],
 'm2.8':[
  {q:"Where do you record a closed deal?",o:["The CALCULATOR page","The Final Count page","Show Totals & Profit","Show Expenses & Info"],a:1,e:"The Final Count page records each closed deal. The CALCULATOR only builds the offer, Show Totals is the locked master, and Show Expenses & Info is for spot prices."},
  {q:"For each closed deal you log:",o:["Just the total","Customer name, check number, amount spent, and counts","Just the name","Nothing"],a:1,e:"Name, check number, amount spent, and counts: the full set is what lets the day reconcile. Just the total or just the name leaves gaps, and logging nothing breaks the day's numbers."},
  {q:"When should you log a deal?",o:["End of day from memory","Right after it closes, while it is fresh","The next morning","Never"],a:1,e:"Right after it closes, while it is fresh, so nothing is missed. End of day from memory or the next morning invites errors, and never logging makes reconciliation impossible."},
  {q:"At close, what should line up?",o:["Spot and weight","The checks written and the total spent","Nothing","The schedule"],a:1,e:"Checks written and total spent should match; a gap means a missing or wrong entry. Spot and weight are pricing inputs, not the close reconciliation, and 'nothing' and the schedule are not what you balance."},
  {q:"'Amount spent' means:",o:["The resale value","Exactly what you paid the customer","The spot price","MAX Face"],a:1,e:"Exactly what you paid, the agreed offer. Resale value and MAX Face are higher value figures, and spot is the metal price, none of which is the cash that left."},
  {q:"You wrote a check but forgot to log it, and the day will not reconcile. You:",o:["Leave anyway","Find the missing entry before leaving","Estimate it","Delete a row to balance"],a:1,e:"Find the missing entry before leaving so the records are true. Leaving with a gap, estimating, or deleting a row to force a balance all hide the real numbers."},
  {q:"The counts you enter by category should match:",o:["Random numbers","The same rows as the calculator","The spot sheet","The customer's guess"],a:1,e:"The same rows as the calculator, so totals build correctly. Random numbers, the spot sheet, or a customer's guess would not tie back to what you actually bought."},
  {q:"The Final Count page feeds:",o:["The marketing budget","The day's totals: people seen, checks written, total spent, total value","The cheat sheet","Nothing"],a:1,e:"The day's totals: it is the source for people seen, checks written, total spent, and total value. It does not feed the marketing budget or the cheat sheet, and it certainly feeds something."}
 ],
 'm2.4':[
  {q:"Customer: 'I want to pass these down to my kids.' Best move?",o:["Insist they sell now","Ask whether the kids actually collect, then reframe to cash value","Quote a higher price","End the appointment"],a:1,e:"Ask whether the kids collect, then reframe to cash value: most heirs do not collect, so this opens the real conversation. Insisting they sell is pushy, quoting higher breaks the rules, and ending the appointment gives up."},
  {q:"Customer: 'I need to ask my spouse.' Best move?",o:["Pressure them to decide now","Ask who is more knowledgeable and offer to include them by phone","End the appointment","Quote a price to force it"],a:1,e:"Ask who is more knowledgeable and offer a phone call: it includes the spouse instead of fighting the objection. Pressuring them backfires, ending the appointment loses the deal, and quoting to force it is manipulative."},
  {q:"Customer: 'I researched it, it's worth X online.' Best move?",o:["Agree to X","Explain online listings are asking prices, not paid, and walk their items","Argue it is worth far less","Match X to close"],a:1,e:"Explain that online listings are asking prices, not paid, then walk their items: this is honest and educational. Agreeing or matching X locks you into their number, and arguing it down starts a fight."},
  {q:"Step 1 of the framework is:",o:["Deliver the price","Clarify why they came in","Evaluate the items","Close the sale"],a:1,e:"Clarify why they came in is step 1; you cannot serve them well without it. Delivering the price, evaluating, and closing all come later in the ten steps."},
  {q:"Much of the decision is shaped:",o:["At the price","In the first minute","At the very end","Never"],a:1,e:"In the first minute: rapport and trust set the tone for everything after. The price moment matters, but the groundwork is already laid, and 'at the end' or 'never' misses how early it forms."},
  {q:"The evaluation should be done:",o:["In a back room","Openly, where the customer can see it","After they leave","Over the phone"],a:1,e:"Openly, where the customer can see it: transparency builds the trust that closes the deal. A back room or doing it after they leave looks like you are hiding something, and the phone is not where evaluation happens."},
  {q:"Right after delivering the price you:",o:["Keep talking to justify it","Go quiet and let them respond","Lower it","Leave the table"],a:1,e:"Go quiet and let them respond: silence lets the offer land and puts the next move on them. Talking past it or lowering it weakens your number, and leaving the table abandons the close."},
  {q:"Feel, Felt, Found is used for:",o:["Pricing math","Emotional objections","Shipping","Scheduling"],a:1,e:"Emotional objections: it is an empathy tool (I understand how you feel, others felt the same, what they found). Pricing, shipping, and scheduling are logistics, not emotions."},
  {q:"The cash offer fails on a high-value item. You:",o:["Lose the item","Pivot to consignment","Pay above MAX Face","Argue the value"],a:1,e:"Pivot to consignment: auction can reach collectors who pay more, so you keep the item in play. Losing it gives up, paying above MAX Face breaks the ceiling, and arguing value rarely closes."},
  {q:"The final step of the framework is:",o:["Deliver the price","Get their information before they leave","Evaluate","Greet"],a:1,e:"Get their information before they leave, so you can follow up whether or not they sold today. Delivering the price, evaluating, and greeting all happen earlier in the ten steps."}
 ],
 'm2.9':[
  {q:"A customer raises their voice, upset at the offer. You:",o:["Match their volume","Lower your voice, acknowledge the feeling, and show transparency","Raise the offer above MAX Face","End it abruptly"],a:1,e:"Lower your voice, acknowledge, and show transparency: calm plus proof defuses the tension. Matching their volume escalates it, raising over MAX Face breaks the ceiling, and ending abruptly burns the deal."},
  {q:"With an upset customer, your goal is to:",o:["Win the argument","Stay calm and keep a path to a deal open","Prove them wrong","Rush them out"],a:1,e:"Stay calm and keep a path open: a calm buyer who never argues earns trust. Winning the argument or proving them wrong wins the point and loses the deal, and rushing them out throws it away."},
  {q:"A customer suspects you are lowballing. Best tool?",o:["Insist you are right","Walk them through the testing, weights, and live sheet","Raise the offer","End the deal"],a:1,e:"Walk them through the testing, weights, and live sheet: transparency shows the number is not a guess. Insisting you are right is not proof, raising the offer rewards the suspicion, and ending the deal gives up."},
  {q:"After transparency, they still reject the price. You:",o:["Pay above MAX Face","Pivot to the consignment pitch","Argue the value harder","Give up"],a:1,e:"Pivot to consignment: it offers them more upside without breaking the ceiling. Paying over MAX Face breaks the rules, arguing harder entrenches them, and giving up loses a recoverable deal."},
  {q:"A price-driven objection moves the lead toward:",o:["Junk Lead","Sent to Consignment","Out of State","Won"],a:1,e:"Sent to Consignment: that is where a 'wants more than we can pay' lead goes. Junk Lead is for items we do not buy, Out of State is about location, and Won is only after a closed deal."},
  {q:"A customer becomes threatening. You:",o:["Argue back","Disengage, get a manager or security, and document it","Keep selling","Match their energy"],a:1,e:"Disengage, get a manager or security, and document it: safety first, and a record protects everyone. Arguing back or matching their energy escalates danger, and continuing to sell ignores the threat."},
  {q:"With an upset customer you should never:",o:["Acknowledge the feeling","Argue, get defensive, or insult what they brought","Slow down","Offer consignment"],a:1,e:"Never argue, get defensive, or insult their items: that destroys trust. Acknowledging the feeling, slowing down, and offering consignment are all the right moves, not things to avoid."},
  {q:"Acknowledging the feeling sounds like:",o:["'You are wrong about that'","'I understand, let me show you exactly how we got here'","'Take it or leave it'","Saying nothing"],a:1,e:"'I understand, let me show you how we got here' acknowledges and opens transparency. 'You are wrong' and 'take it or leave it' are confrontational, and silence does not acknowledge anything."}
 ],
 'm2.10':[
  {q:"Consignment means we:",o:["Buy it, then resell it","Sell the item for the customer at auction","Loan money against it","Melt it"],a:1,e:"Sell it for the customer at auction: they keep ownership until it sells. Buying then reselling is an outright purchase, a loan against it is a pawn, and melting destroys a collectible."},
  {q:"Until the item sells at auction, who owns it?",o:["We do","The customer","The auction house","No one"],a:1,e:"The customer keeps ownership until the item sells; we are selling it on their behalf. We do not own it, the auction house does not own it, and ownership does not vanish."},
  {q:"The final consignment price is set by:",o:["The buyer","Bidding","The customer alone","Spot price"],a:1,e:"Bidding sets the final price at auction. A buyer's offer is the cash-purchase path, the customer cannot dictate the hammer price, and spot only drives melt value, not collector bidding."},
  {q:"A customer wants more than your cash offer on a rare piece. You:",o:["Pay what they ask","Pitch consignment","Reject the item","Lowball again"],a:1,e:"Pitch consignment: a rare piece may fetch more from competing collectors. Paying what they ask can break the ceiling, rejecting it loses the item, and lowballing again just sours the room."},
  {q:"Setting expectations honestly means saying:",o:["The price is guaranteed","The final price depends on bidding, and it takes time","It sells instantly","It always sells high"],a:1,e:"The price depends on bidding and it takes time: honest expectations protect the relationship. Guaranteeing a price, promising an instant sale, or promising it always sells high are overpromises you cannot keep."},
  {q:"The consignment fee or commission:",o:["Does not exist","Comes from the sale, with terms set by the agreement","Is paid upfront by the customer","Is set by the buyer"],a:1,e:"Comes from the sale, with terms in the agreement that leadership sets. It does exist, the customer does not pay it upfront, and an individual buyer does not set the rate."},
  {q:"Setting up a consignment includes:",o:["A handshake only","Itemize, sign the agreement, tag and store, move the lead to Sent to Consignment","Paying cash","Melting the items"],a:1,e:"Itemize, sign, tag and store, and update the lead: a clean, documented setup. A handshake is not a record, paying cash is the purchase path not consignment, and melting destroys the item."},
  {q:"Should you overpromise a final auction price?",o:["Yes, to close it","No, never overpromise","Only for gold","Only for rare coins"],a:1,e:"Never overpromise, because bidding decides the price and a broken promise destroys trust. Doing it to close, or only for gold or rare coins, is still overpromising."}
 ],
 'm2.5':[
  {q:"At first, the manager steps in only to:",o:["Take over the appointment","Prevent a real mistake","Critique your tone","Make small talk"],a:1,e:"Prevent a real mistake: the manager is a safety net, not a co-pilot, so you learn by doing. Taking over robs you of the reps, and critiquing tone or small talk is not the point of being there."},
  {q:"Over time, supervision:",o:["Stays the same","Steps down: at the table, then nearby, then solo","Increases","Ends on day one"],a:1,e:"Steps down from at the table, to nearby, to solo, as you prove yourself. It does not stay constant, it does not increase, and it does not end on day one before you are ready."},
  {q:"You should capture a customer review on:",o:["Big deals only","Every closed deal","No deals","Random deals"],a:1,e:"Every closed deal: review volume protects the rating that drives the business. Big deals only, none, or random misses leave easy reviews uncollected."},
  {q:"Your daily numbers are:",o:["Ignored","Reviewed and checked against the records","Kept secret","Optional"],a:1,e:"Reviewed and checked against the records so reporting stays honest. Ignored, secret, or optional numbers would let problems hide."},
  {q:"Reporting your numbers must be:",o:["Rounded up","Honest","Hidden","Optional"],a:1,e:"Honest, because the numbers are verified against records anyway. Rounding up, hiding, or treating it as optional all break trust the moment they are checked."},
  {q:"In supervised buying you learn mainly by:",o:["Watching only","Doing, with a safety net","Reading only","Testing only"],a:1,e:"Doing, with a safety net: real appointments under supervision build the skill. Watching, reading, or testing alone never builds the hands-on ability."}
 ],
 'm2.6':[
  {q:"Promotion to Junior Purchaser is decided on:",o:["Tenure","Data and results","Relationships","Seniority"],a:1,e:"Data and results, which keeps promotion fair and earned. Tenure, relationships, and seniority reward time or favor instead of proven ability."},
  {q:"Healthy deals are deals that:",o:["Break the rules for volume","Stay within the pricing rules","Skip the records","Avoid reviews"],a:1,e:"Stay within the pricing rules: that is what makes a deal sustainable. Breaking rules for volume, skipping records, or avoiding reviews all create problems later."},
  {q:"Who signs off on the promotion?",o:["A peer","Leadership","HR only","The customer"],a:1,e:"Leadership signs off on the numbers. A peer lacks the authority, HR alone does not decide, and the customer has no role in promotion."},
  {q:"Which is a promotion gate?",o:["Most overtime","Strong customer reviews and healthy buy results","Fewest breaks","Loudest voice"],a:1,e:"Strong reviews and healthy buy results are real performance gates. Overtime, breaks, and volume of voice measure presence or noise, not results."},
  {q:"Before going solo you must consistently:",o:["Work the most hours","Hit targets within the rules","Close every single deal","Skip testing to be faster"],a:1,e:"Consistently hit targets within the rules: that proves you are ready. Most hours is effort not results, closing every deal is unrealistic, and skipping testing creates losses."},
  {q:"Why is data-based promotion good for you?",o:["It is faster","You move up only when truly ready","It avoids tests","It is cheaper"],a:1,e:"You move up only when truly ready, so you succeed in the next role. It is not about speed or cost, and the tests are part of the data, not avoided."}
 ],
 'm3a.1':[
  {q:"Two weeks out you:",o:["Print transaction sheets","Confirm venue and room, brief marketing, set staffing, schedule equipment shipping","Tear down","Do the final count"],a:1,e:"Two weeks out is the big-picture setup: venue, marketing, staffing, shipping. Printing sheets is a three-days-out task, and teardown and final count happen at the end of the show, not before it."},
  {q:"Three days out the appointment count is low. You:",o:["Cancel the show","Escalate to the marketing lead for a boost","Lower prices","Wait and hope"],a:1,e:"Escalate to marketing for a boost: there is still time to drive appointments. Canceling is drastic, lowering prices does not fill a calendar, and waiting wastes the window."},
  {q:"One day out you:",o:["Ship the equipment","Set the room, router, cameras, tablet, and scale, then photograph it","Brief marketing","Do the final count"],a:1,e:"One day out you set up the room and gear and photograph it. Shipping equipment and briefing marketing are earlier tasks, and the final count is an end-of-show task."},
  {q:"After setup the day before you:",o:["Go home immediately","Photograph the setup and send it to the team channel","Start buying","Tear down"],a:1,e:"Photograph the setup and post it: it is the first signal the show will run clean. Going home skips that check, buying has not started, and teardown is for the end."},
  {q:"The customer table should face:",o:["The wall","The door","The window","Away from everyone"],a:1,e:"The door, so you can read and greet everyone who enters. Facing a wall, window, or away from the room leaves you blind to arrivals."},
  {q:"What is printed three days out?",o:["Posters","Transaction sheets","Menus","Nothing"],a:1,e:"Transaction sheets, so you have the paperwork ready. Posters are a marketing item, menus are unrelated, and 'nothing' skips a required step."}
 ],
 'm3a.2':[
  {q:"The first step when setting up the internet is:",o:["Connect to the router's network","Connect the laptop to the venue WiFi and confirm it works","Power the cameras","Open the tablet"],a:1,e:"Confirm the venue WiFi works on the laptop first; if the venue line is dead, nothing downstream will work. Connecting to the router, powering cameras, or opening the tablet all come after you know the internet is good."},
  {q:"After the venue WiFi, you:",o:["Power the cameras","Connect to the router's own network and open its admin page","Zero the scale","Do nothing"],a:1,e:"Connect to the router's network and open its admin page to repeat the venue WiFi. Powering cameras comes after the router is online, zeroing the scale is a separate setup task, and doing nothing stalls the build."},
  {q:"Devices connect to the travel router by:",o:["Cable","WiFi, with the router on wall power","Bluetooth","They do not connect"],a:1,e:"By WiFi, with the router on wall power for stability. Cable and Bluetooth are not how the kit is designed, and the devices clearly do need to connect."},
  {q:"A camera goes down right before opening. You:",o:["Open anyway","Pause until it is fixed; full coverage is required","Cover just that area","Ignore it"],a:1,e:"Pause until it is fixed: running without full coverage is not allowed. Opening anyway, covering one spot manually, or ignoring it all leave a blind spot the policy forbids."},
  {q:"Cameras should cover:",o:["Only the scale","The scale, both sides of the table, the back table, and the entry","Only the door","Only the lobby"],a:1,e:"Full coverage of the scale, both sides of the table, the back table, and the entry. Covering only the scale, door, or lobby leaves the rest of the floor unwatched."},
  {q:"The sign-in tablet color codes should be used:",o:["Randomly","Consistently, with buyer initials on each row","Never","Only for buys"],a:1,e:"Consistently, with buyer initials, so anyone can read the board. Random use makes it meaningless, never using them loses the tracking, and using them only for buys ignores the other statuses."},
  {q:"Each shipping box is:",o:["Unlimited in value","Capped at the set maximum value","Limited to one item","Any amount"],a:1,e:"Capped at the set maximum value to limit risk per box. Unlimited value or any amount defeats the cap, and a one-item limit is not the rule."},
  {q:"Which may NOT be shipped?",o:["Coins","Breakables and recently made firearms","Sterling","Gold"],a:1,e:"Breakables and recently made firearms are not shipped. Coins, sterling, and gold ship normally, sorted and packed per the rules."}
 ],
 'm3a.3':[
  {q:"A deal stays within the pricing rules. You:",o:["Reject it","Approve it","Escalate it always","Ignore it"],a:1,e:"Approve it: a rule-compliant deal is exactly what your authority is for. Rejecting or always escalating wastes a clean deal, and ignoring it leaves the buyer waiting."},
  {q:"A borderline deal with a likely repeat customer can be:",o:["Never approved","Approved with a note explaining why","Approved silently","Reported to police"],a:1,e:"Approved with a note explaining why, so the borderline call is documented. Never approving is too rigid, approving silently hides the reasoning, and police involvement makes no sense here."},
  {q:"A deal that breaks the rules should be:",o:["Approved anyway","Rejected, then pivot to consignment","Hidden","Doubled"],a:1,e:"Rejected, then pivot to consignment: hold the rules and still offer a path. Approving anyway or doubling it breaks the rules, and hiding it is dishonest."},
  {q:"An unusual rare item comes to the floor. You:",o:["Price it fast","Route it to the numismatist or specialist regardless of size","Reject it","Melt it"],a:1,e:"Route it to the specialist regardless of size: rare items are easy to misjudge. Pricing fast risks a costly miss, rejecting loses it, and melting could destroy real value."},

CURRICULUM.forEach(t=>t.modules.forEach(m=>{ if(HARD[m.id]) m.hard=HARD[m.id]; }));
function tierHardPool(t){let p=[];t.modules.forEach(m=>{p=p.concat((m.hard&&m.hard.length)?m.hard:m.test);});return p;}
function buildModuleQuestions(mod,useHard){
  const cap=SHOW_CAP;
  if(useHard && mod.hard && mod.hard.length){
    let pool=shuffle(mod.hard);
    if(pool.length>=cap) return pool.slice(0,cap);
    const used=new Set(pool.map(q=>q.q));
    const fill=shuffle(mod.test).filter(q=>!used.has(q.q)).slice(0,cap-pool.length);
    return shuffle(pool.concat(fill));
  }
  return shuffle(mod.test).slice(0,Math.min(mod.test.length,cap));
}

/* ---- structure helpers ---- */
function flatModules(){const l=[];CURRICULUM.forEach(t=>t.modules.forEach(m=>l.push({tier:t,mod:m})));return l;}
function tierById(id){return CURRICULUM.find(t=>t.id===id);}
function tierPool(t){let p=[];t.modules.forEach(m=>{p=p.concat(m.test);});return p;}
function modulesAllPassed(p,tid){const t=tierById(tid);return t.modules.every(m=>p.modules[m.id]&&p.modules[m.id].status==='passed');}
function finalPassed(p,tid){return !!(p.finals&&p.finals[tid]&&p.finals[tid].passed);}
function tierComplete(p,tid){return modulesAllPassed(p,tid)&&finalPassed(p,tid);}
function tier3Certified(p,tid){return tierComplete(p,tid)&&!!(p.signoff&&p.signoff[tid]);}
function programComplete(p){return tierComplete(p,'tier1')&&tierComplete(p,'tier2')&&(tier3Certified(p,'tier3a')||tier3Certified(p,'tier3b'));}
function finalStatus(p,tid){if(!modulesAllPassed(p,tid))return'locked';return finalPassed(p,tid)?'passed':'available';}

function computeStatus(p){
  const s={};CURRICULUM.forEach(t=>t.modules.forEach(m=>s[m.id]='locked'));
  Object.keys(p.modules).forEach(id=>{if(p.modules[id].status==='passed')s[id]='passed';});
  const t1=tierById('tier1').modules;
  if(s[t1[0].id]!=='passed')s[t1[0].id]='available';
  for(let i=0;i<t1.length-1;i++){if(s[t1[i].id]==='passed'&&s[t1[i+1].id]!=='passed')s[t1[i+1].id]='available';}
  const t2=tierById('tier2').modules;
  if(tierComplete(p,'tier1')&&s[t2[0].id]!=='passed')s[t2[0].id]='available';
  for(let i=0;i<t2.length-1;i++){if(s[t2[i].id]==='passed'&&s[t2[i+1].id]!=='passed')s[t2[i+1].id]='available';}
  ['tier3a','tier3b'].forEach(tid=>{const t3=tierById(tid).modules;
    if(tierComplete(p,'tier2')&&s[t3[0].id]!=='passed')s[t3[0].id]='available';
    for(let i=0;i<t3.length-1;i++){if(s[t3[i].id]==='passed'&&s[t3[i+1].id]!=='passed')s[t3[i+1].id]='available';}});
  return s;
}
function stats(p){const total=flatModules().length;const passed=Object.values(p.modules).filter(m=>m.status==='passed').length;return{passed,total,pct:Math.round(passed/total*100)};}

/* ---- trainee data ---- */
function getTrainees(){return load(STORE.trainees,{});}
function saveTrainees(t){save(STORE.trainees,t);}
function currentName(){return load(STORE.current,null);}
function normalize(p){if(!p)return p;p.modules=p.modules||{};p.finals=p.finals||{};p.signoff=p.signoff||{tier3a:false,tier3b:false};p.log=p.log||[];if(!p.lastActivity)p.lastActivity=p.created||Date.now();return p;}
function currentProgress(){const t=getTrainees();const n=currentName();return n&&t[n]?normalize(t[n]):null;}
function persist(p){const t=getTrainees();t[p.name]=p;saveTrainees(t);}
function newTrainee(n){return{name:n,created:Date.now(),lastActivity:Date.now(),modules:{},finals:{},signoff:{tier3a:false,tier3b:false},completedAt:null,log:[]};}
function ensureCompletion(p){if(programComplete(p)&&!p.completedAt){p.completedAt=Date.now();persist(p);}}
function stalled(p){return !programComplete(p)&&(Date.now()-(p.lastActivity||p.created))>STALL_DAYS*86400000;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(ts){if(!ts)return'';const d=new Date(ts);return d.toLocaleDateString()+' '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}

function renderTopbar(){
  const n=currentName();
