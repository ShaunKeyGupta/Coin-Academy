inal Count","Show Expenses & Info"],"a":1,"e":"CALCULATOR is where you build the offer at the table. Show Totals & Profit is the locked master page, Final Count is for logging closed deals, and Show Expenses & Info holds spot prices, not item entry."},{"q":"The Show Totals & Profit tab is marked Do Not Alter because:","o":["It is decorative","The calculator pulls its values from it","It is the customer copy","It is empty"],"a":1,"e":"The calculator pulls its values from it, so changing it breaks every offer. It is not decorative or empty, and it is an internal master page, not a customer copy."},{"q":"For 2 ounces of 14K scrap, what goes in the Amount column?","o":["The count of pieces","The weight in pennyweight (DWT)","The karat number","The price"],"a":1,"e":"Weight in pennyweight (DWT) for metals: the sheet prices gold by weight. A count is only for coins, the karat is the row you pick, and you never type a price into Amount."},{"q":"For 12 silver quarters, the Amount is:","o":["The total weight","The count, 12","The face value","The year"],"a":1,"e":"The count, 12: coins are entered by how many. Weight is for scrap metal, and face value and year are not the Amount field."},{"q":"The 'Offer' figure at the top is:","o":["The ceiling","What you offer the customer","The spot price","The resale value"],"a":1,"e":"What you offer the customer, the sum of your rows. The ceiling is MAX Face, the spot price lives on the info tab, and the full resale basis is the Total Value figure, not the Offer."},{"q":"A customer wants 50 dollars more than MAX Face on a rare coin. You:","o":["Pay it","Do not exceed MAX Face; pivot to consignment","Split the difference","Raise the spot price"],"a":1,"e":"Hold MAX Face and pivot to consignment: the ceiling exists to protect the deal, and consignment can get them more at auction. Paying over or splitting the difference breaks the ceiling, and you cannot just raise spot to justify it."},{"q":"Gold values look different than they did this morning. This is because:","o":["The sheet is broken","Spot prices update every hour; use the current sheet","The customer changed them","Values never change"],"a":1,"e":"Spot updates every hour, so the metal MAX Face recalculates through the day; always use the current sheet. The sheet is not broken, customers cannot change it, and metal values do move."},{"q":"Who sets the spot prices?","o":["Each buyer","Leadership","The customer","The calculator at random"],"a":1,"e":"Leadership keeps spot current. Individual buyers do not set it, the customer has no input, and the figures come from real prices, not random numbers."},{"q":"Besides the printout, a complete record needs:","o":["Nothing","ID, signature, and an itemized list","Just a photo","Just the name"],"a":1,"e":"ID, signature, and an itemized list make the record complete and compliant. 'Nothing', a photo alone, or just a name all leave the transaction undocumented."},{"q":"The gap between Offer and Total Value is:","o":["An error","The negotiating room up to MAX Face","The tax","The shipping"],"a":1,"e":"The negotiating room up to MAX Face: the offer starts below the value basis, leaving room to move. It is not an error, and tax and shipping are not part of this spread."}],"comp":"Have the trainee price a sample lot on the calculator tab using count for coins and pennyweight for metal, respect MAX Face, and produce an offer. Pass only if the math and the MAX Face ceiling are correct."},{"id":"m2.15","name":"Fast Value Triage","passMark":85,"lessonHTML":"<div class=\"outcome\"><b>What you will be able to do</b><br>Sort a mixed pile fast into three piles, buy, route, and reject, so you spend your time and the customer's patience on the items that actually carry money.</div>\n   <p>Estates and collections arrive as a jumble. A closer who tests every single item one by one burns the appointment and tires the customer. The skill is a quick first sort, so the high-value items get your attention and the low-value bulk gets handled cheaply.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>Triage first, then go deep. Run a fast screen and split the lot into three piles: <strong>Buy</strong> (clearly precious metal, real silver coins, recognizable value), <strong>Route or look up</strong> (early or unusual coins, cards, significant or loose diamonds, vintage or uncertain watches), and <strong>Reject or bulk</strong> (plated, costume, clad bank coins). Then do the careful testing and pricing on the Buy and Route piles, not on the junk.</p></div>\n   <h3>The quick screen</h3>\n   <ul>\n     <li><strong>Stamps first on jewelry:</strong> 10K, 14K, 18K, 22K, .925, Platinum, PT, 950 go to Buy. GF, GP, HGE, EPNS, and 1/10 or 1/20 go to Reject or bulk.</li>\n     <li><strong>Magnet as a fast screen:</strong> real gold, silver, and platinum are not magnetic. A strong pull on the body of a piece is a red flag.</li>\n     <li><strong>Coins by era:</strong> pre-1965 silver dimes, quarters, halves and pre-1971 silver-ish halves go to Buy. Post-cutoff clad and modern bank coins go to Reject or bulk. Early, unusual, or key-date coins go to Route or look up.</li>\n     <li><strong>Watches:</strong> luxury names and solid gold cases go to Buy. Fashion and smartwatches go to Reject unless the case is solid gold.</li>\n     <li><strong>Cards, significant or loose diamonds, anything you cannot value on sight:</strong> Route or look up.</li>\n   </ul>\n   <div class=\"standard\"><b>Why this protects your money</b><br>Time is the scarce resource at the table. Triage means the rare coin and the solid gold get a careful look while the costume jewelry gets weighed by the pound and the clad gets handed back. Closers who do not triage either overpay on junk or run out of time before they reach the gold.</div>\n   <h3>Common mistakes</h3>\n   <ul>\n     <li>Testing every low-value item individually and running out of time.</li>\n     <li>Rabbit-holing on a big pile of costume jewelry instead of bulking it.</li>\n     <li>Skipping the careful test on the Buy pile because the triage felt like enough.</li>\n     <li>Tossing an early or unusual coin into Reject instead of Route.</li>\n   </ul>","comp":"Hand the trainee a mixed lot (or a described lot) containing real gold, plated items, pre-1965 silver coins, clad coins, an early or unusual coin, a card, and a fashion watch. Time them. They must sort it into Buy, Route or look up, and Reject or bulk, explain each call, then state how they would handle the bulk pile (weigh costume by the pound, hand back clad). Pass only if the sort is correct, fast, and nothing valuable lands in Reject.","test":[{"q":"A customer dumps a large mixed box on the table. Your first move is to:","o":["Test every item one at a time","Triage the lot into Buy, Route, and Reject piles, then go deep on Buy and Route","Quote a number for the whole box","Reject the box"],"a":1,"e":"Triage first, then go deep on the valuable piles; testing everything one by one wastes the appointment, and a whole-box quote or rejection skips the value."},{"q":"In the quick screen, a chain stamped GF goes to:","o":["Buy","Reject or bulk","Route to specialist","Numismatist"],"a":1,"e":"GF is gold-filled, not solid, so it goes to Reject or bulk; it is not a Buy, a specialist route, or a coin matter."},{"q":"A 1962 silver quarter in the pile goes to:","o":["Reject","Buy","Route","Bulk costume"],"a":1,"e":"A pre-1965 quarter is 90 percent silver, so it goes to Buy; it is not reject, route, or costume."},{"q":"An early large cent in the pile goes to:","o":["Reject","Route or look up","Buy at melt","Bulk"],"a":1,"e":"An early or unusual coin goes to Route or look up; rejecting, paying melt, or bulking it risks a rarity."},{"q":"A big handful of obvious costume jewelry is best handled by:","o":["Testing each piece","Bulking it and weighing by the pound","Rejecting the whole customer","Routing to specialist"],"a":1,"e":"Bulk costume and weigh it by the pound; testing each piece wastes time, and it is not a reason to reject the customer or route to a specialist."},{"q":"A modern clad quarter dated 1998 goes to:","o":["Buy","Reject or hand back as bank coin","Route","Specialist"],"a":1,"e":"Modern clad coins are bank coins with no precious metal, so reject or hand back; they are not a Buy, a route, or a specialist item."},{"q":"A solid gold watch case with a no-name brand goes to:","o":["Reject","Buy for the gold","Bulk","Skip"],"a":1,"e":"A solid gold case is bought for its gold regardless of brand, so it goes to Buy; rejecting, bulking, or skipping loses real gold."},{"q":"You spot a graded card in the pile. It goes to:","o":["Buy at a guess","Route or look up with sold comps","Reject","Bulk"],"a":1,"e":"A card goes to Route or look up so you can prove value; a guessed buy, reject, or bulk all risk a costly miss."},{"q":"The point of triage is to:","o":["Avoid testing","Spend time on the items that carry money, not the junk","Reject more","Buy everything fast"],"a":1,"e":"Triage focuses your time on the valuable items; it is not about avoiding testing, rejecting more, or buying everything fast."},{"q":"After triage, the careful testing happens on:","o":["The Reject pile","The Buy and Route piles","Nothing","Only costume"],"a":1,"e":"Careful testing happens on the Buy and Route piles; the Reject pile is bulked or handed back, and skipping testing on Buy and Route would be reckless."},{"q":"A fashion-brand quartz watch with a base-metal case goes to:","o":["Buy as luxury","Reject unless the case is solid gold","Route","Numismatist"],"a":1,"e":"A fashion watch is rejected unless the case is solid gold; it is not a luxury Buy, a route, or a coin matter."},{"q":"A magnet pulls strongly on a gold-colored bracelet's body. This is:","o":["Proof it is solid gold","A red flag that it is not solid gold","Meaningless","A sign of high karat"],"a":1,"e":"Real gold is not magnetic, so a strong pull on the body is a red flag; it does not prove solid gold or high karat and is not meaningless."},{"q":"A loose diamond turns up while triaging. It goes to:","o":["Buy as melt","Route to the specialist","Reject","Bulk"],"a":1,"e":"A loose diamond goes to Route to the specialist; buying it as melt, rejecting, or bulking misses or undervalues it."},{"q":"Rabbit-holing on a huge costume pile costs you because:","o":["It does not","You burn the appointment and may never reach the gold","It looks thorough","Costume is valuable"],"a":1,"e":"Spending the appointment on costume means you may never reach the gold; it is not harmless, and costume is low value."},{"q":"A pre-1971 half dollar dated 1967 goes to:","o":["Reject as clad","Buy (1965 to 1970 halves are 40 percent silver)","Route","Bulk"],"a":1,"e":"1965 to 1970 halves are 40 percent silver, so it goes to Buy; rejecting as clad, routing, or bulking would miss the silver."},{"q":"Triage that puts an early coin in the Reject pile is:","o":["Fine, it is old","A mistake; early or unusual coins go to Route","Faster","Required"],"a":1,"e":"Putting an early coin in Reject is a mistake; early or unusual coins go to Route to be looked up, not discarded."},{"q":"A stamped .925 set of flatware goes to:","o":["Reject","Buy as sterling silver","Route","Bulk costume"],"a":1,"e":"A .925 stamp is sterling, so it goes to Buy; it is not reject, route, or costume."},{"q":"The three triage piles are:","o":["Cheap, medium, expensive","Buy, Route or look up, and Reject or bulk","Gold, silver, copper","Yes, no, maybe"],"a":1,"e":"The piles are Buy, Route or look up, and Reject or bulk; the other groupings are not the working sort."},{"q":"An EPNS tray in the pile goes to:","o":["Buy as silver","Reject (it is plated)","Route","Numismatist"],"a":1,"e":"EPNS is plated, not solid silver, so it goes to Reject; it is not a silver Buy, a route, or a coin matter."},{"q":"The fastest screen on a piece of jewelry is to:","o":["Weigh it first","Read the stamp and use the magnet","Acid test it","Ask the customer"],"a":1,"e":"Reading the stamp and using the magnet is the fast screen; weighing or acid-testing comes later, and the customer's word is not a test."},{"q":"After triage you find the Buy pile is large. You:","o":["Skip testing to save time","Test and price the Buy pile carefully; triage was only the first sort","Pay a flat number","Bulk it"],"a":1,"e":"Test and price the Buy pile carefully, because triage is only the first sort; skipping the test, paying flat, or bulking the Buy pile loses accuracy and money."},{"q":"A handful of modern foreign coins of unknown value goes to:","o":["Buy at melt","Route or look up","Reject without checking","Bulk as costume"],"a":1,"e":"Unknown foreign coins go to Route or look up; buying at melt, rejecting without checking, or bulking them risks missing value."}]},{"id":"m2.13","name":"Writing the Check","passMark":85,"lessonHTML":"<div class=\"outcome\"><b>What you will be able to do</b><br>Pay a customer correctly and create a clean record, so the money out matches the deal and the day reconciles to zero.</div>\n   <p>The check is the moment money leaves. A sloppy check is how a day fails to reconcile, how a customer is overpaid, and how a record goes missing. The procedure is short and you follow it the same way every time.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>You write the check only after the deal is agreed and the items are verified. The check is for the exact agreed offer, payable to the name on the customer's ID. You record the check number on the Final Count page immediately, and you sign per the show's authorization. Money out must equal what the deal sheet says you agreed to pay.</div>\n   <h3>The steps, in order</h3>\n   <ul>\n     <li><strong>Confirm the deal:</strong> the agreed offer on the deal sheet is final, and the items are in front of you and verified.</li>\n     <li><strong>Verify ID:</strong> check the customer's identification and write the check payable to the name on that ID.</li>\n     <li><strong>Write the amount:</strong> the exact agreed offer, in numbers and in words, so it cannot be altered.</li>\n     <li><strong>Date and memo:</strong> date the check and note a reference (the deal or a short item description) in the memo line.</li>\n     <li><strong>Sign:</strong> sign per the show's authorization.</li>\n     <li><strong>Record immediately:</strong> write the check number on the Final Count page right then, next to the customer name, amount, and counts, so nothing is lost.</li>\n     <li><strong>Hand over and keep the record:</strong> give the customer their check and keep the itemized record and printout.</li>\n   </ul>\n   <div class=\"standard\"><b>Why this protects your money</b><br>The amount on the check is the amount spent, and the amount spent is what the Final Count reconciles against. If the check is for the wrong amount, written before the deal is verified, or never recorded, the day will not balance and someone has to chase it down. A clean check is a clean day.</div>\n   <h3>When to pause</h3>\n   <ul>\n     <li>If the customer wants more than MAX Face, you do not raise the check, you pivot to consignment.</li>\n     <li>If a deal over 2500 in total value is about to walk, follow the escalation rule before paying.</li>\n     <li>If anything about the ID or the deal feels off, stop and get a second opinion before money moves.</li>\n   </ul>\n   <h3>Common mistakes</h3>\n   <ul>\n     <li>Writing the check before the deal is agreed or the items are verified.</li>\n     <li>Paying a different amount than the agreed offer on the deal sheet.</li>\n     <li>Forgetting to record the check number on the Final Count, so the day will not reconcile.</li>\n     <li>Writing the check to a name that does not match the ID.</li>\n   </ul>","comp":"Have the trainee complete a mock purchase end to end: confirm an agreed offer on a deal sheet, verify a sample ID, write a mock check for the exact amount payable to the ID name with the amount in numbers and words, and then record the check number on a Final Count page. Pass only if the check matches the agreed offer exactly, the payee matches the ID, and the check number is recorded on the Final Count before they consider the deal done.","test":[{"q":"You write the check:","o":["Before evaluating the items, to save time","Only after the deal is agreed and the items are verified","Whenever the customer is in a hurry","Before checking ID"],"a":1,"e":"Write the check only after the deal is agreed and items are verified; writing early, rushing, or skipping ID risks paying for the wrong thing."},{"q":"The check is made payable to:","o":["Cash","The name on the customer's ID","Whatever the customer says","The store"],"a":1,"e":"Make the check payable to the name on the ID; cash, an unverified name, or the store would be wrong or unsafe."},{"q":"The amount on the check must equal:","o":["MAX Face","The exact agreed offer on the deal sheet","The total value","A round number"],"a":1,"e":"The check equals the exact agreed offer (the amount spent); MAX Face and total value are higher figures, and rounding changes what you paid."},{"q":"Right after writing the check you:","o":["Move to the next customer","Record the check number on the Final Count page","Shred the deal sheet","Forget the number"],"a":1,"e":"Record the check number on the Final Count immediately so the day reconciles; moving on, shredding the sheet, or forgetting the number breaks the record."},{"q":"Writing the amount in both numbers and words:","o":["Wastes time","Prevents the amount from being altered","Is optional","Is for decoration"],"a":1,"e":"Numbers and words prevent the amount from being altered; it is not a waste, optional, or decorative."},{"q":"The memo line should carry:","o":["Nothing","A reference such as the deal or a short item description","The spot price","The customer's birthday"],"a":1,"e":"Put a reference like the deal or item description in the memo; leaving it blank, the spot price, or personal data does not document the purchase."},{"q":"A customer wants 200 more than MAX Face. You:","o":["Write the bigger check","Hold the offer and pivot to consignment","Split the difference","Round up"],"a":1,"e":"Hold the offer and pivot to consignment; writing a bigger check, splitting, or rounding up breaks the MAX Face ceiling."},{"q":"The amount spent on the Final Count should match:","o":["The total value","The check amount","MAX Face","The spot price"],"a":1,"e":"Amount spent equals the check amount; total value, MAX Face, and spot are different figures."},{"q":"You realize you wrote the check for 50 more than the agreed offer. You:","o":["Let it go","Void it and write a correct check, then record the right number","Pay the extra","Hide it"],"a":1,"e":"Void the wrong check and write a correct one, then record the right number; letting it go, overpaying, or hiding it breaks the reconciliation and overpays the customer."},{"q":"The day's Final Count will reconcile to zero when:","o":["You guess the totals","Every check written is recorded and the amounts match what was spent","You round everything","You skip the small deals"],"a":1,"e":"It reconciles when every check is recorded and amounts match; guessing, rounding, or skipping deals leaves a gap."},{"q":"The ID name and the payee on the check:","o":["Can differ","Must match","Do not matter","Are filled in later"],"a":1,"e":"The payee must match the ID name; a mismatch, treating it as unimportant, or filling it in later is unsafe and incorrect."},{"q":"A deal over 2500 in total value is about to walk. Before paying you:","o":["Write a bigger check","Follow the escalation rule (call the roadshow manager or another closer, then consignment if needed)","Pay over MAX Face","Let it walk silently"],"a":1,"e":"Follow the escalation rule before paying; a bigger check, paying over MAX Face, or silently letting it walk all break the rules."},{"q":"You forgot to record a check number and the day will not balance. You:","o":["Leave it off","Find the deal and record the correct number before leaving","Estimate it","Delete a row"],"a":1,"e":"Find the deal and record the correct number before leaving; leaving it off, estimating, or deleting a row hides a real gap."},{"q":"If something about the ID feels off, you:","o":["Pay anyway","Stop and get a second opinion before money moves","Round down","Write it to cash"],"a":1,"e":"Stop and get a second opinion before paying; paying anyway, rounding, or writing to cash is unsafe."},{"q":"Keeping the itemized record and printout after paying is:","o":["Optional","Required, so the purchase is fully documented","For the customer only","A waste"],"a":1,"e":"Keeping the itemized record and printout is required for documentation; it is not optional, customer-only, or wasteful."},{"q":"Two customers' checks get mixed up in your recording. The fix is to:","o":["Guess which is which","Match each check number to the right customer and amount on the Final Count","Combine them","Skip both"],"a":1,"e":"Match each check number to the right customer and amount; guessing, combining, or skipping leaves the record wrong."},{"q":"The amount spent figure is used to:","o":["Set the spot price","Reconcile the day and feed the totals","Decide the karat","Schedule customers"],"a":1,"e":"Amount spent reconciles the day and feeds the totals; it does not set spot, decide karat, or schedule anyone."},{"q":"A customer asks you to write the check to a friend who is not present. You:","o":["Do it","Write it to the name on the seller's ID, not a third party","Write it to cash","Refuse the deal"],"a":1,"e":"Write the check to the name on the seller's ID, not a third party or cash; doing what they ask or refusing the deal outright are both wrong."},{"q":"The single rule that keeps payment clean is:","o":["Pay fast","The check equals the agreed offer, payable to the ID name, recorded on the Final Count","Round to the nearest hundred","Pay in cash"],"a":1,"e":"The check equals the agreed offer, is payable to the ID name, and is recorded on the Final Count; paying fast, rounding, or cash break the standard."},{"q":"Recording the check number immediately, rather than at end of day, matters because:","o":["It does not","Memory fails and a missing number is hard to recover later","It looks neat","It is required by the bank"],"a":1,"e":"Recording immediately avoids relying on memory, which fails; it is not pointless, merely cosmetic, or a bank rule."},{"q":"Before considering a deal done you confirm:","o":["Only that the customer is happy","The check matches the agreed offer, the payee matches the ID, and the number is on the Final Count","Only the karat","Only the spot price"],"a":1,"e":"Confirm the check matches the offer, the payee matches the ID, and the number is recorded; customer happiness, karat, or spot alone do not close the loop."},{"q":"The name you wrote does not match the customer's ID. You:","o":["Leave it","Void it and rewrite to the exact ID name, then record the new number","Cross it out and initial","Ask them to sign for it"],"a":1,"e":"Void and rewrite to the exact ID name, then record the new number; leaving it, crossing out, or a signature workaround leave an unsafe, mismatched check."},{"q":"The agreed offer is 1,240. The check should read:","o":["A rounded 1,250","1,240 in numbers and 1,240 in words","Whatever is easier to write","The total value instead"],"a":1,"e":"Write the exact 1,240 in numbers and in words; rounding, convenience, or using total value changes what you actually paid."},{"q":"After handing the customer their check, you:","o":["Discard the paperwork","Keep the itemized record and printout for documentation","Recycle the deal sheet","Delete the lead"],"a":1,"e":"Keep the itemized record and printout so the purchase is documented; discarding, recycling, or deleting destroys the record."}]},{"id":"m2.8","name":"Logging Deals on the Final Count Page","passMark":85,"lessonHTML":"\n   <div class=\"outcome\"><b>What you'll be able to do</b><br>After this module you can record every completed deal on the Final Count page correctly, so the day reconciles cleanly and management has accurate numbers.</div>\n   <h2>Two Different Pages, Two Different Jobs</h2>\n   <p>The <strong>CALCULATOR</strong> page is where you build the offer with the customer in front of you. The <strong>Final Count</strong> page is where you record each deal after it closes. They are not the same page. The CALCULATOR helps you reach a number; the Final Count is the record of what actually happened.</p>\n   <h2>What You Enter for Each Completed Deal</h2>\n   <p>After a customer agrees and you pay them, log the deal on the Final Count page with:</p>\n   <ul>\n   <li><strong>Customer name:</strong> who you bought from.</li>\n   <li><strong>Check number:</strong> the number of the check you wrote them (or the payment reference).</li>\n   <li><strong>Amount spent:</strong> exactly what you paid, the agreed offer.</li>\n   <li><strong>Counts by category:</strong> the quantities of each coin and metal type bought, the same rows as the calculator, so the totals build correctly.</li>\n   <li><strong>Final numbers:</strong> confirm the row totals and the deal total match what you paid.</li>\n   </ul>\n   <h2>Why Accuracy Here Matters</h2>\n   <p>The Final Count page feeds the day's totals: people seen, checks written, total spent, and total value. If a check number or amount is wrong, the day will not reconcile and management sees a gap. Enter each deal right after it closes, while it is fresh, rather than trying to remember at the end of the day.</p>\n   <h2>End of Day</h2>\n   <p>At close, your Final Count totals should match the checks you actually wrote and the cash or payments that went out. The number of checks written and the total spent should line up. If something does not match, find it before you leave.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>Log every deal on the Final Count page the moment it closes, with the customer name, check number, amount spent, and counts. Clean entry as you go is what makes the day reconcile and keeps the numbers management relies on accurate.</div>\n   <div class=\"takeaways\"><h3>Key Takeaways</h3><ul>\n   <li>The CALCULATOR page builds the offer; the Final Count page records each closed deal.</li>\n   <li>For each deal, log the customer name, check number, amount spent, and the counts by category.</li>\n   <li>Confirm the row totals and deal total match what you paid.</li>\n   <li>The Final Count page feeds the day's totals: people seen, checks written, total spent, total value.</li>\n   <li>Enter each deal right after it closes, not from memory at the end of the day.</li>\n   <li>At close, checks written and total spent should line up; fix any mismatch before leaving.</li>\n   </ul></div>","test":[{"q":"What is the CALCULATOR page for?","o":["Recording closed deals","Building the offer with the customer","Management reporting","Shipping"],"a":1,"e":"The CALCULATOR builds the offer in front of the customer; recording closed deals, management reporting, and shipping are other pages or jobs."},{"q":"What is the Final Count page for?","o":["Building the offer","Recording each deal after it closes","Setting spot prices","Marketing"],"a":1,"e":"Final Count records each closed deal; it does not build the offer, set spot prices, or run marketing."},{"q":"Which do you log for each deal?","o":["Only the total","Customer name, check number, amount spent, and counts","Just the customer name","Nothing"],"a":1,"e":"Log the name, check number, amount spent, and counts; only the total or just the name leaves gaps, and nothing breaks the day."},{"q":"The 'amount spent' is:","o":["The item's full value","Exactly what you paid, the agreed offer","The spot price","The tax"],"a":1,"e":"Amount spent is exactly what you paid; the item's full value and MAX Face are higher, and tax is not part of it."},{"q":"The check number is:","o":["Optional","The number of the check you wrote (or payment reference)","The customer's phone","The date"],"a":1,"e":"The check number is the check or payment reference; it is not optional, the customer's phone, or the date."},{"q":"When should you log a deal?","o":["At the end of the day from memory","Right after it closes, while fresh","Next week","Never"],"a":1,"e":"Log right after it closes while fresh; end of day from memory, next week, or never invites errors."},{"q":"The Final Count page feeds:","o":["Nothing","The day's totals (people seen, checks written, total spent, total value)","The marketing budget","The cheat-sheet"],"a":1,"e":"Final Count feeds the day's totals; it does not feed the marketing budget, the cheat-sheet, or nothing."},{"q":"At close, what should line up?","o":["Nothing","Checks written and total spent","The weather","The schedule"],"a":1,"e":"Checks written and total spent should match; the weather and the schedule are not what you reconcile, and 'nothing' is wrong."},{"q":"If the day does not reconcile you should:","o":["Leave anyway","Find the mismatch before leaving","Ignore it","Delete the page"],"a":1,"e":"Find the mismatch before leaving; leaving anyway, ignoring it, or deleting the page hides the real numbers."},{"q":"Are the CALCULATOR and Final Count the same page?","o":["Yes","No, they do different jobs","Only on weekends","Only for managers"],"a":1,"e":"No, they do different jobs (offer versus record); they are not the same, not weekend-only, and not manager-only."},{"q":"The counts you enter by category should match:","o":["Random numbers","The same rows as the calculator","The spot prices","The customer's guess"],"a":1,"e":"Use the same rows as the calculator so totals build correctly; random numbers, the spot sheet, or the customer's guess would not tie back."},{"q":"Where do you record a closed deal?","o":["The CALCULATOR page","The Final Count page","Show Totals & Profit","Show Expenses & Info"],"a":1,"e":"The Final Count page records each closed deal. The CALCULATOR only builds the offer, Show Totals is the locked master, and Show Expenses & Info is for spot prices."},{"q":"For each closed deal you log:","o":["Just the total","Customer name, check number, amount spent, and counts","Just the name","Nothing"],"a":1,"e":"Name, check number, amount spent, and counts: the full set is what lets the day reconcile. Just the total or just the name leaves gaps, and logging nothing breaks the day's numbers."},{"q":"'Amount spent' means:","o":["The resale value","Exactly what you paid the customer","The spot price","MAX Face"],"a":1,"e":"Exactly what you paid, the agreed offer. Resale value and MAX Face are higher value figures, and spot is the metal price, none of which is the cash that left."},{"q":"You wrote a check but forgot to log it, and the day will not reconcile. You:","o":["Leave anyway","Find the missing entry before leaving","Estimate it","Delete a row to balance"],"a":1,"e":"Find the missing entry before leaving so the records are true. Leaving with a gap, estimating, or deleting a row to force a balance all hide the real numbers."},{"q":"Immediately after each deal closes, you log:","o":["Just the amount","Name, check number, amount spent, and counts","Nothing until end of day","Only the customer name"],"a":1,"e":"Log name, check number, amount spent, and counts right away; partial or delayed logging breaks reconciliation."},{"q":"The Final Count reconciles when:","o":["You estimate the totals","Every check is recorded and amounts match what was spent","You round to the nearest hundred","You skip small deals"],"a":1,"e":"It reconciles when every check is recorded and amounts match; estimating, rounding, or skipping leaves a gap."},{"q":"Logging at end of day instead of per deal risks:","o":["Nothing","Lost numbers and a day that will not balance","A neater sheet","Faster pay"],"a":1,"e":"End-of-day logging risks lost numbers and an unbalanced day; it is not harmless, neater, or faster."},{"q":"Your Final Count is off by one check at close. You:","o":["Leave it","Find the deal and record the missing number before leaving","Estimate it","Delete a row"],"a":1,"e":"Find the deal and record the missing number; leaving, estimating, or deleting hides a real gap."},{"q":"You paid by check but mistakenly logged it as cash on the Final Count. You:","o":["Leave it","Correct it to match the check","Add a second entry","Ignore the method"],"a":1,"e":"Correct the entry to match the check; leaving it, duplicating, or ignoring the method breaks reconciliation."},{"q":"Coin counts on a deal are recorded:","o":["At end of week","After each deal, on the Final Count","Never","Only for large deals"],"a":1,"e":"Record counts after each deal on the Final Count; weekly, never, or large-only logging loses accuracy."},{"q":"Two deals share the same customer name. You:","o":["Combine them","Record each with its own check number and amount","Pick one","Skip both"],"a":1,"e":"Record each deal separately with its own check number and amount; combining, picking one, or skipping corrupts the record."},{"q":"At close, your page balances. That means:","o":["You guessed well","Every recorded check matches the amount spent","You rounded","You skipped small deals"],"a":1,"e":"Balancing means recorded checks match amounts spent; guessing, rounding, or skipping would not truly balance."},{"q":"The deal sheet shows one number and the check another. You:","o":["Pick the higher","Reconcile to the agreed offer and fix the error before close","Pick the lower","Leave both"],"a":1,"e":"Reconcile to the agreed offer and fix the error; picking either at random or leaving both leaves the day wrong."}],"comp":"Have the trainee log two mock deals (name, check number, amount spent, counts) and reconcile the Final Count page to zero. Pass only on a clean reconcile."},{"id":"m2.4","name":"The Shows Sales Framework (10 Steps)","passMark":85,"lessonHTML":"\n   <div class=\"outcome\"><b>What you'll be able to do</b><br>After this module you can run a full in-person appointment end to end using the 10-step framework and handle the three most common objections.</div>\n   <h2>The 10 Steps</h2>\n   <ol>\n   <li>Clarify why they came in.</li>\n   <li>Understand who they are (read the avatar).</li>\n   <li>Overview what they have done before (sold items before, other quotes).</li>\n   <li>Show why you are the best (the collector's association story).</li>\n   <li>Handle obstacles early, before the offer.</li>\n   <li>Start the evaluation openly, where the customer can see it.</li>\n   <li>Re-check any unanswered concerns.</li>\n   <li>Deliver the price clearly and confidently.</li>\n   <li>Sale or no sale.</li>\n   <li>Get their information before they leave.</li>\n   </ol>\n   <h2>The First Minute</h2>\n   <p>Greet the customer by name, introduce yourself, and build a little rapport. Much of the decision is shaped in the first minute. Avoid politics and religion. Be warm and confident.</p>\n   <h2>Delivering the Price</h2>\n   <p>State the value clearly, hold a confident and positive tone, and then be quiet and let the customer respond. When they accept and reach to finalize, move the items to your side to complete the handoff.</p>\n   <h2>The Three Common Objections</h2>\n   <ul>\n   <li><strong>\"I want to pass it down to my kids\":</strong> ask whether the kids actually collect; most do not. Gently reframe to the value of cash today for something the family will use.</li>\n   <li><strong>\"I need to ask my spouse\":</strong> ask who is more knowledgeable, offer to include them by phone, and reassure that a free appraisal with no obligation is easy to say yes to.</li>\n   <li><strong>\"I researched it, it's worth X\":</strong> do not confirm or deny; explain that online listings are usually asking prices, not what collectors actually pay, then walk them through their specific items.</li>\n   </ul>\n   <h2>Feel, Felt, Found</h2>\n   <p>For emotional objections: \"I understand how you feel. Others have felt the same. What they found is...\" then give a true, helpful outcome.</p>\n   <h2>If the Cash Offer Fails</h2>\n   <p>On a high-value item where cash does not work, pivot to <strong>consignment</strong> rather than losing the item. Either way, get their information and offer a reason to come back before they leave.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>Follow the 10 steps in order and never skip the evaluation done openly in front of the customer. Transparency builds the trust that closes the deal and earns repeat business.</div>\n   <div class=\"takeaways\"><h3>Key Takeaways</h3><ul>\n   <li>The framework has 10 steps, from Clarify to Get their information.</li>\n   <li>Much of the decision forms in the first minute; greet by name and avoid politics and religion.</li>\n   <li>Run the evaluation openly where the customer can see it.</li>\n   <li>Deliver the price confidently, then go quiet and let them respond.</li>\n   <li>Handle pass-it-down, spouse, and researched-price objections without ever quoting against their number.</li>\n   <li>Feel, Felt, Found is the tool for emotional objections.</li>\n   <li>If cash fails on a high-value item, pivot to consignment.</li>\n   <li>Always get their information before they leave.</li>\n   </ul></div>","test":[{"q":"How many steps are in the framework?","o":["7","8","10","12"],"a":2,"e":"The framework has ten steps; 7, 8, and 12 are the wrong count."},{"q":"What is step 1?","o":["Deliver the price","Clarify why they came in","Close","Evaluate"],"a":1,"e":"Step 1 is clarify why they came in; delivering the price, closing, and evaluating come later."},{"q":"When is much of the decision shaped?","o":["At the price","In the first minute","At the end","Never"],"a":1,"e":"Much of the decision is shaped in the first minute; the price moment matters, but it is not at the end or never."},{"q":"In the first minute you should avoid:","o":["Smiling","Politics and religion","Their name","Eye contact"],"a":1,"e":"Avoid politics and religion early; smiling, using their name, and eye contact all help, not hurt."},{"q":"The evaluation should be done:","o":["In a back room","Openly where the customer can see","After they leave","On the phone"],"a":1,"e":"Run the evaluation openly where they can see; a back room, doing it after they leave, or over the phone looks like hiding something."},{"q":"After you deliver the price you should:","o":["Keep talking","Go quiet and let them respond","Lower it","Leave"],"a":1,"e":"State the price, then go quiet; talking past it or lowering it weakens the number, and leaving abandons the close."},{"q":"For 'pass it down to my kids' you:","o":["Insist they sell all","Ask whether the kids actually collect and reframe to cash value","Mock them","Quote a price"],"a":1,"e":"Ask whether the kids actually collect, then reframe to cash value; insisting they sell, mocking them, or quoting a price all backfire."},{"q":"For 'I need to ask my spouse' you:","o":["End the appointment","Ask who is more knowledgeable and offer to include them by phone","Pressure them","Quote a price"],"a":1,"e":"Ask who is more knowledgeable and offer to include them by phone; ending the appointment, pressuring, or quoting a price loses the deal."},{"q":"For 'I researched it, it's worth X' you:","o":["Agree to X","Argue lower","Explain online prices are asking prices, not paid prices","Walk away"],"a":2,"e":"Explain online prices are asking, not paid; agreeing to X, arguing lower, or walking away all hurt the deal."},{"q":"Feel, Felt, Found is used for:","o":["Pricing math","Emotional objections","Shipping","Scheduling"],"a":1,"e":"Feel, Felt, Found is for emotional objections; pricing math, shipping, and scheduling are logistics."},{"q":"If a cash offer fails on a high-value item you:","o":["Lose the item","Pivot to consignment","Pay over the limit","Argue"],"a":1,"e":"Pivot to consignment rather than losing it; losing the item, paying over the limit, or arguing all fail."},{"q":"The final step of the framework is:","o":["Deliver the price","Get their information before they leave","Evaluate","Greet"],"a":1,"e":"Step 10 is get their information before they leave; delivering the price, evaluating, and greeting happen earlier."},{"q":"When the customer accepts and reaches to finalize you:","o":["Recalculate","Move the items to your side to complete the handoff","Add fees","Pause"],"a":1,"e":"Move the items to your side to complete the handoff; recalculating, adding fees, or pausing risks unraveling the close."},{"q":"Which story do you use in step 4?","o":["A discount story","The collector's association story","A pawn shop story","No story"],"a":1,"e":"Use the collector's association story to show why you are best; a discount, pawn-shop, or no story would undercut the positioning."},{"q":"Customer: 'I want to pass these down to my kids.' Best move?","o":["Insist they sell now","Ask whether the kids actually collect, then reframe to cash value","Quote a higher price","End the appointment"],"a":1,"e":"Ask whether the kids collect, then reframe to cash value: most heirs do not collect, so this opens the real conversation. Insisting they sell is pushy, quoting higher breaks the rules, and ending the appointment gives up."},{"q":"Customer: 'I need to ask my spouse.' Best move?","o":["Pressure them to decide now","Ask who is more knowledgeable and offer to include them by phone","End the appointment","Quote a price to force it"],"a":1,"e":"Ask who is more knowledgeable and offer a phone call: it includes the spouse instead of fighting the objection. Pressuring them backfires, ending the appointment loses the deal, and quoting to force it is manipulative."},{"q":"Customer: 'I researched it, it's worth X online.' Best move?","o":["Agree to X","Explain online listings are asking prices, not paid, and walk their items","Argue it is worth far less","Match X to close"],"a":1,"e":"Explain that online listings are asking prices, not paid, then walk their items: this is honest and educational. Agreeing or matching X locks you into their number, and arguing it down starts a fight."},{"q":"Step 1 of the framework is:","o":["Deliver the price","Clarify why they came in","Evaluate the items","Close the sale"],"a":1,"e":"Clarify why they came in is step 1; you cannot serve them well without it. Delivering the price, evaluating, and closing all come later in the ten steps."},{"q":"Much of the decision is shaped:","o":["At the price","In the first minute","At the very end","Never"],"a":1,"e":"In the first minute: rapport and trust set the tone for everything after. The price moment matters, but the groundwork is already laid, and 'at the end' or 'never' misses how early it forms."},{"q":"Right after delivering the price you:","o":["Keep talking to justify it","Go quiet and let them respond","Lower it","Leave the table"],"a":1,"e":"Go quiet and let them respond: silence lets the offer land and puts the next move on them. Talking past it or lowering it weakens your number, and leaving the table abandons the close."},{"q":"The cash offer fails on a high-value item. You:","o":["Lose the item","Pivot to consignment","Pay above MAX Face","Argue the value"],"a":1,"e":"Pivot to consignment: auction can reach collectors who pay more, so you keep the item in play. Losing it gives up, paying above MAX Face breaks the ceiling, and arguing value rarely closes."},{"q":"When the customer sits down, your first step is to:","o":["State a number","Greet, sign them in, and check the CRM while building rapport","Test the gold","Push for the close"],"a":1,"e":"Greet, sign in, and check the CRM first; leading with a number, testing, or pushing skips rapport and the pipeline."},{"q":"You jumped to the offer without building value. The likely result is:","o":["A stronger close","A weaker close, because the number has no basis in the customer's mind","No effect","A faster deal every time"],"a":1,"e":"Skipping value weakens the close because the number lacks a basis; it does not strengthen or speed the deal."},{"q":"Immediately after stating your offer, you:","o":["Keep talking","Go quiet and let it land","Lower it","Add an item"],"a":1,"e":"Go quiet so the offer lands; talking past it, lowering, or sweetening weakens your number."},{"q":"The ten-step framework is meant to be:","o":["Skipped when busy","Followed in order so nothing is missed","Done backward","Optional"],"a":1,"e":"Follow the steps in order so nothing is missed; skipping, reversing, or treating it as optional breaks the flow."}],"comp":"Have the trainee run a full mock appointment through the ten-step framework. Pass only if every step is present and in order."},{"id":"m2.16","name":"Advanced Closing and Objection Handling","passMark":85,"lessonHTML":"<div class=\"outcome\"><b>What you will be able to do</b><br>Carry a customer from the offer to a signed deal, handling the objections that actually come up, with the calm certainty that closes. This is the difference between someone who knows the items and a closer who brings the money home.</div>\n   <p>The close is not a trick at the end. It is earned through everything before it: the sign-in, the open conversation, the transparent evaluation, and the value you build. By the time you state the number, most of the work is done. This module sharpens the last stretch, the part where deals are won or lost.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>Build trust and value first, state the offer with calm certainty, then stop talking. Handle each objection with its matched response, not a discount. Never exceed MAX Face. When price is the wall and you have done the work, pivot to consignment rather than overpaying, and escalate a 2500-plus deal that is about to walk.</div>\n   <h3>Tonality and framing</h3>\n   <ul>\n     <li><strong>Calm and certain:</strong> a closer who is rushed or unsure invites doubt. Slow down. Speak like the number is fair, because it is.</li>\n     <li><strong>Anchor on value:</strong> walk the items openly, show how the number was built, and let the work justify the offer.</li>\n     <li><strong>State the offer, then go silent:</strong> the offer should land and sit. The next person to speak is usually the customer. Talking past your own number weakens it.</li>\n   </ul>\n   <h3>The objection tree</h3>\n   <ul>\n     <li><strong>It is worth more, I saw it online:</strong> online listings are asking prices, not paid prices. Do not confirm or deny their number. Show the work, and if they still want more, pivot to consignment.</li>\n     <li><strong>I need to think about it:</strong> ask what specifically they want to think through. Often it is one concern you can answer right now.</li>\n     <li><strong>I need to ask my spouse:</strong> ask who knows the items best and offer to include them by phone, so the decision happens now with the right person.</li>\n     <li><strong>I want to pass it to my kids:</strong> ask whether the kids actually collect. Most do not. Reframe gently to the cash value today.</li>\n     <li><strong>It feels low:</strong> use Feel, Felt, Found. I understand how you feel, others felt the same, and here is what they found when we showed the work.</li>\n   </ul>\n   <h3>Closing the deal</h3>\n   <ul>\n     <li><strong>Assume the sale:</strong> once they lean in, move to finishing, do not re-sell what is already won.</li>\n     <li><strong>Handle, then return to the close:</strong> answer the objection, then ask for the deal again. Do not leave it hanging.</li>\n     <li><strong>Know when to pivot:</strong> if price is the wall and you have shown the work, pivot to consignment instead of breaking MAX Face.</li>\n     <li><strong>Know when to escalate:</strong> a 2500-plus total-value deal heading for the door gets a manager or another closer before it leaves.</li>\n     <li><strong>Finish clean:</strong> move the items to your side, write the check correctly, capture a review, and get their information.</li>\n   </ul>\n   <div class=\"standard\"><b>Why this protects your money</b><br>Most lost deals are not lost on price. They are lost because the closer kept talking, discounted out of nerves, or had no answer for a normal objection. A calm close with matched responses converts the same items into more closed deals at the same fair number.</div>\n   <h3>Common mistakes</h3>\n   <ul>\n     <li>Talking past your own offer and talking yourself down.</li>\n     <li>Treating every objection as a price problem and discounting.</li>\n     <li>Confirming or arguing the customer's online number.</li>\n     <li>Breaking MAX Face to save a deal instead of pivoting to consignment.</li>\n   </ul>","comp":"Role-play a full close. You play a customer who likes the items, hears the offer, and raises two objections (for example, it is worth more online and I need to ask my spouse). The trainee must state the offer with calm certainty, go quiet, handle each objection with the matched response without discounting, return to the close, and either land the handoff or pivot to consignment cleanly. Pass only if they never exceed MAX Face, never confirm the online number, and finish with a clear next step (signed deal or consignment setup).","test":[{"q":"You have just stated your offer. The best next move is to:","o":["Keep explaining why it is fair","Go quiet and let the offer land","Immediately lower it","Add another item to sweeten it"],"a":1,"e":"State the offer and go quiet so it lands; explaining past it, lowering it, or sweetening it weakens your number."},{"q":"Customer: 'I saw one online for way more.' You:","o":["Agree and match it","Explain online listings are asking prices, show your work, and pivot to consignment if they still want more","Argue it is worth nothing","Walk away"],"a":1,"e":"Explain asking versus paid, show the work, and pivot to consignment if needed; agreeing, arguing it down, or walking away all lose the deal or your margin."},{"q":"Customer: 'I need to think about it.' Best response:","o":["Pressure them to decide now","Ask what specifically they want to think through, since it is often one answerable concern","End the appointment","Lower the price"],"a":1,"e":"Ask what specifically they want to think through; pressuring, ending, or discounting do not address the real concern."},{"q":"Customer: 'I need to ask my spouse.' You:","o":["Refuse to continue","Ask who knows the items best and offer to include them by phone now","Pressure them","Quote a higher number"],"a":1,"e":"Ask who knows best and offer a phone call so the decision happens now; refusing, pressuring, or quoting higher push them away."},{"q":"Customer: 'I want to leave these to my kids.' You:","o":["Insist they sell","Ask whether the kids actually collect, then reframe to cash value","Mock the idea","Quote a price"],"a":1,"e":"Ask whether the kids collect, then reframe to cash value; insisting, mocking, or quoting a price all backfire."},{"q":"Calm, certain tonality matters because:","o":["It does not","A rushed or unsure tone invites doubt; calm certainty signals a fair number","It impresses no one","Loud is better"],"a":1,"e":"Calm certainty signals the number is fair, while rushed or unsure tone invites doubt; tone clearly matters and loud is not better."},{"q":"Feel, Felt, Found is best used when the objection is:","o":["A pricing calculation","Emotional, like the offer feels low","About shipping","About scheduling"],"a":1,"e":"Feel, Felt, Found fits emotional objections like the offer feeling low; it is not for calculations, shipping, or scheduling."},{"q":"You have shown the work and price is still the wall. You:","o":["Break MAX Face","Pivot to consignment","Keep arguing","Give up"],"a":1,"e":"Pivot to consignment when price is the wall; breaking MAX Face, arguing, or giving up are all wrong."},{"q":"A 2500-plus total-value deal is heading for the door. You:","o":["Let it go","Get a manager or another closer involved before it leaves","Break MAX Face","Lower your offer"],"a":1,"e":"Escalate a 2500-plus walk to a manager or another closer before it leaves; letting it go, breaking MAX Face, or lowering the offer fail the rule."},{"q":"The most common reason deals are lost is:","o":["The number is always too low","The closer kept talking, discounted out of nerves, or had no answer for a normal objection","Bad lighting","Slow internet"],"a":1,"e":"Most losses come from over-talking, nervous discounting, or no answer for normal objections, not the number itself, lighting, or internet."},{"q":"Anchoring on value means:","o":["Quoting a random high number","Walking the items openly and showing how the offer was built","Hiding the evaluation","Talking about the weather"],"a":1,"e":"Anchoring on value means showing how the offer was built through an open walkthrough; a random number, hiding the work, or small talk do not anchor value."},{"q":"After you handle an objection, you should:","o":["Leave it hanging","Return to the close and ask for the deal again","Start a new pitch","Lower the price"],"a":1,"e":"Return to the close and ask again after handling the objection; leaving it hanging, re-pitching, or discounting stalls the deal."},{"q":"The customer leans in and seems ready. You:","o":["Keep selling the items","Assume the sale and move to finishing","Re-explain the offer","Add a discount"],"a":1,"e":"Assume the sale and move to finishing once they lean in; re-selling, re-explaining, or discounting can talk them back out."},{"q":"You should never, to save a deal:","o":["Show the work","Exceed MAX Face","Offer consignment","Stay calm"],"a":1,"e":"Never exceed MAX Face to save a deal; showing the work, offering consignment, and staying calm are all correct."},{"q":"A customer keeps repeating their online number. You:","o":["Confirm it","Neither confirm nor deny it; redirect to your transparent work","Argue it is fake","Match it"],"a":1,"e":"Neither confirm nor deny their number; redirect to your transparent work. Confirming, arguing, or matching all hurt the close."},{"q":"Finishing a deal cleanly includes:","o":["Just taking the items","Moving the items to your side, writing the check correctly, capturing a review, and getting their info","Only writing the check","Skipping the review"],"a":1,"e":"Finishing clean is the items, the correct check, a review, and their info; just taking the items, the check only, or skipping the review leaves the close incomplete."},{"q":"Talking past your own offer tends to:","o":["Strengthen it","Weaken it and talk yourself down","Speed the close","Build trust"],"a":1,"e":"Talking past your offer weakens it and talks you down; it does not strengthen the number, speed the close, or build trust."},{"q":"The close is mostly won:","o":["In the final sentence","Earlier, through rapport, transparency, and built value","By the discount","By luck"],"a":1,"e":"The close is mostly won earlier through rapport, transparency, and value; it is not the final sentence, a discount, or luck."},{"q":"A customer says the offer feels low and seems hurt. You:","o":["Defend the number aggressively","Acknowledge the feeling, then show the work calmly","Raise the offer over MAX Face","End the appointment"],"a":1,"e":"Acknowledge the feeling, then show the work calmly; defending aggressively, breaking MAX Face, or ending the appointment all damage the close."},{"q":"When price is fair and the customer just wants more than MAX Face, the right tool is:","o":["A bigger check","Consignment","Arguing","Walking away"],"a":1,"e":"Consignment is the tool when they want more than MAX Face; a bigger check, arguing, or walking away are wrong."},{"q":"The goal of handling objections is to:","o":["Win the argument","Remove the real concern and return to a fair close","Talk the most","Prove the customer wrong"],"a":1,"e":"The goal is to remove the real concern and return to a fair close, not to win an argument, talk the most, or prove them wrong."},{"q":"A confident, calm closer who handles objections without discounting will:","o":["Close fewer deals","Close more of the same items at the same fair number","Lose trust","Need to break MAX Face"],"a":1,"e":"A calm closer who handles objections without discounting closes more at the same fair number; it does not lower closes, lose trust, or require breaking MAX Face."}]},{"id":"m2.9","name":"Handling a Difficult Customer","passMark":85,"lessonHTML":"\n   <div class=\"outcome\"><b>What you'll be able to do</b><br>After this module you can keep a tense table calm, answer suspicion with transparency, and turn a price the customer does not like into a consignment pitch instead of an argument.</div>\n   <h2>Your Goal Is Not to Win</h2>\n   <p>When a customer gets upset or suspicious, the goal is never to win an argument. The goal is to keep them comfortable, keep the table calm, and keep a path to a deal open. A calm buyer who never argues earns trust even from a skeptical customer.</p>\n   <h2>The Two Common Triggers</h2>\n   <ul>\n   <li><strong>The price is lower than they hoped.</strong> They expected more, so they feel let down or insulted.</li>\n   <li><strong>They suspect they are being lowballed.</strong> They do not trust that the number is fair.</li>\n   </ul>\n   <h2>How to Stay Calm and Build Trust</h2>\n   <ul>\n   <li>Lower your voice and slow down. Never match their volume.</li>\n   <li>Acknowledge the feeling: \"I understand, a lot of people expect more, let me show you exactly how we got here.\"</li>\n   <li>Use transparency: walk them through the testing, the weights, and the live sheet so they can see the number is not a guess.</li>\n   <li>Never argue, never get defensive, and never insult what they brought.</li>\n   <li>Give them a moment of space if they need it.</li>\n   </ul>\n   <h2>If They Still Do Not Like the Price</h2>\n   <p>Do not raise your offer above MAX Face to calm them down. Instead, <strong>pivot to the consignment pitch</strong>: explain that for an item they feel is worth more, selling it at auction may reach collectors who pay more, and we can handle that for them. This turns a dead end into a real option and moves the lead to the Sent to Consignment stage.</p>\n   <h2>If a Customer Becomes Hostile</h2>\n   <p>If someone becomes threatening or will not calm down, stop selling. Disengage politely, get a manager, and if needed contact security. Stay safe and document what happened. Never escalate it yourself.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>Calm and transparent always beats winning the argument. When the price is the sticking point, never go above MAX Face to please someone; pivot to consignment. If it turns hostile, disengage and get help.</div>\n   <div class=\"takeaways\"><h3>Key Takeaways</h3><ul>\n   <li>The goal with an upset customer is to stay calm and keep a path open, not to win.</li>\n   <li>The two common triggers are a price lower than hoped and a suspicion of being lowballed.</li>\n   <li>Lower your voice, acknowledge the feeling, and use transparency (testing, weights, the live sheet).</li>\n   <li>Never argue, get defensive, or insult what they brought.</li>\n   <li>If they do not like the price, do not go above MAX Face; pivot to the consignment pitch.</li>\n   <li>A price-driven objection moves the lead toward Sent to Consignment.</li>\n   <li>If a customer turns hostile, disengage, get a manager or security, and document it.</li>\n   </ul></div>","test":[{"q":"With an upset customer, your goal is to:","o":["Win the argument","Stay calm and keep a path to a deal open","Raise your voice","Walk away fast"],"a":1,"e":"Stay calm and keep a path open; winning the argument, raising your voice, or walking away fast all lose the deal."},{"q":"A common trigger for upset customers is:","o":["Free coffee","A price lower than they hoped","Too many cameras","A short wait"],"a":1,"e":"A price lower than hoped is a common trigger; free coffee, cameras, and a short wait are not."},{"q":"The other common trigger is:","o":["Suspicion of being lowballed","The weather","Parking","The lighting"],"a":0,"e":"Suspicion of being lowballed is the other trigger; the weather, parking, and lighting are not."},{"q":"When a customer raises their voice you should:","o":["Match their volume","Lower your voice and slow down","Argue louder","Leave"],"a":1,"e":"Lower your voice and slow down; matching their volume, arguing louder, or leaving all escalate it."},{"q":"The best tool against suspicion is:","o":["Insisting you are right","Transparency: show the testing, weights, and live sheet","Raising the offer","Ending the deal"],"a":1,"e":"Transparency (testing, weights, the live sheet) shows the number is not a guess; insisting you are right, raising the offer, or ending the deal do not."},{"q":"You should never:","o":["Acknowledge their feeling","Argue, get defensive, or insult what they brought","Slow down","Offer consignment"],"a":1,"e":"Never argue, get defensive, or insult their items; acknowledging the feeling, slowing down, and offering consignment are all good moves."},{"q":"If they do not like the price, you should NOT:","o":["Pivot to consignment","Raise your offer above MAX Face","Stay calm","Explain the number"],"a":1,"e":"Never raise above MAX Face to please someone; pivoting to consignment, staying calm, and explaining the number are all fine."},{"q":"When the price is the sticking point, the right move is to:","o":["Argue the value","Pivot to the consignment pitch","Give up","Lower to zero"],"a":1,"e":"Pivot to consignment, which can reach collectors who pay more; arguing the value, giving up, or going to zero all fail."},{"q":"A price-driven objection moves the lead toward:","o":["Junk Lead","Sent to Consignment","Out of State","Won"],"a":1,"e":"It moves toward Sent to Consignment; Junk Lead is for items we do not buy, Out of State is location, and Won is a closed deal."},{"q":"If a customer becomes threatening you should:","o":["Argue back","Disengage, get a manager or security, and document it","Match them","Keep selling"],"a":1,"e":"Disengage, get a manager or security, and document it; arguing back, matching them, or continuing to sell ignores the danger."},{"q":"Acknowledging the feeling sounds like:","o":["'You are wrong'","'I understand, let me show you exactly how we got here'","'Take it or leave it'","Silence"],"a":1,"e":"Acknowledge, then offer transparency; 'you are wrong', 'take it or leave it', and silence are not acknowledgment."},{"q":"A customer raises their voice, upset at the offer. You:","o":["Match their volume","Lower your voice, acknowledge the feeling, and show transparency","Raise the offer above MAX Face","End it abruptly"],"a":1,"e":"Lower your voice, acknowledge, and show transparency: calm plus proof defuses the tension. Matching their volume escalates it, raising over MAX Face breaks the ceiling, and ending abruptly burns the deal."},{"q":"A customer suspects you are lowballing. Best tool?","o":["Insist you are right","Walk them through the testing, weights, and live sheet","Raise the offer","End the deal"],"a":1,"e":"Walk them through the testing, weights, and live sheet: transparency shows the number is not a guess. Insisting you are right is not proof, raising the offer rewards the suspicion, and ending the deal gives up."},{"q":"After transparency, they still reject the price. You:","o":["Pay above MAX Face","Pivot to the consignment pitch","Argue the value harder","Give up"],"a":1,"e":"Pivot to consignment: it offers them more upside without breaking the ceiling. Paying over MAX Face breaks the rules, arguing harder entrenches them, and giving up loses a recoverable deal."},{"q":"A customer becomes threatening. You:","o":["Argue back","Disengage, get a manager or security, and document it","Keep selling","Match their energy"],"a":1,"e":"Disengage, get a manager or security, and document it: safety first, and a record protects everyone. Arguing back or matching their energy escalates danger, and continuing to sell ignores the threat."},{"q":"With an upset customer you should never:","o":["Acknowledge the feeling","Argue, get defensive, or insult what they brought","Slow down","Offer consignment"],"a":1,"e":"Never argue, get defensive, or insult their items: that destroys trust. Acknowledging the feeling, slowing down, and offering consignment are all the right moves, not things to avoid."},{"q":"A customer raises their voice over your offer. You:","o":["Raise yours back","Stay calm, lower your tone, and stay transparent","End the deal instantly","Give them whatever they want"],"a":1,"e":"Stay calm and transparent; matching their volume, abruptly ending, or caving all make it worse."},{"q":"A customer disputes your number but is calm. You:","o":["Cave on price","Show the work transparently and offer consignment if a gap remains","Walk away","Insult their items"],"a":1,"e":"Show the work and offer consignment if needed; caving, walking, or insulting them lose the deal or margin."},{"q":"De-escalation works best when you:","o":["Talk over them","Listen, stay calm, and keep it transparent","Rush them out","Match their emotion"],"a":1,"e":"Listening, calm, and transparency de-escalate; talking over, rushing, or matching emotion escalate."},{"q":"A customer accuses you of lowballing. You:","o":["Get defensive","Stay calm and show the transparent work behind the offer","Raise over MAX Face","End the appointment"],"a":1,"e":"Stay calm and show the work; defensiveness, breaking MAX Face, or ending abruptly all worsen it."},{"q":"A customer keeps interrupting your explanation. You:","o":["Talk over them","Let them finish, then continue calmly","Stop explaining","Raise your voice"],"a":1,"e":"Let them finish, then continue calmly; talking over, quitting, or raising your voice escalates."},{"q":"A customer is upset the offer is below an old appraisal. You:","o":["Match the appraisal","Explain appraisals differ from buy prices, show the work, and offer consignment","Argue the appraisal is fake","Walk away"],"a":1,"e":"Explain the difference, show the work, and offer consignment; matching, arguing, or walking away lose the deal or margin."},{"q":"Staying calm under pressure mainly protects:","o":["Your ego","The deal and your safety","Nothing","Only the rating"],"a":1,"e":"Calm protects the deal and your safety; it is not about ego, and it does more than affect the rating."}],"comp":"Role-play an upset, then escalating customer. The trainee must de-escalate, stay transparent, and disengage and get help at the right point. Pass only on calm control and a correct disengage decision."},{"id":"m2.17","name":"Escalation and Authority","passMark":90,"lessonHTML":"<div class=\"outcome\"><b>What you will be able to do</b><br>Know exactly when to stop and get help instead of guessing, so the biggest dollars in the room are never lost to pride or a bad guess.</div>\n   <p>A closer's worst losses do not come from working slowly. They come from guessing on something they were unsure of, or letting a big deal walk because they did not want to bother anyone. This module gives you a small set of triggers, each with one fixed action. When a trigger fires, you do the action. No improvising on money.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>Three triggers, three actions. (1) If you are unsure of anything, get a second opinion before you commit. (2) If an item has no set price, look it up the right way before you price it. (3) If a deal over 2500 in total value is about to walk, get a manager or another closer involved before it leaves, and pivot to consignment if it still will not close.</div>\n   <h3>Trigger 1: You are unsure of anything</h3>\n   <p>Unsure what a coin is, whether a stamp is real, what a card is worth, whether a watch is genuine, or what to pay. The action: <strong>do not guess.</strong> Get a second opinion. Ask another closer on the floor, post it in the Collectors Slack channel, or call the sales manager. A guess that looks confident can cost more than the whole appointment is worth.</p>\n   <h3>Trigger 2: The item has no set price</h3>\n   <p>Early coins, cards, unusual collectibles. The action: <strong>look it up, do not price from memory.</strong> Raw items use eBay sold and completed listings, auction format, recently ended, in similar condition. Graded items use greysheet wholesale for the date and grade. Post your finding in the team pricing channel so it is on record and confirmed. Active or unsold listings are asking prices and do not count.</p>\n   <h3>Trigger 3: A 2500-plus total-value deal is about to walk</h3>\n   <p>If the <strong>total value</strong> of a deal is over 2500 and the customer is heading for the door, do not let it walk on your own. The action: <strong>call the roadshow manager or another closer to step in.</strong> If it still does not close after that, <strong>pivot to consignment</strong> so the item stays in play instead of leaving the building. This trigger is only for deals over 2500 that are about to walk. A 2500-plus deal that is closing normally does not need escalation, and you still never exceed MAX Face.</p>\n   <h3>The other standing rules</h3>\n   <ul>\n     <li><strong>Rare or significant item:</strong> route to the numismatist or specialist regardless of size.</li>\n     <li><strong>Customer wants more than MAX Face:</strong> hold the ceiling and pivot to consignment.</li>\n     <li><strong>Customer becomes threatening:</strong> disengage, get a manager or security, and document it.</li>\n   </ul>\n   <div class=\"standard\"><b>Why this protects your money</b><br>One wrong guess on a rare coin, or one high-value deal that walks out the door, can erase a week of small wins. Escalation is not weakness. It is how you protect the dollars that matter most. The closers who escalate at the right moments out-earn the ones who guess.</div>\n   <h3>Common mistakes</h3>\n   <ul>\n     <li>Guessing to look competent instead of getting a second opinion.</li>\n     <li>Pricing an unknown item from memory or from active listings.</li>\n     <li>Letting a 2500-plus deal walk to avoid bothering a manager.</li>\n     <li>Exceeding MAX Face to save a deal instead of pivoting to consignment.</li>\n   </ul>","comp":"Run three live scenarios back to back: (1) a coin or item the trainee cannot identify, (2) an item with no set price that needs a lookup, and (3) a deal over 2500 in total value where the customer stands up to leave. The trainee must state the exact action for each, in order, with no prompting: get a second opinion (another closer, the Collectors channel, or the sales manager); look it up (raw to eBay sold/completed auction, graded to greysheet, post to the pricing channel); and call the roadshow manager or another closer, then pivot to consignment if it still will not close. Pass only if all three actions are correct and they never offer to guess or exceed MAX Face.","test":[{"q":"A coin comes across the table and you cannot identify it. You:","o":["Guess a price to keep things moving","Get a second opinion before committing: another closer, the Collectors channel, or the sales manager","Pay melt and move on","Reject it"],"a":1,"e":"When unsure, get a second opinion before committing; guessing, paying melt, or rejecting can lose a rarity or overpay."},{"q":"A deal's total value is 3,200 and the customer stands up to leave. Your first action is:","o":["Let them go","Exceed MAX Face to keep them","Call the roadshow manager or another closer to step in","Lower your offer"],"a":2,"e":"On a 2500-plus deal about to walk, call the roadshow manager or another closer first; letting them go, exceeding MAX Face, or lowering the offer all fail the rule."},{"q":"The 2500-plus escalation is based on:","o":["What you offer","The total value of the deal","The customer's asking number","The spot price"],"a":1,"e":"The trigger is total value over 2500; it is not based on your offer, the customer's number, or spot."},{"q":"After a manager or second closer is involved and the 2500-plus deal still will not close, you:","o":["Exceed MAX Face","Pivot to consignment so it stays in play","Let it walk","Pay the asking number"],"a":1,"e":"Pivot to consignment so the item stays in play; exceeding MAX Face, letting it walk, or paying the asking number break the rules."},{"q":"A 2,800 total-value deal is closing smoothly with no resistance. You:","o":["Must escalate anyway","Do not need to escalate; the trigger is only over 2500 and about to walk","Exceed MAX Face","Call the manager for permission"],"a":1,"e":"Escalation is only for 2500-plus deals about to walk; a smooth close does not require it, and you still never exceed MAX Face."},{"q":"You need a second opinion. Acceptable channels are:","o":["Only the customer","Another closer, the Collectors Slack channel, or the sales manager","A web forum","No one"],"a":1,"e":"Get a second opinion from another closer, the Collectors channel, or the sales manager; the customer, a random forum, or no one are not the channels."},{"q":"An item has no set price (an early coin or a card). You:","o":["Price it from memory","Look it up the right way before pricing","Pay melt","Reject it"],"a":1,"e":"Look it up the right way before pricing; pricing from memory, paying melt, or rejecting risks a costly mistake."},{"q":"For a raw item with no set price, the lookup is:","o":["Active listings","eBay sold and completed auction results, recently ended, similar condition","The customer's estimate","A guess"],"a":1,"e":"Raw items use sold and completed auction results in similar condition; active listings, the customer's estimate, and guesses are not what it sells for."},{"q":"For a graded item with no set price, the lookup is:","o":["Active listings","Greysheet wholesale for that date and grade","Melt only","Eye appeal"],"a":1,"e":"Graded items use greysheet wholesale for the date and grade; active listings, melt, or eye appeal will misprice it."},{"q":"After you find a price on an unknown item, you:","o":["Keep it to yourself","Post it in the team pricing channel for record and confirmation","Pay double","Skip the sheet"],"a":1,"e":"Post it in the pricing channel for record and confirmation; keeping it quiet, overpaying, or skipping the sheet breaks the process."},{"q":"A rare or significant item, regardless of size, goes to:","o":["The bulk pile","The numismatist or specialist","Melt","The customer's car"],"a":1,"e":"Route rare or significant items to the numismatist or specialist regardless of size; bulking, melting, or letting it leave risks the value."},{"q":"A customer wants more than MAX Face. You:","o":["Exceed MAX Face","Hold the ceiling and pivot to consignment","Call security","Guess higher"],"a":1,"e":"Hold MAX Face and pivot to consignment; exceeding it, calling security, or guessing higher are wrong responses to a price gap."},{"q":"A customer becomes threatening. You:","o":["Argue back","Disengage, get a manager or security, and document it","Keep selling","Match their energy"],"a":1,"e":"Disengage, get help, and document it; arguing, selling on, or matching their energy escalates danger."},{"q":"Guessing on something you are unsure of is dangerous because:","o":["It is slow","One confident wrong guess can cost more than the whole appointment","It looks bad","It is against the law"],"a":1,"e":"A confident wrong guess can cost more than the appointment is worth; the danger is the loss, not speed, appearance, or legality."},{"q":"You are 90 percent sure what a coin is, but not certain. You:","o":["Treat 90 percent as certain and price it","Get a quick second opinion before committing money","Pay melt","Reject it"],"a":1,"e":"Not certain means get a quick second opinion before committing; treating a guess as certain, paying melt, or rejecting all carry risk."},{"q":"A 2,000 total-value deal is about to walk. The 2500 escalation:","o":["Applies","Does not apply because it is under 2500, but you can still get a second closer to help","Means exceed MAX Face","Means let it walk"],"a":1,"e":"The 2500 trigger does not apply under 2500, though you can still bring in another closer to help; it never means exceed MAX Face or let it walk by rule."},{"q":"Why post unknown-item prices to the pricing channel?","o":["To slow down","To create a record and let a second person confirm before money moves","To impress the team","It is required by law"],"a":1,"e":"It creates a record and lets a second person confirm before money moves; it is not a delay, for show, or a legal rule."},{"q":"The point of escalation is:","o":["To avoid responsibility","To protect the biggest dollars from a guess or a walk-out","To slow the show","To pass blame"],"a":1,"e":"Escalation protects the biggest dollars from a guess or a walk-out; it is not about dodging responsibility, slowing down, or blame."},{"q":"A closer who escalates at the right moments will:","o":["Earn less","Out-earn one who guesses, because they protect the big deals","Get in trouble","Lose customers"],"a":1,"e":"Escalating at the right moments protects big deals and out-earns guessing; it does not lower pay, cause trouble, or lose customers."},{"q":"You priced an unknown card from an active listing and paid. The mistake was:","o":["Nothing","Using an asking price instead of a sold comp","Posting to the channel","Asking a second closer"],"a":1,"e":"The mistake was using an asking price instead of a sold comp; posting to the channel and asking a second closer are correct, not mistakes."},{"q":"A 5,000 total-value deal is about to walk and no manager answers. You:","o":["Exceed MAX Face","Reach another closer; if still not closed, pivot to consignment","Let it walk","Pay the asking number"],"a":1,"e":"If the manager is unreachable, reach another closer, then pivot to consignment if it still will not close; exceeding MAX Face, letting it walk, or paying the asking number break the rules."},{"q":"The three escalation triggers are:","o":["Slow day, big crowd, late hour","Unsure of anything, no set price, and a 2500-plus deal about to walk","Tired, hungry, busy","Gold, silver, platinum"],"a":1,"e":"The triggers are being unsure, an item with no set price, and a 2500-plus deal about to walk; the other lists are not triggers."},{"q":"Escalation replaces:","o":["Doing your job","Guessing on money you are not sure about","Testing metal","Writing the deal sheet"],"a":1,"e":"Escalation replaces guessing on money you are unsure about; it does not replace doing your job, testing, or the deal sheet."}]},{"id":"m2.10","name":"Pitching and Setting Up Consignment","passMark":85,"lessonHTML":"\n   <div class=\"outcome\"><b>What you'll be able to do</b><br>After this module you can explain consignment clearly, pitch it at the right moment, set realistic expectations, and set up the consignment cleanly.</div>\n   <h2>What Consignment Is</h2>\n   <p>Consignment means we sell the item <strong>for</strong> the customer at auction instead of buying it outright. The customer keeps ownership until it sells, the item is shown to a wide audience of collectors, and the final price is set by bidding. For the right items, this can net the customer more than a cash offer.</p>\n   <h2>When to Pitch Consignment</h2>\n   <ul>\n   <li>When the customer wants more than your cash offer (more than MAX Face).</li>\n   <li>When the item is rare or high value and likely to do better in front of collectors.</li>\n   <li>When the lead already said they want to sell on auction (a Sent to Consignment lead).</li>\n   </ul>\n   <h2>How to Pitch It</h2>\n   <ul>\n   <li>Frame it as a way to get the most for a special item: \"For a piece like this, auction can reach collectors who compete for it.\"</li>\n   <li>Explain we handle the work: photography, listing, and putting it in front of the right buyers.</li>\n   <li>Set expectations honestly: the final price dep
