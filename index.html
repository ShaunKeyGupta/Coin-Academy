<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin Sales Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1b2e; --navy2:#13263d; --navy3:#1c344f;
  --gold:#c9a227; --gold-bright:#e6c34a; --gold-dim:#8a7320;
  --cream:#f4efe2; --cream-dim:#cfc7b3;
  --green:#2e7d52; --red:#b3402f;
  --line:rgba(201,162,39,.22);
  --shadow:0 18px 50px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Archivo',system-ui,sans-serif;
  background:
    radial-gradient(1200px 700px at 75% -10%, rgba(201,162,39,.14), transparent 60%),
    radial-gradient(900px 600px at 10% 110%, rgba(28,52,79,.6), transparent 55%),
    var(--navy);
  color:var(--cream); -webkit-font-smoothing:antialiased; min-height:100%;
}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:.2px}
.wrap{max-width:1080px;margin:0 auto;padding:32px 24px 80px}
.hidden{display:none!important}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(13,27,46,.9),rgba(13,27,46,.5));position:sticky;top:0;z-index:50;backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:14px}
.crest{width:42px;height:42px;border-radius:11px;background:radial-gradient(circle at 35% 30%,var(--gold-bright),var(--gold-dim));
  display:grid;place-items:center;color:var(--navy);font-family:'Fraunces';font-weight:700;font-size:17px;
  box-shadow:0 0 0 2px rgba(201,162,39,.35),0 6px 18px rgba(0,0,0,.4)}
.brand .name{font-family:'Fraunces';font-size:20px;font-weight:600;letter-spacing:.5px}
.brand .sub{font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-top:-2px}
.topbar-right{display:flex;align-items:center;gap:14px;font-size:14px}
.whoami{color:var(--cream-dim)} .whoami b{color:var(--cream)}
.btn{font-family:'Archivo';cursor:pointer;border:none;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:600;transition:.18s;letter-spacing:.3px}
.btn-gold{background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:var(--navy);box-shadow:0 6px 18px rgba(201,162,39,.3)}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(201,162,39,.42)}
.btn-ghost{background:transparent;color:var(--cream-dim);border:1px solid var(--line)}
.btn-ghost:hover{color:var(--cream);border-color:var(--gold)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.login-hero{max-width:540px;margin:8vh auto 0;text-align:center;animation:rise .7s ease both}
.login-hero .crest{width:84px;height:84px;font-size:34px;border-radius:20px;margin:0 auto 26px}
.login-hero h1{font-size:46px;line-height:1.05;margin-bottom:10px}
.login-hero .tag{color:var(--gold);letter-spacing:4px;text-transform:uppercase;font-size:12px;margin-bottom:26px}
.login-hero p{color:var(--cream-dim);font-size:15px;line-height:1.6;margin-bottom:30px}
.field{width:100%;padding:15px 18px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--cream);font-size:16px;font-family:'Archivo';margin-bottom:14px}
.field:focus{outline:none;border-color:var(--gold);background:rgba(255,255,255,.07)}
.login-card{background:linear-gradient(180deg,rgba(28,52,79,.5),rgba(19,38,61,.5));border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:var(--shadow)}
.adminlink{margin-top:26px;font-size:12px;color:var(--cream-dim);cursor:pointer;letter-spacing:1px}
.adminlink:hover{color:var(--gold)}
.dash-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:8px}
.dash-head h1{font-size:34px}
.progress-meta{color:var(--cream-dim);font-size:14px;margin-bottom:30px} .progress-meta b{color:var(--gold)}
.tier{margin-bottom:26px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:linear-gradient(180deg,rgba(28,52,79,.35),rgba(19,38,61,.25))}
.tier-head{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line);background:rgba(13,27,46,.4)}
.tier-num{width:42px;height:38px;border-radius:10px;background:var(--navy3);color:var(--gold);display:grid;place-items:center;font-family:'Fraunces';font-weight:700;font-size:15px;border:1px solid var(--line);padding:0 6px}
.tier-title{font-family:'Fraunces';font-size:20px;font-weight:600}
.tier-sub{font-size:12px;color:var(--cream-dim);letter-spacing:1px;text-transform:uppercase}
.tier-prog{margin-left:auto;font-size:13px;color:var(--cream-dim)}
.modules{padding:10px 14px 16px}
.mod{display:flex;align-items:center;gap:16px;padding:15px 14px;border-radius:12px;transition:.15s;border:1px solid transparent}
.mod+.mod{margin-top:4px}
.mod.available,.mod.passed{cursor:pointer}
.mod.available:hover,.mod.passed:hover{background:rgba(201,162,39,.08);border-color:var(--line)}
.mod.locked{opacity:.45}
.mod-dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;flex:none;border:2px solid var(--navy3)}
.mod.passed .mod-dot{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700}
.mod.available .mod-dot{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 4px rgba(201,162,39,.12);animation:pulse 2.4s infinite}
.mod.locked .mod-dot{color:var(--cream-dim)}
.mod-body{flex:1;min-width:0}
.mod-name{font-weight:600;font-size:15.5px}
.mod-meta{font-size:12.5px;color:var(--cream-dim);margin-top:2px}
.mod-status{font-size:12px;font-weight:600;letter-spacing:.5px;padding:5px 12px;border-radius:20px;flex:none}
.st-passed{background:rgba(46,125,82,.2);color:#7fd3a5;border:1px solid rgba(46,125,82,.4)}
.st-available{background:rgba(201,162,39,.16);color:var(--gold-bright);border:1px solid var(--line)}
.st-locked{background:rgba(255,255,255,.04);color:var(--cream-dim)}
.st-await{background:rgba(224,160,106,.16);color:#e0a06a;border:1px solid rgba(224,160,106,.4)}
.mod.awaiting{cursor:pointer}
.mod.awaiting:hover{background:rgba(224,160,106,.08);border-color:var(--line)}
.mod.awaiting .mod-dot{border-color:#e0a06a;color:#e0a06a}
.crumb{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.lesson h1{font-size:32px;margin-bottom:6px}
.lesson .sub{color:var(--cream-dim);font-size:14px;margin-bottom:28px}
.lesson-card{background:linear-gradient(180deg,rgba(28,52,79,.4),rgba(19,38,61,.3));border:1px solid var(--line);border-radius:16px;padding:30px 32px;box-shadow:var(--shadow);line-height:1.7}
.lesson-card h2{font-size:22px;color:var(--gold-bright);margin:26px 0 12px}
.lesson-card h2:first-child{margin-top:0}
.lesson-card h3{font-size:17px;margin:20px 0 8px;color:var(--cream)}
.lesson-card p{margin-bottom:14px;color:var(--cream-dim)}
.lesson-card strong{color:var(--cream)}
.lesson-card ul,.lesson-card ol{margin:0 0 16px 22px}
.lesson-card li{margin-bottom:8px;color:var(--cream-dim)}
.lesson-card .script{background:rgba(13,27,46,.6);border-left:3px solid var(--gold);padding:14px 18px;border-radius:8px;font-style:italic;color:var(--cream);margin:14px 0}
.outcome{background:linear-gradient(180deg,rgba(46,125,82,.12),rgba(46,125,82,.04));border:1px solid rgba(46,125,82,.3);border-radius:10px;padding:14px 18px;margin:0 0 8px}
.outcome b{color:#7fd3a5;letter-spacing:1px;font-size:12px;text-transform:uppercase}
.standard{background:linear-gradient(180deg,rgba(201,162,39,.12),rgba(201,162,39,.05));border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:16px 0}
.standard b{color:var(--gold-bright);letter-spacing:1px;font-size:13px;text-transform:uppercase}
.takeaways{background:rgba(13,27,46,.5);border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin:24px 0 0}
.takeaways h3{color:var(--gold-bright);margin:0 0 10px;font-family:'Fraunces';font-size:18px}
.takeaways li{margin-bottom:7px}
.lesson-actions{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:14px;flex-wrap:wrap}
.lesson-note{font-size:13px;color:var(--cream-dim)}
.test-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:10px}
.test-head h1{font-size:28px}
.qcount{font-size:13px;color:var(--cream-dim);letter-spacing:1px}
.passbar{font-size:13px;color:var(--gold);margin-bottom:24px}
.q{background:linear-gradient(180deg,rgba(28,52,79,.4),rgba(19,38,61,.3));border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:16px}
.q-num{font-size:12px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.q-text{font-size:16.5px;font-weight:500;margin-bottom:16px;line-height:1.5}
.opt{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;cursor:pointer;transition:.14s;background:rgba(255,255,255,.02)}
.opt:hover{border-color:var(--gold);background:rgba(201,162,39,.06)}
.opt.sel{border-color:var(--gold);background:rgba(201,162,39,.14)}
.opt .mark{width:22px;height:22px;border-radius:50%;border:2px solid var(--cream-dim);flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.opt.sel .mark{border-color:var(--gold);background:var(--gold);color:var(--navy)}
.opt .otext{font-size:15px;color:var(--cream);line-height:1.45}
.opt.correct{border-color:var(--green);background:rgba(46,125,82,.16)}
.opt.correct .mark{border-color:var(--green);background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:rgba(179,64,47,.16)}
.opt.wrong .mark{border-color:var(--red);background:var(--red);color:#fff}
.explain{font-size:13.5px;color:var(--cream-dim);margin-top:10px;padding:10px 14px;background:rgba(13,27,46,.5);border-radius:8px;border-left:3px solid var(--gold)}
.explain b{color:var(--gold-bright)}
.result-card{max-width:560px;margin:6vh auto 0;text-align:center;background:linear-gradient(180deg,rgba(28,52,79,.5),rgba(19,38,61,.4));border:1px solid var(--line);border-radius:20px;padding:46px 38px;box-shadow:var(--shadow);animation:rise .6s ease both}
.result-ring{width:150px;height:150px;margin:0 auto 24px;border-radius:50%;display:grid;place-items:center;position:relative}
.result-ring .score{font-family:'Fraunces';font-size:40px;font-weight:700}
.result-ring .of{font-size:13px;color:var(--cream-dim);letter-spacing:2px}
.result-card h1{font-size:34px;margin-bottom:10px}
.result-card p{color:var(--cream-dim);margin-bottom:26px;line-height:1.6}
.pass-h1{color:var(--gold-bright)} .fail-h1{color:#e08a78}
.admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;flex-wrap:wrap;gap:14px}
.admin-head h1{font-size:30px}
.table-wrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:680px}
th{background:rgba(13,27,46,.7);color:var(--gold);text-align:left;padding:14px 16px;font-weight:600;letter-spacing:.5px;font-size:12px;text-transform:uppercase}
td{padding:13px 16px;border-top:1px solid var(--line);color:var(--cream-dim)} td b{color:var(--cream)}
tr:hover td{background:rgba(201,162,39,.04)}
.pill{display:inline-block;padding:3px 10px;border-radius:14px;font-size:12px;font-weight:600}
.pill-g{background:rgba(46,125,82,.2);color:#7fd3a5} .pill-a{background:rgba(201,162,39,.16);color:var(--gold-bright)} .pill-l{background:rgba(255,255,255,.05);color:var(--cream-dim)}
.stat-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.stat{flex:1;min-width:150px;background:linear-gradient(180deg,rgba(28,52,79,.4),rgba(19,38,61,.3));border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.stat .n{font-family:'Fraunces';font-size:34px;font-weight:700;color:var(--gold-bright)}
.stat .l{font-size:12px;color:var(--cream-dim);letter-spacing:1px;text-transform:uppercase;margin-top:4px}
.config-row{display:flex;gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap}
.dchat{margin-top:16px;display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow-y:auto;padding:6px 2px}
.dbubble{max-width:80%;padding:10px 14px;border-radius:14px;font-size:15px;line-height:1.4}
.dcust{align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.drep{align-self:flex-end;background:rgba(201,162,39,.16);border:1px solid var(--line)}
.dwho{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--cream-dim);margin-bottom:3px}
.dtyping{letter-spacing:3px;color:var(--cream-dim)}
.dinrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.dinput{flex:1;min-width:200px;background:var(--navy-soft,rgba(255,255,255,.04));border:1px solid var(--line);color:var(--cream);padding:12px 14px;border-radius:10px;font-size:15px;font-family:inherit}
textarea.dinput{min-height:54px;resize:vertical;line-height:1.4}
.dinput:focus{outline:none;border-color:var(--gold)}
.dscorehead{display:flex;align-items:center;gap:18px;margin:6px 0 16px}
.dscorenum{font-family:'Fraunces';font-size:54px;font-weight:700;line-height:1}
.dmodel{margin-top:6px;padding:8px 12px;border-left:3px solid var(--gold);background:rgba(201,162,39,.08);font-size:14px;border-radius:0 8px 8px 0}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(201,162,39,.12)}50%{box-shadow:0 0 0 7px rgba(201,162,39,.04)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.fade{animation:rise .45s ease both}
.cheat{background:linear-gradient(180deg,rgba(28,52,79,.4),rgba(19,38,61,.3));border:1px solid var(--line);border-radius:16px;padding:28px 30px;box-shadow:var(--shadow)}
.cheat h2{font-family:'Fraunces';font-size:19px;color:var(--gold-bright);margin:22px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px}
.cheat h2:first-child{margin-top:0}
.cheat .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
.cheat .row{font-size:13.5px;color:var(--cream-dim);padding:3px 0;line-height:1.4}
.cheat .row b{color:var(--cream)}
.cheat .full{grid-column:1 / -1}
@media print{
  body{background:#fff!important;color:#111!important}
  .topbar,.dash-head button,.lesson-actions,.adminlink{display:none!important}
  .cheat{box-shadow:none;border:1px solid #999;background:#fff!important;padding:0}
  .cheat h2{color:#111!important;border-color:#999}
  .cheat .row,.cheat .row b{color:#111!important}
  .wrap{padding:0}
  h1{color:#111!important}
}
@media(max-width:600px){.cheat .grid{grid-template-columns:1fr}}
.cert{max-width:680px;margin:0 auto;text-align:center;background:linear-gradient(180deg,rgba(28,52,79,.5),rgba(19,38,61,.4));border:2px solid var(--gold);border-radius:18px;padding:48px 40px;box-shadow:var(--shadow)}
.cert-crest{width:70px;height:70px;border-radius:16px;margin:0 auto 18px;background:radial-gradient(circle at 35% 30%,var(--gold-bright),var(--gold-dim));display:grid;place-items:center;color:var(--navy);font-family:'Fraunces';font-weight:700;font-size:28px}
.cert-k{letter-spacing:5px;text-transform:uppercase;font-size:12px;color:var(--gold);margin-bottom:24px}
.cert-title{font-family:'Fraunces';font-size:34px;color:var(--gold-bright);margin-bottom:20px}
.cert-sub{color:var(--cream-dim);font-size:15px;max-width:460px;margin:0 auto 8px;line-height:1.5}
.cert-name{font-family:'Fraunces';font-size:38px;color:var(--cream);margin:14px 0}
.cert-track{font-family:'Fraunces';font-size:20px;color:var(--gold-bright);margin:14px 0}
.cert-date{color:var(--cream-dim);font-size:14px;margin-top:18px}
.cert-line{margin-top:34px;padding-top:8px;border-top:1px solid var(--line);display:inline-block;min-width:260px;color:var(--cream-dim);font-size:13px}
@media print{.cert{border-color:#b8860b;background:#fff!important}.cert-title,.cert-track{color:#8a6d1b!important}.cert-name{color:#111!important}.cert-sub,.cert-date,.cert-line{color:#333!important}.cert-k{color:#8a6d1b!important}}
</style>
</head>
<body>
<div class="topbar" id="topbar">
  <div class="brand">
    <div class="crest">CSA</div>
    <div><div class="name">Coin Sales Academy</div><div class="sub">Promotion Ladder <span style="opacity:.6">v13</span></div></div>
  </div>
  <div class="topbar-right" id="topbarRight"></div>
</div>
<div id="app" class="wrap"></div>

<script>
const STORE={trainees:'sa_trainees_v2',current:'sa_current_v2',admin:'sa_adminpass_v2'};
function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v));}
function getAdminPass(){return load(STORE.admin,'ADMIN-2024');}
/* CURRICULUM (assembled: merged pools + new modules + competency rubrics) */
const CURRICULUM=[{"id":"tier1","n":"I","name":"Appointment Setter","sub":"5 modules","modules":[{"id":"m1.1","name":"Foundation","passMark":85,"lessonHTML":"\n   <div class=\"outcome\"><b>What you'll be able to do</b><br>After this module you can explain who we are, recognize the four customer types, know what we buy and don't buy, and state the one rule that protects every deal.</div>\n   <h2>Your Role</h2>\n   <p>You are an <strong>Appointment Setter</strong>. Your two jobs, above everything else, are to <strong>book and confirm appointments</strong> and to do it with <strong>speed to lead</strong> (reach new leads fast). You do not give prices on the phone. You do not negotiate. You book, confirm, and move on.</p>\n   <h2>The Company Story</h2>\n   <p>We are a <strong>collector's association, not a pawn shop</strong>. We work directly with private collectors and auction houses. We educate sellers on rarity, key dates, and collector value before we ever discuss a number. Because most of what we buy goes to private clients, we can pay top of market instead of pawn-shop pricing.</p>\n   <h2>The Four Customer Avatars</h2>\n   <p>Avatars describe the <strong>type of person</strong> you are talking to (separate from the pipeline stage, which describes where the lead is in the process).</p>\n   <ul>\n   <li><strong>Lifelong Collector:</strong> uses terms like \"my collection,\" knows key dates, talks like a peer.</li>\n   <li><strong>Inherited:</strong> references a late parent or relative, often unsure of value. Most common.</li>\n   <li><strong>Duplicate Seller:</strong> an active collector selling doubles or common pieces.</li>\n   <li><strong>Curious:</strong> no urgency, just wants to know what it's worth.</li>\n   </ul>\n   <h2>What We Buy</h2>\n   <p>Gold, silver, and platinum (coins, jewelry, bullion); pre-1965 silver coins; key-date coins; pre-1933 US gold; sterling flatware; diamonds half a carat and up; luxury and antique pocket watches; and routed collectibles handled by specialists.</p>\n   <h2>What We Do NOT Buy</h2>\n   <p>Gold-filled or plated items (GF, GP, HGE, 1/20, 1/10); costume jewelry; silver-plate (EPNS, EP); modern clad coins (post-1964 dimes and quarters, post-1970 halves); fashion and smart watches; furniture; fine art; general antiques; electronics.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>Never give a price over the phone, not even a range. The correct move is always: get a photo, book the appointment, and let the buyer deliver the number in person. Phone quotes lose deals and create expectations no one can honor.</div>\n   <div class=\"takeaways\"><h3>Key Takeaways</h3><ul>\n   <li>Your two priorities: book and confirm appointments, and reach new leads fast (speed to lead).</li>\n   <li>We are a collector's association, not a pawn shop; we pay top of market because we sell to private clients.</li>\n   <li>The four avatars are Lifelong Collector, Inherited, Duplicate Seller, and Curious.</li>\n   <li>We buy precious metals, key-date and pre-1965 silver coins, pre-1933 gold, sterling, qualifying diamonds and watches.</li>\n   <li>We do not buy plated/filled metal, costume jewelry, modern clad coins, fashion watches, furniture, art, or electronics.</li>\n   <li>Never give a price on the phone. Get a photo, book the appointment.</li>\n   </ul></div>","test":[{"q":"What are the Setter's two most important priorities?","o":["Pricing and negotiating","Booking/confirming appointments and speed to lead","Shipping and inventory","Marketing and ads"],"a":1,"e":"Booking and confirming appointments plus speed to lead are the setter's two jobs; pricing, shipping, and marketing all belong to other roles."},{"q":"How is the company positioned in the company story?","o":["A pawn shop","A collector's association, not a pawn shop","A jewelry retailer","An online marketplace"],"a":1,"e":"We are positioned as a collector's association, not a pawn shop; we are also not a jewelry retailer or an online marketplace, and that framing is why sellers trust us."},{"q":"Why can we pay top of market?","o":["We charge fees","Most of what we buy goes to private clients","We pay in gold","We have no costs"],"a":1,"e":"Because most of what we buy goes to private collectors and auction houses, we capture collector value; we do not charge fees, pay in gold, or operate without costs."},{"q":"Which is NOT one of the four avatars?","o":["Lifelong Collector","Inherited","Duplicate Seller","Wholesale Dealer"],"a":3,"e":"Wholesale Dealer is not an avatar; the four are Lifelong Collector, Inherited, Duplicate Seller, and Curious."},{"q":"Which avatar is the most common?","o":["Lifelong Collector","Inherited","Curious","Duplicate Seller"],"a":1,"e":"Inherited is the most common avatar; Lifelong Collectors, the Curious, and Duplicate Sellers all come in less often."},{"q":"An avatar describes:","o":["Where the lead is in the pipeline","The type of person you are talking to","The item's value","The setter's score"],"a":1,"e":"An avatar describes the type of person you are talking to; where the lead sits in the pipeline, the item's value, and your score are all separate things."},{"q":"A caller who says items were 'my late father's' is which avatar?","o":["Lifelong Collector","Inherited","Curious","Duplicate Seller"],"a":1,"e":"Items from a relative make this the Inherited avatar, not a Lifelong Collector, the Curious, or a Duplicate Seller offloading extras."},{"q":"Which item do we BUY?","o":["Gold-filled jewelry","Pre-1965 silver coins","Costume jewelry","Modern clad quarters"],"a":1,"e":"Pre-1965 silver coins are real silver, so we buy them; gold-filled and costume jewelry are not solid precious metal, and modern clad quarters have none."},{"q":"Which item do we NOT buy?","o":["Sterling flatware","Pre-1933 US gold","Gold-plated jewelry (GP)","Diamonds half a carat and up"],"a":2,"e":"Gold-plated (GP) is only a thin coating, so we reject it; sterling flatware, pre-1933 US gold, and half-carat-plus diamonds are all genuine buys."},{"q":"Diamonds are bought at what minimum size?","o":["Any size","Quarter carat","Half a carat","One carat"],"a":2,"e":"Half a carat is the minimum; any size or a quarter carat pulls in tiny low-value stones, and a one-carat floor would turn away stones we want."},{"q":"A customer asks for a price on the phone. What do you do?","o":["Give a range","Give an exact number","Refuse a number, get a photo, book the appointment","Transfer the call"],"a":2,"e":"Refuse a number, get a photo, and book; a range or an exact number sets an expectation we cannot honor, and transferring just dodges the job."},{"q":"Why is giving a phone price a problem?","o":["It is illegal","It loses deals and creates expectations no one can honor","It is slow","It is fine to do"],"a":1,"e":"It loses deals and sets expectations no one can honor; it is not illegal, it is not mainly about speed, and it is never fine to do."},{"q":"Which watches do we buy?","o":["Smart watches","Fashion brands","Luxury and antique pocket watches","Fitness trackers"],"a":2,"e":"Only luxury and antique pocket watches; smartwatches, fashion brands, and fitness trackers have no resale value here."},{"q":"What does the company story say we do before discussing a number?","o":["Take a deposit","Educate on rarity, key dates, and collector value","Run a credit check","Charge a fee"],"a":1,"e":"We educate the seller on rarity, key dates, and value first; we do not take a deposit, run a credit check, or charge a fee."},{"q":"A caller says, 'I have my late mother's jewelry box, not sure what's in it, probably junk.' Which avatar?","o":["Lifelong Collector","Inherited","Duplicate Seller","Curious"],"a":1,"e":"Inherited is right: items from a relative with the seller unsure of value. It is not Lifelong Collector (they would know their pieces) or Duplicate Seller (an active collector offloading extras), and Curious is someone with no items just asking what something is worth."},{"q":"A caller insists on a ballpark before booking. What is the correct move?","o":["Give a conservative low range","Refuse a number, get a photo, book the appointment","Give a range, then book","Quote the current spot price"],"a":1,"e":"Refusing the number and booking is right because any phone figure, even a low range or spot, sets an expectation the buyer cannot honor in person and loses deals. A range or a spot quote is still a phone number, which is the one thing setters never give."},{"q":"A customer brings a tea set marked EPNS. You should:","o":["Buy it as sterling","Not buy it; EPNS is plated, not solid silver","Pay the .925 silver price","Route it to the numismatist"],"a":1,"e":"Do not buy: EPNS means electroplated nickel silver, a plated coating with no real silver value. Buying it as sterling or paying the .925 price would be paying for silver that is not there, and the numismatist handles coins, not plated holloware."},{"q":"A customer lays a Rolex and a Fossil on the table. You:","o":["Buy both as luxury","Buy the Rolex, skip the Fossil unless its case is solid gold","Skip both","Buy the Fossil, skip the Rolex"],"a":1,"e":"Buy the Rolex and skip the Fossil is right: Rolex is a luxury buy brand, Fossil is fashion with little resale unless its case happens to be solid gold. Buying both treats fashion as luxury, skipping both throws away the Rolex, and buying only the Fossil is backwards."},{"q":"A diamond is offered loose. What is our minimum size of interest?","o":["Any size","A quarter carat","Half a carat","One carat"],"a":2,"e":"Half a carat is the stated minimum we buy. Any size or a quarter carat would pull in tiny melee stones with little standalone value, and setting the bar at one carat would turn away plenty of stones we do want."},{"q":"A fresh lead just appeared in the system. Your first duty is to:","o":["Research the likely coins","Reach out as fast as possible (speed to lead)","Wait for photos","Estimate a price"],"a":1,"e":"Speed to lead is right because the faster you reach a new lead, the more likely it ever books. Researching coins, waiting for photos, or estimating a price all delay contact, and a setter never prices anyway."},{"q":"A neighbor calls us a pawn shop. The accurate framing is:","o":["They are right","A collectors association that buys directly at a fair price, not a lender","A jewelry store","An auction house only"],"a":1,"e":"We are a collectors association that buys directly, not a pawn shop or lender; the other labels misdescribe the business."},{"q":"A caller has one item from a relative and no idea what it is worth. The avatar is:","o":["Lifelong Collector","Inherited","Duplicate Seller","Dealer"],"a":1,"e":"An item from a relative with the seller unsure of value is the Inherited avatar; a collector would know their pieces, a duplicate seller is offloading extras, and a dealer trades professionally."},{"q":"We make money primarily by:","o":["Lending against items","Buying solid precious metal and genuine collectibles at a fair margin","Charging appraisal fees","Storage fees"],"a":1,"e":"We earn by buying real metal and genuine collectibles at a fair margin; we do not lend, and fees are not the model."},{"q":"The right mindset with a nervous first-time seller is:","o":["Rushed and pushy","Patient, transparent, and educational","Dismissive","Secretive about pricing"],"a":1,"e":"Patient, transparent, educational builds trust with a first-timer; rushing, dismissing, or hiding pricing breaks it."},{"q":"A customer expects us to behave like a pawn shop and haggle aggressively. You:","o":["Haggle aggressively","Stay transparent, show the work, and make a fair offer","Refuse to deal","Inflate then drop the price"],"a":1,"e":"Stay transparent and make a fair offer; aggressive haggling, refusing, or fake price drops undermine the collectors-association approach."}],"comp":"Have the trainee explain in their own words what the business is (a collectors association, not a pawn shop), the customer mindset, and how a customer should be treated. Pass only if the framing is accurate and delivered with confidence."},{"id":"m1.2","name":"The Pipeline (17 Stages)","passMark":85,"lessonHTML":"\n   <div class=\"outcome\"><b>What you'll be able to do</b><br>After this module you can place any lead in the correct pipeline stage and know exactly what to write in the notes for each one.</div>\n   <h2>Why Stages Matter</h2>\n   <p>The pipeline is how we track every lead. The stage tells everyone where the lead is and what happens next. Putting a lead in the wrong stage breaks follow-up and loses money. Many stages ask you to <strong>write what the customer has</strong> in the notes, so the next person knows the situation without a phone call.</p>\n   <h2>The 17 Stages</h2>\n   <ol>\n   <li><strong>New:</strong> lead just entered, no outreach yet.</li>\n   <li><strong>Working, Attempting to Contact:</strong> you have started outreach (first attempt made).</li>\n   <li><strong>Attempt Two:</strong> second logged contact attempt.</li>\n   <li><strong>Attempt Three:</strong> third logged contact attempt.</li>\n   <li><strong>Qualified:</strong> a qualified lead that is not yet scheduled. Note: write what they have so the next step is clear.</li>\n   <li><strong>Connected, Awaiting Photos:</strong> contact made, photos requested and not yet received.</li>\n   <li><strong>Qualified, Scheduled:</strong> appointment is booked.</li>\n   <li><strong>Sent to Consignment:</strong> the lead wants to sell on auction, so it goes to consignment.</li>\n   <li><strong>Wanting to Ship:</strong> they are outside our workable area and want to ship items in for an offer or consignment.</li>\n   <li><strong>Won, Deal Closed:</strong> the deal is done and monetized.</li>\n   <li><strong>Reschedule / No-Show:</strong> requires a Reason in the notes.</li>\n   <li><strong>Low Value:</strong> they have items we would buy, but not enough to be worth it. Note: write what they have.</li>\n   <li><strong>Junk Lead:</strong> they have items we do not buy. Note: write what they had.</li>\n   <li><strong>Cold Lead:</strong> leads we have not been able to reach (this also covers leads auto-moved after three attempts and a waiting period).</li>\n   <li><strong>Lost Lead:</strong> leads we lost and could not close.</li>\n   <li><strong>Wanting to Buy:</strong> they called wanting to buy items from us instead of selling to us.</li>\n   <li><strong>Out of State:</strong> leads located out of state.</li>\n   </ol>\n   <h2>The 60-Second Priority</h2>\n   <p>When a lead lands in <strong>New</strong>, reach out as fast as possible. Speed to lead is one of the biggest drivers of whether a lead ever books. Then log each attempt so the stage stays accurate.</p>\n   <h2>Photos Before Scheduling</h2>\n   <p>A lead should not move to <strong>Qualified, Scheduled</strong> without photos, except when the customer simply refuses. Photos let the buyer prepare and make the customer more likely to show up.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>Keep notes accurate and specific. For Qualified, Low Value, and Junk Lead, always write what the customer has. Accurate notes mean anyone can pick up the lead without a single extra phone call.</div>\n   <div class=\"takeaways\"><h3>Key Takeaways</h3><ul>\n   <li>There are 17 pipeline stages; the stage tells everyone where the lead is and what is next.</li>\n   <li>New means no outreach yet; Working, Attempting to Contact means the first attempt was made.</li>\n   <li>Qualified means qualified but not scheduled; you write what they have.</li>\n   <li>Sent to Consignment is for sellers who want to sell on auction.</li>\n   <li>Wanting to Ship is for sellers outside our workable area.</li>\n   <li>Low Value means we'd buy but there is not enough; Junk Lead means items we do not buy.</li>\n   <li>Cold Lead means we could not reach them; Lost Lead means we could not close.</li>\n   <li>Wanting to Buy means they want to buy from us; Out of State means located out of state.</li>\n   <li>Reschedule / No-Show requires a Reason.</li>\n   <li>Reach New leads fast, and get photos before scheduling.</li>\n   </ul></div>","test":[{"q":"How many pipeline stages are there?","o":["9","12","17","20"],"a":2,"e":"There are 17 stages; 9, 12, and 20 are simply the wrong count."},{"q":"What does 'New' mean?","o":["Photos received","Lead just entered, no outreach yet","Appointment booked","Deal closed"],"a":1,"e":"New means the lead just entered with no outreach yet; photos received, an appointment booked, and a closed deal are all later stages."},{"q":"'Working, Attempting to Contact' means:","o":["No outreach yet","The first attempt has been made","The deal closed","They want to buy"],"a":1,"e":"It means outreach has started with a first attempt; it is not 'no outreach yet' (that is New), a closed deal, or a buyer."},{"q":"The 'Qualified' (not scheduled) stage asks you to:","o":["Take a deposit","Write what they have","Close the deal","Ship the items"],"a":1,"e":"Write what they have so the next step is clear; you do not take a deposit, close the deal, or ship at this stage."},{"q":"A seller who wants to sell on auction goes to:","o":["Junk Lead","Sent to Consignment","Wanting to Buy","Out of State"],"a":1,"e":"Auction sellers go to Sent to Consignment; Junk Lead is for items we do not buy, Wanting to Buy is for buyers, and Out of State is about location."},{"q":"A seller outside our workable area who wants to send items in is:","o":["Lost Lead","Wanting to Ship","Cold Lead","New"],"a":1,"e":"Wanting to Ship covers out-of-area sellers mailing items in; Lost Lead and Cold Lead are about failed or unreachable contact, and New means no outreach yet."},{"q":"'Low Value' means:","o":["Items we don't buy","Items we'd buy but not enough to be worth it","A closed deal","A buyer"],"a":1,"e":"Low Value means we would buy, but there is not enough to justify it; that differs from items we do not buy at all, a closed deal, or a buyer."},{"q":"'Junk Lead' is for:","o":["High-value sellers","People with items we do not buy","Scheduled customers","Auction sellers"],"a":1,"e":"Junk Lead is for items we do not buy at all; it is not for high-value sellers, scheduled customers, or auction sellers."},{"q":"'Cold Lead' means:","o":["A closed deal","Leads we have not been able to reach","Out-of-state leads","Buyers"],"a":1,"e":"Cold Lead means leads we could not reach, including auto-moved ones; it is not a closed deal, an out-of-state marker, or a buyer."},{"q":"'Lost Lead' means:","o":["We couldn't reach them","Leads we lost and could not close","They want to buy","New leads"],"a":1,"e":"Lost Lead means we reached them but could not close; that differs from Cold Lead (unreachable), a buyer, or a brand-new lead."},{"q":"A caller who wants to buy items from us is:","o":["Wanting to Buy","Sent to Consignment","Junk Lead","Qualified"],"a":0,"e":"Wanting to Buy is for people buying from us; Sent to Consignment and Qualified are seller stages, and Junk Lead is for items we do not buy."},{"q":"'Out of State' is for:","o":["Auction sellers","Leads located out of state","No-shows","Buyers"],"a":1,"e":"Out of State simply marks location; it is not for auction sellers, no-shows, or buyers."},{"q":"'Reschedule / No-Show' requires:","o":["A photo","A Reason","A deposit","A manager"],"a":1,"e":"It requires a Reason in the notes so the next person understands what happened; a photo, deposit, or manager name is not what this stage asks for."},{"q":"Before moving a lead to 'Qualified, Scheduled' you should have:","o":["A deposit","Photos (unless the customer refuses)","A signed contract","A second call"],"a":1,"e":"You should have photos unless the customer refuses; a deposit, a signed contract, and a second call are not requirements to schedule."},{"q":"Why write what the customer has in the notes?","o":["For fun","So anyone can pick up the lead without another call","It is required by law","To slow things down"],"a":1,"e":"So anyone can continue the lead without re-calling; it is not for fun, not a legal requirement, and certainly not to slow things down."},{"q":"What drives whether a New lead ever books?","o":["The weather","Speed to lead (reaching them fast)","The lead's age","Luck"],"a":1,"e":"Speed to lead is one of the biggest factors; the weather, the lead's age, and luck do not decide it."},{"q":"A seller says they would rather sell their coins on auction. Stage?","o":["Wanting to Buy","Sent to Consignment","Out of State","Won, Deal Closed"],"a":1,"e":"Sent to Consignment is right: that stage is exactly for sellers who want to sell on auction. Wanting to Buy is for people buying from us, Out of State is about location, and Won is only after a deal closes."},{"q":"You tried three times, never reached them, and the waiting period passed. Stage?","o":["Lost Lead","Cold Lead","Junk Lead","New"],"a":1,"e":"Cold Lead is right: it covers leads you could not reach, including those auto-moved after three attempts and a wait. Lost Lead means you reached them but could not close, Junk Lead is about items we do not buy, and New means no outreach has happened yet."},{"q":"A caller only has post-1965 clad quarters. Stage?","o":["Low Value","Junk Lead","Cold Lead","Sent to Consignment"],"a":1,"e":"Junk Lead is right because clad quarters are items we do not buy at all. Low Value is for items we would buy but not enough of, Cold Lead is about being unreachable, and Sent to Consignment is for auction sellers."},{"q":"A caller has two real silver quarters, not enough to justify a visit. Stage?","o":["Junk Lead","Low Value","Lost Lead","Cold Lead"],"a":1,"e":"Low Value is right: we would buy silver quarters, there is just not enough to be worth it. Junk Lead is for things we never buy, Lost Lead means a deal we could not close, and Cold Lead means unreachable."},{"q":"A seller is far outside the area and wants to send items in for an offer. Stage?","o":["Out of State","Wanting to Ship","Sent to Consignment","Cold Lead"],"a":1,"e":"Wanting to Ship is right: it is for out-of-area sellers who will mail items in. Out of State only marks location without the intent to ship, Sent to Consignment is specifically auction, and Cold Lead means you could not reach them."},{"q":"A scheduled customer did not show. What must the notes contain?","o":["A deposit","A Reason","A photo","A manager name"],"a":1,"e":"A Reason is right: Reschedule / No-Show requires a reason so the next person understands what happened. A deposit is not part of our process, a photo belongs to scheduling, and a manager name is not what the stage asks for."},{"q":"A lead is qualified but not yet scheduled. What must you write?","o":["Nothing yet","What they have","The final offer","The spot price"],"a":1,"e":"Write what they have is right so the next person can act without another call. Leaving it blank breaks follow-up, and setters never write a final offer or a price because that is the buyer's job in person."},{"q":"A caller wants to buy coins from us, not sell. Stage?","o":["Sent to Consignment","Wanting to Buy","Wanting to Ship","New"],"a":1,"e":"Wanting to Buy is right: that stage is for people buying from us. Sent to Consignment and Wanting to Ship are both for sellers, and New means a brand-new lead with no outreach."}],"comp":"Give the trainee a sample lead and have them name the pipeline stages in order and place the lead at the correct stage, then move it as the situation changes. Pass only if they move it correctly and can explain each transition."},{"id":"m1.3","name":"Phone Framework and Scripts","passMark":85,"lessonHTML":"\n   <div class=\"outcome\"><b>What you'll be able to do</b><br>After this module you can run the call framework, handle the common objections, and book appointments without ever quoting a price.</div>\n   <h2>The 3A Framework</h2>\n   <p>Handle every objection with <strong>Acknowledge, Associate, Ask</strong>:</p>\n   <ul>\n   <li><strong>Acknowledge</strong> the feeling (\"I understand wanting a ballpark first\").</li>\n   <li><strong>Associate</strong> with others (\"Most folks with inherited collections feel the same way\").</li>\n   <li><strong>Ask</strong> for the next step (\"Would you be open to bringing them in for an exact valuation?\").</li>\n   </ul>\n   <h2>Call Opening Framework (bullet points)</h2>\n   <ul>\n   <li>Open with your name and the company.</li>\n   <li>State the reason for the call and confirm they still want to come in.</li>\n   <li>Listen for high-value trigger words (gold coins, gold jewelry, large amounts of silver).</li>\n   <li>If standard items: route them to send photos to your line so the buyer can follow up.</li>\n   <li>If high-value items: go straight to scheduling using two specific time options.</li>\n   <li>Before ending the call, request a photo so the buyer can prepare.</li>\n   </ul>\n   <h2>Voicemail Framework (bullet points)</h2>\n   <ul>\n   <li>Say your name and the company.</li>\n   <li>State the reason: they asked about getting items appraised.</li>\n   <li>Give the fastest next step: text a few photos to your line.</li>\n   <li>Keep it short (about 25 to 30 seconds) and say your number slowly, twice.</li>\n   </ul>\n   <p>Numbers change per setter, so always use <strong>[your line]</strong> as your own direct number.</p>\n   <h2>The Two-Option Close</h2>\n   <p>Never offer \"whenever works for you.\" Always offer <strong>two specific times</strong>. Removing open-ended choice raises the show rate.</p>\n   <h2>Common Objections</h2>\n   <ul>\n   <li><strong>\"Price over the phone\":</strong> use 3A, never give a number, ask for a photo.</li>\n   <li><strong>\"I need to ask my spouse\":</strong> ask who is more knowledgeable, offer a speaker call, still get a photo.</li>\n   <li><strong>\"I researched it, it's worth X\":</strong> neither confirm nor deny; explain that online prices are usually asking prices, not what collectors actually pay.</li>\n   </ul>\n   <div class=\"standard\"><b>Operating Standard</b><br>Never give any number on the phone, even a range. This single discipline protects every downstream deal and keeps the buyer in control of the offer.</div>\n   <div class=\"takeaways\"><h3>Key Takeaways</h3><ul>\n   <li>3A means Acknowledge, Associate, Ask, in that order.</li>\n   <li>Open with name and company, confirm intent, listen for high-value trigger words.</li>\n   <li>Standard items get routed to send photos to your line; high-value items go straight to scheduling.</li>\n   <li>Voicemails are about 25 to 30 seconds with your number said slowly twice.</li>\n   <li>Use [your line] because numbers change per setter.</li>\n   <li>Always close with two specific time options, never \"whenever works.\"</li>\n   <li>For \"price over phone,\" \"ask my spouse,\" and \"I researched it,\" use 3A and never quote a number.</li>\n   </ul></div>","test":[{"q":"What does 3A stand for?","o":["Ask, Answer, Act","Acknowledge, Associate, Ask","Attract, Anchor, Approve","Align, Adjust, Advance"],"a":1,"e":"3A is Acknowledge, Associate, Ask; the other sets (Ask/Answer/Act, Attract/Anchor/Approve, Align/Adjust/Advance) are not the framework."},{"q":"What is the correct 3A order?","o":["Ask, Acknowledge, Associate","Acknowledge, Associate, Ask","Associate, Ask, Acknowledge","Ask, Associate, Acknowledge"],"a":1,"e":"Acknowledge first, Associate second, Ask last; the other orders try to ask for the next step before acknowledging the feeling or building common ground."},{"q":"What do you listen for early in the call?","o":["Their budget","High-value trigger words (gold, large silver)","Their age","Their zip code"],"a":1,"e":"Listen for high-value triggers like gold and large silver; their budget, age, and zip code are not what you are screening for."},{"q":"For standard items, you route the customer to:","o":["Schedule immediately","Send photos to your line for buyer follow-up","Hang up","A manager"],"a":1,"e":"Standard items go to photos on your line for buyer follow-up; scheduling immediately is for high-value triggers, and hanging up or routing to a manager is wrong."},{"q":"For high-value items you:","o":["Send them to photos only","Go straight to scheduling with two time options","Quote a price","End the call"],"a":1,"e":"High-value items go straight to scheduling with two time options; photos-only is for standard items, you never quote a price, and you do not end the call."},{"q":"How long should a voicemail be?","o":["10 seconds","About 25 to 30 seconds","2 minutes","As long as needed"],"a":1,"e":"About 25 to 30 seconds with the number said twice; 10 seconds is too short to land a usable number, and 2 minutes or open-ended loses the listener."},{"q":"Why use [your line] in scripts?","o":["It is a company rule with no reason","Numbers change per setter","It is faster to read","It hides the number"],"a":1,"e":"Because numbers change per setter, each inserts their own line; it is not a rule without reason, not about reading speed, and not about hiding the number."},{"q":"The two-option close means:","o":["Offer any time they want","Offer two specific times","Offer one time only","Offer a callback"],"a":1,"e":"Offer two specific times; any time they want invites delay, one time feels like pressure, and a callback just postpones the booking."},{"q":"Customer: 'Just give me a ballpark.' First move?","o":["Give a range","Acknowledge the feeling (3A)","Hang up","Transfer"],"a":1,"e":"Start with Acknowledge, no number; giving a range breaks the rule, and hanging up or transferring abandons the objection in front of you."},{"q":"Customer: 'I need to ask my spouse.' Good approach?","o":["End the call","Ask who is more knowledgeable, offer a speaker call, get a photo","Pressure them","Quote a price"],"a":1,"e":"Probe who is more knowledgeable, offer a speaker call, and still capture a photo; ending the call, pressuring them, or quoting a price all lose the lead."},{"q":"Customer: 'I researched it, it's worth X.' Correct response?","o":["Agree to X","Argue it is worth less","Neither confirm nor deny; explain asking vs paid prices","Hang up"],"a":2,"e":"Stay neutral and explain online prices are asking, not paid; agreeing locks you to their number, arguing it down starts a fight, and hanging up loses the lead."},{"q":"Giving any number on the phone is:","o":["Encouraged for big deals","Against the operating standard","Required","Fine for gold"],"a":1,"e":"Giving any number on the phone is against the standard; it is not encouraged for big deals, not required, and not fine for gold."},{"q":"When do you request a photo on a scheduling call?","o":["Never","Before ending the call","A week later","Only if asked"],"a":1,"e":"Request the photo before ending the call so the buyer can prepare; never, a week later, or only if asked would leave the buyer blind."},{"q":"The 'Associate' step does what?","o":["Closes the sale","Relates the customer to others who felt the same","Gives a price","Ends the call"],"a":1,"e":"Associate relates the customer to others who felt the same; it does not close the sale, give a price, or end the call."},{"q":"Customer: 'Just give me a ballpark.' Best first response with 3A?","o":["Give a low range","Acknowledge the feeling, no number","Ask for the spouse","Quote spot"],"a":1,"e":"Acknowledge first is right: 3A starts by acknowledging the feeling, with no number. A low range or a spot quote breaks the no-phone-price rule, and asking for the spouse skips the objection in front of you."},{"q":"Which are high-value trigger words to listen for?","o":["Costume and plated","Gold coins, gold jewelry, large amounts of silver","Clad and junk","Fashion watches"],"a":1,"e":"Gold and large silver are the high-value triggers that mean go straight to scheduling. Costume, plated, clad, and fashion watches are all items we do not buy, so they are the opposite of a trigger."},{"q":"A voicemail should be:","o":["About 5 seconds","About 25 to 30 seconds, number said slowly twice","About 2 minutes","As long as needed"],"a":1,"e":"25 to 30 seconds with the number said twice is right: long enough to land the message and the callback number, short enough to be heard. Five seconds is too rushed to leave a usable number, and two minutes or open-ended loses the listener."},{"q":"The two-option close means offering:","o":["Any time they want","Two specific times","One time only","A callback later"],"a":1,"e":"Two specific times is right because removing open-ended choice raises the show rate. Any time they want invites delay, one time feels like pressure, and a callback just postpones the booking."},{"q":"Why do scripts say [your line] instead of a number?","o":["It hides the number","Numbers change per setter","It reads faster","It is a rule with no reason"],"a":1,"e":"Numbers change per setter is the real reason, so each person inserts their own direct line. It is not about hiding the number or reading speed, and it is a deliberate rule, not an arbitrary one."},{"q":"A caller demands a firm price over the phone before booking. You:","o":["Give a low range","Refuse a number, ask for a photo, and book the appointment","Quote spot","Quote a high range"],"a":1,"e":"Refuse the number, get a photo, and book; any phone figure, low, high, or spot, sets an expectation the buyer cannot honor in person."},{"q":"The single goal of a setter's call is to:","o":["Quote a price","Book the appointment","Sell over the phone","Collect payment"],"a":1,"e":"The goal is to book the appointment; pricing, selling, or collecting over the phone is not the setter's job."},{"q":"A caller is rude but clearly has real items. You:","o":["Hang up","Stay professional and book the appointment","Argue","Quote a low price to be rid of them"],"a":1,"e":"Stay professional and book; hanging up, arguing, or a brush-off quote loses a real deal."},{"q":"You reach a voicemail on an outbound call. You:","o":["Hang up silently","Leave a brief value message and log the attempt","Call back ten times","Delete the lead"],"a":1,"e":"Leave a brief message and log it; silence, spamming, or deleting the lead breaks the cadence."},{"q":"A caller asks what an item is worth but cannot send a photo. You:","o":["Guess a number","Explain we value items in person and book the appointment","Refuse to help","Quote spot"],"a":1,"e":"Explain that valuation happens in person and book; guessing, refusing, or quoting spot are not the framework."},{"q":"A cold lead from months ago is worth reactivating when:","o":["Never","There is a fresh reason, like a rise in metal prices","Only on holidays","At random"],"a":1,"e":"Reactivate cold leads when there is a fresh reason such as a metals rise; never, holidays-only, or random timing is not strategy."}],"comp":"Run a live mock call (one inbound, one outbound). The trainee must follow the phone framework, handle one objection, and book an appointment. Pass only on a clean, scripted booking."},{"id":"m1.4","name":"Live Phones and Daily Rhythm","passMark":85,"lessonHTML":"\n   <div class=\"outcome\"><b>What you'll be able to do</b><br>After this module you can run a full day of live phones, self-review your calls, and recover no-shows and cold leads.</div>\n   <h2>Reps Build the Skill</h2>\n   <p>This stage is about volume. You run live phones daily and review one of your own recorded calls each day to find one thing to improve. Your targets are a strong photo capture rate, a strong show rate, and accurate pipeline notes.</p>\n   <h2>Daily Self-Review</h2>\n   <p>At the end of each day, pick one recorded call at random and score it on these points: opening, listening, correct avatar read, framework adherence, objection handling, photo request, and the close. Pick one specific thing to do better tomorrow.</p>\n   <h2>No-Show Recovery</h2>\n   <p>When a customer misses an appointment, call them back quickly (within about two hours). Acknowledge the miss, offer a new time, and rebook. Try a few times before marking the lead Reschedule / No-Show with a Reason, or Lost Lead if they never re-engage.</p>\n   <h2>Cold Lead Reactivation</h2>\n   <p>Spend part of each day working Cold Leads (people you could not reach). Reach back out, especially when there is a reason to call (for example, a rise in metal prices). Keep daily outreach within a sensible cap so messages do not look like spam.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>Review your own calls honestly every day. The fastest way to improve is to hear yourself, pick one fix, and apply it the next day. Small daily corrections compound quickly.</div>\n   <div class=\"takeaways\"><h3>Key Takeaways</h3><ul>\n   <li>This stage is about daily reps on live phones.</li>\n   <li>Review one random recorded call each day and pick one thing to improve.</li>\n   <li>The self-review covers opening, listening, avatar read, framework, objections, photo, and close.</li>\n   <li>Call back no-shows quickly (about two hours) and rebook before marking them off.</li>\n   <li>Work Cold Leads daily, especially when there is a fresh reason to call.</li>\n   <li>Keep outreach within a sensible cap so it does not look like spam.</li>\n   </ul></div>","test":[{"q":"What is this stage mostly about?","o":["Pricing","Daily reps on live phones","Shipping","Hiring"],"a":1,"e":"This stage is about daily reps on live phones; pricing, shipping, and hiring belong to other roles."},{"q":"How do you pick the call to self-review?","o":["Your best one","At random","Your worst one","The first one"],"a":1,"e":"Pick one at random for an honest review; cherry-picking your best, worst, or first call would bias what you learn."},{"q":"How often do you self-review a call?","o":["Weekly","Each day","Monthly","Never"],"a":1,"e":"One recorded call each day; weekly, monthly, or never is too infrequent to improve fast."},{"q":"Which is part of the self-review?","o":["Lunch timing","Opening, listening, avatar read, framework, objections, photo, close","Commute","Email count"],"a":1,"e":"Those seven call points are the review; lunch timing, your commute, and email count have nothing to do with it."},{"q":"After reviewing a call you should:","o":["Forget it","Pick one specific thing to improve tomorrow","Quit","Skip tomorrow"],"a":1,"e":"Pick one concrete fix for tomorrow; forgetting it, quitting, or skipping the next day wastes the review."},{"q":"How quickly should you call back a no-show?","o":["Within about two hours","Next week","Never","Within a month"],"a":0,"e":"Call back within about two hours while it is fresh; next week, never, or within a month lets the lead go cold."},{"q":"When a no-show never re-engages after several tries, you mark them:","o":["Won","Lost Lead (or Reschedule/No-Show with a Reason)","New","Wanting to Buy"],"a":1,"e":"Mark them Reschedule/No-Show with a Reason, or Lost Lead if they never re-engage; Won, New, and Wanting to Buy do not fit a no-show."},{"q":"When is a great time to reactivate Cold Leads?","o":["Never","When there is a fresh reason, like a rise in metal prices","Only on holidays","At midnight"],"a":1,"e":"A fresh reason like a metal-price rise is the moment to reach back out; never, holidays-only, or midnight are not strategy."},{"q":"Why keep outreach within a sensible cap?","o":["To work less","So messages do not look like spam","No reason","To slow sales"],"a":1,"e":"A cap keeps outreach from looking like spam; it is not about working less, slowing sales, or for no reason."},{"q":"What is the fastest way to improve on the phones?","o":["Talk faster","Hear yourself, pick one fix, apply it next day","Take fewer calls","Avoid objections"],"a":1,"e":"Hear yourself, pick one fix, and apply it the next day; talking faster, taking fewer calls, or avoiding objections does not build skill."},{"q":"Cold Leads are people who:","o":["Closed a deal","You could not reach","Want to buy","Are scheduled"],"a":1,"e":"Cold Leads are people you could not reach; they are not closed deals, buyers, or scheduled customers."},{"q":"No-show recovery starts by:","o":["Marking them Lost immediately","Calling back quickly and offering a new time","Ignoring them","Sending a bill"],"a":1,"e":"Start by calling back fast and offering a new time; marking them Lost right away, ignoring them, or billing them all give up the deal."},{"q":"A brand-new lead just hit your queue and you also have older follow-ups. Priority?","o":["Finish the follow-ups first","Reach the new lead fast, then follow-ups","Wait for photos on the new one","Research the items first"],"a":1,"e":"Hit the fresh lead first is right because speed to lead is highest when a lead is brand new. Finishing follow-ups first lets the new lead cool off, and waiting for photos or researching items both delay first contact."},{"q":"After each contact attempt you should:","o":["Move on silently","Log it so the stage stays accurate","Wait a day","Delete the lead"],"a":1,"e":"Log every attempt is right so the pipeline stage stays accurate and the next person knows the history. Moving on silently or waiting leaves the record wrong, and deleting the lead throws away a contact you may still close."},{"q":"You booked an appointment for tomorrow. Best practice?","o":["Do nothing until they arrive","Confirm it to reduce no-shows","Cancel and rebook","Ask for a deposit"],"a":1,"e":"Confirming is right because a confirmed appointment is far less likely to no-show. Doing nothing leaves the show to chance, canceling and rebooking is pointless, and we do not take deposits."},{"q":"Mid-call the customer presses again for a price. You:","o":["Give a quick range","Use 3A, no number, get a photo, book","Transfer the call","End the call"],"a":1,"e":"3A with no number is right: hold the line, get a photo, and book. A quick range still breaks the no-phone-price rule, transferring dodges the job, and ending the call loses the lead."},{"q":"Why does confirming appointments matter?","o":["It does not","It reduces no-shows and protects the show rate","It slows the day","It avoids photos"],"a":1,"e":"It reduces no-shows and protects the show rate, which is the whole point. It does matter, it does not slow the day in any meaningful way, and it has nothing to do with avoiding photos."},{"q":"A productive setter's day is measured most by:","o":["Hours seated","Speed to lead, attempts logged, and appointments confirmed","Longest calls","Number of voicemails only"],"a":1,"e":"Speed, logged attempts, and confirmed appointments are the real measures because they drive booked, kept appointments. Hours seated and call length measure effort, not results, and voicemails alone do not book anyone."},{"q":"With limited calling hours, you should work first through:","o":["Random numbers","Warm and recent leads and confirmations, then cold leads with a reason","Only cold leads","Whoever called last year"],"a":1,"e":"Prioritize warm and recent leads and confirmations, then cold with a reason; random numbers, cold-only, or stale picks waste the block."},{"q":"After a no-answer on an outbound call, you:","o":["Move on and never log it","Leave a brief value voicemail and log the attempt, then follow the cadence","Call ten more times in a row","Delete the lead"],"a":1,"e":"Leave a brief voicemail and log it, then follow the cadence; skipping the log, spamming calls, or deleting the lead breaks the rhythm."},{"q":"Your daily rhythm is built around:","o":["Waiting for inbound calls only","Consistent call blocks with every outcome logged","Calling when you feel like it","One big push per week"],"a":1,"e":"Consistent call blocks with logged outcomes build the rhythm; waiting on inbound, calling on a whim, or one weekly push do not."},{"q":"To reduce no-shows on a booked appointment, you:","o":["Do nothing","Confirm it ahead of time","Double-book the slot","Cancel it"],"a":1,"e":"Confirm appointments ahead to reduce no-shows; doing nothing, double-booking, or canceling all hurt the pipeline."},{"q":"Logging every call outcome matters because:","o":["It does not","It keeps the pipeline accurate and feeds follow-up","It slows you down","It is only for managers"],"a":1,"e":"Logging keeps the pipeline accurate and feeds follow-up; it is not pointless, mere busywork, or manager-only."}],"comp":"Observe the trainee make real calls for a set block. Pass only if they keep the call rhythm, follow the script, log every outcome, and book at the expected rate."},{"id":"m1.5","name":"Buyer Shadow and Setter Promotion","passMark":85,"lessonHTML":"\n   <div class=\"outcome\"><b>What you'll be able to do</b><br>After this module you understand what a great appointment looks like from the buyer's side and you know exactly what it takes to promote.</div>\n   <h2>Shadow the Buyer</h2>\n   <p>You will sit in on live appointments with a buyer. Watch how they greet, profile the customer, evaluate items, handle objections, and close. After each appointment, note one thing you could not yet do yourself and one thing you would improve on the setter side. Do not interrupt appointments and keep your phone away.</p>\n   <h2>The Promotion Gate</h2>\n   <p>To move up to Junior Purchaser, all of these must be true at the same time, held steady for two months:</p>\n   <ul>\n   <li>You have been in the role long enough to show consistency.</li>\n   <li>Your pipeline notes and stages are accurate and complete.</li>\n   <li>Your show rate is strong.</li>\n   <li>You pass the written promotion test.</li>\n   <li>You pass a recorded role-play scored by leadership.</li>\n   </ul>\n   <p>Promotion is signed off by leadership based on the numbers, not on tenure or relationships.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>Promotion is decided on data: accurate pipeline, strong show rate, and passing scores. This protects you (you only move up when you are truly ready) and protects the team (no weak links get promoted early).</div>\n   <div class=\"takeaways\"><h3>Key Takeaways</h3><ul>\n   <li>You shadow a buyer to see greeting, profiling, evaluation, objections, and the close.</li>\n   <li>During shadow you do not interrupt and you keep your phone away.</li>\n   <li>After each appointment, note one thing you couldn't do yet and one setter-side improvement.</li>\n   <li>Promotion requires consistency, accurate pipeline, strong show rate, a written test, and a role-play.</li>\n   <li>All gates must hold at once for two months.</li>\n   <li>Promotion is decided on data, not tenure or relationships.</li>\n   </ul></div>","test":[{"q":"During buyer shadow you watch the buyer do what?","o":["Ship boxes","Greet, profile, evaluate, handle objections, close","File taxes","Run ads"],"a":1,"e":"You watch the buyer greet, profile, evaluate, handle objections, and close; shipping boxes, filing taxes, and running ads are not the appointment."},{"q":"During shadow you should:","o":["Run the appointment","Not interrupt and keep your phone away","Take over the close","Price the items"],"a":1,"e":"Observe quietly with your phone away; running the appointment, taking the close, or pricing items are all the buyer's job."},{"q":"After each shadowed appointment you note:","o":["The customer's name","One thing you couldn't do yet and one setter-side improvement","The weather","Nothing"],"a":1,"e":"Note one thing you could not do yet and one setter-side improvement; the customer's name, the weather, and nothing teach you nothing."},{"q":"How many gates must be true to promote?","o":["Just the test","All of them at once","Only tenure","Only show rate"],"a":1,"e":"All gates must hold at once; passing just the test, only tenure, or only show rate is not enough."},{"q":"How long must the gates hold?","o":["One day","One week","Two months","One year"],"a":2,"e":"The gates must hold steady for two months; one day or one week is too short, and a year is more than required."},{"q":"Promotion is decided on:","o":["Tenure","Relationships","Data (numbers and scores)","Seniority"],"a":2,"e":"Promotion is decided on data; tenure, relationships, and seniority reward time or favor, not readiness."},{"q":"Who signs off on promotion?","o":["A peer","Leadership","HR only","The customer"],"a":1,"e":"Leadership signs off on the numbers; a peer, HR alone, or the customer have no authority to promote."},{"q":"Which is a promotion gate?","o":["A strong show rate","Most hours worked","Most calls dialed","Longest tenure"],"a":0,"e":"A strong show rate is a gate; most hours, most dials, and longest tenure measure effort or time, not results."},{"q":"The recorded role-play is scored by:","o":["The trainee","Leadership","Another setter","No one"],"a":1,"e":"Leadership scores the role-play to keep the bar objective; the trainee, another setter, or no one would not."},{"q":"Why is data-based promotion good for you?","o":["It is not","You only move up when truly ready","It is faster","It avoids tests"],"a":1,"e":"You move up only when truly ready; it is not faster, and it does not avoid tests, since the tests are part of the data."},{"q":"Why is data-based promotion good for the team?","o":["No reason","No weak links get promoted early","It is cheaper","It avoids training"],"a":1,"e":"It keeps weak links from being promoted early; that is the reason, not cost or avoiding training."},{"q":"During a buyer shadow you should:","o":["Run the appointment","Observe quietly, no interrupting, phone away","Take over the close","Price the items"],"a":1,"e":"Observe quietly is right: the point of a shadow is to watch the full flow without disrupting it. Running the appointment, taking the close, or pricing items are all the buyer's job, not the shadowing setter's."},{"q":"Promotion from setter is decided on:","o":["Tenure","Data: numbers and scores","Relationships","Seniority"],"a":1,"e":"Data is right: promotion is earned on numbers and scores, which keeps it fair. Tenure, relationships, and seniority all reward time or favor rather than proven readiness."},{"q":"How long must the promotion gates hold?","o":["One day","One week","Two months","One year"],"a":2,"e":"Two months is right: the gates must hold steady that long to prove consistency, not a single good stretch. One day or one week is too short to be reliable, and a year is longer than the standard requires."},{"q":"While shadowing a buyer, your job is to:","o":["Take over the deal","Watch and learn the flow without interfering","Quote prices yourself","Talk to the customer"],"a":1,"e":"Watch and learn the flow without interfering; taking over, quoting, or talking to the customer is not shadowing."},{"q":"Promotion from setter to junior purchaser depends on:","o":["Time served alone","Demonstrated skills and a sign-off","Seniority","Who you know"],"a":1,"e":"It depends on demonstrated skills and a sign-off; time, seniority, or connections do not earn it."},{"q":"After shadowing a deal, you should be able to:","o":["Forget it","Explain each step the buyer took and why","Only recall the price","Critique the customer"],"a":1,"e":"You should be able to explain each step and the reasoning; forgetting, price-only recall, or critiquing the customer misses the point."},{"q":"You watch the buyer route a loose diamond to the specialist. The lesson is:","o":["Buyers are slow","Route what swings sharply in value","Never buy diamonds","Always guess"],"a":1,"e":"Route what swings sharply in value; it is not about speed, refusing diamonds, or guessing."},{"q":"Shadowing teaches the table flow so that:","o":["You can skip supervised buying","When you buy supervised, you already know the sequence","You never have to buy","You can work the phones forever"],"a":1,"e":"It prepares you so supervised buying goes smoothly; it does not let you skip steps or avoid buying."},{"q":"During a shadow, the customer asks you a question directly. You:","o":["Take over the deal","Defer politely to the buyer you are shadowing","Quote a price","Argue"],"a":1,"e":"Defer politely to the buyer; taking over, quoting, or arguing oversteps the shadow role."},{"q":"Mid-shadow, you think the buyer mispriced something. You:","o":["Interrupt the deal","Note it and ask afterward, without interrupting","Tell the customer","Take over"],"a":1,"e":"Note it and ask after the deal; interrupting, telling the customer, or taking over undermines the buyer and the shadow."},{"q":"The point of shadowing before supervised buying is to:","o":["Pass time","Learn the sequence so supervised buys go smoothly","Avoid buying","Earn a bonus"],"a":1,"e":"It teaches the sequence so supervised buying goes smoothly; it is not filler, avoidance, or a bonus."},{"q":"Asked to summarize a shadowed deal, you should be able to:","o":["Recall only the price","Walk each step the buyer took and the reasoning","Critique the customer","Say nothing"],"a":1,"e":"You should walk each step and the reasoning; price-only recall, critiquing the customer, or silence misses the learning."},{"q":"You watch the buyer pivot a customer to consignment. The lesson is:","o":["Always buy","When you cannot reach a deal within MAX Face, consignment keeps the item in play","Never offer consignment","Pay over MAX Face"],"a":1,"e":"Consignment keeps the item in play when a buy is not reachable; always-buy, never-consign, or overpaying are wrong takeaways."},{"q":"Promotion to junior purchaser is earned through:","o":["Time alone","Demonstrated skill and a sign-off","Seniority","Volume of calls only"],"a":1,"e":"It is earned through demonstrated skill and sign-off; time, seniority, or call volume alone do not earn it."}],"comp":"After the trainee shadows a live buyer, have them narrate every step the buyer took and why. Pass only if they can explain the full table flow accurately."}]},{"id":"tier2","n":"II","name":"Junior Purchaser","sub":"6 modules","modules":[{"id":"m2.1","name":"Coin and Metal Identification (Deep)","passMark":90,"lessonHTML":"\n   <div class=\"outcome\"><b>What you'll be able to do</b><br>After this deep module you can identify coins and metals on sight, recognize the key dates for every series, read karat and silver and platinum stamps, know the weights and silver content by era, and know which items must go to the specialist instead of being priced or melted.</div>\n   <h2>Why This Module Is the Largest</h2>\n   <p>Identification is the heart of buying. Misreading a coin, or melting a key date, is a permanent loss. Take your time here. Everything later depends on knowing this cold.</p>\n   <h2>The Rarity Idea</h2>\n   <p>Value comes from <strong>rarity and condition, not age</strong>. A low-mintage or key-date coin can be worth many times its metal value. When a coin might be a key date, set it aside and send it to the <strong>numismatist</strong> instead of pricing or melting it.</p>\n   <h2>Mint Marks</h2>\n   <ul>\n   <li><strong>CC</strong> equals Carson City, the rarest. On a Morgan, CC always goes to the numismatist; never price it yourself.</li>\n   <li><strong>O</strong> equals New Orleans, rare on gold.</li>\n   <li><strong>S</strong> equals San Francisco, <strong>D</strong> equals Denver, <strong>P</strong> or no mark equals Philadelphia.</li>\n   </ul>\n   <h2>Bank Coins (Face Value Only)</h2>\n   <p>These are common circulating coins worth only their face value: pennies after 1958, dimes and quarters after 1964, half dollars after 1970. Hand them back.</p>\n   <h2>Silver Content by Era</h2>\n   <ul>\n   <li>Kennedy and Roosevelt and other dimes, quarters, halves dated <strong>1964 and earlier: 90 percent silver</strong>.</li>\n   <li>Kennedy half dollars <strong>1965 to 1970: 40 percent silver</strong>.</li>\n   <li>Eisenhower dollars can be 40 percent silver (the silver-clad versions).</li>\n   <li>Dimes and quarters 1965 and later, and halves 1971 and later: no silver (bank coins).</li>\n   </ul>\n   <h2>Silver Coin Weights</h2>\n   <ul>\n   <li>Silver dime: about 2.5 grams.</li>\n   <li>Silver quarter: about 6.25 grams.</li>\n   <li>Silver half dollar: about 12.5 grams.</li>\n   <li>Silver dollar (Morgan or Peace): about 26.7 grams. If it is noticeably lighter, it is likely fake.</li>\n   </ul>\n   <h2>Key Dates by Series (study this table closely)</h2>\n   <ul>\n   <li><strong>Peace dollar:</strong> 1921-P or 1928-P.</li>\n   <li><strong>Morgan dollar:</strong> any CC mint mark, 1893-S, 1895-P.</li>\n   <li><strong>Mercury dime:</strong> 1916-D, 1921-D.</li>\n   <li><strong>Seated Liberty dime:</strong> 1841, 1875.</li>\n   <li><strong>Barber dime:</strong> 1894-S, 1895-O, 1896-S.</li>\n   <li><strong>Washington quarter:</strong> 1932-D, 1932-S.</li>\n   <li><strong>Standing Liberty quarter:</strong> 1916, 1921.</li>\n   <li><strong>Barber quarter:</strong> 1896-S, 1901-S.</li>\n   <li><strong>Seated Liberty quarter:</strong> 1841, 1853, 1877, 1878.</li>\n   <li><strong>Walking Liberty half:</strong> 1916 all mint marks, 1921 all mint marks.</li>\n   <li><strong>Franklin half:</strong> 1955 and 1956 \"Bugs Bunny\" variety.</li>\n   <li><strong>Barber half:</strong> 1892-O \"Micro O\", 1893-S, 1913, 1915.</li>\n   <li><strong>Wheat or steel penny:</strong> 1909-S VDB, 1914-D, 1931-S, 1944 steel, 1943-D copper.</li>\n   <li><strong>Indian Head penny:</strong> 1877, 1909-S.</li>\n   <li><strong>Flying Eagle penny:</strong> 1856.</li>\n   <li><strong>Large cent:</strong> 1793 to 1795, 1804.</li>\n   <li><strong>Jefferson war nickel:</strong> 1942 to 1945 (35 percent silver).</li>\n   <li><strong>Shield nickel:</strong> 1877, 1878, 1881.</li>\n   <li><strong>Liberty (Victory) nickel:</strong> 1913 (only five made), 1883 \"no cents\", 1885.</li>\n   <li><strong>Buffalo nickel:</strong> 1937-D three-legged, 1936 three-and-a-half-legged.</li>\n   <li><strong>Half cent:</strong> 1793, 1796, 1802, 1804, and 1831 and 1836 proof-only, and 1849 to 1857.</li>\n   <li><strong>Two cent piece:</strong> 1864 small motto, 1867, 1870.</li>\n   <li><strong>Three cent piece:</strong> silver type 1851 and 1855 and 1868; nickel type 1883, 1884, 1885.</li>\n   </ul>\n   <h2>Two Facts You Will Be Asked</h2>\n   <ul>\n   <li><strong>VDB</strong> on the 1909-S VDB penny stands for <strong>Victor David Brenner</strong>, the designer.</li>\n   <li><strong>Jefferson war nickels</strong> were made 1942 to 1945 and are <strong>35 percent silver</strong>, because nickel metal was needed for bullets and tanks during the war.</li>\n   </ul>\n   <h2>Gold Stamps and Purity</h2>\n   <ul>\n   <li><strong>10K:</strong> marked 417, 41.7 percent, or 10KT.</li>\n   <li><strong>14K:</strong> marked 585, 58.5 percent, or 14KT.</li>\n   <li><strong>18K:</strong> marked 750, 75 percent, or 18KT.</li>\n   <li><strong>22K:</strong> marked 916, 91.6 percent, or 22KT.</li>\n   <li>Reject items stamped GF, GP, HGE, 1/10, or 1/20. These are filled or plated, not solid gold.</li>\n   </ul>\n   <h2>Silver and Platinum Stamps</h2>\n   <ul>\n   <li><strong>Sterling silver:</strong> marked .925, \"Sterling\" written out, or \"Ster\". If it does not say one of these, do not buy it as silver.</li>\n   <li><strong>.999 fine:</strong> should say \".999 fine silver\" or \".999 fine gold\".</li>\n   <li><strong>Platinum:</strong> marked Platinum, Plat, PT, or 950.</li>\n   </ul>\n   <h2>Costume, Foreign, and Routed Items</h2>\n   <ul>\n   <li><strong>Costume:</strong> buy by the pound and very cheap; it is not precious metal.</li>\n   <li><strong>Foreign:</strong> send to the specialist channel for experts to evaluate.</li>\n   <li><strong>Rare coins, certain watches and diamonds, comics, militaria, instruments:</strong> route to the right specialist rather than pricing at the table.</li>\n   </ul>\n   <div class=\"standard\"><b>Operating Standard</b><br>When unsure, never melt and never guess. Set the item aside and route it to the numismatist or the right specialist. One missed key date costs more than a day of careful checking.</div>\n   <div class=\"takeaways\"><h3>Key Takeaways</h3><ul>\n   <li>Value comes from rarity and condition, not age.</li>\n   <li>CC means Carson City, the rarest; on a Morgan, route CC to the numismatist.</li>\n   <li>Bank coins (face value): pennies after 1958, dimes and quarters after 1964, halves after 1970.</li>\n   <li>1964 and earlier dimes, quarters, halves are 90 percent silver; 1965 to 1970 halves are 40 percent silver.</li>\n   <li>A real silver dollar weighs about 26.7 grams; much lighter means likely fake.</li>\n   <li>Know the key dates by series: Peace 1921-P or 1928-P; Morgan any CC, 1893-S, 1895-P; Mercury 1916-D and 1921-D; Washington quarter 1932-D and 1932-S; Walking Liberty half 1916 and 1921 all mints; wheat penny 1909-S VDB, 1914-D, 1943-D copper, 1944 steel.</li>\n   <li>VDB stands for Victor David Brenner.</li>\n   <li>Jefferson war nickels (1942 to 1945) are 35 percent silver.</li>\n   <li>Gold stamps: 10K is 417 or 41.7 percent; 14K is 585 or 58.5 percent; 18K is 750 or 75 percent; 22K is 916 or 91.6 percent.</li>\n   <li>Sterling is .925, Sterling, or Ster; platinum is PT, Plat, Platinum, or 950; reject GF, GP, HGE, 1/10, 1/20.</li>\n   <li>Costume is bought by the pound; foreign and rare items go to the specialist.</li>\n   <li>When unsure, set aside and route; never melt or guess.</li>\n   </ul></div>","test":[{"q":"What drives a coin's value most?","o":["Age","Rarity and condition","Weight","Shininess"],"a":1,"e":"Rarity and condition drive value most; age, weight, and shininess do not by themselves."},{"q":"What does a CC mint mark mean?","o":["Carson City, the rarest","Charlotte","Cleveland","Common Coin"],"a":0,"e":"CC means Carson City, the rarest mint; it is not Charlotte, Cleveland, or 'common coin'."},{"q":"Correct action for a CC Morgan?","o":["Price it yourself","Melt it","Route to the numismatist","Reject it"],"a":2,"e":"Route a CC Morgan to the numismatist; pricing it yourself, melting it, or rejecting it could give away a rare coin."},{"q":"Pennies are bank coins (face value) after what year?","o":["1958","1964","1970","1982"],"a":0,"e":"Pennies after 1
