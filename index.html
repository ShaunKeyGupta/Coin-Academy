dule using marketing's content","Hourly","With random images"],"a":1,"e":"On a regular weekly schedule using marketing's content keeps the office visible in local search. Never posting goes dark, hourly is overkill, and random images stray from the brand."},{"q":"You ask for a review:","o":["Never","In person on every closed deal","Only by email","Once a month"],"a":1,"e":"In person on every closed deal, when goodwill is highest. Never asking leaves reviews on the table, email-only is weaker than in person, and once a month is far too infrequent."},{"q":"A one-star review just posted. You:","o":["Reply publicly right away","Alert leadership, draft a calm response, get approval before posting, then call the customer","Delete it","Argue in the comments"],"a":1,"e":"Alert leadership, draft a calm reply, get approval, then call the customer: measured and on-brand. Replying instantly or arguing risks a public mess, and you cannot simply delete a review."},{"q":"Before posting any response to a bad review you:","o":["Post immediately","Get leadership approval","Delete the review","Argue"],"a":1,"e":"Get leadership approval first, since a public reply represents the whole office. Posting immediately or arguing can backfire, and deleting is not an option."},{"q":"With referral partners you:","o":["Pay everyone equally","Track who refers and focus on those who send business","Treat all the same forever","Avoid them"],"a":1,"e":"Track who refers and focus on the partners who actually send business. Paying everyone equally or treating all the same ignores results, and avoiding partners forfeits free leads."},{"q":"A review was missed at the table. You:","o":["Forget it","Follow up by message soon after","Write it yourself","Pay for one"],"a":1,"e":"Follow up by message soon after; forgetting, faking, or paying for reviews is wrong."},{"q":"A bad review comes in. You:","o":["Post a public reply immediately","Alert leadership, draft a calm response, get approval before posting, then try to make it right","Argue online","Ignore it"],"a":1,"e":"Alert leadership, draft a calm response, get approval, then make it right; immediate replies, arguing, or ignoring hurt the rating."},{"q":"You may post a public response to a bad review:","o":["Anytime","Only with leadership approval first","Never","After arguing"],"a":1,"e":"Only with leadership approval first; anytime, never, or after arguing are wrong."},{"q":"What protects the rating most over time is:","o":["A few perfect reviews","A steady volume of named reviews plus careful responses","Deleting bad ones","Arguing with critics"],"a":1,"e":"Volume of named reviews plus careful responses protects the rating; a few reviews, deletion, or arguing do not."},{"q":"A response to a bad review is posted:","o":["Immediately by you","Only after leadership approval","Never","After arguing"],"a":1,"e":"Post only after leadership approval; immediate, never, or post-argument responses hurt the rating."},{"q":"What protects the rating over time is:","o":["A single great review","A steady volume of named reviews and careful responses","Deleting criticism","Ignoring reviews"],"a":1,"e":"Volume of named reviews plus careful responses protects the rating; one review, deletion, or ignoring do not."},{"q":"A customer leaves happy but you forgot to ask for a review. You:","o":["Forget it","Follow up by message soon after","Write one for them","Buy one"],"a":1,"e":"Follow up by message soon after; forgetting, faking, or buying reviews is wrong."},{"q":"Before replying publicly to a one-star review, you must:","o":["Reply at once","Get leadership approval first","Argue the facts","Delete it"],"a":1,"e":"Get leadership approval before posting any public reply; replying at once, arguing, or deleting hurts the rating."}],"comp":"Have the trainee ask for a review correctly on a mock closed deal and draft a calm bad-review response for leadership approval. Pass only if they ask in person and never post without approval first."},{"id":"m3b.3","name":"Office Numbers (P&L)","passMark":85,"lessonHTML":"\n   <div class=\"outcome\"><b>What you'll be able to do</b><br>After this module you can track the office's daily numbers, handle pricing inputs correctly, and prepare pay accurately.</div>\n   <h2>Daily Numbers</h2>\n   <p>Each day capture revenue (resale value bought), cost of goods (what you paid), gross profit, daily expenses, and the net result. Post a short summary to the team.</p>\n   <h2>Pricing Inputs</h2>\n   <p>Spot prices and pricing rules in the tool are set by leadership. You confirm they are current, but you do not change them yourself. If a price looks wrong, raise it; do not edit it.</p>\n   <h2>Preparing Pay</h2>\n   <p>At the end of the period, prepare each buyer's pay from their results, then submit it to leadership for approval before it is paid. Accuracy matters; mistakes here break trust.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>You confirm the pricing inputs, you never change them yourself. Pay is prepared from the records and approved by leadership before it goes out. This keeps the most sensitive numbers correct and accountable.</div>\n   <div class=\"takeaways\"><h3>Key Takeaways</h3><ul>\n   <li>Capture daily revenue, cost of goods, gross profit, expenses, and net result; post a short summary.</li>\n   <li>Spot prices and pricing rules are set by leadership; you confirm they are current but never change them.</li>\n   <li>If a price looks wrong, raise it rather than edit it.</li>\n   <li>Prepare each buyer's pay from results, then submit to leadership for approval before paying.</li>\n   <li>Accuracy in pay is critical to trust.</li>\n   </ul></div>","test":[{"q":"Daily revenue is:","o":["Cash on hand","Resale value of what was bought","Profit","Expenses"],"a":1,"e":"Daily revenue is the resale value of what was bought; cash on hand is a balance, profit is after costs, and expenses are costs."},{"q":"Net result is:","o":["Revenue only","Gross profit minus daily expenses","Cost of goods","Revenue plus expenses"],"a":1,"e":"Net result is gross profit minus daily expenses; revenue alone, cost of goods, or adding expenses back is wrong."},{"q":"Who sets spot prices and pricing rules?","o":["You","Leadership","The customer","The buyer"],"a":1,"e":"Leadership sets spot and the rules in the tool; you, the customer, and the buyer do not."},{"q":"Your job with pricing inputs is to:","o":["Change them freely","Confirm they are current, not change them","Ignore them","Delete them"],"a":1,"e":"Confirm the inputs are current, do not change them; changing freely, ignoring, or deleting them is wrong."},{"q":"If a price looks wrong you:","o":["Edit it","Raise it rather than edit it","Ignore it","Guess"],"a":1,"e":"Raise a wrong-looking price to leadership rather than editing it; editing oversteps, ignoring lets it stand, and guessing adds error."},{"q":"Pay is prepared from:","o":["Memory","Each buyer's results","Guesses","The customer"],"a":1,"e":"Pay is prepared from each buyer's results and records; memory, guesses, or the customer have no place in it."},{"q":"Before pay goes out it must be:","o":["Posted publicly","Approved by leadership","Paid immediately","Hidden"],"a":1,"e":"Pay must be approved by leadership first; posting it publicly, paying immediately, or hiding it is wrong."},{"q":"Why does pay accuracy matter?","o":["It does not","Mistakes break trust","To slow down","No reason"],"a":1,"e":"Pay accuracy matters because mistakes break trust; it does matter, and it is not about slowing down or for no reason."},{"q":"You post a daily summary to:","o":["No one","The team","The public","A competitor"],"a":1,"e":"Post a short daily summary to the team; not no one, the public, or a competitor."},{"q":"Gross profit is:","o":["Revenue minus cost of goods","Revenue plus cost","Expenses","Net result"],"a":0,"e":"Gross profit is revenue minus cost of goods; adding revenue and cost, expenses, and net result are different figures."},{"q":"A price looks wrong in the tool. You:","o":["Edit it yourself","Raise it rather than edit it","Ignore it","Guess a new one"],"a":1,"e":"Raise it rather than edit it: pricing is leadership's to change. Editing it yourself oversteps, ignoring it lets a bad price stand, and guessing introduces a new error."},{"q":"An office profit and loss subtracts from gross:","o":["Nothing","Rent, payroll, marketing, and lead costs","Only rent","Only marketing"],"a":1,"e":"An office P&L subtracts rent, payroll, marketing, and lead costs; not nothing or a single line."},{"q":"Net profit is:","o":["The same as gross","What bonuses and step-ups are calculated on","Irrelevant","Set by the customer"],"a":1,"e":"Net profit, not gross, is what bonuses and step-ups calculate on; it is not irrelevant or customer-set."},{"q":"High gross with high costs:","o":["Always profits","Can net little; manage the P&L","Is impossible","Needs no attention"],"a":1,"e":"High gross with high costs can net little, so manage the P&L; it is not always profitable or unworthy of attention."},{"q":"Lead-referrer costs:","o":["Raise net","Reduce net before any bonus","Do not exist","Are fixed by law"],"a":1,"e":"Lead costs reduce net before bonus; they do not raise net or fail to exist."},{"q":"You improve net by:","o":["Spending more everywhere","Margin and cost control","Cutting reviews","Ignoring the P&L"],"a":1,"e":"Improve net through margin and cost control; spending more, cutting reviews, or ignoring the P&L do not."},{"q":"Reviewing the office P&L regularly lets you:","o":["Avoid numbers","Catch and fix margin leaks","Skip payroll","Stop marketing"],"a":1,"e":"Regular review catches and fixes margin leaks; it does not let you avoid numbers, skip payroll, or stop marketing."},{"q":"An office profit and loss subtracts:","o":["Nothing","Rent, payroll, marketing, and lead costs","Only payroll","Only rent"],"a":1,"e":"It subtracts rent, payroll, marketing, and lead costs; not nothing or a single line."},{"q":"Bonuses and step-ups are calculated on:","o":["Gross","Net profit","Customer count","Hours"],"a":1,"e":"They are calculated on net profit, not gross, headcount, or hours."},{"q":"Lead costs:","o":["Raise net","Reduce net before bonus","Do not apply","Are fixed by law"],"a":1,"e":"Lead costs reduce net before bonus; they do not raise net or fail to apply."},{"q":"High gross can still net little when:","o":["Never","Costs are heavy","Customers are happy","Hours are short"],"a":1,"e":"Heavy costs can leave little net even on high gross; the other options are not the cause."},{"q":"You improve office net by:","o":["Spending more everywhere","Margin and cost control","Cutting reviews","Ignoring the P&L"],"a":1,"e":"Improve net through margin and cost control; spending more, cutting reviews, or ignoring the P&L do not."},{"q":"Office gross is up but net is flat. The likely cause is:","o":["Too few customers","Rising costs such as payroll, marketing, and leads","Low spot price","Good reviews"],"a":1,"e":"Flat net on rising gross usually means rising costs; it is not customer count, spot, or reviews."},{"q":"To lift net without adding volume, you:","o":["Spend more on ads","Raise margin per deal and control costs","Cut reviews","Lower prices to customers"],"a":1,"e":"Lift net by raising margin and controlling costs; more ad spend, cutting reviews, or lowering buy margins do not help net."}],"comp":"Have the trainee build or read an office profit and loss from sample numbers. Pass only if the math is right and they can explain net profit."},{"id":"m3b.4","name":"Team Management and Hiring","passMark":85,"lessonHTML":"\n   <div class=\"outcome\"><b>What you'll be able to do</b><br>After this module you can hire and coach setters, run weekly one-on-ones, and handle underperformance fairly.</div>\n   <h2>Hiring Setters</h2>\n   <p>Post the role, screen applicants, interview, and include a short role-play to see how they handle a real call. A final offer needs leadership's sign-off. You can hire setters with that sign-off; hiring or removing buyers and above stays with leadership.</p>\n   <h2>Weekly One-on-Ones</h2>\n   <p>Meet each person weekly for about half an hour: review their numbers, coach one specific skill, run one quick role-play, and set next week's focus. Write a short note each time.</p>\n   <h2>Underperformance</h2>\n   <p>If someone misses targets for two weeks, put a clear written improvement plan in place with specific goals and a timeframe. If it is not met, move to removal. Removals are reviewed by leadership.</p>\n   <h2>Weekly Team Huddle</h2>\n   <p>Once a week, recap last week, set this week's target, give one reminder, run one role-play, and finish on energy.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>Final hiring of setters needs leadership sign-off, and hiring or removing buyers stays with leadership. Underperformance is handled with a written plan first, then a documented decision. This keeps people decisions fair and consistent.</div>\n   <div class=\"takeaways\"><h3>Key Takeaways</h3><ul>\n   <li>Interviews include a short role-play; a final setter offer needs leadership sign-off.</li>\n   <li>You can hire setters with sign-off; hiring or removing buyers and above stays with leadership.</li>\n   <li>Run weekly half-hour one-on-ones: numbers, one skill, one role-play, next focus, short note.</li>\n   <li>Underperformance gets a written improvement plan with goals and a timeframe before removal.</li>\n   <li>Removals are reviewed by leadership.</li>\n   <li>Run a weekly team huddle that ends on energy.</li>\n   </ul></div>","test":[{"q":"A final setter offer requires:","o":["Your decision alone","Leadership sign-off","HR only","A vote"],"a":1,"e":"A final setter offer requires leadership sign-off; your decision alone, HR-only, or a vote is not the process."},{"q":"Hiring or removing buyers and above is:","o":["Yours","Leadership's","HR's only","The team's"],"a":1,"e":"Hiring or removing buyers and above stays with leadership; it is not yours, HR's alone, or the team's."},{"q":"Interviews include:","o":["A written test only","A short role-play of a real call","A credit check","Nothing"],"a":1,"e":"Interviews include a short role-play of a real call; a written test alone, a credit check, or nothing misses live skill."},{"q":"Weekly one-on-ones are about:","o":["Two hours","Half an hour","Five minutes","All day"],"a":1,"e":"One-on-ones are about half an hour; two hours, five minutes, or all day is wrong for a focused check-in."},{"q":"A one-on-one covers:","o":["Only chat","Numbers, one skill, one role-play, next focus","Lunch","Nothing"],"a":1,"e":"It covers numbers, one skill, one role-play, and the next focus; only chat, lunch, or nothing wastes the time."},{"q":"Two weeks of missed targets triggers:","o":["Immediate removal","A written improvement plan with goals and a timeframe","A bonus","Nothing"],"a":1,"e":"Two weeks of misses triggers a written improvement plan; immediate removal skips the fair chance, a bonus rewards the miss, and nothing lets it continue."},{"q":"If the improvement plan is not met:","o":["Ignore it","Move to removal","Extend forever","Promote them"],"a":1,"e":"If the plan is not met, move to removal; ignoring it, extending forever, or promoting them defeats the plan."},{"q":"Removals are:","o":["Secret","Reviewed by leadership","Posted publicly","Skipped"],"a":1,"e":"Removals are reviewed by leadership; keeping them secret, posting publicly, or skipping review is wrong."},{"q":"After each one-on-one you:","o":["Forget it","Write a short note","Bill the person","Do nothing"],"a":1,"e":"Write a short note after each one-on-one; forgetting it, billing the person, or doing nothing loses the record."},{"q":"The weekly team huddle ends on:","o":["A lecture","Energy","Paperwork","Silence"],"a":1,"e":"End the huddle on energy; a lecture, paperwork, or silence drains the team."},{"q":"You can hire setters:","o":["Never","With leadership sign-off","Without any approval","Only buyers"],"a":1,"e":"You can hire setters with leadership sign-off; never, without any approval, or 'only buyers' is not the rule."},{"q":"Hiring or removing buyers and above:","o":["Is yours to do","Stays with leadership","Is HR's only","Is the team's"],"a":1,"e":"Stays with leadership: your authority covers setters, not buyers and above. It is not yours, not HR's alone, and not the team's call."},{"q":"A setter misses targets for two weeks. You:","o":["Remove them immediately","Put a written improvement plan in place with goals and a timeframe","Give a bonus","Do nothing"],"a":1,"e":"A written improvement plan with goals and a timeframe gives a fair, documented chance to recover. Immediate removal skips that, a bonus rewards the miss, and doing nothing lets it continue."},{"q":"The improvement plan is not met. You:","o":["Ignore it","Move to removal, reviewed by leadership","Extend it forever","Promote them"],"a":1,"e":"Move to removal, reviewed by leadership, since the documented chance was not met. Ignoring it or extending forever defeats the plan, and promoting an underperformer is backwards."},{"q":"A weekly one-on-one covers:","o":["Only small talk","Numbers, one skill, one role-play, next focus, and a short note","Lunch","Nothing"],"a":1,"e":"Numbers, one skill, one role-play, next focus, and a short note: a focused half hour. Small talk, lunch, or nothing wastes the coaching time."},{"q":"Underperformance is handled with:","o":["Instant firing","A written plan first, then a documented decision","Public shaming","Nothing"],"a":1,"e":"Handle underperformance with a written plan first, then a documented decision; instant firing, shaming, or inaction are wrong."},{"q":"Setter interviews should include:","o":["Only a resume scan","A short role-play to see how they handle a call","A personality quiz only","Nothing"],"a":1,"e":"Include a short role-play to see how they handle a call; a resume scan, a quiz alone, or nothing tells you little."},{"q":"You may hire setters:","o":["Never","With leadership sign-off","With no approval","Only buyers"],"a":1,"e":"You can hire setters with leadership sign-off; never, no approval, or buyers-only is wrong."},{"q":"Two setters apply. The factor that best separates them is:","o":["Their resume length","How they handle a short live call role-play","Their availability","Their hobbies"],"a":1,"e":"A short live call role-play best reveals fit, since the job is calls; resume length, availability, or hobbies are weaker signals."},{"q":"You want to let a buyer go for poor performance. That decision:","o":["Is yours to make alone","Belongs to leadership","Is a team vote","Is automatic after one bad week"],"a":1,"e":"Removing a buyer belongs to leadership; it is not yours alone, a vote, or automatic."},{"q":"A setter has missed targets for several weeks. Your first formal step is:","o":["Immediate termination","A written improvement plan","A public warning","Ignoring it"],"a":1,"e":"Start with a written improvement plan; immediate firing, public warnings, or inaction are not the process."},{"q":"You extended a setter offer before leadership signed off. This is:","o":["Fine if they are good","Out of process; the final offer needs sign-off first","Required","A team decision"],"a":1,"e":"It is out of process because the final offer needs leadership sign-off first; talent does not waive the rule."},{"q":"An applicant looks great on paper but fumbles the role-play call. You weigh:","o":["The paper over the call","The live call heavily, since the role is calls","Neither","Their references only"],"a":1,"e":"Weigh the live call heavily because the job is calls; paper alone or references do not show call skill."},{"q":"Documenting a termination decision protects:","o":["No one","Fairness and the business, with a consistent record","Only the employee","Only you"],"a":1,"e":"Documentation protects fairness and the business with a consistent record; it is not pointless or one-sided."}],"comp":"Have the trainee run a mock setter interview with a short role-play and explain that a final offer needs leadership sign-off and that buyer hiring stays with leadership. Pass only on the correct process."},{"id":"m3b.5","name":"Solo Office and Promotion","passMark":85,"lessonHTML":"\n   <div class=\"outcome\"><b>What you'll be able to do</b><br>After this module you know exactly what it takes to be certified as a Local Office Manager.</div>\n   <h2>Run the Office Solo</h2>\n   <p>Run the office on your own for two months, hitting the net result target both months, keeping the rating strong, and keeping records clean.</p>\n   <h2>The Promotion Gate</h2>\n   <ul>\n   <li>Enough consistent time in the role.</li>\n   <li>Two months hitting the net result target.</li>\n   <li>Healthy office margins.</li>\n   <li>A strong customer rating.</li>\n   <li>A healthy team (good pipeline habits across your setters).</li>\n   <li>No compliance issues.</li>\n   <li>You have begun training a possible successor.</li>\n   </ul>\n   <p>Leadership certifies based on the numbers.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>You cannot be promoted until you have started building the person who could replace you. The office grows only when each manager can train the next one.</div>\n   <div class=\"takeaways\"><h3>Key Takeaways</h3><ul>\n   <li>Run the office solo for two months hitting the net result target both months.</li>\n   <li>Keep a strong rating and clean records.</li>\n   <li>The gate also requires consistent time, healthy margins, a healthy team, and no compliance issues.</li>\n   <li>You must have begun training a possible successor.</li>\n   <li>Leadership certifies based on the numbers.</li>\n   </ul></div>","test":[{"q":"How long do you run the office solo for the gate?","o":["One week","Two months","Six months","A year"],"a":1,"e":"Run the office solo for two months; one week is too short, and six months or a year is more than required."},{"q":"The net result target must be hit:","o":["Once","Both months","Half the time","Never"],"a":1,"e":"The net result target must be hit both months; once, half the time, or never does not prove consistency."},{"q":"What must you begin before promoting?","o":["A new office","Training a possible successor","A new product","Nothing"],"a":1,"e":"Before promoting, begin training a successor, since the office grows by replication; a new office, a new product, or nothing is not the requirement."},{"q":"The customer rating must be:","o":["Ignored","Strong","Negative","Hidden"],"a":1,"e":"The customer rating must be strong; ignored, negative, or hidden fails the gate."},{"q":"A healthy team means:","o":["No team","Good pipeline habits across your setters","The most hires","No setters"],"a":1,"e":"A healthy team means good pipeline habits across your setters; no team, the most hires, or no setters is not health."},{"q":"Compliance issues allowed:","o":["A few","None","Some","Many"],"a":1,"e":"No compliance issues are allowed; a few, some, or many all fail."},{"q":"Records must be:","o":["Loose","Clean","Optional","Secret"],"a":1,"e":"Records must be clean; loose, optional, or secret records fail."},{"q":"Who certifies the promotion?","o":["A peer","Leadership","HR only","The team"],"a":1,"e":"Leadership certifies on the numbers; a peer, HR alone, or the team cannot."},{"q":"Why train a successor before promoting?","o":["Busywork","The office grows only when each manager can train the next","HR rule","No reason"],"a":1,"e":"Because the office grows only when each manager can train the next; it is not busywork, an HR rule, or for no reason."},{"q":"Office margins must be:","o":["Negative","Healthy","Ignored","Hidden"],"a":1,"e":"Office margins must be healthy; negative, ignored, or hidden margins fail."},{"q":"You run the office solo for:","o":["One week","Two months, hitting the net result target both months","Six months","A year"],"a":1,"e":"Two months, hitting target both months, proves repeatable performance. One week is too short to prove it, and six months or a year is longer than the standard requires."},{"q":"Before being promoted you must begin:","o":["A second office","Training a possible successor","A new product line","Nothing"],"a":1,"e":"Training a possible successor: the office grows only when each manager can train the next. A second office or product line is not the requirement, and 'nothing' ignores the rule."},{"q":"Certification requires:","o":["A single good day","Running the office solo with strong numbers","No solo run","One week"],"a":1,"e":"It requires a solo run with strong numbers; a single day, no run, or one week is not enough."},{"q":"Compliance issues allowed to certify:","o":["A few","None","Some","Many"],"a":1,"e":"None are allowed; a few, some, or many fail the gate."},{"q":"A clean solo run with strong numbers earns:","o":["Nothing","The office manager certification, with sign-off","A transfer","An automatic raise only"],"a":1,"e":"It earns the office manager certification with sign-off; not nothing, a transfer, or a raise alone."},{"q":"One good week is not enough because:","o":["It always is","Certification needs a sustained solo result","Leadership is unfair","Weeks do not count"],"a":1,"e":"Certification needs a sustained result, not one good week; the alternatives misstate the standard."},{"q":"A compliance violation during the solo run:","o":["Is fine","Fails the gate even with good numbers","Counts double","Is ignored"],"a":1,"e":"A violation fails the gate regardless of numbers; it is not fine, double-counted, or ignored."},{"q":"Certification needs:","o":["One good day","A sustained solo run with strong numbers","No solo run","A single deal"],"a":1,"e":"It needs a sustained solo run with strong numbers, not a day, no run, or one deal."},{"q":"The promotion is certified by:","o":["A peer","Leadership on the numbers","HR alone","The team"],"a":1,"e":"Leadership certifies on the numbers; a peer, HR alone, or the team cannot."},{"q":"A clean solo office run earns:","o":["Nothing","The office manager certification, with sign-off","A transfer","A raise only"],"a":1,"e":"It earns the office manager certification with sign-off, not nothing, a transfer, or a raise alone."},{"q":"A compliance violation during the run:","o":["Is fine","Fails the gate even with good numbers","Counts double","Is ignored"],"a":1,"e":"A violation fails the gate regardless of numbers."},{"q":"Your solo office stretch had great numbers but a compliance slip. Certification:","o":["Proceeds","Is blocked; compliance must be clean","Counts double","Is automatic"],"a":1,"e":"A compliance slip blocks certification until clean; strong numbers do not override it."},{"q":"Office manager certification is granted by:","o":["A peer","Leadership, on the numbers","HR alone","The team"],"a":1,"e":"Leadership grants it on the numbers; a peer, HR alone, or the team cannot."},{"q":"A single strong week is not enough; certification needs:","o":["One good day","A sustained solo result","A big single deal","Long tenure"],"a":1,"e":"It needs a sustained solo result, not one day, one deal, or tenure."}],"comp":"Verify the trainee has run the office solo with strong numbers and a clean compliance record. Pass only on verified real results."}]}];

const DRILL_PERSONAS=[
 {name:'Price Shopper',opening:"Yeah hi, what do you pay per gram for gold?",behavior:"You have real gold jewelry and a couple of gold coins worth well over 500 dollars, but you do not say what you have unless the rep asks good questions. You demand a price on the phone and you name other shops. You do NOT accept a firm dollar number; if the rep gives you one, you push for more and stay unsold. You only soften when the rep acknowledges your concern and tells you others ask the same. After you have pushed for a price about twice, you will accept a rough range, or an incentive like beating a written offer or a free silver eagle for coming in. You agree to come in only when the rep offers two specific times. If they dodge or pressure you, stay resistant."},
 {name:'Inherited Box (unsure)',opening:"Hi, my dad passed and left me a box of coins and some jewelry. I have no idea what any of it is or what it is worth.",behavior:"You genuinely do not know what you have, and it could be valuable or could be junk. You describe items poorly and you are a little emotional and worried about being taken advantage of. You warm up when the rep asks calm qualifying questions or asks you to text photos so they can tell you what you have. You agree to send photos or come in when the rep is reassuring and offers two specific times. You resist if the rep just quotes a price or rushes you."},
 {name:'Online Says More',opening:"I looked my coins up online and they are worth about 3000 dollars. Can you beat that?",behavior:"You have genuine collectible coins worth over 500 dollars. You quote online prices as fact and you are a little combative. You only come around when the rep explains that online shows asking prices, not what items actually sell for, and frames the shop as a collectors association that shows real value. You agree to come in when offered two specific times. You resist if the rep argues with you or just throws out a number."},
 {name:'Is This A Scam',opening:"Why will nobody just tell me a price? Is this some kind of scam?",behavior:"You have real silver and a few decent coins worth over 500 dollars, but you are guarded and distrustful. You calm down only when the rep gives an honest reason that a price on unseen items is just a guess, and that in person their experts give a real price. You agree to come in when the rep is transparent and offers two specific times. You stay cold if the rep is evasive or pushy."},
 {name:'Wants Retail',opening:"Another place offered me more, and honestly I think my stuff is worth way more than that.",behavior:"You have a genuinely valuable collectible worth well over 500 dollars and you expect close to retail. You have already been pushing on price. You only get satisfied when the rep stops haggling on cash and offers consignment: selling it at auction for full value with the reserve floor set at the shop's cash price, so you cannot get less, only more. You agree to come in to see both numbers when offered two specific times. You stay unhappy if the rep just repeats a low cash number."},
 {name:'Junk Caller',opening:"I have a whole jewelry box of stuff, necklaces and rings, lots of it. Can you tell me what it is worth?",behavior:"Your items are costume and plated jewelry and common coins, worth very little, well under 500 dollars, but you think they might be valuable. The RIGHT outcome here is NOT an in-person appointment. You respond well when the rep asks for photos, gently tells you what the items actually are, and offers a free education packet on what to look for. You are happy to leave a positive review only if the rep was genuinely helpful and you feel good about it. You should NOT be booked for a visit, and if the rep pushes hard to schedule you in person, that is the wrong move and you can sense the time-waste. You are satisfied by the help and the packet, not by a sale."}
];

/* In-person table sellers for the closer drill (m2.4). Each carries hidden grading notes the rep never sees. */
const CLOSER_PERSONAS=[
 {name:'Multi-Offer Shopper',opening:"Hey, how's it going? I brought in some gold jewelry and a few coins to see what they're worth.",
  behavior:"You just walked in and set your items on the table. Start friendly and normal. As the rep goes through the items and asks questions, answer honestly: you took them out recently and a couple other shops already looked at them, short drive, you heard about them online, and you know a bit about this stuff. Do NOT lead with objections. Only AFTER the rep evaluates and gives you a number do you start pushing: ask what they pay per gram, per ounce, or per lot, say another shop offered more, ask if they can do a little better, and ask to see their internal sheet. You walk if the first offer is insulting. You commit when the rep builds trust, justifies the value, lands a fair number, or pivots the high pieces to consignment.",
  grading:"Items roughly 3000 to 4000 dollars, mostly gold scrap (90 percent cap off spot) plus a few raw collectible coins (80 percent cap off eBay sold). Signals: knowledgeable, recently shopped, short drive, online, so a SHARP seller. Opening at the 30 percent floor loses the deal and must be docked; the opener should be higher, around 55 to 65 percent. Ideal landing band is roughly 70 to 80 percent given the competition, never over the caps. Dock: exceeding caps or releasing the internal sheet. Best path: cash the gold near band, pivot the collectible coins to Jason on consignment."},
 {name:'Inherited Collection',opening:"Hi, thanks for seeing me. These were my father's, I brought the whole box in. I honestly don't know what any of it is.",
  behavior:"You just walked in and set down a box of coins and jewelry. You are unsure and a little sentimental. As the rep looks through it and asks questions, answer honestly: you do not need money urgently, you are not a collector, your kids are not interested, you have not had it looked at recently, you drove a fair distance. You are not knowledgeable. You respond to trust, patience, and being told honestly what things are. Later you may say you want to pass it down, or that you will think about it. You can be moved to a cash sale or consignment if treated with care.",
  grading:"Items roughly 2000 to 6000 dollars, mixed metals and raw coins. Signals: low knowledge, low urgency, some sentiment, fair drive, not a collector, so a SOFT, unaware seller. Opening can be lower, around 35 to 45 percent, and still close. Ideal landing band 45 to 60 percent. The main leak to DOCK is OVERPAYING (paying near the caps when signals say they would take far less). Also dock failing to handle pass-it-down, or being pushy and losing trust. Best path: clean cash buy well under cap, or consignment on the better coins."},
 {name:'Walk-In With Junk',opening:"Hi there, I've got a bag of old jewelry and coins here, wasn't sure if any of it's worth anything.",
  behavior:"You just walked in and emptied a bag onto the table. Most items are plated, costume, or common low-value coins, maybe one small real piece. You think it might be worth a lot. You answer questions and are not knowledgeable. The right outcome is honesty: the rep looks through it, kindly tells you what is real and what is not, makes a small fair offer on anything real, and does not run a full closing pitch on junk. You are satisfied by honesty and good treatment.",
  grading:"Items mostly junk, real value under 200 dollars. Correct move is fast, honest triage and a small fair offer or a polite no, NOT the full Show Sales close and NOT overpaying. Dock: running the full high-pressure close on junk, overpaying for costume or plated as if real, or being dismissive. Best path: quick honest read, small fair cash on anything real, keep goodwill."},
 {name:'Whale',opening:"Good to meet you. I brought a sample of my collection in to see how you operate, there's a lot more where this came from.",
  behavior:"You just walked in and laid out a sample of high-value items. The full collection is easily over 100k. You are knowledgeable, value your time, and want to be treated as a serious seller. As the rep handles the items, you probe whether they can handle volume and get top dollar. You are not desperate. You respond to authority, the auction upside, and being introduced to the right person. You expect near retail and push back on a pure cash lowball.",
  grading:"Sample is high value, full collection over 100k, so the consignment fee is WAIVED over 100k. Signals: knowledgeable, high value, low urgency, serious, so a CONSIGNMENT-FIRST deal. The win is NOT a cash lowball, it is hyping auction upside, mentioning the 10 percent and that it is waived over 100k, and a warm transfer to Jason. Dock: trying to cash-buy the whole thing cheap, missing the consignment pivot, or failing the warm transfer. Best path: cash the bullion fairly, consign the collectibles, transfer to Jason."},
 {name:'Emotional Seller',opening:"Hi... sorry, this is a little hard for me. I brought some things in that I think I need to sell.",
  behavior:"You just walked in and carefully set your items down. You are attached and a little distressed. You may need the money (some urgency) but it hurts to let go. You answer the rep's questions but get emotional about where the items came from. You respond to empathy and patience, not pressure. Pushing too hard makes you shut down and want to keep them or pass them down. Handled with care, you will sell.",
  grading:"Items moderate value. Signals: high attachment, some urgency, low knowledge. The skill tested is trust and empathy under emotion, plus not overpaying out of sympathy. Ideal landing band mid range. Dock: high-pressure tactics that break trust, overpaying because of the emotion, or fumbling the pass-it-down stall. Best path: empathetic close at a fair under-cap number, or a gentle consignment option."},
 {name:'Dealer',opening:"Hey. I'm in the trade myself, brought a few things by. Let's take a look at what you've got room on.",
  behavior:"You just walked in, sat down, and laid out your items. You are a knowledgeable dealer who knows melt, spot, and grades cold. You have little patience for a retail pitch or a long round of qualifying questions; you want a fast, fair wholesale number. You call out any lowball instantly and will get up and leave. You do not need trust-building or the authority pitch, you need a sharp, accurate number near the top of the band.",
  grading:"Items priced near melt and spot, dealer knows exact value. Signals: maximum knowledge, low attachment, the SHARPEST seller. Opening at 30 percent is an instant lost deal. Ideal landing is near the category caps. Skill tested: pricing accuracy and speed, dropping the retail script, protecting thin margin. Dock: running the full Show Sales Framework on a dealer (wastes their time), lowballing, or paying ABOVE cap to win. Best path: fast accurate near-cap wholesale, or pass if no margin."}
];

 'm1.3':{script:'Appointment Setter phone call',beats:[
   {key:'acknowledge',label:'Acknowledged the concern or what the caller has, without arguing'},
   {key:'associate',label:'Normalized it (others ask the same, or past customers had a good experience)'},

   {key:'price_discipline',label:'No firm dollar figure on unseen items, a range only after two price pushes, and priced junk only after photos'},
   {key:'ask_close',label:'Asked for the next step and, when booking, closed on two specific times, confirmed the appointment, and got a photo'}
 ]},

   {key:'authority',label:'Positioned GSA (largest auction houses, thousands of transactions, 400-plus collectors, we do the work for you)'},

function hasExplain(id){return !!EXPLAIN[id];}
function explainPassedIdx(p,id){return (p&&p.explain&&p.explain[id]&&Array.isArray(p.explain[id].passed))?p.explain[id].passed:[];}
function explainCleared(p,id){return explainPassedIdx(p,id).length>=EXPLAIN_QUOTA;}
function explainReady(p,id){return !hasExplain(id)||explainCleared(p,id);}
function flatModules(){const l=[];CURRICULUM.forEach(t=>t.modules.forEach(m=>l.push({tier:t,mod:m})));return l;}
function tierById(id){return CURRICULUM.find(t=>t.id===id);}
function tierPool(t){let p=[];t.modules.forEach(m=>{p=p.concat(m.test);});return p;}
function isTestPassed(p,id){const r=p.modules[id];return !!(r&&r.status==='passed');}
function isCertified(p,id){const r=p.modules[id];return !!(r&&r.status==='passed'&&r.signoff);}
function modulesAllPassed(p,tid){const t=tierById(tid);return t.modules.every(m=>isCertified(p,m.id));}
function finalPassed(p,tid){return !!(p.finals&&p.finals[tid]&&p.finals[tid].passed);}
function tierComplete(p,tid){return modulesAllPassed(p,tid)&&finalPassed(p,tid);}
function programComplete(p){return tierComplete(p,'tier1')&&tierComplete(p,'tier2')&&(tierComplete(p,'tier3a')||tierComplete(p,'tier3b'));}
function finalStatus(p,tid){if(!modulesAllPassed(p,tid))return'locked';return finalPassed(p,tid)?'passed':'available';}
function certifyModule(p,id,by){
  const rec=p.modules[id]||{status:'available',best:0,attempts:0};
  if(rec.status!=='passed')rec.status='passed';
  rec.signoff={by:by,at:Date.now()};
  p.modules[id]=rec;p.log=p.log||[];
  p.log.push({type:'signoff',id:id,by:by,ts:Date.now()});
  ensureCompletion(p);persist(p);
}

function computeStatus(p){
  const s={};
  CURRICULUM.forEach(t=>t.modules.forEach(m=>{
    if(isCertified(p,m.id))s[m.id]='certified';
    else if(isTestPassed(p,m.id)&&explainReady(p,m.id))s[m.id]='awaiting';
    else if(isTestPassed(p,m.id))s[m.id]='available';
    else s[m.id]='locked';
  }));
  function openTier(mods,gateOk){
    if(gateOk&&s[mods[0].id]==='locked')s[mods[0].id]='available';
    for(let i=0;i<mods.length-1;i++){
      if(s[mods[i].id]==='certified'&&s[mods[i+1].id]==='locked')s[mods[i+1].id]='available';
    }
  }
  openTier(tierById('tier1').modules,true);
  openTier(tierById('tier2').modules,tierComplete(p,'tier1'));
  openTier(tierById('tier3a').modules,tierComplete(p,'tier2'));
  openTier(tierById('tier3b').modules,tierComplete(p,'tier2'));
  return s;
}
function stats(p){const total=flatModules().length;let passed=0;CURRICULUM.forEach(t=>t.modules.forEach(m=>{if(isCertified(p,m.id))passed++;}));return{passed,total,pct:Math.round(passed/total*100)};}

/* ---- trainee data ---- */
function getTrainees(){return load(STORE.trainees,{});}
function saveTrainees(t){save(STORE.trainees,t);}
function currentName(){return load(STORE.current,null);}
function normalize(p){if(!p)return p;p.modules=p.modules||{};p.finals=p.finals||{};p.signoff=p.signoff||{tier3a:false,tier3b:false};p.log=p.log||[];p.drills=p.drills||{};p.explain=p.explain||{};if(!p.lastActivity)p.lastActivity=p.created||Date.now();return p;}
function currentProgress(){const t=getTrainees();const n=currentName();return n&&t[n]?normalize(t[n]):null;}
function persist(p){const t=getTrainees();t[p.name]=p;saveTrainees(t);}
function newTrainee(n){return{name:n,created:Date.now(),lastActivity:Date.now(),modules:{},finals:{},signoff:{tier3a:false,tier3b:false},completedAt:null,log:[]};}
function ensureCompletion(p){if(programComplete(p)&&!p.completedAt){p.completedAt=Date.now();persist(p);}}
function stalled(p){return !programComplete(p)&&(Date.now()-(p.lastActivity||p.created))>STALL_DAYS*86400000;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(ts){if(!ts)return'';const d=new Date(ts);return d.toLocaleDateString()+' '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}

function doLogin(){
  const name=(document.getElementById('nameInput').value||'').trim();
  if(name.length<2){alert('Please enter your name.');return;}
  const t=getTrainees();if(!t[name]){t[name]=newTrainee(name);}else{normalize(t[name]);t[name].lastActivity=Date.now();}
  saveTrainees(t);save(STORE.current,name);renderTopbar();renderDashboard();
}

function renderDashboard(){
  const p=currentProgress();if(!p){renderLogin();return;}
  ensureCompletion(p);
  const status=computeStatus(p);const st=stats(p);
  const certBtn=programComplete(p)?`<button class="btn btn-gold" onclick="renderCertificate()">View Certificate</button>`:'';
  let html=`<div class="fade"><div class="dash-head"><h1>Your Ladder</h1>
    <div style="display:flex;gap:10px;flex-wrap:wrap">${certBtn}
      <button class="btn btn-ghost" onclick="renderFlashcards()">Key Dates Drill</button>
      <button class="btn btn-ghost" onclick="renderCheatSheet()">Reference Card</button></div></div>
    <div class="progress-meta"><b>${st.passed}</b> of <b>${st.total}</b> modules complete, <b>${st.pct}%</b> through the program</div>`;
  CURRICULUM.forEach(t=>{
    const tp=t.modules.filter(m=>status[m.id]==='certified').length;
    const fin=finalStatus(p,t.id);
    let tierTag='';
    if(tierComplete(p,t.id))tierTag=`<span class="mod-status st-passed">${(t.id==='tier3a'||t.id==='tier3b')?'CERTIFIED':'COMPLETE'}</span>`;
    html+=`<div class="tier"><div class="tier-head">
      <div class="tier-num">${t.n}</div>
      <div><div class="tier-title">${t.name}</div><div class="tier-sub">${t.sub}</div></div>
      <div class="tier-prog" style="display:flex;align-items:center;gap:10px">${tierTag}<span>${tp}/${t.modules.length} modules</span></div></div><div class="modules">`;
    t.modules.forEach((m,idx)=>{
      const s=status[m.id];const rec=p.modules[m.id];
      const cssState=s==='certified'?'passed':(s==='awaiting'?'awaiting':s);
      const dot=s==='certified'?'&#10003;':(s==='awaiting'?'&#9203;':(s==='available'?(idx+1):'&#128274;'));
      const label=s==='certified'?`<span class="mod-status st-passed">CERTIFIED ${rec?rec.best:''}%</span>`
        :(s==='awaiting'?`<span class="mod-status st-await">AWAITING SIGN-OFF</span>`
        :(s==='available'?`<span class="mod-status st-available">START</span>`:`<span class="mod-status st-locked">LOCKED</span>`));
      const click=(s!=='locked')?`onclick="openModule('${m.id}')"`:'';
      const shown=Math.min(m.test.length,SHOW_CAP);
      html+=`<div class="mod ${cssState}" ${click}><div class="mod-dot">${dot}</div>
        <div class="mod-body"><div class="mod-name">${m.name}</div>
        <div class="mod-meta">Pass mark ${m.passMark}%, ${shown} questions${rec&&rec.attempts?`, ${rec.attempts} attempt${rec.attempts>1?'s':''}`:''}</div></div>
        ${label}</div>`;
    });
    // final exam row
    const frec=p.finals[t.id];
    const fdot=fin==='passed'?'&#10003;':(fin==='available'?'&#9733;':'&#128274;');
    const flabel=fin==='passed'?`<span class="mod-status st-passed">PASSED ${frec?frec.best:''}%</span>`
      :(fin==='available'?`<span class="mod-status st-available">FINAL EXAM</span>`:`<span class="mod-status st-locked">LOCKED</span>`);
    const fclick=(fin!=='locked')?`onclick="startFinal('${t.id}')"`:'';
    const fpoolN=Math.min(tierHardPool(t).length,FINAL_COUNT);
    html+=`<div class="mod ${fin} ${fin==='available'?'available':''}" ${fclick} style="margin-top:8px;border-top:1px dashed var(--line);border-radius:0 0 12px 12px"><div class="mod-dot">${fdot}</div>
      <div class="mod-body"><div class="mod-name">Tier Final Exam</div>
      <div class="mod-meta">Pass all modules to unlock. ${fpoolN} harder, scenario-based questions, pass ${FINAL_PASS}%, fresh set each attempt${frec&&frec.attempts?`, ${frec.attempts} attempt${frec.attempts>1?'s':''}`:''}</div></div>
      ${flabel}</div>`;
    html+=`</div></div>`;
  });
  html+=`</div>`;app.innerHTML=html;window.scrollTo(0,0);
}

function findModule(id){for(const t of CURRICULUM){const m=t.modules.find(x=>x.id===id);if(m)return{tier:t,mod:m};}return null;}
/* ---- AI drill engine ---- */
let drillState=null;
function drillAPI(mode,body){
  const c=getDrillCfg();
  return fetch(c.url,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(Object.assign({passcode:c.pass,mode},body))})
    .then(r=>{if(!r.ok)return r.text().then(t=>{throw new Error('Server '+r.status+(t?': '+t.slice(0,120):''));});return r.json();});
}
function voiceSupported(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition);}
function startDrill(id){
  if(!moduleDrill(id))return;
  if(!drillReady()){alert('The AI practice drill is not set up yet. An administrator can add the practice server in Administrator settings.');return;}
  const rub=moduleDrill(id);
  const personas=modulePersonas(id);
  const persona=personas[Math.floor(Math.random()*personas.length)];
  drillState={id,rub,persona,script:rub.script,setting:moduleSetting(id),focused:false,voice:false,busy:false,
    msgs:[{who:'cust',text:persona.opening}]};
  renderDrillChat();
}
function renderObjectionBank(id){
  const objs=moduleObjections(id);if(!objs)return;
  let cards=objs.map(o=>`<div class="standard" style="margin-top:0;margin-bottom:14px">
    <b>${esc(o.name)}</b>
    <div style="margin:8px 0;color:var(--cream-dim)">Customer: "${esc(o.line)}"</div>
    <div class="dmodel"><b>Model response:</b> ${esc(o.model)}</div>
    <div class="lesson-note" style="margin-top:6px">Principle: ${esc(o.principle)}</div>
    <button class="btn btn-gold" style="margin-top:10px" onclick="startObjectionDrill('${id}','${o.id}')">Drill this one</button>
  </div>`).join('');
  app.innerHTML=`<div class="fade"><div class="admin-head"><div><div class="crumb">Objection mastery</div><h1>Objection Drills</h1></div>
    <button class="btn btn-gold" onclick="openModule('${id}')">Back</button></div>
    <div class="standard" style="margin-top:0">Study the model line, then drill the objection one at a time until it is automatic. The AI customer will keep hitting you with this one objection until you handle it cleanly.</div>
    ${cards}</div>`;
  window.scrollTo(0,0);
}
function startObjectionDrill(id,objId){
  if(!drillReady()){alert('The AI practice drill is not set up yet. Ask an administrator to connect the practice server.');return;}
  const o=(moduleObjections(id)||[]).find(x=>x.id===objId);if(!o)return;
  const persona={name:o.name,opening:o.line,behavior:o.behavior};
  drillState={id,objId,rub:{script:'Objection: '+o.name,beats:o.rubric},persona,script:'Objection: '+o.name,setting:moduleSetting(id),focused:true,voice:false,busy:false,
    msgs:[{who:'cust',text:o.line}]};
  renderDrillChat();
}
function startBeatDrill(id,beatKey){
  if(!drillReady())return;
  const rub=moduleDrill(id);if(!rub)return;
  const beat=rub.beats.find(b=>b.key===beatKey);if(!beat)return;
  const personas=modulePersonas(id);
  const persona=personas[Math.floor(Math.random()*personas.length)];
  drillState={id,rub:{script:'Focus drill: '+beat.label,beats:[beat]},persona,script:'Focus drill',setting:moduleSetting(id),focused:true,voice:false,busy:false,
    msgs:[{who:'cust',text:persona.opening}]};
  renderDrillChat();
}
function drillBubble(m){
  const me=m.who==='rep';
  return `<div class="dbubble ${me?'drep':'dcust'}"><div class="dwho">${me?'You':'Customer'}</div><div>${esc(m.text)}</div></div>`;
}
function renderDrillChat(){
  const s=drillState;const {mod}=findModule(s.id);
  const vbtn=voiceSupported()?`<button class="btn btn-ghost" id="vtoggle" onclick="drillToggleVoice()">Voice: ${s.voice?'On':'Off'}</button>`:'';
  const mic=(voiceSupported()&&s.voice)?`<button class="btn btn-ghost" id="micbtn" onclick="drillMic()">${s.listening?'Listening, tap to stop':'Tap to talk'}</button>`:'';
  app.innerHTML=`<div class="fade">
    <div class="admin-head"><div><div class="crumb">${esc(s.script)}</div><h1>${s.setting==='in_person'?'Practice Sit-Down':'Practice Call'}</h1></div>
      <button class="btn btn-gold" onclick="drillExit()">Exit</button></div>
    <div class="standard" style="margin-top:0">${s.setting==='in_person'?'A customer just walked in and their items are on the table in front of you. Greet them and run the Show Sales Framework, then end the session to get scored on the checklist.':'A live customer is on the line. Run the phone framework. When you are done, end the call to get scored on the exact checklist your real calls are graded on.'} ${vbtn}</div>
    <div id="dscroll" class="dchat">${s.msgs.map(drillBubble).join('')}${s.busy?'<div class="dbubble dcust"><div class="dwho">Customer</div><div class="dtyping">...</div></div>':''}</div>
    <div class="dinrow">
      <textarea id="dinput" class="dinput" rows="2" placeholder="Type or tap to talk your full response, then Send. Shift+Enter for a new line." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();drillSend();}"></textarea>
      ${mic}
      <button class="btn btn-gold" id="dsend" onclick="drillSend()" ${s.busy?'disabled':''}>Send</button>
    </div>
    <div style="margin-top:14px"><button class="btn btn-ghost" onclick="drillEnd()">End call and score me</button></div>
    <div id="derr" class="lesson-note" style="color:#e0a06a"></div>
  </div>`;
  const sc=document.getElementById('dscroll');if(sc)sc.scrollTop=sc.scrollHeight;
  const di=document.getElementById('dinput');if(di&&!s.busy)di.focus();
}
function drillToggleVoice(){drillState.voice=!drillState.voice;if(!drillState.voice&&drillState.listening){drillState.listening=false;try{drillRec&&drillRec.stop();}catch(e){}drillRec=null;}renderDrillChat();}
function drillSpeak(t){try{if(drillState&&drillState.voice&&window.speechSynthesis){const u=new SpeechSynthesisUtterance(t);u.rate=1.02;window.speechSynthesis.speak(u);}}catch(e){}}
let drillRec=null;
function drillStartRec(){
  const s=drillState;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR||!s)return;
  const rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
  drillRec=rec;
  rec.onresult=e=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)s.dictFinal+=r[0].transcript+' ';else interim+=r[0].transcript;}
    const di=document.getElementById('dinput');if(di)di.value=(s.dictBase+s.dictFinal+interim).replace(/\s+/g,' ').replace(/^\s+/,'');
  };
  rec.onend=()=>{if(s.listening){try{drillStartRec();}catch(e){}}};
  rec.onerror=()=>{};
  try{rec.start();}catch(e){}
}
function drillMic(){
  const s=drillState;if(!s)return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
  const b=document.getElementById('micbtn');
  if(s.listening){s.listening=false;try{drillRec&&drillRec.stop();}catch(e){}drillRec=null;if(b)b.textContent='Tap to talk';return;}
  const di=document.getElementById('dinput');
  s.dictBase=(di&&di.value)?di.value.replace(/\s+$/,'')+' ':'';
  s.dictFinal='';s.listening=true;
  if(b)b.textContent='Listening, tap to stop';
  drillStartRec();
}
function drillSend(){
  const s=drillState;if(!s||s.busy)return;
  if(s.listening){s.listening=false;try{drillRec&&drillRec.stop();}catch(e){}drillRec=null;}
  const di=document.getElementById('dinput');const text=(di?di.value:'').trim();if(!text)return;
  s.msgs.push({who:'rep',text});s.busy=true;renderDrillChat();
  const api=s.msgs.slice(1).map(m=>({role:m.who==='rep'?'user':'assistant',content:m.text}));
  drillAPI('chat',{persona:s.persona,opening:s.persona.opening,script:s.script,setting:s.setting,messages:api,maxTokens:500})
    .then(r=>{const reply=(r&&r.reply)?r.reply:'(no response)';s.msgs.push({who:'cust',text:reply});s.busy=false;renderDrillChat();drillSpeak(reply);})
    .catch(err=>{s.busy=false;renderDrillChat();const ee=document.getElementById('derr');if(ee)ee.textContent='Could not reach the practice server. '+err.message;});
}
function drillTranscript(s){return s.msgs.map(m=>(m.who==='rep'?'Rep: ':'Customer: ')+m.text).join('\n');}
function drillEnd(){
  const s=drillState;if(!s)return;
  const repTurns=s.msgs.filter(m=>m.who==='rep').length;
  if(repTurns===0){const ee=document.getElementById('derr');if(ee)ee.textContent='Say at least one thing before ending the call.';return;}
  app.innerHTML=`<div class="fade"><h1>Scoring your call...</h1><div class="standard">Grading against the ${esc(s.script)} checklist.</div></div>`;
  drillAPI('score',{script:s.script,rubric:s.rub.beats,transcript:drillTranscript(s),context:(s.persona&&s.persona.grading)?s.persona.grading:''})
    .then(r=>{logDrill(s.id,r,s.focused);renderDrillScore(r);})
    .catch(err=>{app.innerHTML=`<div class="fade"><h1>Scoring failed</h1><div class="standard">${esc(err.message)}</div><button class="btn btn-gold" onclick="renderDrillChat()">Back to the call</button></div>`;});
}
function logDrill(id,r,focused){
  if(previewMode)return;
  const p=currentProgress();if(!p)return;
  p.drills=p.drills||{};const sc=Math.max(0,Math.min(100,Number(r.score)||0));
  const d=p.drills[id]||{best:0,attempts:0,focusedAttempts:0,last:0,beatStats:{}};
  d.beatStats=d.beatStats||{};
  (Array.isArray(r.beats)?r.beats:[]).forEach(b=>{
    if(!b||!b.key)return;const bs=d.beatStats[b.key]||{hit:0,total:0};bs.total++;
    const v=(b.status==='hit')?1:(b.status==='partial')?0.5:(b.hit?1:0);bs.hit+=v;d.beatStats[b.key]=bs;
  });
  if(focused){d.focusedAttempts=(d.focusedAttempts||0)+1;}
  else{d.attempts=(d.attempts||0)+1;d.best=Math.max(d.best||0,sc);d.last=sc;d.lastAt=Date.now();}
  p.drills[id]=d;
  p.log=p.log||[];p.log.push({type:'drill',id,score:sc,focused:!!focused,ts:Date.now()});
  p.lastActivity=Date.now();persist(p);
}
function weakestBeat(p,id){
  const rub=moduleDrill(id);if(!rub||!p.drills||!p.drills[id]||!p.drills[id].beatStats)return null;
  const stats=p.drills[id].beatStats;let worst=null;
  rub.beats.forEach(b=>{const s=stats[b.key];if(s&&s.total>=2){const ratio=s.hit/s.total;if(!worst||ratio<worst.ratio)worst={key:b.key,label:b.label,ratio};}});
  return (worst&&worst.ratio<1)?worst:null;
}
function quotaMet(p,id){const q=drillQuota(id);const d=(p.drills&&p.drills[id])?p.drills[id]:null;return !!(d&&d.attempts>=q.reps&&d.best>=q.score);}
function quotaLine(p,id){const q=drillQuota(id);const d=(p.drills&&p.drills[id])?p.drills[id]:{attempts:0,best:0};
  const met=quotaMet(p,id);
  return `${met?'<span class="pill pill-g">quota met</span>':'<span class="pill pill-l">quota not met</span>'} ${d.attempts||0} of ${q.reps} full reps, best ${d.best||0} (target ${q.score})`;}
function renderDrillScore(r){
  const s=drillState;const sc=Math.max(0,Math.min(100,Number(r.score)||0));
  const beats=Array.isArray(r.beats)?r.beats:[];
  const model=Array.isArray(r.model)?r.model:[];
  const modelFor=k=>{const m=model.find(x=>x.key===k);return m?m.line:'';};
  let rows=s.rub.beats.map(b=>{
    const got=beats.find(x=>x.key===b.key)||{};
    const status=got.status||(got.hit?'hit':'miss');
    const ev=got.evidence?`<div class="lesson-note">${esc(got.evidence)}</div>`:'';
    const fix=(status!=='hit'&&modelFor(b.key))?`<div class="dmodel"><b>What great sounds like:</b> ${esc(modelFor(b.key))}</div>`:'';
    const pill=status==='hit'?'<span class="pill pill-g">hit</span>':(status==='partial'?'<span class="pill pill-a">partial</span>':'<span class="pill pill-l">miss</span>');
    return `<tr><td style="width:42px">${pill}</td><td>${esc(b.label)}${ev}${fix}</td></tr>`;
  }).join('');
  const ring=sc>=85?'#7fd3a5':(sc>=70?'#d9b84a':'#e0a06a');
  const p=currentProgress();
  const weak=(p&&!s.focused)?weakestBeat(p,s.id):null;
  const weakBlock=weak?`<div class="dmodel" style="margin-top:14px"><b>Your weakest skill so far:</b> ${esc(weak.label)}. <button class="btn btn-ghost" style="margin-left:8px;padding:4px 10px;font-size:12px" onclick="startBeatDrill('${s.id}','${weak.key}')">Drill just this</button></div>`:'';
  const rerun=s.focused
    ? (s.objId?`<button class="btn btn-gold" onclick="startObjectionDrill('${s.id}','${s.objId}')">Run this objection again</button>`
              :`<button class="btn btn-gold" onclick="startBeatDrill('${s.id}','${(s.rub.beats[0]||{}).key}')">Run again</button>`)
    : `<button class="btn btn-gold" onclick="startDrill('${s.id}')">Run another (new customer)</button>`;
  app.innerHTML=`<div class="fade"><div class="admin-head"><h1>${s.focused?'Drill Scored':'Call Scored'}</h1>
    <button class="btn btn-gold" onclick="drillExit()">Back to module</button></div>
    <div class="dscorehead"><div class="dscorenum" style="color:${ring}">${sc}</div><div><div style="font-weight:700">${esc(s.script)}</div><div class="lesson-note">${s.focused?'Focused drill':'Customer type this round: '+esc(s.persona.name)}</div></div></div>
    ${r.coaching?`<div class="standard"><b>Coach's note:</b> ${esc(r.coaching)}</div>`:''}
    <div class="table-wrap"><table>${rows}</table></div>
    ${weakBlock}
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
      ${rerun}
      <button class="btn btn-ghost" onclick="drillExit()">Done</button></div></div>`;
  window.scrollTo(0,0);
}
function drillExit(){const id=drillState?drillState.id:null;if(drillState&&drillState.listening){drillState.listening=false;try{drillRec&&drillRec.stop();}catch(e){}drillRec=null;}drillState=null;try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){}if(id)openModule(id);else goDash();}

/* ---- Explain-it-out-loud drill ---- */
let explainState=null, explainRec=null;
function startExplain(id){
  if(!hasExplain(id))return;
  if(!drillReady()){alert('The AI practice server is not set up yet. An administrator can add it in Administrator settings.');return;}
  const data=EXPLAIN[id];
  const p=previewMode?null:currentProgress();
  const passed=explainPassedIdx(p,id);
  const order=shuffle(data.prompts.map((_,i)=>i));
  let idx=order.find(i=>passed.indexOf(i)===-1);if(idx===undefined)idx=order[0];
  explainState={id,data,idx,busy:false,listening:false,dictBase:'',dictFinal:''};
  renderExplain();
}
function renderExplain(){
  const s=explainState;if(!s)return;
  const p=previewMode?null:currentProgress();
  const count=explainPassedIdx(p,s.id).length;
  const {tier,mod}=findModule(s.id);
  const v=voiceSupported();
  app.innerHTML=`<div class="fade">
    <div class="admin-head"><div><div class="crumb">${esc(tier.name)} ${previewMode?'(preview)':''}</div><h1>Explain: ${esc(mod.name)}</h1></div>
    <button class="btn btn-ghost" onclick="explainExit()">Back to module</button></div>
    <div class="passbar">${previewMode?'Preview mode: nothing is recorded. ':''}Pass ${EXPLAIN_QUOTA} different questions at ${explainPass()} or higher. ${count} of ${EXPLAIN_QUOTA} passed.</div>
    <div class="standard" style="margin-top:0"><b>Your question</b><br>${esc(s.data.prompts[s.idx])}</div>
    <div class="lesson-note" style="margin:8px 2px">Explain it in your own words. Plain language is fine; you do not need the exact wording.</div>
    <textarea id="einput" rows="6" style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card,#fff);color:inherit;font:inherit" placeholder="Speak or type your explanation here..."></textarea>
    <div id="eerr" class="lesson-note" style="color:#e0a06a;min-height:16px;margin:6px 2px"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">
      ${v?`<button class="btn btn-ghost" id="emic" onclick="explainMic()">Tap to talk</button>`:''}
      <button class="btn btn-ghost" onclick="explainNew()">New question</button>
      <button class="btn btn-gold" onclick="explainSubmit()">Submit my explanation</button>
    </div></div>`;
  window.scrollTo(0,0);
}
function explainNew(){
  const s=explainState;if(!s)return;
  if(s.listening){s.listening=false;try{explainRec&&explainRec.stop();}catch(e){}explainRec=null;}

/* ---- certified counters ---- */
function certCounts(){
  const tr=getTrainees();let c={t1:0,t2:0,a:0,b:0,full:0,stalled:0,total:0};
  Object.values(tr).forEach(raw=>{const p=normalize(raw);c.total++;
    if(tierComplete(p,'tier1'))c.t1++;
    if(tierComplete(p,'tier2'))c.t2++;
    if(tierComplete(p,'tier3a'))c.a++;
    if(tierComplete(p,'tier3b'))c.b++;
    if(programComplete(p))c.full++;
    if(stalled(p))c.stalled++;});
  return c;
}
function traineeRowData(p){
  const status=computeStatus(p);
  const passed=Object.values(p.modules).filter(m=>m.status==='passed').length;
  const total=flatModules().length;
  let cur='None';for(const t of CURRICULUM){let f=false;for(const m of t.modules){if(status[m.id]==='available'){cur=m.name;f=true;break;}}if(f)break;if(finalStatus(p,t.id)==='available'){cur=t.name+' Final Exam';break;}}
  if(programComplete(p))cur='Program complete';
  const att=(p.log||[]).length;
  const last=(p.log&&p.log.length)?p.log[p.log.length-1].score+'%':'None';
  return {passed,total,cur,att,last};
}

function csvFor(p){

  CURRICULUM.forEach(t=>{t.modules.forEach(m=>{const rec=p.modules[m.id];
    const lastE=(p.log||[]).filter(e=>e.type==='module'&&e.id===m.id).slice(-1)[0];
    const st=isCertified(p,m.id)?'certified':(isTestPassed(p,m.id)?(explainReady(p,m.id)?'awaiting sign-off':'explain pending'):'locked');
    const by=rec&&rec.signoff?rec.signoff.by:'';
    const at=rec&&rec.signoff?fmtDate(rec.signoff.at):'';
    rows.push(['Module',m.name,st,rec?rec.best+'%':'',rec?rec.attempts:0,lastE?fmtDate(lastE.ts):'',by,at]);});
    const fr=p.finals[t.id];const lastF=(p.log||[]).filter(e=>e.type==='final'&&e.id===t.id).slice(-1)[0];
    rows.push(['Final',t.name+' Final',fr&&fr.passed?'passed':(modulesAllPassed(p,t.id)?'available':'locked'),fr?fr.best+'%':'',fr?fr.attempts:0,lastF?fmtDate(lastF.ts):'','','']);});
  rows.push(['Cert','Roadshow certified',tierComplete(p,'tier3a')?'yes':'no','','','','','']);
  rows.push(['Cert','Office certified',tierComplete(p,'tier3b')?'yes':'no','','','','','']);
  rows.push(['Cert','Full program',programComplete(p)?'yes':'no','','',p.completedAt?fmtDate(p.completedAt):'','','']);
  return rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');

  const trainees=getTrainees();const p=normalize(trainees[n]);
  if(!isTestPassed(p,id)){alert('That module has not passed its written test yet.');return;}
  if(!explainReady(p,id)){alert('That module still needs the explain drill (3 different questions passed) before sign-off.');return;}
  if(moduleDrill(id)&&!quotaMet(p,id)){const q=drillQuota(id);if(!confirm('This trainee has not hit the practice bar of '+q.reps+' calls scoring '+q.score+' or higher. Sign off anyway?'))return;}
  const code=prompt('Manager passcode to certify this module:');if(code===null)return;
  if(code!==getMgrPass()){alert('Incorrect manager passcode.');return;}
  const by=prompt('Your name (recorded with this sign-off):');if(by===null)return;
  if(by.trim().length<2){alert('A name is required to sign off.');return;}
  certifyModule(p,id,by.trim());renderMgrTrainee(n);
}

renderTopbar();
if(currentName()&&currentProgress())renderDashboard();else renderLogin();</script>
