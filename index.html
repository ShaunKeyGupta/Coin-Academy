    <button class="btn btn-ghost" onclick="goDash()">Dashboard</button>
    <button class="btn btn-ghost" onclick="logout()">Sign out</button>`:'';
}
function logout(){save(STORE.current,null);renderLogin();renderTopbar();}
function goDash(){renderDashboard();renderTopbar();}

function renderLogin(){
  app.innerHTML=`<div class="login-hero">
    <div class="crest">SA</div>
    <div class="tag">Sales Academy</div>
    <h1>The Promotion Ladder</h1>
    <p>This program trains you from Appointment Setter to running your own location. Each module ends with a test you must pass to advance, and each tier ends with a final exam. Enter your name to begin or resume.</p>
    <div class="login-card">
      <input id="nameInput" class="field" placeholder="Your full name" autocomplete="off" />
      <button class="btn btn-gold" style="width:100%" onclick="doLogin()">Enter</button>
    </div>
    <div class="adminlink" onclick="adminPrompt()">Administrator access</div>
    <div class="adminlink" onclick="mgrPrompt()">Manager access</div>
  </div>`;
  setTimeout(()=>{const i=document.getElementById('nameInput');if(i){i.focus();i.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});}},50);
}
function doLogin(){
  const name=(document.getElementById('nameInput').value||'').trim();
  if(name.length<2){alert('Please enter your name.');return;}
  const t=getTrainees();if(!t[name]){t[name]=newTrainee(name);}else{normalize(t[name]);t[name].lastActivity=Date.now();}
  saveTrainees(t);save(STORE.current,name);renderTopbar();renderDashboard();
}

function renderDashboard(){
  const p=currentProgress();if(!p){renderLogin();return;}
  ensureCompletion(p);
  const status=computeStatus(p);const st=stats(p);
  const certBtn=programComplete(p)?`<button class="btn btn-gold" onclick="renderCertificate()">View Certificate</button>`:'';
  let html=`<div class="fade"><div class="dash-head"><h1>Your Ladder</h1>
    <div style="display:flex;gap:10px;flex-wrap:wrap">${certBtn}
      <button class="btn btn-ghost" onclick="renderFlashcards()">Key Dates Drill</button>
      <button class="btn btn-ghost" onclick="renderCheatSheet()">Reference Card</button></div></div>
    <div class="progress-meta"><b>${st.passed}</b> of <b>${st.total}</b> modules complete, <b>${st.pct}%</b> through the program</div>`;
  CURRICULUM.forEach(t=>{
    const tp=t.modules.filter(m=>status[m.id]==='passed').length;
    const fin=finalStatus(p,t.id);
    let tierTag='';
    if(tier3Certified(p,t.id))tierTag='<span class="mod-status st-passed">CERTIFIED</span>';
    else if(tierComplete(p,t.id)&&(t.id==='tier3a'||t.id==='tier3b'))tierTag='<span class="mod-status st-available">SOLO PENDING</span>';
    else if(tierComplete(p,t.id))tierTag='<span class="mod-status st-passed">COMPLETE</span>';
    html+=`<div class="tier"><div class="tier-head">
      <div class="tier-num">${t.n}</div>
      <div><div class="tier-title">${t.name}</div><div class="tier-sub">${t.sub}</div></div>
      <div class="tier-prog" style="display:flex;align-items:center;gap:10px">${tierTag}<span>${tp}/${t.modules.length} modules</span></div></div><div class="modules">`;
    t.modules.forEach((m,idx)=>{
      const s=status[m.id];const rec=p.modules[m.id];
      const dot=s==='passed'?'&#10003;':(s==='available'?(idx+1):'&#128274;');
      const label=s==='passed'?`<span class="mod-status st-passed">PASSED ${rec?rec.best:''}%</span>`
        :(s==='available'?`<span class="mod-status st-available">START</span>`:`<span class="mod-status st-locked">LOCKED</span>`);
      const click=(s!=='locked')?`onclick="openModule('${m.id}')"`:'';
      const shown=Math.min(m.test.length,SHOW_CAP);
      html+=`<div class="mod ${s}" ${click}><div class="mod-dot">${dot}</div>
        <div class="mod-body"><div class="mod-name">${m.name}</div>
        <div class="mod-meta">${m.days}, pass mark ${m.passMark}%, ${shown} questions${rec&&rec.attempts?`, ${rec.attempts} attempt${rec.attempts>1?'s':''}`:''}</div></div>
        ${label}</div>`;
    });
    // final exam row
    const frec=p.finals[t.id];
    const fdot=fin==='passed'?'&#10003;':(fin==='available'?'&#9733;':'&#128274;');
    const flabel=fin==='passed'?`<span class="mod-status st-passed">PASSED ${frec?frec.best:''}%</span>`
      :(fin==='available'?`<span class="mod-status st-available">FINAL EXAM</span>`:`<span class="mod-status st-locked">LOCKED</span>`);
    const fclick=(fin!=='locked')?`onclick="startFinal('${t.id}')"`:'';
    const fpoolN=Math.min(tierHardPool(t).length,FINAL_COUNT);
    html+=`<div class="mod ${fin} ${fin==='available'?'available':''}" ${fclick} style="margin-top:8px;border-top:1px dashed var(--line);border-radius:0 0 12px 12px"><div class="mod-dot">${fdot}</div>
      <div class="mod-body"><div class="mod-name">Tier Final Exam</div>
      <div class="mod-meta">Pass all modules to unlock. ${fpoolN} harder, scenario-based questions, pass ${FINAL_PASS}%, fresh set each attempt${frec&&frec.attempts?`, ${frec.attempts} attempt${frec.attempts>1?'s':''}`:''}</div></div>
      ${flabel}</div>`;
    html+=`</div></div>`;
  });
  html+=`</div>`;app.innerHTML=html;window.scrollTo(0,0);
}

function findModule(id){for(const t of CURRICULUM){const m=t.modules.find(x=>x.id===id);if(m)return{tier:t,mod:m};}return null;}
function openModule(id){
  const p=currentProgress();const status=computeStatus(p);if(status[id]==='locked')return;
  const {tier,mod}=findModule(id);
  const passed=status[id]==='passed';
  const isCoin=(id==='m2.1');
  app.innerHTML=`<div class="lesson fade">
    <div class="crumb">${tier.name}, ${mod.days}</div>
    <h1>${mod.name}</h1>
    <div class="sub">Read the briefing, then take the test. You need ${mod.passMark}% to advance.</div>
    <div class="lesson-card">${mod.lessonHTML}</div>
    <div class="lesson-actions">
      <button class="btn btn-ghost" onclick="goDash()">Back to ladder</button>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        ${isCoin?`<button class="btn btn-ghost" onclick="renderFlashcards()">Key Dates Drill</button>`:''}
        ${passed?`<button class="btn btn-ghost" onclick="startTest('${id}',true)">Practice (not recorded)</button>`:''}
        <button class="btn btn-gold" onclick="startTest('${id}')">Take the Test</button>
      </div></div></div>`;
  window.scrollTo(0,0);
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function startTest(id,practice){
  const {tier,mod}=findModule(id);
  const p=currentProgress();const rec=p&&p.modules[id];
  const useHard=!!(rec&&rec.attempts>0&&mod.hard&&mod.hard.length);
  const questions=buildModuleQuestions(mod,useHard);
  TEST={kind:'module',moduleId:id,tier,mod,practice:!!practice,hard:useHard,questions,optOrders:questions.map(()=>shuffle([0,1,2,3])),passMark:mod.passMark,title:mod.name,answers:{},submitted:false};
  renderTest();
}
function startFinal(tid){
  const p=currentProgress();if(finalStatus(p,tid)==='locked')return;
  const tier=tierById(tid);const pool=tierHardPool(tier);
  const n=Math.min(pool.length,FINAL_COUNT);
  const questions=shuffle(pool).slice(0,n);
  TEST={kind:'final',tierId:tid,tier,practice:false,hard:true,questions,optOrders:questions.map(()=>shuffle([0,1,2,3])),passMark:FINAL_PASS,title:tier.name+' Final Exam',answers:{},submitted:false};
  renderTest();
}
function renderTest(){
  const {questions,answers,passMark,title,practice,kind}=TEST;const n=questions.length;const need=Math.ceil(passMark/100*n);
  let html=`<div class="fade"><div class="test-head"><h1>${title}${kind==='final'?'':', Test'}</h1><span class="qcount">${n} questions</span></div>
    <div class="passbar">${practice?'Practice mode: this attempt is not recorded. ':''}${TEST.hard?'This is the harder set, including situational questions. ':''}You need ${passMark}% (${need} of ${n})${kind==='final'?' to complete the tier':' to advance'}. Answer every question.</div>`;
  questions.forEach((q,pos)=>{const oo=TEST.optOrders[pos];
    html+=`<div class="q" id="q${pos}"><div class="q-num">Question ${pos+1}</div><div class="q-text">${q.q}</div>`;
    oo.forEach((origIdx,slot)=>{html+=`<div class="opt ${answers[pos]===origIdx?'sel':''}" data-orig="${origIdx}" onclick="pick(${pos},${origIdx})"><div class="mark">${'ABCD'[slot]}</div><div class="otext">${q.o[origIdx]}</div></div>`;});
    html+=`</div>`;});
  const backBtn=kind==='module'?`<button class="btn btn-ghost" onclick="openModule('${TEST.moduleId}')">Back to briefing</button>`:`<button class="btn btn-ghost" onclick="goDash()">Back to ladder</button>`;
  html+=`<div class="lesson-actions">${backBtn}<button class="btn btn-gold" onclick="submitTest()">Submit</button></div></div>`;
  app.innerHTML=html;window.scrollTo(0,0);
}
function pick(pos,origIdx){if(TEST.submitted)return;TEST.answers[pos]=origIdx;const qEl=document.getElementById('q'+pos);qEl.querySelectorAll('.opt').forEach(el=>el.classList.toggle('sel',Number(el.dataset.orig)===origIdx));}
function submitTest(){
  const {questions,answers,passMark,practice,kind}=TEST;const n=questions.length;
  if(Object.keys(answers).length<n){const miss=[];questions.forEach((q,pos)=>{if(answers[pos]===undefined)miss.push(pos+1);});alert('Please answer every question. Missing: '+miss.join(', '));return;}
  let correct=0;questions.forEach((q,pos)=>{if(answers[pos]===q.a)correct++;});
  const pct=Math.round(correct/n*100);const passed=pct>=passMark;
  TEST.submitted=true;TEST.score=pct;TEST.correct=correct;TEST.passed=passed;
  if(!practice){
    const p=currentProgress();p.lastActivity=Date.now();
    if(kind==='module'){
      const rec=p.modules[TEST.moduleId]||{status:'available',best:0,attempts:0};
      rec.attempts=(rec.attempts||0)+1;rec.best=Math.max(rec.best||0,pct);if(passed)rec.status='passed';
      p.modules[TEST.moduleId]=rec;p.log.push({type:'module',id:TEST.moduleId,score:pct,passed,ts:Date.now()});
    }else{
      const rec=p.finals[TEST.tierId]||{passed:false,best:0,attempts:0};
      rec.attempts=(rec.attempts||0)+1;rec.best=Math.max(rec.best||0,pct);if(passed)rec.passed=true;
      p.finals[TEST.tierId]=rec;p.log.push({type:'final',id:TEST.tierId,score:pct,passed,ts:Date.now()});
    }
    persist(p);ensureCompletion(p);
  }
  renderResults();
}
function renderResults(){
  const {passMark,correct,score,passed,questions,practice,kind,moduleId,tierId}=TEST;const n=questions.length;const need=Math.ceil(passMark/100*n);
  const ring=passed?'var(--green)':'var(--red)';
  let body,actions;
  if(practice){

    actions=`<button class="btn btn-ghost" onclick="reviewTest()">Review answers</button><button class="btn btn-gold" onclick="goDash()">Back to ladder</button>`;
  }else if(passed){
    body=kind==='final'?`You passed the ${TEST.tier.name} final exam with ${correct} of ${n}. This tier is now complete.`:`You scored ${correct} of ${n} and cleared the ${passMark}% gate. The next step is unlocked.`;
    actions=`<button class="btn btn-ghost" onclick="reviewTest()">Review answers</button><button class="btn btn-gold" onclick="goDash()">Back to ladder</button>`;
  }else{

    const reread=kind==='module'?`<button class="btn btn-gold" onclick="openModule('${moduleId}')">Re-read the briefing</button>`:`<button class="btn btn-gold" onclick="goDash()">Back to ladder to review</button>`;
    actions=`<button class="btn btn-ghost" onclick="reviewTest()">Review answers</button>${reread}`;
  }
  app.innerHTML=`<div class="result-card">
    <div class="result-ring" style="background:conic-gradient(${ring} ${score}%, rgba(255,255,255,.08) 0)">
      <div style="width:120px;height:120px;border-radius:50%;background:var(--navy2);display:grid;place-items:center">
        <div><div class="score" style="color:${passed?'var(--gold-bright)':'#e08a78'}">${score}%</div><div class="of">${correct} of ${n}</div></div></div></div>
    <h1 class="${passed?'pass-h1':'fail-h1'}">${practice?'Practice Complete':(passed?(kind==='final'?'Tier Complete':'Passed'):'Not Quite Yet')}</h1>
    <p>${body}</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">${actions}</div></div>`;
  window.scrollTo(0,0);
}
function reviewTest(){
  const {questions,answers,title}=TEST;
  let html=`<div class="fade"><div class="test-head"><h1>${title}, Review</h1><span class="qcount">Score ${TEST.score}%</span></div>
    <div class="passbar">Correct answers in green, your wrong picks in red.</div>`;
  questions.forEach((q,pos)=>{const chosen=answers[pos];const oo=TEST.optOrders[pos];
    html+=`<div class="q"><div class="q-num">Question ${pos+1}</div><div class="q-text">${q.q}</div>`;

  app.innerHTML=html;window.scrollTo(0,0);
}

function certCounts(){
  const tr=getTrainees();let c={t1:0,t2:0,a:0,b:0,full:0,stalled:0,total:0};
  Object.values(tr).forEach(raw=>{const p=normalize(raw);c.total++;
    if(tierComplete(p,'tier1'))c.t1++;
    if(tierComplete(p,'tier2'))c.t2++;
    if(tier3Certified(p,'tier3a'))c.a++;
    if(tier3Certified(p,'tier3b'))c.b++;
    if(programComplete(p))c.full++;
    if(stalled(p))c.stalled++;});
  return c;
}
function traineeRowData(p){
  const status=computeStatus(p);
  const passed=Object.values(p.modules).filter(m=>m.status==='passed').length;
  const total=flatModules().length;
  let cur='None';for(const t of CURRICULUM){let f=false;for(const m of t.modules){if(status[m.id]==='available'){cur=m.name;f=true;break;}}if(f)break;if(finalStatus(p,t.id)==='available'){cur=t.name+' Final Exam';break;}}
  if(programComplete(p))cur='Program complete';
  const att=(p.log||[]).length;
  const last=(p.log&&p.log.length)?p.log[p.log.length-1].score+'%':'None';
  return {passed,total,cur,att,last};
}

    <div class="table-wrap"><table><tr><th>Item</th><th>Status</th><th>Best</th><th>Attempts</th></tr>${modRows}</table></div>
    <h2 style="font-family:'Fraunces';font-size:20px;margin:26px 0 10px;color:var(--gold-bright)">Attempt History (most recent first)</h2>
    <div class="table-wrap"><table><tr><th>When</th><th>Test</th><th>Score</th><th>Result</th></tr>${logRows}</table></div></div>`;
  window.scrollTo(0,0);
}
function toggleSignoff(n,tid){const t=getTrainees();const p=normalize(t[n]);if(!tierComplete(p,tid)){alert('This trainee has not finished the modules and final exam for that track yet.');return;}p.signoff[tid]=!p.signoff[tid];ensureCompletion(p);persist(p);renderDetail(n);}
function resetTrainee(n){if(!confirm('Reset all progress for '+n+'?'))return;const t=getTrainees();if(t[n]){t[n]=newTrainee(n);saveTrainees(t);}renderAdmin();}
function changeAdminPass(){const np=prompt('New administrator passcode:');if(np&&np.length>=4){save(STORE.admin,np);alert('Admin passcode updated.');}else if(np!==null)alert('Passcode must be at least 4 characters.');}
function changeMgrPass(){const np=prompt('New manager passcode:');if(np&&np.length>=4){save(MGR_STORE,np);alert('Manager passcode updated.');}else if(np!==null)alert('Passcode must be at least 4 characters.');}
function csvFor(p){
  let rows=[['Type','Name','Status','Best Score','Attempts','Last Attempt']];
  CURRICULUM.forEach(t=>{t.modules.forEach(m=>{const rec=p.modules[m.id];
    const lastE=(p.log||[]).filter(e=>e.type==='module'&&e.id===m.id).slice(-1)[0];
    rows.push(['Module',m.name,rec?rec.status:'locked',rec?rec.best+'%':'',rec?rec.attempts:0,lastE?fmtDate(lastE.ts):'']);});
    const fr=p.finals[t.id];const lastF=(p.log||[]).filter(e=>e.type==='final'&&e.id===t.id).slice(-1)[0];
    rows.push(['Final',t.name+' Final',fr&&fr.passed?'passed':(modulesAllPassed(p,t.id)?'available':'locked'),fr?fr.best+'%':'',fr?fr.attempts:0,lastF?fmtDate(lastF.ts):'']);});
  rows.push(['Cert','Roadshow certified',tier3Certified(p,'tier3a')?'yes':'no','','','']);
  rows.push(['Cert','Office certified',tier3Certified(p,'tier3b')?'yes':'no','','','']);
  rows.push(['Cert','Full program',programComplete(p)?'yes':'no','','',p.completedAt?fmtDate(p.completedAt):'']);
  return rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
}
function exportTrainee(n){const t=getTrainees();const p=normalize(t[n]);const blob=new Blob([csvFor(p)],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=n.replace(/[^a-z0-9]/gi,'_')+'_record.csv';a.click();URL.revokeObjectURL(url);}
function exportAll(){const data={trainees:getTrainees(),exportedAt:new Date().toISOString()};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='sales_academy_data.json';a.click();URL.revokeObjectURL(url);}
function wipeAll(){if(!confirm('Delete ALL trainee progress?'))return;if(!confirm('Are you absolutely sure?'))return;saveTrainees({});renderAdmin();}

/* ---- manager (read-only) ---- */
function mgrPrompt(){const pass=prompt('Manager passcode:');if(pass===null)return;if(pass===getMgrPass())renderManager();else alert('Incorrect passcode.');}
function renderManager(){
  const trainees=getTrainees();const names=Object.keys(trainees).sort();const c=certCounts();
  let rows='';
  names.forEach(n=>{const p=normalize(trainees[n]);const d=traineeRowData(p);
    const pill=programComplete(p)?'pill-g':(d.passed>0?'pill-a':'pill-l');
    const flag=stalled(p)?' <span class="pill pill-l" style="color:#e0a06a">stalled</span>':'';
    rows+=`<tr><td><b>${esc(n)}</b>${flag}</td><td><span class="pill ${pill}">${d.passed}/${d.total}</span></td><td>${esc(d.cur)}</td><td>${d.last}</td>
      <td><button class="btn btn-ghost" style="padding:6px 12px;font-size:12px" onclick="exportTrainee('${esc(n).replace(/'/g,"\\'")}')">CSV</button></td></tr>`;});
  if(!rows)rows=`<tr><td colspan="5" style="text-align:center;color:var(--cream-dim)">No trainees yet.</td></tr>`;
  app.innerHTML=`<div class="fade"><div class="admin-head"><h1>Manager View</h1>
    <button class="btn btn-gold" onclick="goDash()">Exit</button></div>
    <div class="stat-row">
      <div class="stat"><div class="n">${c.total}</div><div class="l">Trainees</div></div>
      <div class="stat"><div class="n">${c.t1}</div><div class="l">Tier 1 Complete</div></div>
      <div class="stat"><div class="n">${c.t2}</div><div class="l">Tier 2 Complete</div></div>
      <div class="stat"><div class="n">${c.stalled}</div><div class="l">Stalled</div></div>
    </div>
    <div class="table-wrap"><table><tr><th>Trainee</th><th>Modules</th><th>Current Step</th><th>Last Score</th><th></th></tr>${rows}</table></div>
    <p style="color:var(--cream-dim);font-size:13px;margin-top:14px">Read-only team progress. Stalled means no activity in 7 or more days. Certification sign-off and resets are owner-only.</p></div>`;
  window.scrollTo(0,0);
}

renderTopbar();
if(currentName()&&currentProgress())renderDashboard();else renderLogin();</script>
</body>
