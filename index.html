<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1b2e; --navy2:#13263d; --navy3:#1c344f;
  --gold:#c9a227; --gold-bright:#e6c34a; --gold-dim:#8a7320;
  --cream:#f4efe2; --cream-dim:#cfc7b3;
  --green:#2e7d52; --red:#b3402f;
  --line:rgba(201,162,39,.22);
  --shadow:0 18px 50px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Archivo',system-ui,sans-serif;
  background:
    radial-gradient(1200px 700px at 75% -10%, rgba(201,162,39,.14), transparent 60%),
    radial-gradient(900px 600px at 10% 110%, rgba(28,52,79,.6), transparent 55%),
    var(--navy);
  color:var(--cream); -webkit-font-smoothing:antialiased; min-height:100%;
}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:.2px}
.wrap{max-width:1080px;margin:0 auto;padding:32px 24px 80px}
.hidden{display:none!important}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(13,27,46,.9),rgba(13,27,46,.5));position:sticky;top:0;z-index:50;backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:14px}
.crest{width:42px;height:42px;border-radius:11px;background:radial-gradient(circle at 35% 30%,var(--gold-bright),var(--gold-dim));
  display:grid;place-items:center;color:var(--navy);font-family:'Fraunces';font-weight:700;font-size:17px;
  box-shadow:0 0 0 2px rgba(201,162,39,.35),0 6px 18px rgba(0,0,0,.4)}
.brand .name{font-family:'Fraunces';font-size:20px;font-weight:600;letter-spacing:.5px}
.brand .sub{font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-top:-2px}
.topbar-right{display:flex;align-items:center;gap:14px;font-size:14px}
.whoami{color:var(--cream-dim)} .whoami b{color:var(--cream)}
.btn{font-family:'Archivo';cursor:pointer;border:none;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:600;transition:.18s;letter-spacing:.3px}
.btn-gold{background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:var(--navy);box-shadow:0 6px 18px rgba(201,162,39,.3)}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(201,162,39,.42)}
.btn-ghost{background:transparent;color:var(--cream-dim);border:1px solid var(--line)}
.btn-ghost:hover{color:var(--cream);border-color:var(--gold)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.login-hero{max-width:540px;margin:8vh auto 0;text-align:center;animation:rise .7s ease both}
.login-hero .crest{width:84px;height:84px;font-size:34px;border-radius:20px;margin:0 auto 26px}
.login-hero h1{font-size:46px;line-height:1.05;margin-bottom:10px}
.login-hero .tag{color:var(--gold);letter-spacing:4px;text-transform:uppercase;font-size:12px;margin-bottom:26px}
.login-hero p{color:var(--cream-dim);font-size:15px;line-height:1.6;margin-bottom:30px}
.field{width:100%;padding:15px 18px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--cream);font-size:16px;font-family:'Archivo';margin-bottom:14px}
.field:focus{outline:none;border-color:var(--gold);background:rgba(255,255,255,.07)}
.login-card{background:linear-gradient(180deg,rgba(28,52,79,.5),rgba(19,38,61,.5));border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:var(--shadow)}
.adminlink{margin-top:26px;font-size:12px;color:var(--cream-dim);cursor:pointer;letter-spacing:1px}
.adminlink:hover{color:var(--gold)}
.dash-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:8px}
.dash-head h1{font-size:34px}
.progress-meta{color:var(--cream-dim);font-size:14px;margin-bottom:30px} .progress-meta b{color:var(--gold)}
.tier{margin-bottom:26px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:linear-gradient(180deg,rgba(28,52,79,.35),rgba(19,38,61,.25))}
.tier-head{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line);background:rgba(13,27,46,.4)}
.tier-num{width:42px;height:38px;border-radius:10px;background:var(--navy3);color:var(--gold);display:grid;place-items:center;font-family:'Fraunces';font-weight:700;font-size:15px;border:1px solid var(--line);padding:0 6px}
.tier-title{font-family:'Fraunces';font-size:20px;font-weight:600}
.tier-sub{font-size:12px;color:var(--cream-dim);letter-spacing:1px;text-transform:uppercase}
.tier-prog{margin-left:auto;font-size:13px;color:var(--cream-dim)}
.modules{padding:10px 14px 16px}
.mod{display:flex;align-items:center;gap:16px;padding:15px 14px;border-radius:12px;transition:.15s;border:1px solid transparent}
.mod+.mod{margin-top:4px}
.mod.available,.mod.passed{cursor:pointer}
.mod.available:hover,.mod.passed:hover{background:rgba(201,162,39,.08);border-color:var(--line)}
.mod.locked{opacity:.45}
.mod-dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;flex:none;border:2px solid var(--navy3)}
.mod.passed .mod-dot{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700}
.mod.available .mod-dot{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 4px rgba(201,162,39,.12);animation:pulse 2.4s infinite}
.mod.locked .mod-dot{color:var(--cream-dim)}
.mod-body{flex:1;min-width:0}
.mod-name{font-weight:600;font-size:15.5px}
.mod-meta{font-size:12.5px;color:var(--cream-dim);margin-top:2px}
.mod-status{font-size:12px;font-weight:600;letter-spacing:.5px;padding:5px 12px;border-radius:20px;flex:none}
.st-passed{background:rgba(46,125,82,.2);color:#7fd3a5;border:1px solid rgba(46,125,82,.4)}
.st-available{background:rgba(201,162,39,.16);color:var(--gold-bright);border:1px solid var(--line)}
.st-locked{background:rgba(255,255,255,.04);color:var(--cream-dim)}
.crumb{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.lesson h1{font-size:32px;margin-bottom:6px}
.lesson .sub{color:var(--cream-dim);font-size:14px;margin-bottom:28px}
.lesson-card{background:linear-gradient(180deg,rgba(28,52,79,.4),rgba(19,38,61,.3));border:1px solid var(--line);border-radius:16px;padding:30px 32px;box-shadow:var(--shadow);line-height:1.7}
.lesson-card h2{font-size:22px;color:var(--gold-bright);margin:26px 0 12px}
.lesson-card h2:first-child{margin-top:0}
.lesson-card h3{font-size:17px;margin:20px 0 8px;color:var(--cream)}
.lesson-card p{margin-bottom:14px;color:var(--cream-dim)}
.lesson-card strong{color:var(--cream)}
.lesson-card ul,.lesson-card ol{margin:0 0 16px 22px}
.lesson-card li{margin-bottom:8px;color:var(--cream-dim)}
.lesson-card .script{background:rgba(13,27,46,.6);border-left:3px solid var(--gold);padding:14px 18px;border-radius:8px;font-style:italic;color:var(--cream);margin:14px 0}
.outcome{background:linear-gradient(180deg,rgba(46,125,82,.12),rgba(46,125,82,.04));border:1px solid rgba(46,125,82,.3);border-radius:10px;padding:14px 18px;margin:0 0 8px}
.outcome b{color:#7fd3a5;letter-spacing:1px;font-size:12px;text-transform:uppercase}
.standard{background:linear-gradient(180deg,rgba(201,162,39,.12),rgba(201,162,39,.05));border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:16px 0}
.standard b{color:var(--gold-bright);letter-spacing:1px;font-size:13px;text-transform:uppercase}
.takeaways{background:rgba(13,27,46,.5);border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin:24px 0 0}
.takeaways h3{color:var(--gold-bright);margin:0 0 10px;font-family:'Fraunces';font-size:18px}
.takeaways li{margin-bottom:7px}
.lesson-actions{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:14px;flex-wrap:wrap}
.lesson-note{font-size:13px;color:var(--cream-dim)}
.test-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:10px}
.test-head h1{font-size:28px}
.qcount{font-size:13px;color:var(--cream-dim);letter-spacing:1px}
.passbar{font-size:13px;color:var(--gold);margin-bottom:24px}
.q{background:linear-gradient(180deg,rgba(28,52,79,.4),rgba(19,38,61,.3));border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:16px}
.q-num{font-size:12px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.q-text{font-size:16.5px;font-weight:500;margin-bottom:16px;line-height:1.5}
.opt{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;cursor:pointer;transition:.14s;background:rgba(255,255,255,.02)}
.opt:hover{border-color:var(--gold);background:rgba(201,162,39,.06)}
.opt.sel{border-color:var(--gold);background:rgba(201,162,39,.14)}
.opt .mark{width:22px;height:22px;border-radius:50%;border:2px solid var(--cream-dim);flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.opt.sel .mark{border-color:var(--gold);background:var(--gold);color:var(--navy)}
.opt .otext{font-size:15px;color:var(--cream);line-height:1.45}
.opt.correct{border-color:var(--green);background:rgba(46,125,82,.16)}
.opt.correct .mark{border-color:var(--green);background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:rgba(179,64,47,.16)}
.opt.wrong .mark{border-color:var(--red);background:var(--red);color:#fff}
.explain{font-size:13.5px;color:var(--cream-dim);margin-top:10px;padding:10px 14px;background:rgba(13,27,46,.5);border-radius:8px;border-left:3px solid var(--gold)}
.explain b{color:var(--gold-bright)}
.result-card{max-width:560px;margin:6vh auto 0;text-align:center;background:linear-gradient(180deg,rgba(28,52,79,.5),rgba(19,38,61,.4));border:1px solid var(--line);border-radius:20px;padding:46px 38px;box-shadow:var(--shadow);animation:rise .6s ease both}
.result-ring{width:150px;height:150px;margin:0 auto 24px;border-radius:50%;display:grid;place-items:center;position:relative}
.result-ring .score{font-family:'Fraunces';font-size:40px;font-weight:700}
.result-ring .of{font-size:13px;color:var(--cream-dim);letter-spacing:2px}
.result-card h1{font-size:34px;margin-bottom:10px}
.result-card p{color:var(--cream-dim);margin-bottom:26px;line-height:1.6}
.pass-h1{color:var(--gold-bright)} .fail-h1{color:#e08a78}
.admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;flex-wrap:wrap;gap:14px}
.admin-head h1{font-size:30px}
.table-wrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:680px}
th{background:rgba(13,27,46,.7);color:var(--gold);text-align:left;padding:14px 16px;font-weight:600;letter-spacing:.5px;font-size:12px;text-transform:uppercase}
td{padding:13px 16px;border-top:1px solid var(--line);color:var(--cream-dim)} td b{color:var(--cream)}
tr:hover td{background:rgba(201,162,39,.04)}
.pill{display:inline-block;padding:3px 10px;border-radius:14px;font-size:12px;font-weight:600}
.pill-g{background:rgba(46,125,82,.2);color:#7fd3a5} .pill-a{background:rgba(201,162,39,.16);color:var(--gold-bright)} .pill-l{background:rgba(255,255,255,.05);color:var(--cream-dim)}
.stat-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.stat{flex:1;min-width:150px;background:linear-gradient(180deg,rgba(28,52,79,.4),rgba(19,38,61,.3));border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.stat .n{font-family:'Fraunces';font-size:34px;font-weight:700;color:var(--gold-bright)}
.stat .l{font-size:12px;color:var(--cream-dim);letter-spacing:1px;text-transform:uppercase;margin-top:4px}
.config-row{display:flex;gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(201,162,39,.12)}50%{box-shadow:0 0 0 7px rgba(201,162,39,.04)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.fade{animation:rise .45s ease both}
.cheat{background:linear-gradient(180deg,rgba(28,52,79,.4),rgba(19,38,61,.3));border:1px solid var(--line);border-radius:16px;padding:28px 30px;box-shadow:var(--shadow)}
.cheat h2{font-family:'Fraunces';font-size:19px;color:var(--gold-bright);margin:22px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px}
.cheat h2:first-child{margin-top:0}
.cheat .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
.cheat .row{font-size:13.5px;color:var(--cream-dim);padding:3px 0;line-height:1.4}
.cheat .row b{color:var(--cream)}
.cheat .full{grid-column:1 / -1}
@media print{
  body{background:#fff!important;color:#111!important}
  .topbar,.dash-head button,.lesson-actions,.adminlink{display:none!important}
  .cheat{box-shadow:none;border:1px solid #999;background:#fff!important;padding:0}
  .cheat h2{color:#111!important;border-color:#999}
  .cheat .row,.cheat .row b{color:#111!important}
  .wrap{padding:0}
  h1{color:#111!important}
}
@media(max-width:600px){.cheat .grid{grid-template-columns:1fr}}
.cert{max-width:680px;margin:0 auto;text-align:center;background:linear-gradient(180deg,rgba(28,52,79,.5),rgba(19,38,61,.4));border:2px solid var(--gold);border-radius:18px;padding:48px 40px;box-shadow:var(--shadow)}
.cert-crest{width:70px;height:70px;border-radius:16px;margin:0 auto 18px;background:radial-gradient(circle at 35% 30%,var(--gold-bright),var(--gold-dim));display:grid;place-items:center;color:var(--navy);font-family:'Fraunces';font-weight:700;font-size:28px}
.cert-k{letter-spacing:5px;text-transform:uppercase;font-size:12px;color:var(--gold);margin-bottom:24px}
.cert-title{font-family:'Fraunces';font-size:34px;color:var(--gold-bright);margin-bottom:20px}
.cert-sub{color:var(--cream-dim);font-size:15px;max-width:460px;margin:0 auto 8px;line-height:1.5}
.cert-name{font-family:'Fraunces';font-size:38px;color:var(--cream);margin:14px 0}
.cert-track{font-family:'Fraunces';font-size:20px;color:var(--gold-bright);margin:14px 0}
.cert-date{color:var(--cream-dim);font-size:14px;margin-top:18px}
.cert-line{margin-top:34px;padding-top:8px;border-top:1px solid var(--line);display:inline-block;min-width:260px;color:var(--cream-dim);font-size:13px}
@media print{.cert{border-color:#b8860b;background:#fff!important}.cert-title,.cert-track{color:#8a6d1b!important}.cert-name{color:#111!important}.cert-sub,.cert-date,.cert-line{color:#333!important}.cert-k{color:#8a6d1b!important}}
</style>
</head>
<body>
<div class="topbar" id="topbar">
  <div class="brand">
    <div class="crest">SA</div>
    <div><div class="name">Sales Academy</div><div class="sub">Promotion Ladder</div></div>
  </div>
  <div class="topbar-right" id="topbarRight"></div>
</div>
<div id="app" class="wrap"></div>

<script>
const STORE={trainees:'sa_trainees_v2',current:'sa_current_v2',admin:'sa_adminpass_v2'};
function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v));}
function getAdminPass(){return load(STORE.admin,'ADMIN-2024');}

/* ===== CURRICULUM =====
   module: id, name, days, passMark, lessonHTML, test[]
   test item: {q, o:[4], a:index, e:explanation}
   Every question maps to a stated point in that module's lesson. */
const CURRICULUM=[
{
 id:'tier1', n:'I', name:'Appointment Setter', sub:'5 modules',
 modules:[
  {
   id:'m1.1', name:'Foundation', days:'Days 1 to 10', passMark:80,
   lessonHTML:`
   <div class="outcome"><b>What you'll be able to do</b><br>After this module you can explain who we are, recognize the four customer types, know what we buy and don't buy, and state the one rule that protects every deal.</div>
   <h2>Your Role</h2>
   <p>You are an <strong>Appointment Setter</strong>. Your two jobs, above everything else, are to <strong>book and confirm appointments</strong> and to do it with <strong>speed to lead</strong> (reach new leads fast). You do not give prices on the phone. You do not negotiate. You book, confirm, and move on.</p>
   <h2>The Company Story</h2>
   <p>We are a <strong>collector's association, not a pawn shop</strong>. We work directly with private collectors and auction houses. We educate sellers on rarity, key dates, and collector value before we ever discuss a number. Because most of what we buy goes to private clients, we can pay top of market instead of pawn-shop pricing.</p>
   <h2>The Four Customer Avatars</h2>
   <p>Avatars describe the <strong>type of person</strong> you are talking to (separate from the pipeline stage, which describes where the lead is in the process).</p>
   <ul>
   <li><strong>Lifelong Collector:</strong> uses terms like "my collection," knows key dates, talks like a peer.</li>
   <li><strong>Inherited:</strong> references a late parent or relative, often unsure of value. Most common.</li>
   <li><strong>Duplicate Seller:</strong> an active collector selling doubles or common pieces.</li>
   <li><strong>Curious:</strong> no urgency, just wants to know what it's worth.</li>
   </ul>
   <h2>What We Buy</h2>
   <p>Gold, silver, and platinum (coins, jewelry, bullion); pre-1965 silver coins; key-date coins; pre-1933 US gold; sterling flatware; diamonds half a carat and up; luxury and antique pocket watches; and routed collectibles handled by specialists.</p>
   <h2>What We Do NOT Buy</h2>
   <p>Gold-filled or plated items (GF, GP, HGE, 1/20, 1/10); costume jewelry; silver-plate (EPNS, EP); modern clad coins (post-1964 dimes and quarters, post-1970 halves); fashion and smart watches; furniture; fine art; general antiques; electronics.</p>
   <div class="standard"><b>Operating Standard</b><br>Never give a price over the phone, not even a range. The correct move is always: get a photo, book the appointment, and let the buyer deliver the number in person. Phone quotes lose deals and create expectations no one can honor.</div>
   <div class="takeaways"><h3>Key Takeaways</h3><ul>
   <li>Your two priorities: book and confirm appointments, and reach new leads fast (speed to lead).</li>
   <li>We are a collector's association, not a pawn shop; we pay top of market because we sell to private clients.</li>
   <li>The four avatars are Lifelong Collector, Inherited, Duplicate Seller, and Curious.</li>
   <li>We buy precious metals, key-date and pre-1965 silver coins, pre-1933 gold, sterling, qualifying diamonds and watches.</li>
   <li>We do not buy plated/filled metal, costume jewelry, modern clad coins, fashion watches, furniture, art, or electronics.</li>
   <li>Never give a price on the phone. Get a photo, book the appointment.</li>
   </ul></div>`,
   test:[
    {q:"What are the Setter's two most important priorities?",o:["Pricing and negotiating","Booking/confirming appointments and speed to lead","Shipping and inventory","Marketing and ads"],a:1,e:"Booking and confirming appointments plus speed to lead are the setter's two jobs; pricing, shipping, and marketing all belong to other roles."},
    {q:"How is the company positioned in the company story?",o:["A pawn shop","A collector's association, not a pawn shop","A jewelry retailer","An online marketplace"],a:1,e:"We are positioned as a collector's association, not a pawn shop; we are also not a jewelry retailer or an online marketplace, and that framing is why sellers trust us."},
    {q:"Why can we pay top of market?",o:["We charge fees","Most of what we buy goes to private clients","We pay in gold","We have no costs"],a:1,e:"Because most of what we buy goes to private collectors and auction houses, we capture collector value; we do not charge fees, pay in gold, or operate without costs."},
    {q:"Which is NOT one of the four avatars?",o:["Lifelong Collector","Inherited","Duplicate Seller","Wholesale Dealer"],a:3,e:"Wholesale Dealer is not an avatar; the four are Lifelong Collector, Inherited, Duplicate Seller, and Curious."},
    {q:"Which avatar is the most common?",o:["Lifelong Collector","Inherited","Curious","Duplicate Seller"],a:1,e:"Inherited is the most common avatar; Lifelong Collectors, the Curious, and Duplicate Sellers all come in less often."},
    {q:"An avatar describes:",o:["Where the lead is in the pipeline","The type of person you are talking to","The item's value","The setter's score"],a:1,e:"An avatar describes the type of person you are talking to; where the lead sits in the pipeline, the item's value, and your score are all separate things."},
    {q:"A caller who says items were 'my late father's' is which avatar?",o:["Lifelong Collector","Inherited","Curious","Duplicate Seller"],a:1,e:"Items from a relative make this the Inherited avatar, not a Lifelong Collector, the Curious, or a Duplicate Seller offloading extras."},
    {q:"Which item do we BUY?",o:["Gold-filled jewelry","Pre-1965 silver coins","Costume jewelry","Modern clad quarters"],a:1,e:"Pre-1965 silver coins are real silver, so we buy them; gold-filled and costume jewelry are not solid precious metal, and modern clad quarters have none."},
    {q:"Which item do we NOT buy?",o:["Sterling flatware","Pre-1933 US gold","Gold-plated jewelry (GP)","Diamonds half a carat and up"],a:2,e:"Gold-plated (GP) is only a thin coating, so we reject it; sterling flatware, pre-1933 US gold, and half-carat-plus diamonds are all genuine buys."},

  {
   id:'m1.2', name:'The Pipeline (17 Stages)', days:'Days 11 to 20', passMark:80,
   lessonHTML:`
   <div class="outcome"><b>What you'll be able to do</b><br>After this module you can place any lead in the correct pipeline stage and know exactly what to write in the notes for each one.</div>
   <h2>Why Stages Matter</h2>
   <p>The pipeline is how we track every lead. The stage tells everyone where the lead is and what happens next. Putting a lead in the wrong stage breaks follow-up and loses money. Many stages ask you to <strong>write what the customer has</strong> in the notes, so the next person knows the situation without a phone call.</p>
   <h2>The 17 Stages</h2>
   <ol>
   <li><strong>New:</strong> lead just entered, no outreach yet.</li>
   <li><strong>Working, Attempting to Contact:</strong> you have started outreach (first attempt made).</li>
   <li><strong>Attempt Two:</strong> second logged contact attempt.</li>
   <li><strong>Attempt Three:</strong> third logged contact attempt.</li>
   <li><strong>Qualified:</strong> a qualified lead that is not yet scheduled. Note: write what they have so the next step is clear.</li>
   <li><strong>Connected, Awaiting Photos:</strong> contact made, photos requested and not yet received.</li>
   <li><strong>Qualified, Scheduled:</strong> appointment is booked.</li>
   <li><strong>Sent to Consignment:</strong> the lead wants to sell on auction, so it goes to consignment.</li>
   <li><strong>Wanting to Ship:</strong> they are outside our workable area and want to ship items in for an offer or consignment.</li>
   <li><strong>Won, Deal Closed:</strong> the deal is done and monetized.</li>
   <li><strong>Reschedule / No-Show:</strong> requires a Reason in the notes.</li>
   <li><strong>Low Value:</strong> they have items we would buy, but not enough to be worth it. Note: write what they have.</li>
   <li><strong>Junk Lead:</strong> they have items we do not buy. Note: write what they had.</li>
   <li><strong>Cold Lead:</strong> leads we have not been able to reach (this also covers leads auto-moved after three attempts and a waiting period).</li>
   <li><strong>Lost Lead:</strong> leads we lost and could not close.</li>
   <li><strong>Wanting to Buy:</strong> they called wanting to buy items from us instead of selling to us.</li>
   <li><strong>Out of State:</strong> leads located out of state.</li>
   </ol>
   <h2>The 60-Second Priority</h2>
   <p>When a lead lands in <strong>New</strong>, reach out as fast as possible. Speed to lead is one of the biggest drivers of whether a lead ever books. Then log each attempt so the stage stays accurate.</p>
   <h2>Photos Before Scheduling</h2>
   <p>A lead should not move to <strong>Qualified, Scheduled</strong> without photos, except when the customer simply refuses. Photos let the buyer prepare and make the customer more likely to show up.</p>
   <div class="standard"><b>Operating Standard</b><br>Keep notes accurate and specific. For Qualified, Low Value, and Junk Lead, always write what the customer has. Accurate notes mean anyone can pick up the lead without a single extra phone call.</div>
   <div class="takeaways"><h3>Key Takeaways</h3><ul>
   <li>There are 17 pipeline stages; the stage tells everyone where the lead is and what is next.</li>
   <li>New means no outreach yet; Working, Attempting to Contact means the first attempt was made.</li>
   <li>Qualified means qualified but not scheduled; you write what they have.</li>
   <li>Sent to Consignment is for sellers who want to sell on auction.</li>
   <li>Wanting to Ship is for sellers outside our workable area.</li>
   <li>Low Value means we'd buy but there is not enough; Junk Lead means items we do not buy.</li>
   <li>Cold Lead means we could not reach them; Lost Lead means we could not close.</li>
   <li>Wanting to Buy means they want to buy from us; Out of State means located out of state.</li>
   <li>Reschedule / No-Show requires a Reason.</li>
   <li>Reach New leads fast, and get photos before scheduling.</li>
   </ul></div>`,
   test:[
    {q:"How many pipeline stages are there?",o:["9","12","17","20"],a:2,e:"There are 17 stages; 9, 12, and 20 are simply the wrong count."},
    {q:"What does 'New' mean?",o:["Photos received","Lead just entered, no outreach yet","Appointment booked","Deal closed"],a:1,e:"New means the lead just entered with no outreach yet; photos received, an appointment booked, and a closed deal are all later stages."},
    {q:"'Working, Attempting to Contact' means:",o:["No outreach yet","The first attempt has been made","The deal closed","They want to buy"],a:1,e:"It means outreach has started with a first attempt; it is not 'no outreach yet' (that is New), a closed deal, or a buyer."},
    {q:"The 'Qualified' (not scheduled) stage asks you to:",o:["Take a deposit","Write what they have","Close the deal","Ship the items"],a:1,e:"Write what they have so the next step is clear; you do not take a deposit, close the deal, or ship at this stage."},
    {q:"A seller who wants to sell on auction goes to:",o:["Junk Lead","Sent to Consignment","Wanting to Buy","Out of State"],a:1,e:"Auction sellers go to Sent to Consignment; Junk Lead is for items we do not buy, Wanting to Buy is for buyers, and Out of State is about location."},
    {q:"A seller outside our workable area who wants to send items in is:",o:["Lost Lead","Wanting to Ship","Cold Lead","New"],a:1,e:"Wanting to Ship covers out-of-area sellers mailing items in; Lost Lead and Cold Lead are about failed or unreachable contact, and New means no outreach yet."},
    {q:"'Low Value' means:",o:["Items we don't buy","Items we'd buy but not enough to be worth it","A closed deal","A buyer"],a:1,e:"Low Value means we would buy, but there is not enough to justify it; that differs from items we do not buy at all, a closed deal, or a buyer."},
    {q:"'Junk Lead' is for:",o:["High-value sellers","People with items we do not buy","Scheduled customers","Auction sellers"],a:1,e:"Junk Lead is for items we do not buy at all; it is not for high-value sellers, scheduled customers, or auction sellers."},
    {q:"'Cold Lead' means:",o:["A closed deal","Leads we have not been able to reach","Out-of-state leads","Buyers"],a:1,e:"Cold Lead means leads we could not reach, including auto-moved ones; it is not a closed deal, an out-of-state marker, or a buyer."},
    {q:"'Lost Lead' means:",o:["We couldn't reach them","Leads we lost and could not close","They want to buy","New leads"],a:1,e:"Lost Lead means we reached them but could not close; that differs from Cold Lead (unreachable), a buyer, or a brand-new lead."},
    {q:"A caller who wants to buy items from us is:",o:["Wanting to Buy","Sent to Consignment","Junk Lead","Qualified"],a:0,e:"Wanting to Buy is for people buying from us; Sent to Consignment and Qualified are seller stages, and Junk Lead is for items we do not buy."},
    {q:"'Out of State' is for:",o:["Auction sellers","Leads located out of state","No-shows","Buyers"],a:1,e:"Out of State simply marks location; it is not for auction sellers, no-shows, or buyers."},
    {q:"'Reschedule / No-Show' requires:",o:["A photo","A Reason","A deposit","A manager"],a:1,e:"It requires a Reason in the notes so the next person understands what happened; a photo, deposit, or manager name is not what this stage asks for."},
    {q:"Before moving a lead to 'Qualified, Scheduled' you should have:",o:["A deposit","Photos (unless the customer refuses)","A signed contract","A second call"],a:1,e:"You should have photos unless the customer refuses; a deposit, a signed contract, and a second call are not requirements to schedule."},
    {q:"Why write what the customer has in the notes?",o:["For fun","So anyone can pick up the lead without another call","It is required by law","To slow things down"],a:1,e:"So anyone can continue the lead without re-calling; it is not for fun, not a legal requirement, and certainly not to slow things down."},
    {q:"What drives whether a New lead ever books?",o:["The weather","Speed to lead (reaching them fast)","The lead's age","Luck"],a:1,e:"Speed to lead is one of the biggest factors; the weather, the lead's age, and luck do not decide it."}
   ]

  {
   id:'m1.3', name:'Phone Framework and Scripts', days:'Days 21 to 35', passMark:80,
   lessonHTML:`
   <div class="outcome"><b>What you'll be able to do</b><br>After this module you can run the call framework, handle the common objections, and book appointments without ever quoting a price.</div>
   <h2>The 3A Framework</h2>
   <p>Handle every objection with <strong>Acknowledge, Associate, Ask</strong>:</p>
   <ul>
   <li><strong>Acknowledge</strong> the feeling ("I understand wanting a ballpark first").</li>
   <li><strong>Associate</strong> with others ("Most folks with inherited collections feel the same way").</li>
   <li><strong>Ask</strong> for the next step ("Would you be open to bringing them in for an exact valuation?").</li>
   </ul>
   <h2>Call Opening Framework (bullet points)</h2>
   <ul>
   <li>Open with your name and the company.</li>
   <li>State the reason for the call and confirm they still want to come in.</li>
   <li>Listen for high-value trigger words (gold coins, gold jewelry, large amounts of silver).</li>
   <li>If standard items: route them to send photos to your line so the buyer can follow up.</li>
   <li>If high-value items: go straight to scheduling using two specific time options.</li>
   <li>Before ending the call, request a photo so the buyer can prepare.</li>
   </ul>
   <h2>Voicemail Framework (bullet points)</h2>
   <ul>
   <li>Say your name and the company.</li>
   <li>State the reason: they asked about getting items appraised.</li>
   <li>Give the fastest next step: text a few photos to your line.</li>
   <li>Keep it short (about 25 to 30 seconds) and say your number slowly, twice.</li>
   </ul>
   <p>Numbers change per setter, so always use <strong>[your line]</strong> as your own direct number.</p>
   <h2>The Two-Option Close</h2>
   <p>Never offer "whenever works for you." Always offer <strong>two specific times</strong>. Removing open-ended choice raises the show rate.</p>
   <h2>Common Objections</h2>
   <ul>
   <li><strong>"Price over the phone":</strong> use 3A, never give a number, ask for a photo.</li>
   <li><strong>"I need to ask my spouse":</strong> ask who is more knowledgeable, offer a speaker call, still get a photo.</li>
   <li><strong>"I researched it, it's worth X":</strong> neither confirm nor deny; explain that online prices are usually asking prices, not what collectors actually pay.</li>
   </ul>
   <div class="standard"><b>Operating Standard</b><br>Never give any number on the phone, even a range. This single discipline protects every downstream deal and keeps the buyer in control of the offer.</div>
   <div class="takeaways"><h3>Key Takeaways</h3><ul>
   <li>3A means Acknowledge, Associate, Ask, in that order.</li>
   <li>Open with name and company, confirm intent, listen for high-value trigger words.</li>
   <li>Standard items get routed to send photos to your line; high-value items go straight to scheduling.</li>
   <li>Voicemails are about 25 to 30 seconds with your number said slowly twice.</li>
   <li>Use [your line] because numbers change per setter.</li>
   <li>Always close with two specific time options, never "whenever works."</li>
   <li>For "price over phone," "ask my spouse," and "I researched it," use 3A and never quote a number.</li>
   </ul></div>`,
   test:[
    {q:"What does 3A stand for?",o:["Ask, Answer, Act","Acknowledge, Associate, Ask","Attract, Anchor, Approve","Align, Adjust, Advance"],a:1,e:"3A is Acknowledge, Associate, Ask; the other sets (Ask/Answer/Act, Attract/Anchor/Approve, Align/Adjust/Advance) are not the framework."},
    {q:"What is the correct 3A order?",o:["Ask, Acknowledge, Associate","Acknowledge, Associate, Ask","Associate, Ask, Acknowledge","Ask, Associate, Acknowledge"],a:1,e:"Acknowledge first, Associate second, Ask last; the other orders try to ask for the next step before acknowledging the feeling or building common ground."},
    {q:"What do you listen for early in the call?",o:["Their budget","High-value trigger words (gold, large silver)","Their age","Their zip code"],a:1,e:"Listen for high-value triggers like gold and large silver; their budget, age, and zip code are not what you are screening for."},
    {q:"For standard items, you route the customer to:",o:["Schedule immediately","Send photos to your line for buyer follow-up","Hang up","A manager"],a:1,e:"Standard items go to photos on your line for buyer follow-up; scheduling immediately is for high-value triggers, and hanging up or routing to a manager is wrong."},
    {q:"For high-value items you:",o:["Send them to photos only","Go straight to scheduling with two time options","Quote a price","End the call"],a:1,e:"High-value items go straight to scheduling with two time options; photos-only is for standard items, you never quote a price, and you do not end the call."},
    {q:"How long should a voicemail be?",o:["10 seconds","About 25 to 30 seconds","2 minutes","As long as needed"],a:1,e:"About 25 to 30 seconds with the number said twice; 10 seconds is too short to land a usable number, and 2 minutes or open-ended loses the listener."},
    {q:"Why use [your line] in scripts?",o:["It is a company rule with no reason","Numbers change per setter","It is faster to read","It hides the number"],a:1,e:"Because numbers change per setter, each inserts their own line; it is not a rule without reason, not about reading speed, and not about hiding the number."},
    {q:"The two-option close means:",o:["Offer any time they want","Offer two specific times","Offer one time only","Offer a callback"],a:1,e:"Offer two specific times; any time they want invites delay, one time feels like pressure, and a callback just postpones the booking."},
    {q:"Customer: 'Just give me a ballpark.' First move?",o:["Give a range","Acknowledge the feeling (3A)","Hang up","Transfer"],a:1,e:"Start with Acknowledge, no number; giving a range breaks the rule, and hanging up or transferring abandons the objection in front of you."},
    {q:"Customer: 'I need to ask my spouse.' Good approach?",o:["End the call","Ask who is more knowledgeable, offer a speaker call, get a photo","Pressure them","Quote a price"],a:1,e:"Probe who is more knowledgeable, offer a speaker call, and still capture a photo; ending the call, pressuring them, or quoting a price all lose the lead."},
    {q:"Customer: 'I researched it, it's worth X.' Correct response?",o:["Agree to X","Argue it is worth less","Neither confirm nor deny; explain asking vs paid prices","Hang up"],a:2,e:"Stay neutral and explain online prices are asking, not paid; agreeing locks you to their number, arguing it down starts a fight, and hanging up loses the lead."},
    {q:"Giving any number on the phone is:",o:["Encouraged for big deals","Against the operating standard","Required","Fine for gold"],a:1,e:"Giving any number on the phone is against the standard; it is not encouraged for big deals, not required, and not fine for gold."},
    {q:"When do you request a photo on a scheduling call?",o:["Never","Before ending the call","A week later","Only if asked"],a:1,e:"Request the photo before ending the call so the buyer can prepare; never, a week later, or only if asked would leave the buyer blind."},
    {q:"The 'Associate' step does what?",o:["Closes the sale","Relates the customer to others who felt the same","Gives a price","Ends the call"],a:1,e:"Associate relates the customer to others who felt the same; it does not close the sale, give a price, or end the call."}
   ]
  },
  {
   id:'m1.4', name:'Live Phones and Daily Rhythm', days:'Days 36 to 55', passMark:80,
   lessonHTML:`
   <div class="outcome"><b>What you'll be able to do</b><br>After this module you can run a full day of live phones, self-review your calls, and recover no-shows and cold leads.</div>
   <h2>Reps Build the Skill</h2>
   <p>This stage is about volume. You run live phones daily and review one of your own recorded calls each day to find one thing to improve. Your targets are a strong photo capture rate, a strong show rate, and accurate pipeline notes.</p>
   <h2>Daily Self-Review</h2>
   <p>At the end of each day, pick one recorded call at random and score it on these points: opening, listening, correct avatar read, framework adherence, objection handling, photo request, and the close. Pick one specific thing to do better tomorrow.</p>
   <h2>No-Show Recovery</h2>
   <p>When a customer misses an appointment, call them back quickly (within about two hours). Acknowledge the miss, offer a new time, and rebook. Try a few times before marking the lead Reschedule / No-Show with a Reason, or Lost Lead if they never re-engage.</p>
   <h2>Cold Lead Reactivation</h2>
   <p>Spend part of each day working Cold Leads (people you could not reach). Reach back out, especially when there is a reason to call (for example, a rise in metal prices). Keep daily outreach within a sensible cap so messages do not look like spam.</p>
   <div class="standard"><b>Operating Standard</b><br>Review your own calls honestly every day. The fastest way to improve is to hear yourself, pick one fix, and apply it the next day. Small daily corrections compound quickly.</div>
   <div class="takeaways"><h3>Key Takeaways</h3><ul>
   <li>This stage is about daily reps on live phones.</li>
   <li>Review one random recorded call each day and pick one thing to improve.</li>
   <li>The self-review covers opening, listening, avatar read, framework, objections, photo, and close.</li>
   <li>Call back no-shows quickly (about two hours) and rebook before marking them off.</li>
   <li>Work Cold Leads daily, especially when there is a fresh reason to call.</li>
   <li>Keep outreach within a sensible cap so it does not look like spam.</li>
   </ul></div>`,
   test:[
    {q:"What is this stage mostly about?",o:["Pricing","Daily reps on live phones","Shipping","Hiring"],a:1,e:"This stage is about daily reps on live phones; pricing, shipping, and hiring belong to other roles."},
    {q:"How do you pick the call to self-review?",o:["Your best one","At random","Your worst one","The first one"],a:1,e:"Pick one at random for an honest review; cherry-picking your best, worst, or first call would bias what you learn."},
    {q:"How often do you self-review a call?",o:["Weekly","Each day","Monthly","Never"],a:1,e:"One recorded call each day; weekly, monthly, or never is too infrequent to improve fast."},
    {q:"Which is part of the self-review?",o:["Lunch timing","Opening, listening, avatar read, framework, objections, photo, close","Commute","Email count"],a:1,e:"Those seven call points are the review; lunch timing, your commute, and email count have nothing to do with it."},
    {q:"After reviewing a call you should:",o:["Forget it","Pick one specific thing to improve tomorrow","Quit","Skip tomorrow"],a:1,e:"Pick one concrete fix for tomorrow; forgetting it, quitting, or skipping the next day wastes the review."},
    {q:"How quickly should you call back a no-show?",o:["Within about two hours","Next week","Never","Within a month"],a:0,e:"Call back within about two hours while it is fresh; next week, never, or within a month lets the lead go cold."},
    {q:"When a no-show never re-engages after several tries, you mark them:",o:["Won","Lost Lead (or Reschedule/No-Show with a Reason)","New","Wanting to Buy"],a:1,e:"Mark them Reschedule/No-Show with a Reason, or Lost Lead if they never re-engage; Won, New, and Wanting to Buy do not fit a no-show."},
    {q:"When is a great time to reactivate Cold Leads?",o:["Never","When there is a fresh reason, like a rise in metal prices","Only on holidays","At midnight"],a:1,e:"A fresh reason like a metal-price rise is the moment to reach back out; never, holidays-only, or midnight are not strategy."},
    {q:"Why keep outreach within a sensible cap?",o:["To work less","So messages do not look like spam","No reason","To slow sales"],a:1,e:"A cap keeps outreach from looking like spam; it is not about working less, slowing sales, or for no reason."},
    {q:"What is the fastest way to improve on the phones?",o:["Talk faster","Hear yourself, pick one fix, apply it next day","Take fewer calls","Avoid objections"],a:1,e:"Hear yourself, pick one fix, and apply it the next day; talking faster, taking fewer calls, or avoiding objections does not build skill."},
    {q:"Cold Leads are people who:",o:["Closed a deal","You could not reach","Want to buy","Are scheduled"],a:1,e:"Cold Leads are people you could not reach; they are not closed deals, buyers, or scheduled customers."},
    {q:"No-show recovery starts by:",o:["Marking them Lost immediately","Calling back quickly and offering a new time","Ignoring them","Sending a bill"],a:1,e:"Start by calling back fast and offering a new time; marking them Lost right away, ignoring them, or billing them all give up the deal."}
   ]
  },
  {
   id:'m1.5', name:'Buyer Shadow and Setter Promotion', days:'Days 56 to 75', passMark:80,
   lessonHTML:`
   <div class="outcome"><b>What you'll be able to do</b><br>After this module you understand what a great appointment looks like from the buyer's side and you know exactly what it takes to promote.</div>
   <h2>Shadow the Buyer</h2>
   <p>You will sit in on live appointments with a buyer. Watch how they greet, profile the customer, evaluate items, handle objections, and close. After each appointment, note one thing you could not yet do yourself and one thing you would improve on the setter side. Do not interrupt appointments and keep your phone away.</p>
   <h2>The Promotion Gate</h2>
   <p>To move up to Junior Purchaser, all of these must be true at the same time, held steady for two months:</p>
   <ul>
   <li>You have been in the role long enough to show consistency.</li>
   <li>Your pipeline notes and stages are accurate and complete.</li>
   <li>Your show rate is strong.</li>
   <li>You pass the written promotion test.</li>
   <li>You pass a recorded role-play scored by leadership.</li>
   </ul>
   <p>Promotion is signed off by leadership based on the numbers, not on tenure or relationships.</p>
   <div class="standard"><b>Operating Standard</b><br>Promotion is decided on data: accurate pipeline, strong show rate, and passing scores. This protects you (you only move up when you are truly ready) and protects the team (no weak links get promoted early).</div>
   <div class="takeaways"><h3>Key Takeaways</h3><ul>
   <li>You shadow a buyer to see greeting, profiling, evaluation, objections, and the close.</li>
   <li>During shadow you do not interrupt and you keep your phone away.</li>
   <li>After each appointment, note one thing you couldn't do yet and one setter-side improvement.</li>
   <li>Promotion requires consistency, accurate pipeline, strong show rate, a written test, and a role-play.</li>
   <li>All gates must hold at once for two months.</li>
   <li>Promotion is decided on data, not tenure or relationships.</li>
   </ul></div>`,
   test:[
    {q:"During buyer shadow you watch the buyer do what?",o:["Ship boxes","Greet, profile, evaluate, handle objections, close","File taxes","Run ads"],a:1,e:"You watch the buyer greet, profile, evaluate, handle objections, and close; shipping boxes, filing taxes, and running ads are not the appointment."},
    {q:"During shadow you should:",o:["Run the appointment","Not interrupt and keep your phone away","Take over the close","Price the items"],a:1,e:"Observe quietly with your phone away; running the appointment, taking the close, or pricing items are all the buyer's job."},
    {q:"After each shadowed appointment you note:",o:["The customer's name","One thing you couldn't do yet and one setter-side improvement","The weather","Nothing"],a:1,e:"Note one thing you could not do yet and one setter-side improvement; the customer's name, the weather, and nothing teach you nothing."},
    {q:"How many gates must be true to promote?",o:["Just the test","All of them at once","Only tenure","Only show rate"],a:1,e:"All gates must hold at once; passing just the test, only tenure, or only show rate is not enough."},
    {q:"How long must the gates hold?",o:["One day","One week","Two months","One year"],a:2,e:"The gates must hold steady for two months; one day or one week is too short, and a year is more than required."},
    {q:"Promotion is decided on:",o:["Tenure","Relationships","Data (numbers and scores)","Seniority"],a:2,e:"Promotion is decided on data; tenure, relationships, and seniority reward time or favor, not readiness."},
    {q:"Who signs off on promotion?",o:["A peer","Leadership","HR only","The customer"],a:1,e:"Leadership signs off on the numbers; a peer, HR alone, or the customer have no authority to promote."},
    {q:"Which is a promotion gate?",o:["A strong show rate","Most hours worked","Most calls dialed","Longest tenure"],a:0,e:"A strong show rate is a gate; most hours, most dials, and longest tenure measure effort or time, not results."},
    {q:"The recorded role-play is scored by:",o:["The trainee","Leadership","Another setter","No one"],a:1,e:"Leadership scores the role-play to keep the bar objective; the trainee, another setter, or no one would not."},
    {q:"Why is data-based promotion good for you?",o:["It is not","You only move up when truly ready","It is faster","It avoids tests"],a:1,e:"You move up only when truly ready; it is not faster, and it does not avoid tests, since the tests are part of the data."},
    {q:"Why is data-based promotion good for the team?",o:["No reason","No weak links get promoted early","It is cheaper","It avoids training"],a:1,e:"It keeps weak links from being promoted early; that is the reason, not cost or avoiding training."}
   ]
  }
 ]
}

   id:'m2.1', name:'Coin and Metal Identification (Deep)', days:'Days 1 to 20', passMark:90,
   lessonHTML:`
   <div class="outcome"><b>What you'll be able to do</b><br>After this deep module you can identify coins and metals on sight, recognize the key dates for every series, read karat and silver and platinum stamps, know the weights and silver content by era, and know which items must go to the specialist instead of being priced or melted.</div>
   <h2>Why This Module Is the Largest</h2>
   <p>Identification is the heart of buying. Misreading a coin, or melting a key date, is a permanent loss. Take your time here. Everything later depends on knowing this cold.</p>
   <h2>The Rarity Idea</h2>
   <p>Value comes from <strong>rarity and condition, not age</strong>. A low-mintage or key-date coin can be worth many times its metal value. When a coin might be a key date, set it aside and send it to the <strong>numismatist</strong> instead of pricing or melting it.</p>
   <h2>Mint Marks</h2>
   <ul>
   <li><strong>CC</strong> equals Carson City, the rarest. On a Morgan, CC always goes to the numismatist; never price it yourself.</li>
   <li><strong>O</strong> equals New Orleans, rare on gold.</li>
   <li><strong>S</strong> equals San Francisco, <strong>D</strong> equals Denver, <strong>P</strong> or no mark equals Philadelphia.</li>
   </ul>
   <h2>Bank Coins (Face Value Only)</h2>
   <p>These are common circulating coins worth only their face value: pennies after 1958, dimes and quarters after 1964, half dollars after 1970. Hand them back.</p>
   <h2>Silver Content by Era</h2>
   <ul>
   <li>Kennedy and Roosevelt and other dimes, quarters, halves dated <strong>1964 and earlier: 90 percent silver</strong>.</li>
   <li>Kennedy half dollars <strong>1965 to 1970: 40 percent silver</strong>.</li>
   <li>Eisenhower dollars can be 40 percent silver (the silver-clad versions).</li>
   <li>Dimes and quarters 1965 and later, and halves 1971 and later: no silver (bank coins).</li>
   </ul>
   <h2>Silver Coin Weights</h2>
   <ul>
   <li>Silver dime: about 2.5 grams.</li>
   <li>Silver quarter: about 6.25 grams.</li>
   <li>Silver half dollar: about 12.5 grams.</li>
   <li>Silver dollar (Morgan or Peace): about 26.7 grams. If it is noticeably lighter, it is likely fake.</li>
   </ul>
   <h2>Key Dates by Series (study this table closely)</h2>
   <ul>
   <li><strong>Peace dollar:</strong> 1921-P or 1928-P.</li>
   <li><strong>Morgan dollar:</strong> any CC mint mark, 1893-S, 1895-P.</li>
   <li><strong>Mercury dime:</strong> 1916-D, 1921-D.</li>
   <li><strong>Seated Liberty dime:</strong> 1841, 1875.</li>
   <li><strong>Barber dime:</strong> 1894-S, 1895-O, 1896-S.</li>
   <li><strong>Washington quarter:</strong> 1932-D, 1932-S.</li>
   <li><strong>Standing Liberty quarter:</strong> 1916, 1921.</li>
   <li><strong>Barber quarter:</strong> 1896-S, 1901-S.</li>
   <li><strong>Seated Liberty quarter:</strong> 1841, 1853, 1877, 1878.</li>
   <li><strong>Walking Liberty half:</strong> 1916 all mint marks, 1921 all mint marks.</li>
   <li><strong>Franklin half:</strong> 1955 and 1956 "Bugs Bunny" variety.</li>
   <li><strong>Barber half:</strong> 1892-O "Micro O", 1893-S, 1913, 1915.</li>
   <li><strong>Wheat or steel penny:</strong> 1909-S VDB, 1914-D, 1931-S, 1944 steel, 1943-D copper.</li>
   <li><strong>Indian Head penny:</strong> 1877, 1909-S.</li>
   <li><strong>Flying Eagle penny:</strong> 1856.</li>
   <li><strong>Large cent:</strong> 1793 to 1795, 1804.</li>
   <li><strong>Jefferson war nickel:</strong> 1942 to 1945 (35 percent silver).</li>
   <li><strong>Shield nickel:</strong> 1877, 1878, 1881.</li>
   <li><strong>Liberty (Victory) nickel:</strong> 1913 (only five made), 1883 "no cents", 1885.</li>
   <li><strong>Buffalo nickel:</strong> 1937-D three-legged, 1936 three-and-a-half-legged.</li>
   <li><strong>Half cent:</strong> 1793, 1796, 1802, 1804, and 1831 and 1836 proof-only, and 1849 to 1857.</li>
   <li><strong>Two cent piece:</strong> 1864 small motto, 1867, 1870.</li>
   <li><strong>Three cent piece:</strong> silver type 1851 and 1855 and 1868; nickel type 1883, 1884, 1885.</li>
   </ul>
   <h2>Two Facts You Will Be Asked</h2>
   <ul>
   <li><strong>VDB</strong> on the 1909-S VDB penny stands for <strong>Victor David Brenner</strong>, the designer.</li>
   <li><strong>Jefferson war nickels</strong> were made 1942 to 1945 and are <strong>35 percent silver</strong>, because nickel metal was needed for bullets and tanks during the war.</li>
   </ul>
   <h2>Gold Stamps and Purity</h2>
   <ul>
   <li><strong>10K:</strong> marked 417, 41.7 percent, or 10KT.</li>
   <li><strong>14K:</strong> marked 585, 58.5 percent, or 14KT.</li>
   <li><strong>18K:</strong> marked 750, 75 percent, or 18KT.</li>
   <li><strong>22K:</strong> marked 916, 91.6 percent, or 22KT.</li>
   <li>Reject items stamped GF, GP, HGE, 1/10, or 1/20. These are filled or plated, not solid gold.</li>
   </ul>
   <h2>Silver and Platinum Stamps</h2>
   <ul>
   <li><strong>Sterling silver:</strong> marked .925, "Sterling" written out, or "Ster". If it does not say one of these, do not buy it as silver.</li>
   <li><strong>.999 fine:</strong> should say ".999 fine silver" or ".999 fine gold".</li>
   <li><strong>Platinum:</strong> marked Platinum, Plat, PT, or 950.</li>
   </ul>
   <h2>Costume, Foreign, and Routed Items</h2>
   <ul>
   <li><strong>Costume:</strong> buy by the pound and very cheap; it is not precious metal.</li>
   <li><strong>Foreign:</strong> send to the specialist channel for experts to evaluate.</li>
   <li><strong>Rare coins, certain watches and diamonds, comics, militaria, instruments:</strong> route to the right specialist rather than pricing at the table.</li>
   </ul>
   <div class="standard"><b>Operating Standard</b><br>When unsure, never melt and never guess. Set the item aside and route it to the numismatist or the right specialist. One missed key date costs more than a day of careful checking.</div>
   <div class="takeaways"><h3>Key Takeaways</h3><ul>
   <li>Value comes from rarity and condition, not age.</li>
   <li>CC means Carson City, the rarest; on a Morgan, route CC to the numismatist.</li>
   <li>Bank coins (face value): pennies after 1958, dimes and quarters after 1964, halves after 1970.</li>
   <li>1964 and earlier dimes, quarters, halves are 90 percent silver; 1965 to 1970 halves are 40 percent silver.</li>
   <li>A real silver dollar weighs about 26.7 grams; much lighter means likely fake.</li>
   <li>Know the key dates by series: Peace 1921-P or 1928-P; Morgan any CC, 1893-S, 1895-P; Mercury 1916-D and 1921-D; Washington quarter 1932-D and 1932-S; Walking Liberty half 1916 and 1921 all mints; wheat penny 1909-S VDB, 1914-D, 1943-D copper, 1944 steel.</li>
   <li>VDB stands for Victor David Brenner.</li>
   <li>Jefferson war nickels (1942 to 1945) are 35 percent silver.</li>
   <li>Gold stamps: 10K is 417 or 41.7 percent; 14K is 585 or 58.5 percent; 18K is 750 or 75 percent; 22K is 916 or 91.6 percent.</li>
   <li>Sterling is .925, Sterling, or Ster; platinum is PT, Plat, Platinum, or 950; reject GF, GP, HGE, 1/10, 1/20.</li>
   <li>Costume is bought by the pound; foreign and rare items go to the specialist.</li>
   <li>When unsure, set aside and route; never melt or guess.</li>
   </ul></div>`,

   lessonHTML:`
   <div class="outcome"><b>What you'll be able to do</b><br>After this module you can verify gold, silver, and platinum using the magnet test, the scratch test, and the scale, and you will know the one thing you must never do.</div>
   <h2>Step 1: The Magnet Test (Always First)</h2>
   <p>Real gold, silver, and platinum are <strong>not magnetic</strong>. If a piece sticks to a strong magnet, it is fake. Test the chain or band itself, not the clasp, because clasps can contain steel springs.</p>
   <h2>Step 2: The Scratch Test (Jewelry Only)</h2>
   <p><strong>Never acid-test coins.</strong> Acid permanently destroys collector value. For gold jewelry, scratch the piece on the stone and apply acid in steps: 10K, then 14K, then 18K. If the mark stays at a level, the piece is at least that karat. For silver, the reaction tells you the type: a creamy or milky look means real sterling, while green or fizzing means plated.</p>
   <h2>Step 3: The Scale</h2>
   <p>Zero the scale before every batch. Weigh each piece and compare to the known weights from the identification module. Suspiciously light coins are likely fake.</p>
   <h2>Deductions</h2>
   <p>You pay for metal, not for stones or non-metal parts. Deduct weight for stones (more for larger stones), and deduct a large share of a pocket watch's weight for the movement and glass. For a sterling set with weighted knife handles, weigh a fork or spoon and multiply rather than weighing the filled knives.</p>
   <div class="standard"><b>Operating Standard</b><br>Magnet first, then scratch (jewelry only), then scale. Never put acid on a coin. These steps in this order protect you from fakes and protect the customer from a wrong call.</div>
   <div class="takeaways"><h3>Key Takeaways</h3><ul>
   <li>Test order is magnet first, then scratch (jewelry only), then scale.</li>
   <li>Real gold, silver, and platinum are not magnetic; if it sticks, it is fake.</li>
   <li>Test the chain or band, not the clasp, because clasps can hold steel springs.</li>
   <li>Never acid-test coins; acid destroys collector value permanently.</li>
   <li>On silver, creamy or milky means real sterling; green or fizzing means plated.</li>
   <li>Zero the scale before every batch and compare to known weights.</li>
   <li>Deduct for stones and pocket-watch movements; weigh a fork or spoon for weighted knife sets.</li>
   </ul></div>`,

    {q:"Real gold, silver, and platinum react to a magnet how?",o:["Strong pull","No attraction","Repel","Spin"],a:1,e:"Real precious metals show no magnetic attraction; they do not pull, repel, or spin."},

    {q:"Why never acid-test coins?",o:["It is slow","Acid permanently destroys collector value","It is costly","Acid runs out"],a:1,e:"Acid permanently destroys a coin's collector value; the reason is not that it is slow, costly, or that acid runs out."},
    {q:"On a silver scratch test, creamy or milky means:",o:["Plated","Real sterling","Fake","Gold"],a:1,e:"A creamy, milky reaction means real sterling; plated or fake pieces react green or fizz, and gold uses a different test."},
    {q:"On a silver scratch test, green or fizzing means:",o:["Real sterling","Plated","Platinum","Pure silver"],a:1,e:"Green or fizzing means plated, so do not buy; real sterling, platinum, and pure silver do not react that way."},

   lessonHTML:`
   <div class="outcome"><b>What you'll be able to do</b><br>After this module you can judge a pocket watch by its jewel count, tell a luxury wrist watch from a fashion watch, describe a diamond using the 4 Cs, and know exactly when to route a stone or watch to the specialist.</div>
   <h2>Pocket Watches: Jewel Counts</h2>
   <p>The jewel count is stamped on the movement (open the back to read it) and tells you the tier of the watch:</p>
   <ul>
   <li><strong>7 jewels:</strong> a standard starter watch, usually lower value.</li>
   <li><strong>15 to 20 jewels:</strong> a mid-level watch, usually about 50 to 100 dollars.</li>
   <li><strong>21 jewels and up:</strong> a high-end watch, usually about 100 to 500 dollars.</li>
   </ul>
   <p>A solid gold pocket watch case also has melt value. Weigh the case and deduct for the movement and glass, the same way you learned in the testing module.</p>
   <h2>Luxury Wrist Watches We Buy</h2>
   <p>These brands hold real value: <strong>Rolex, Patek Philippe, Audemars Piguet, Omega, Cartier, Tudor, Breitling, TAG Heuer, IWC, and Jaeger-LeCoultre</strong>. Any solid gold case of any brand also has melt value. When a luxury or vintage piece looks valuable or you are unsure, route it to the specialist rather than guessing.</p>
   <h2>Watches We Do NOT Buy</h2>
   <p>Fashion and quartz brands have little or no resale value: <strong>Fossil, Michael Kors, Invicta, Guess</strong>, and any smartwatch (Apple Watch, Samsung, Fitbit) or replica. The exception is a solid gold case, which is bought for its metal weight regardless of the name.</p>
   <h2>Diamonds: The 4 Cs</h2>
   <p>Every diamond is judged on four things:</p>
   <ul>
   <li><strong>Carat:</strong> the weight, which is the size. Bigger is rarer and worth more.</li>
   <li><strong>Cut:</strong> how well it is cut, which controls the sparkle. A better cut is worth more.</li>
   <li><strong>Color:</strong> graded from D (colorless, best) down toward Z (more yellow or brown). Less color is worth more.</li>
   <li><strong>Clarity:</strong> how few internal marks (inclusions) it has, from Flawless down to Included. Fewer inclusions is worth more.</li>
   </ul>
   <h2>When to Buy and When to Route</h2>
   <p>Small accent stones set in gold jewelry usually add little value; handle them as part of the jewelry deal and deduct their weight as you learned in testing. For any <strong>loose diamond, any stone roughly half a carat and up, or any certified (graded) stone</strong>, route it to the specialist for valuation. Diamond value swings sharply with grade, so a quick guess at the table can cost a lot.</p>
   <div class="standard"><b>Operating Standard</b><br>Buy what is clearly safe (jewel-count pocket watches, known luxury brands, solid gold cases, small accent stones in jewelry) and route what swings in value (significant or loose or certified diamonds, vintage or uncertain high-end watches) to the specialist. The specialist exists to protect the margin on the items that are easiest to misjudge.</div>
   <div class="takeaways"><h3>Key Takeaways</h3><ul>
   <li>Pocket watch jewel counts: 7 is a starter (low value), 15 to 20 is mid level (about 50 to 100 dollars), 21 and up is high end (about 100 to 500 dollars).</li>
   <li>A solid gold watch case has melt value; weigh it and deduct for the movement and glass.</li>
   <li>Luxury brands we buy include Rolex, Patek Philippe, Audemars Piguet, Omega, Cartier, Tudor, Breitling, TAG Heuer, IWC, and Jaeger-LeCoultre.</li>
   <li>We do not buy Fossil, Michael Kors, Invicta, Guess, smartwatches, or replicas, unless the case is solid gold.</li>
   <li>The diamond 4 Cs are Carat, Cut, Color, and Clarity.</li>
   <li>Color is best at D (colorless); clarity is best when Flawless with the fewest inclusions.</li>
   <li>Handle small accent stones within the jewelry deal; route loose, half-carat-and-up, or certified diamonds to the specialist.</li>
   <li>Route uncertain or vintage high-end watches to the specialist too.</li>
   </ul></div>`,

   id:'m2.3', name:'Pricing and Buying (The Deal Sheet)', days:'Days 39 to 48', passMark:80,
   lessonHTML:`
   <div class="outcome"><b>What you'll be able to do</b><br>After this module you can use the deal sheet to build an offer, read the Offer and Total Value, respect the MAX Face ceiling, and complete a clean transaction record.</div>
   <h2>The Deal Sheet Has Four Tabs</h2>
   <p>The pricing tool is a spreadsheet with four tabs along the bottom:</p>
   <ul>
   <li><strong>CALCULATOR:</strong> this is the only tab you use at the table. You enter what the customer has here.</li>
   <li><strong>Show Expenses & Info:</strong> holds the live spot prices and the show expenses. Do not edit this unless you are told to.</li>
   <li><strong>Final Count:</strong> end-of-show reconciliation.</li>
   <li><strong>Show Totals & Profit:</strong> the master totals page. It is marked "Do Not Alter This Page". Never touch it; the calculator pulls its values from here.</li>
   </ul>
   <h2>How the Calculator Is Laid Out</h2>
   <p>Each row is one item type (a coin name and denomination, or a metal like 14K). Reading left to right:</p>
   <ul>
   <li><strong>Amount:</strong> what you type in. For coins it is the count. For gold, silver, and platinum it is the weight in <strong>pennyweight (DWT)</strong>.</li>
   <li><strong>Coin and Item:</strong> the type and denomination, already filled in for you.</li>
   <li><strong>Face Value:</strong> the coin's face value, already set.</li>
   <li><strong>Times Face:</strong> the sheet calculates this for you. It is the figure that builds your offer line.</li>
   <li><strong>Total Value (the F column):</strong> the offer amount for that row, which the sheet works out from Amount, Face, and Times Face.</li>
   <li><strong>MAX Face:</strong> the most that item is worth to us. This is the ceiling. It comes from the master totals page.</li>
   </ul>
   <h2>The Two Numbers at the Top</h2>
   <ul>
   <li><strong>Offer:</strong> the sum of all your rows. This is the number you offer the customer.</li>
   <li><strong>Total Value:</strong> the value of everything at MAX Face. This is the full value basis of the lot.</li>
   </ul>
   <p>The gap between the Offer and the Total Value is the room built into the deal. You can negotiate up toward MAX Face, but you never go above MAX Face.</p>
   <h2>Prices Change Every Hour</h2>
   <p>For gold, silver, and platinum, the MAX Face values are not fixed. They recalculate automatically from the <strong>spot prices</strong> on the Show Expenses & Info tab, and those update <strong>every hour</strong> based on what we are getting for the metal. Because of this:</p>
   <ul>
   <li>Always work from the current sheet for the day, never an old copy.</li>
   <li>Never quote a metal price from memory; let the live sheet do it.</li>
   <li>You do not set or change spot prices. Leadership keeps them current.</li>
   </ul>
   <h2>Entering a Deal, Step by Step</h2>
   <ol>
   <li>Identify and verify each item using the identification and testing modules.</li>
   <li>Find the matching row on the CALCULATOR tab.</li>
   <li>Type the Amount: the count for coins, the weight in pennyweight (DWT) for precious metal.</li>
   <li>Enter collectibles in the collectibles section with their own offer and value.</li>
   <li>Read the Offer total. That is what you present, in person, never over the phone.</li>
   <li>Negotiate only up to MAX Face, never above it.</li>
   </ol>
   <h2>The Transaction Record</h2>
   <p>Every closed deal needs a complete record: the customer's identification, their signature, and the itemized list of what was purchased and paid. Keep the deal sheet printout with the record. Accurate records protect the company and are required for second-hand purchases.</p>
   <h2>If the Numbers Do Not Work</h2>
   <p>If the customer wants more than MAX Face, do not exceed the ceiling. Offer the alternative path: <strong>consignment</strong>, where the item is sold on auction for them. Move that lead to the Sent to Consignment stage.</p>
   <div class="standard"><b>Operating Standard</b><br>Work only on the CALCULATOR tab, never alter the totals page, and always use the current day's sheet because metal prices change hourly. MAX Face is the ceiling on every item. If a deal cannot work under MAX Face, pivot to consignment rather than forcing it.</div>
   <div class="takeaways"><h3>Key Takeaways</h3><ul>
   <li>The deal sheet has four tabs; you work only on the CALCULATOR tab.</li>
   <li>Never alter the Show Totals & Profit page; the calculator pulls its values from there.</li>
   <li>Amount is the count for coins and the weight in pennyweight (DWT) for gold, silver, and platinum.</li>
   <li>The sheet fills in Face Value, Times Face, the row Total Value, and MAX Face for you.</li>
   <li>Offer is the sum you present; Total Value is the value of everything at MAX Face.</li>
   <li>MAX Face is the ceiling; negotiate up toward it but never above it.</li>
   <li>Gold, silver, and platinum MAX Face values come from spot prices that change every hour, so always use the current sheet and never quote metal from memory.</li>
   <li>You do not set spot prices; leadership keeps them current.</li>
   <li>Present offers in person, keep a full record (ID, signature, itemized list, printout).</li>
   <li>If the customer wants more than MAX Face, pivot to consignment (Sent to Consignment stage).</li>
   </ul></div>`,
   test:[

    {q:"Which tab do you use at the table?",o:["Final Count","CALCULATOR","Show Totals & Profit","Show Expenses & Info"],a:1,e:"You enter items on the CALCULATOR tab; Final Count is for closed deals, Show Totals is the locked master, and Show Expenses & Info holds spot prices."},

    {q:"The 'Total Value' at the top is:",o:["What you offer","The value of everything at MAX Face","The hotel cost","The count"],a:1,e:"Total Value is the full value basis at MAX Face; it is not what you offer, the hotel cost, or the count."},
    {q:"MAX Face is:",o:["The opening offer","The ceiling, the most an item is worth to us","The spot price","The weight"],a:1,e:"MAX Face is the ceiling you never exceed; the opening offer is lower, spot is an input, and weight is just an entry."},
    {q:"You may negotiate:",o:["Above MAX Face for big deals","Up toward MAX Face but never above it","Only at the Offer number","Never"],a:1,e:"Negotiate up toward MAX Face but never above it; exceeding it for big deals breaks the rule, staying only at the Offer leaves room unused, and 'never' is wrong."},

    {q:"Where do the spot prices live?",o:["The CALCULATOR tab","The Show Expenses & Info tab","The customer's phone","Nowhere"],a:1,e:"Spot prices live on the Show Expenses & Info tab; not the CALCULATOR, the customer's phone, or nowhere."},
    {q:"Because prices change hourly you should:",o:["Use any old copy","Always use the current day's sheet","Quote from memory","Guess"],a:1,e:"Always use the current day's sheet; an old copy, memory, or a guess will be wrong on metal."},
    {q:"Who sets or changes the spot prices?",o:["You","Leadership","The customer","Each buyer"],a:1,e:"Leadership sets spot; you, the customer, and individual buyers do not."},
    {q:"Collectibles are entered:",o:["In the coin rows","In the collectibles section with their own offer and value","Not at all","On the phone"],a:1,e:"Collectibles go in their own section with their own offer and value; not in the coin rows, not skipped, and not over the phone."},
    {q:"Offers are presented:",o:["Over the phone","In person","By text","By email"],a:1,e:"Offers are presented in person; phone, text, or email quotes set expectations before the items are verified."},
    {q:"A complete transaction record includes:",o:["Just a name","ID, signature, itemized list, and the printout","A photo only","Nothing"],a:1,e:"A complete record needs ID, signature, an itemized list, and the printout; a name alone, a photo only, or nothing leaves it undocumented."},
    {q:"If the customer wants more than MAX Face you:",o:["Exceed the ceiling","Pivot to consignment","Pay anyway","Argue"],a:1,e:"If they want more than MAX Face, pivot to consignment; exceeding the ceiling, paying anyway, or arguing all break the rule."},
    {q:"A consignment deal moves the lead to which stage?",o:["Junk Lead","Sent to Consignment","Out of State","Won"],a:1,e:"It moves to Sent to Consignment; Junk Lead, Out of State, and Won do not fit a consignment."},
    {q:"The gap between Offer and Total Value represents:",o:["An error","The room built into the deal","The tax","The shipping"],a:1,e:"The gap is the negotiating room up to MAX Face; it is not an error, the tax, or the shipping."}

   id:'m2.8', name:'Logging Deals on the Final Count Page', days:'Days 49 to 55', passMark:80,
   lessonHTML:`
   <div class="outcome"><b>What you'll be able to do</b><br>After this module you can record every completed deal on the Final Count page correctly, so the day reconciles cleanly and management has accurate numbers.</div>
   <h2>Two Different Pages, Two Different Jobs</h2>
   <p>The <strong>CALCULATOR</strong> page is where you build the offer with the customer in front of you. The <strong>Final Count</strong> page is where you record each deal after it closes. They are not the same page. The CALCULATOR helps you reach a number; the Final Count is the record of what actually happened.</p>
   <h2>What You Enter for Each Completed Deal</h2>
   <p>After a customer agrees and you pay them, log the deal on the Final Count page with:</p>
   <ul>
   <li><strong>Customer name:</strong> who you bought from.</li>
   <li><strong>Check number:</strong> the number of the check you wrote them (or the payment reference).</li>
   <li><strong>Amount spent:</strong> exactly what you paid, the agreed offer.</li>
   <li><strong>Counts by category:</strong> the quantities of each coin and metal type bought, the same rows as the calculator, so the totals build correctly.</li>
   <li><strong>Final numbers:</strong> confirm the row totals and the deal total match what you paid.</li>
   </ul>
   <h2>Why Accuracy Here Matters</h2>
   <p>The Final Count page feeds the day's totals: people seen, checks written, total spent, and total value. If a check number or amount is wrong, the day will not reconcile and management sees a gap. Enter each deal right after it closes, while it is fresh, rather than trying to remember at the end of the day.</p>
   <h2>End of Day</h2>
   <p>At close, your Final Count totals should match the checks you actually wrote and the cash or payments that went out. The number of checks written and the total spent should line up. If something does not match, find it before you leave.</p>
   <div class="standard"><b>Operating Standard</b><br>Log every deal on the Final Count page the moment it closes, with the customer name, check number, amount spent, and counts. Clean entry as you go is what makes the day reconcile and keeps the numbers management relies on accurate.</div>
   <div class="takeaways"><h3>Key Takeaways</h3><ul>
   <li>The CALCULATOR page builds the offer; the Final Count page records each closed deal.</li>
   <li>For each deal, log the customer name, check number, amount spent, and the counts by category.</li>
   <li>Confirm the row totals and deal total match what you paid.</li>
   <li>The Final Count page feeds the day's totals: people seen, checks written, total spent, total value.</li>
   <li>Enter each deal right after it closes, not from memory at the end of the day.</li>
   <li>At close, checks written and total spent should line up; fix any mismatch before leaving.</li>
   </ul></div>`,
