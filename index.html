ends on bidding, and it takes time, unlike instant cash.</li>\n   <li>Explain that our fee or commission is taken from the sale, and that the exact terms are set by the consignment agreement (leadership sets the rates).</li>\n   </ul>\n   <h2>How to Set It Up</h2>\n   <ul>\n   <li>Itemize exactly what is being consigned.</li>\n   <li>Complete and sign the consignment agreement with the customer.</li>\n   <li>Tag and store the items securely with the customer's information attached.</li>\n   <li>Move the lead to the <strong>Sent to Consignment</strong> stage and note what was taken in.</li>\n   </ul>\n   <div class=\"standard\"><b>Operating Standard</b><br>Consignment is the answer when a customer wants more than MAX Face or has an item that belongs in front of collectors. Pitch the value honestly, never overpromise a final price, and always set it up with a signed agreement and the lead moved to Sent to Consignment.</div>\n   <div class=\"takeaways\"><h3>Key Takeaways</h3><ul>\n   <li>Consignment means we sell the item for the customer at auction, not buy it outright.</li>\n   <li>The customer keeps ownership until it sells; the final price is set by bidding.</li>\n   <li>Pitch it when the customer wants more than MAX Face, the item is rare or high value, or the lead wants auction.</li>\n   <li>Frame it as reaching collectors who compete; explain we handle photography, listing, and buyers.</li>\n   <li>Set expectations honestly: price depends on bidding and it takes time.</li>\n   <li>Our fee comes from the sale; exact terms are in the agreement set by leadership.</li>\n   <li>Set up: itemize, sign the agreement, tag and store securely, move the lead to Sent to Consignment.</li>\n   </ul></div>","test":[{"q":"Consignment means we:","o":["Buy the item outright","Sell the item for the customer at auction","Melt the item","Reject the item"],"a":1,"e":"Consignment means we sell it for them at auction; buying it outright, melting it, or rejecting it are different paths."},{"q":"Until the item sells at auction, who owns it?","o":["We do","The customer","The auction house","No one"],"a":1,"e":"The customer keeps ownership until it sells; not us, not the auction house, and ownership does not vanish."},{"q":"The final consignment price is set by:","o":["The buyer","Bidding","The customer alone","Spot price"],"a":1,"e":"Bidding sets the final price; a buyer's offer is the cash path, the customer cannot dictate the hammer, and spot only drives melt."},{"q":"A good time to pitch consignment is when:","o":["The customer takes the cash offer","The customer wants more than MAX Face","The item is junk","The item is costume"],"a":1,"e":"Pitch it when they want more than your cash offer; not when they take the cash, and not for junk or costume."},{"q":"Consignment also fits items that are:","o":["Common bank coins","Rare or high value, better in front of collectors","Plated","Foreign junk"],"a":1,"e":"It fits rare or high-value items collectors compete for; common bank coins, plated pieces, and foreign junk do not."},{"q":"How do you frame the pitch?","o":["As a last resort","As a way to reach collectors who compete for the item","As a favor","As a loan"],"a":1,"e":"Frame it as reaching collectors who compete for the item; not as a last resort, a favor, or a loan."},{"q":"What do you tell them we handle?","o":["Nothing","Photography, listing, and putting it in front of buyers","Only storage","Only shipping"],"a":1,"e":"We handle photography, listing, and the buyer audience; not 'nothing', storage only, or shipping only."},{"q":"Setting expectations honestly means saying:","o":["The price is guaranteed","The final price depends on bidding and it takes time","It sells instantly","It always sells high"],"a":1,"e":"Honest expectations: the price depends on bidding and it takes time; guaranteeing a price, an instant sale, or 'always sells high' are overpromises."},{"q":"The consignment fee or commission:","o":["Does not exist","Comes from the sale, with terms set by the agreement","Is paid upfront by the customer","Is set by the buyer"],"a":1,"e":"The fee comes from the sale with terms in the agreement; it is not nonexistent, paid upfront by the customer, or set by the buyer."},{"q":"Setting up a consignment includes:","o":["Just a handshake","Itemize, sign the agreement, tag and store, update the lead stage","Paying cash","Melting items"],"a":1,"e":"Setup is itemize, sign, tag and store, and update the lead; a handshake, paying cash, or melting are not it."},{"q":"After setting up consignment, the lead moves to:","o":["Won","Sent to Consignment","Junk Lead","Out of State"],"a":1,"e":"The lead moves to Sent to Consignment; not Won, Junk Lead, or Out of State."},{"q":"Should you overpromise a final auction price?","o":["Yes, to close it","No, never overpromise","Only for gold","Only for rare coins"],"a":1,"e":"Never overpromise, because bidding decides the price; doing it to close, or only for gold or rare coins, is still overpromising."},{"q":"A customer wants more than your cash offer on a rare piece. You:","o":["Pay what they ask","Pitch consignment","Reject the item","Lowball again"],"a":1,"e":"Pitch consignment: a rare piece may fetch more from competing collectors. Paying what they ask can break the ceiling, rejecting it loses the item, and lowballing again just sours the room."},{"q":"The customer wants more than MAX Face. The right tool is:","o":["A bigger check","Consignment","Arguing","Walking away"],"a":1,"e":"Pivot to consignment when they want more than MAX Face; a bigger check, arguing, or walking away are wrong."},{"q":"The buy rate on an item would be too thin to profit. Often the better path is:","o":["Buy it anyway at a loss","Consignment, which usually nets more in that case","Reject the customer","Pay over MAX Face"],"a":1,"e":"Consignment usually nets more when the buy would be too thin; buying at a loss, rejecting, or overpaying are worse."},{"q":"The consignment pitch should be delivered:","o":["As a last-second mumble","Clearly and confidently, as a real alternative that keeps the item in play","Only if asked","Never"],"a":1,"e":"Deliver consignment clearly and confidently as a real alternative; mumbling it, waiting to be asked, or skipping it loses the item."},{"q":"A customer wants 30 percent more than MAX Face. The right path is:","o":["Pay it","Consignment","Argue","Walk away"],"a":1,"e":"Pivot to consignment when they want more than MAX Face; paying, arguing, or walking away are wrong."},{"q":"A high-value item that would be a thin buy is often better:","o":["Bought at a loss","On consignment","Rejected","Paid over MAX Face"],"a":1,"e":"A thin-margin high-value item is often better on consignment; a loss buy, rejection, or overpaying are worse."},{"q":"The consignment pitch should stress:","o":["A guaranteed price","A potentially higher return by reaching the right buyer","A loan option","Storage"],"a":1,"e":"Stress the potential for a higher return by reaching the right buyer; not a guarantee, a loan, or storage."},{"q":"You pivot to consignment when:","o":["The customer is friendly","You cannot reach a deal within MAX Face","It is late","The item is small"],"a":1,"e":"Pivot when a deal is not reachable within MAX Face; friendliness, time, or size are not the trigger."},{"q":"A 3,000 total-value item will not close even after escalation. You:","o":["Exceed MAX Face","Pivot to consignment so it stays in play","Let it walk","Pay the asking number"],"a":1,"e":"Pivot to consignment after escalation fails; exceeding MAX Face, letting it walk, or paying the asking number break the rules."},{"q":"Consignment keeps the item:","o":["Walking out the door","In play instead of leaving the building","In storage forever","Off the books"],"a":1,"e":"Consignment keeps the item in play rather than walking out; it is not lost, stored forever, or off the books."},{"q":"Offering consignment only after the customer has left means:","o":["No harm","You lose the item; offer it before they walk","A better deal","More margin"],"a":1,"e":"Offering too late loses the item, so offer before they walk; it does not help, improve the deal, or add margin."}],"comp":"Give a scenario where the customer wants more than MAX Face or the buy rate is too thin. The trainee must identify the consignment trigger and deliver the consignment pitch clearly. Pass only on the correct trigger and a clean pitch."},{"id":"m2.5","name":"Supervised Buying","passMark":85,"lessonHTML":"\n   <div class=\"outcome\"><b>What you'll be able to do</b><br>After this module you can run live appointments on your own with a manager nearby, then fully solo, while hitting your targets.</div>\n   <h2>How Supervision Steps Down</h2>\n   <p>First, a manager sits with you and steps in only to prevent a real mistake (a missed key date, a skipped test, a deal that breaks the rules). Next, the manager is nearby but not at the table. Finally, you run appointments solo with an end-of-day review.</p>\n   <h2>Your Targets</h2>\n   <p>You should be closing a strong share of appointments, keeping deals within the pricing rules, and capturing a customer review on every closed deal.</p>\n   <h2>The Daily Review</h2>\n   <p>Each day, your numbers are reviewed: how many customers you saw, how many you bought from, your average result, reviews captured, and any rule issues. Reporting must be honest; numbers are checked against the records.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>The manager never takes over your appointment; they only prevent a real mistake. You learn by doing. Honest daily numbers are how you and your manager find the next thing to improve.</div>\n   <div class=\"takeaways\"><h3>Key Takeaways</h3><ul>\n   <li>Supervision steps down: manager at the table, then nearby, then you solo.</li>\n   <li>The manager steps in only to prevent a real mistake, never to take over.</li>\n   <li>Targets: close a strong share, keep deals within the rules, capture a review on every closed deal.</li>\n   <li>Your daily numbers are reviewed and checked against the records.</li>\n   <li>Reporting must be honest.</li>\n   </ul></div>","test":[{"q":"At first, the manager steps in only to:","o":["Take over","Prevent a real mistake","Chat","Critique tone"],"a":1,"e":"At first the manager steps in only to prevent a real mistake; not to take over, chat, or critique your tone."},{"q":"How does supervision change over time?","o":["Stays the same","Steps down: at table, then nearby, then solo","Increases","Ends day one"],"a":1,"e":"Supervision steps down from at the table, to nearby, to solo; it does not stay the same, increase, or end on day one."},{"q":"You should capture a review on:","o":["No deals","Every closed deal","Big deals only","Random deals"],"a":1,"e":"Capture a review on every closed deal; no deals, big deals only, or random misses leave reviews uncollected."},{"q":"Deals must stay:","o":["Above the rules","Within the pricing rules","Off the books","Unrecorded"],"a":1,"e":"Deals must stay within the pricing rules; above the rules, off the books, or unrecorded all create problems."},{"q":"Your daily numbers are:","o":["Ignored","Reviewed and checked against the records","Secret","Optional"],"a":1,"e":"Your numbers are reviewed and checked against records; ignored, secret, or optional would let problems hide."},{"q":"Reporting your numbers must be:","o":["Optional","Honest","Rounded up","Hidden"],"a":1,"e":"Reporting must be honest because numbers are verified; rounding up, hiding, or treating it as optional breaks trust."},{"q":"Does the manager take over your appointment?","o":["Yes, often","No, only prevents a real mistake","Always","On big deals"],"a":1,"e":"No, the manager only prevents a real mistake; not often, always, or on big deals."},{"q":"What is reviewed each day?","o":["Only lunch","Customers seen, bought, average result, reviews, rule issues","Nothing","Commute"],"a":1,"e":"Those points are the daily review; only lunch, nothing, and your commute are not."},{"q":"How do you learn in this stage?","o":["By watching only","By doing, with a safety net","By reading","By testing only"],"a":1,"e":"You learn by doing with a safety net; watching, reading, or testing alone does not build the skill."},{"q":"Honest daily numbers help you:","o":["Look good only","Find the next thing to improve","Avoid work","Skip review"],"a":1,"e":"Honest numbers reveal the next thing to improve; looking good only, avoiding work, or skipping review defeats the point."},{"q":"Over time, supervision:","o":["Stays the same","Steps down: at the table, then nearby, then solo","Increases","Ends on day one"],"a":1,"e":"Steps down from at the table, to nearby, to solo, as you prove yourself. It does not stay constant, it does not increase, and it does not end on day one before you are ready."},{"q":"You should capture a customer review on:","o":["Big deals only","Every closed deal","No deals","Random deals"],"a":1,"e":"Every closed deal: review volume protects the rating that drives the business. Big deals only, none, or random misses leave easy reviews uncollected."},{"q":"In supervised buying you learn mainly by:","o":["Watching only","Doing, with a safety net","Reading only","Testing only"],"a":1,"e":"Doing, with a safety net: real appointments under supervision build the skill. Watching, reading, or testing alone never builds the hands-on ability."},{"q":"During supervised buying, the senior is present to:","o":["Do your job for you","Confirm pricing and catch mistakes before money moves","Watch silently and never help","Slow you down"],"a":1,"e":"The senior confirms pricing and catches mistakes before money moves; they are not doing your job, idle, or there to slow you."},{"q":"You disagree with the senior's pricing call during a supervised buy. You:","o":["Override them","Defer and learn; they hold the sign-off","Argue with the customer present","Walk off"],"a":1,"e":"Defer and learn since they hold the sign-off; overriding, arguing in front of the customer, or walking off is wrong during supervision."},{"q":"The goal of supervised buying is to:","o":["Fill time","Build reps and prove you price correctly under watch","Avoid solo buying","Skip the deal sheet"],"a":1,"e":"It builds reps and proves you can price correctly under observation; it is not filler or a way to avoid solo work or paperwork."},{"q":"An unusual coin appears during a supervised buy. You:","o":["Guess, since a senior is watching","Still look it up or route it; supervision is not a license to guess","Pay melt","Ignore it"],"a":1,"e":"Look it up or route it even under supervision; a watching senior is not permission to guess, pay melt, or ignore it."},{"q":"Supervised buys are recorded:","o":["Loosely, since a senior is there","The same as solo deals: full deal sheet and Final Count","Only if large","Never"],"a":1,"e":"Record supervised buys the same as solo deals; loose, large-only, or no recording breaks the system."},{"q":"The senior signs off on several of your supervised buys. This signals:","o":["You can ignore rules now","You are pricing correctly and building toward more independence","Supervision never ends","You can skip lookups"],"a":1,"e":"Sign-offs signal you are pricing correctly and building independence; they do not waive the rules or lookups."},{"q":"Supervised buying exists to:","o":["Fill the schedule","Build reps and verify your pricing under watch","Avoid solo work","Skip paperwork"],"a":1,"e":"It builds reps and verifies pricing under observation; it is not filler, avoidance, or a paperwork shortcut."},{"q":"A senior catches a pricing error during your supervised buy. You:","o":["Argue","Learn from it and correct it before paying","Ignore them","Pay anyway"],"a":1,"e":"Learn and correct before paying; arguing, ignoring, or paying anyway repeats the error."},{"q":"Supervised deals are documented:","o":["Loosely","Fully, the same as solo deals","Only if large","Never"],"a":1,"e":"Document supervised deals fully like solo ones; loose, large-only, or no documentation breaks the system."},{"q":"After several clean supervised buys, you:","o":["Can ignore rules","Move toward more independence","Stop buying","Skip lookups"],"a":1,"e":"Clean supervised buys move you toward independence; they do not waive rules or lookups."}],"comp":"Observe the trainee complete supervised buys with a senior present. Pass only when they price correctly, follow the rules (escalation, MAX Face, lookups), and record each deal fully under observation."},{"id":"m2.6","name":"Solo Buying and JP Promotion","passMark":85,"lessonHTML":"\n   <div class=\"outcome\"><b>What you'll be able to do</b><br>After this module you can run buying fully solo and you know exactly what it takes to promote toward a manager track.</div>\n   <h2>Run It Solo</h2>\n   <p>Run appointments on your own for a stretch of days, keeping your numbers strong and your records clean. Pass a random check of your recent deals with no rule issues.</p>\n   <h2>The Promotion Gate</h2>\n   <p>To promote toward a manager track, all of these must be true at the same time, held for two months:</p>\n   <ul>\n   <li>Enough consistent time in the role.</li>\n   <li>Strong close rate and healthy deals.</li>\n   <li>Strong customer reviews.</li>\n   <li>No rule or pricing issues.</li>\n   <li>Pass a deal-records check with no issues.</li>\n   <li>You have helped train at least one setter (proving you can teach the system, not just run it).</li>\n   </ul>\n   <p>Then you choose your track: <strong>Roadshow Sales Manager</strong> or <strong>Local Office Manager</strong>. Leadership signs off based on the numbers.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>A manager must be able to teach, not just sell. Helping train a setter is part of the gate because the whole system grows only when good people can replicate themselves.</div>\n   <div class=\"takeaways\"><h3>Key Takeaways</h3><ul>\n   <li>Run buying solo with strong numbers and clean records.</li>\n   <li>Pass a random deal-records check with no rule issues.</li>\n   <li>Promotion requires consistency, strong close rate, strong reviews, no rule issues, and a clean records check.</li>\n   <li>You must have helped train at least one setter.</li>\n   <li>All gates hold for two months; leadership signs off on the numbers.</li>\n   <li>You then choose Roadshow Sales Manager or Local Office Manager.</li>\n   </ul></div>","test":[{"q":"To promote, how many gates must be true at once?","o":["Just one","All of them","Only the test","Only tenure"],"a":1,"e":"All gates must be true at once; just one, only the test, or only tenure is not enough."},{"q":"How long must the gates hold?","o":["One day","One week","Two months","One year"],"a":2,"e":"The gates hold for two months; one day or one week is too short, and a year is more than required."},{"q":"A required gate is that you have:","o":["Worked the most hours","Helped train at least one setter","The longest tenure","Made the most calls"],"a":1,"e":"A gate is having helped train a setter, proving you can teach; most hours, longest tenure, and most calls measure effort, not teaching."},{"q":"The deal-records check must show:","o":["A few issues","No rule issues","One issue","Any result"],"a":1,"e":"The records check must show no rule issues; a few, one, or 'any result' would fail the gate."},{"q":"Promotion is signed off by:","o":["A peer","Leadership, on the numbers","HR only","The customer"],"a":1,"e":"Leadership signs off on the numbers; a peer, HR alone, or the customer cannot."},{"q":"After the gate you choose between:","o":["Quit or stay","Roadshow Sales Manager or Local Office Manager","Two offices","Sales or HR"],"a":1,"e":"After the gate you choose Roadshow Sales Manager or Local Office Manager; quit-or-stay, two offices, or sales-or-HR are not the branch."},{"q":"Why is training a setter part of the gate?","o":["To fill time","A manager must be able to teach, not just sell","HR rule","No reason"],"a":1,"e":"Because a manager must teach, not just sell, training a setter is the proof; it is not to fill time, an HR rule, or for no reason."},{"q":"Solo buying requires:","o":["Sloppy records","Strong numbers and clean records","No reviews","Breaking rules"],"a":1,"e":"Solo buying requires strong numbers and clean records; sloppy records, no reviews, or breaking rules disqualify you."},{"q":"Which is a promotion gate?","o":["Strong customer reviews","Most overtime","Fewest breaks","Loudest voice"],"a":0,"e":"Strong customer reviews are a gate; most overtime, fewest breaks, and loudest voice are not results."},{"q":"Healthy deals means deals that:","o":["Break the rules","Stay within the pricing rules","Skip records","Avoid reviews"],"a":1,"e":"Healthy deals stay within the pricing rules; breaking rules, skipping records, or avoiding reviews are unhealthy."},{"q":"Promotion to Junior Purchaser is decided on:","o":["Tenure","Data and results","Relationships","Seniority"],"a":1,"e":"Data and results, which keeps promotion fair and earned. Tenure, relationships, and seniority reward time or favor instead of proven ability."},{"q":"Healthy deals are deals that:","o":["Break the rules for volume","Stay within the pricing rules","Skip the records","Avoid reviews"],"a":1,"e":"Stay within the pricing rules: that is what makes a deal sustainable. Breaking rules for volume, skipping records, or avoiding reviews all create problems later."},{"q":"Who signs off on the promotion?","o":["A peer","Leadership","HR only","The customer"],"a":1,"e":"Leadership signs off on the numbers. A peer lacks the authority, HR alone does not decide, and the customer has no role in promotion."},{"q":"Before going solo you must consistently:","o":["Work the most hours","Hit targets within the rules","Close every single deal","Skip testing to be faster"],"a":1,"e":"Consistently hit targets within the rules: that proves you are ready. Most hours is effort not results, closing every deal is unrealistic, and skipping testing creates losses."},{"q":"Why is data-based promotion good for you?","o":["It is faster","You move up only when truly ready","It avoids tests","It is cheaper"],"a":1,"e":"You move up only when truly ready, so you succeed in the next role. It is not about speed or cost, and the tests are part of the data, not avoided."},{"q":"Running solo, you keep your numbers strong and your records:","o":["Loose","Clean and audit-ready","Only in your head","End-of-month"],"a":1,"e":"Keep records clean and audit-ready; loose, memory-only, or delayed records fail an audit."},{"q":"A random check of your solo deals finds a MAX Face violation. This is:","o":["No big deal","A rule issue that blocks promotion","Rewarded","Ignored"],"a":1,"e":"A MAX Face violation is a rule issue that blocks promotion; it is not minor, rewarded, or ignored."},{"q":"Buying solo means you decide, but the rules:","o":["No longer apply","Still apply: escalation, MAX Face, and lookups","Are optional","Apply only to large deals"],"a":1,"e":"The rules still apply solo; they are not waived, optional, or size-limited."},{"q":"A 2500-plus total-value deal is about to walk while you are solo. You:","o":["Let it walk","Still escalate to the roadshow manager or another closer, then consignment if needed","Exceed MAX Face","Lower your offer"],"a":1,"e":"Escalate even when solo, then pivot to consignment if needed; letting it walk, breaking MAX Face, or lowering the offer fail the rule."},{"q":"A clean stretch of solo appointments with strong numbers earns:","o":["Nothing","The junior purchaser promotion, with sign-off","An automatic raise only","A different job"],"a":1,"e":"It earns the junior purchaser promotion with sign-off; it is not nothing, a raise alone, or a transfer."},{"q":"An item you cannot value comes up while solo. You:","o":["Guess, since no one is watching","Look it up or route it; never guess","Pay melt","Reject it"],"a":1,"e":"Look it up or route it even with no one watching; guessing, melt, or rejecting risks a costly miss."},{"q":"Buying solo means the rules:","o":["No longer apply","Still apply in full","Apply only to big deals","Are optional"],"a":1,"e":"All rules still apply solo; they are not waived, size-limited, or optional."},{"q":"A random audit finds your solo records clean. This supports:","o":["A demotion","Your promotion","Nothing","A warning"],"a":1,"e":"Clean audited records support your promotion; they are not grounds for demotion or a warning."},{"q":"Unsure on a solo deal, you:","o":["Guess to keep moving","Look it up or route it; never guess","Pay melt","Reject it"],"a":1,"e":"Look it up or route it solo; guessing, paying melt, or rejecting risks a costly miss."}],"comp":"Have the trainee run appointments solo, then audit a random sample of their recent deals. Pass only if records are clean and audit-ready with no rule issues."}]},{"id":"tier3a","n":"IIIA","name":"Roadshow Sales Manager","sub":"5 modules","modules":[{"id":"m3a.1","name":"Roadshow Planning","passMark":85,"lessonHTML":"\n   <div class=\"outcome\"><b>What you'll be able to do</b><br>After this module you can run the full pre-event countdown and arrive set up and ready before the first customer.</div>\n   <h2>The Countdown</h2>\n   <ul>\n   <li><strong>Two weeks out:</strong> confirm the venue and room, brief the marketing lead, set staffing, and schedule the equipment to ship.</li>\n   <li><strong>One week out:</strong> confirm marketing is live and pulling interest, confirm the supplies kit is complete, and test the camera and router kit.</li>\n   <li><strong>Three days out:</strong> pull the appointment count. If it is low, escalate to the marketing lead for a boost. Print transaction sheets.</li>\n   <li><strong>One day out:</strong> arrive in the afternoon, set the room, the router, the cameras, the sign-in tablet, and the scale. Photograph the setup and send it to the team channel.</li>\n   </ul>\n   <h2>Room Setup</h2>\n   <p>The customer table faces the door. There is a back table for stored items. Put the sign-in tablet and signage where customers see it as they enter.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>The setup photo the day before is the first signal of how the show will run. A clean, complete setup predicts a clean show. Never skip the countdown steps.</div>\n   <div class=\"takeaways\"><h3>Key Takeaways</h3><ul>\n   <li>Two weeks out: confirm venue and room, brief marketing, set staffing, schedule equipment shipping.</li>\n   <li>One week out: confirm marketing is live, supplies complete, camera and router kit tested.</li>\n   <li>Three days out: pull the appointment count and escalate to marketing if low; print transaction sheets.</li>\n   <li>One day out: arrive in the afternoon, set room, router, cameras, tablet, scale; photograph setup.</li>\n   <li>Customer table faces the door; sign-in tablet and signage are visible at entry.</li>\n   </ul></div>","test":[{"q":"When do you confirm the venue and room?","o":["Three days out","One week out","Two weeks out","Day of"],"a":2,"e":"Confirm the venue and room two weeks out; three days, one week, or day-of is too late for that big-picture step."},{"q":"When do you confirm marketing is live and test the camera/router kit?","o":["Two weeks out","One week out","Three days out","Day of"],"a":1,"e":"Confirm marketing and test the kit one week out; two weeks is for venue, three days for sheets, and day-of is too late."},{"q":"What do you do three days out if the appointment count is low?","o":["Cancel","Escalate to the marketing lead for a boost","Wait","Lower prices"],"a":1,"e":"Escalate to marketing for a boost; canceling is drastic, waiting wastes the window, and lowering prices does not fill a calendar."},{"q":"When do you set up the room, router, cameras, tablet, and scale?","o":["Two weeks out","One week out","One day out","Day of, during the show"],"a":2,"e":"Set up the gear one day out; two weeks and one week are earlier planning steps, and day-of during the show is too late."},{"q":"After setup the day before you should:","o":["Go home","Photograph the setup and send it to the team channel","Start buying","Tear down"],"a":1,"e":"Photograph the setup and post it; going home, buying, or tearing down all skip the check."},{"q":"The customer table should face:","o":["The wall","The door","The window","Away from everyone"],"a":1,"e":"The table faces the door so you can greet arrivals; the wall, window, or away leaves you blind to who enters."},{"q":"Where do the sign-in tablet and signage go?","o":["Hidden","Where customers see them as they enter","In the back","In a closet"],"a":1,"e":"Place them where customers see them on entry; hidden, in the back, or in a closet defeats the purpose."},{"q":"What does the setup photo signal?","o":["Nothing","How the show will run","The weather","The hotel brand"],"a":1,"e":"A clean, complete setup predicts a clean show; it is not 'nothing', the weather, or the hotel brand."},{"q":"Two weeks out also includes:","o":["Tearing down","Briefing marketing, setting staffing, scheduling equipment shipping","Final count","Buying"],"a":1,"e":"Two weeks out also covers briefing marketing, staffing, and scheduling shipping; tearing down, the final count, and buying happen at the show."},{"q":"What is printed three days out?","o":["Posters","Transaction sheets","Menus","Nothing"],"a":1,"e":"Print transaction sheets three days out; posters are marketing, menus are unrelated, and 'nothing' skips a step."},{"q":"Two weeks out you:","o":["Print transaction sheets","Confirm venue and room, brief marketing, set staffing, schedule equipment shipping","Tear down","Do the final count"],"a":1,"e":"Two weeks out is the big-picture setup: venue, marketing, staffing, shipping. Printing sheets is a three-days-out task, and teardown and final count happen at the end of the show, not before it."},{"q":"Three days out the appointment count is low. You:","o":["Cancel the show","Escalate to the marketing lead for a boost","Lower prices","Wait and hope"],"a":1,"e":"Escalate to marketing for a boost: there is still time to drive appointments. Canceling is drastic, lowering prices does not fill a calendar, and waiting wastes the window."},{"q":"One day out you:","o":["Ship the equipment","Set the room, router, cameras, tablet, and scale, then photograph it","Brief marketing","Do the final count"],"a":1,"e":"One day out you set up the room and gear and photograph it. Shipping equipment and briefing marketing are earlier tasks, and the final count is an end-of-show task."},{"q":"After setup the day before you:","o":["Go home immediately","Photograph the setup and send it to the team channel","Start buying","Tear down"],"a":1,"e":"Photograph the setup and post it: it is the first signal the show will run clean. Going home skips that check, buying has not started, and teardown is for the end."},{"q":"Two weeks out from a roadshow, you:","o":["Wait and see","Confirm the venue, brief marketing, set staffing, and schedule equipment shipping","Only book the hotel","Do nothing until the week of"],"a":1,"e":"Two weeks out you confirm venue, brief marketing, set staffing, and schedule shipping; waiting or doing the bare minimum risks an unready show."},{"q":"One week out, you:","o":["Relax","Confirm marketing is live, the supplies kit is complete, and test the camera and router kit","Cancel staffing","Skip the equipment test"],"a":1,"e":"One week out you confirm marketing, the kit, and test equipment; relaxing or skipping the test invites failures on show day."},{"q":"Three days out, the appointment count is low. You:","o":["Hope it improves","Escalate to the marketing lead for a boost","Cancel the show","Lower prices"],"a":1,"e":"Escalate a low count to the marketing lead for a boost; hoping, canceling, or cutting prices are not the planning response."},{"q":"Before the show you print:","o":["Nothing","Transaction and deal sheets","Only business cards","The lease"],"a":1,"e":"Print transaction and deal sheets ahead; nothing, cards only, or the lease miss the operational need."},{"q":"Equipment is shipped:","o":["Whenever it is convenient","On schedule, with tracking recorded","Without tracking","Day-of"],"a":1,"e":"Ship on schedule with tracking recorded; convenience, no tracking, or day-of shipping risks arriving without gear."},{"q":"Arriving set up before the first customer requires:","o":["Improvising day-of","Running the full pre-event countdown","Luck","A bigger team"],"a":1,"e":"It requires running the full countdown; improvising, luck, or extra people do not substitute for the process."},{"q":"Marketing is not pulling interest one week out. You:","o":["Wait","Escalate to the marketing lead for a boost","Cancel","Cut prices"],"a":1,"e":"Escalate to the marketing lead for a boost; waiting, canceling, or cutting prices are not the planning move."},{"q":"Equipment must arrive:","o":["Day-of, untracked","Before setup, shipped on schedule with tracking","Whenever","After the first customer"],"a":1,"e":"It must arrive before setup, shipped on schedule with tracking; the other options risk arriving without gear."}],"comp":"Have the trainee walk the full pre-event countdown for a real or mock show. Pass only if every checkpoint and the low-appointment escalation are covered."},{"id":"m3a.2","name":"Roadshow Setup: Router, Cameras, Shipping","passMark":85,"lessonHTML":"\n   <div class=\"outcome\"><b>What you'll be able to do</b><br>After this module you can set up the internet, the cameras, the sign-in tablet, and ship inventory correctly, step by step.</div>\n   <h2>Internet Router (in order)</h2>\n   <ol>\n   <li>Connect your laptop to the venue WiFi first and confirm the internet works.</li>\n   <li>Connect to the travel router's own network.</li>\n   <li>Open the router's admin page in a browser and log in.</li>\n   <li>Use the repeater or scan option to select the venue WiFi and enter its password.</li>\n   <li>Confirm the connection succeeds, then let the cameras and tablet join the router.</li>\n   <li>Keep the router on wall power. Connect devices by WiFi, not by cable.</li>\n   </ol>\n   <h2>Cameras</h2>\n   <p>Place cameras to cover the scale, both sides of the customer table, the back table with stored items, and the entry or lobby. Confirm every camera is live before the show opens. If a camera is down, pause until it is fixed; running without full coverage is not allowed.</p>\n   <h2>Sign-In Tablet</h2>\n   <p>The tablet runs the sign-in form. Use the color codes consistently: one color for bought, one for no sale, one for an offer made and awaiting a response, and one for a customer waiting. Add the buyer's initials to each row.</p>\n   <h2>Shipping</h2>\n   <ul>\n   <li>Cap each box at the set maximum value.</li>\n   <li>Tape the box well: seal the bottom, wrap the middle, and overlap the ends.</li>\n   <li>Label the outside with the city, state, and box number.</li>\n   <li>No breakables and no recently made firearms. Ship comics and cards separately and flat.</li>\n   <li>Sort items into the standard bags before boxing.</li>\n   <li>Record the tracking number.</li>\n   </ul>\n   <div class=\"standard\"><b>Operating Standard</b><br>Connect to venue WiFi first, then the router, then let devices join. Never run the show with a camera down. Every box gets taped, labeled, capped in value, and tracked. These steps prevent lost internet, lost coverage, and lost inventory.</div>\n   <div class=\"takeaways\"><h3>Key Takeaways</h3><ul>\n   <li>Router order: laptop to venue WiFi first, then router network, then admin page, then select venue WiFi, then let devices join.</li>\n   <li>Keep the router on wall power; connect devices by WiFi, not cable.</li>\n   <li>Cameras cover the scale, both sides of the customer table, the back table, and the entry.</li>\n   <li>If a camera is down, pause the show; full coverage is required.</li>\n   <li>Use consistent tablet color codes and add buyer initials to each row.</li>\n   <li>Boxes: cap the value, tape bottom-middle-overlap, label city/state/box number, record tracking.</li>\n   <li>No breakables or recent firearms; ship comics and cards separately and flat.</li>\n   </ul></div>","test":[{"q":"What do you connect to first when setting up internet?","o":["The router network","The venue WiFi, to confirm internet works","The cameras","The tablet"],"a":1,"e":"Confirm the venue WiFi works first; if the venue line is dead nothing downstream works, so the router, cameras, and tablet come after."},{"q":"After the venue WiFi, you connect to:","o":["The cameras","The travel router's own network","The scale","Nothing"],"a":1,"e":"Next connect to the router's own network; the cameras and scale are later, and 'nothing' stalls the build."},{"q":"How do devices connect to the router?","o":["By cable","By WiFi","By Bluetooth","They do not"],"a":1,"e":"Devices join by WiFi with the router on wall power; not by cable or Bluetooth, and they do connect."},{"q":"Cameras should cover:","o":["Only the scale","Scale, both sides of the customer table, back table, and entry","Only the door","Only the lobby"],"a":1,"e":"Full coverage of the scale, both sides of the table, the back table, and the entry; only the scale, door, or lobby leaves blind spots."},{"q":"If a camera is down you:","o":["Keep going","Pause until it is fixed","Ignore it","Cover it with tape"],"a":1,"e":"Pause until it is fixed, since full coverage is required; keeping going, ignoring it, or taping over it leaves a blind spot."},{"q":"The sign-in tablet color codes should be used:","o":["Randomly","Consistently, with buyer initials on each row","Never","Only for buys"],"a":1,"e":"Use them consistently with buyer initials; random use makes them meaningless, never loses tracking, and buys-only ignores other statuses."},{"q":"Each shipping box is capped at:","o":["Any amount","The set maximum value","One item","Unlimited"],"a":1,"e":"Cap each box at the set maximum value to limit risk; any amount or unlimited defeats the cap, and one item is not the rule."},{"q":"How do you tape a box?","o":["One strip","Seal the bottom, wrap the middle, overlap the ends","Staples","Glue"],"a":1,"e":"Seal the bottom, wrap the middle, and overlap the ends; one strip, staples, or glue will not hold."},{"q":"The box label shows:","o":["Nothing","City, state, and box number","Your name","The value"],"a":1,"e":"The label shows city, state, and box number; not 'nothing', your name, or the value, which would advertise the contents."},{"q":"Which may NOT be shipped?","o":["Coins","Breakables and recently made firearms","Sterling","Gold"],"a":1,"e":"Breakables and recently made firearms may not be shipped; coins, sterling, and gold ship normally."},{"q":"Comics and cards are shipped:","o":["With coins","Separately and flat","In metal bags","Never"],"a":1,"e":"Comics and cards ship separately and flat to avoid damage; not with coins, in metal bags, or never."},{"q":"After boxing you must:","o":["Forget it","Record the tracking number","Hide the box","Open it again"],"a":1,"e":"Record the tracking number after boxing; forgetting it, hiding the box, or reopening it breaks the chain of custody."},{"q":"Before boxing, items are:","o":["Loose","Sorted into the standard bags","Melted","Photographed only"],"a":1,"e":"Sort items into the standard bags first; loose, melted, or photographed-only is not how you prep for shipping."},{"q":"The first step when setting up the internet is:","o":["Connect to the router's network","Connect the laptop to the venue WiFi and confirm it works","Power the cameras","Open the tablet"],"a":1,"e":"Confirm the venue WiFi works on the laptop first; if the venue line is dead, nothing downstream will work. Connecting to the router, powering cameras, or opening the tablet all come after you know the internet is good."},{"q":"After the venue WiFi, you:","o":["Power the cameras","Connect to the router's own network and open its admin page","Zero the scale","Do nothing"],"a":1,"e":"Connect to the router's network and open its admin page to repeat the venue WiFi. Powering cameras comes after the router is online, zeroing the scale is a separate setup task, and doing nothing stalls the build."},{"q":"Devices connect to the travel router by:","o":["Cable","WiFi, with the router on wall power","Bluetooth","They do not connect"],"a":1,"e":"By WiFi, with the router on wall power for stability. Cable and Bluetooth are not how the kit is designed, and the devices clearly do need to connect."},{"q":"A camera goes down right before opening. You:","o":["Open anyway","Pause until it is fixed; full coverage is required","Cover just that area","Ignore it"],"a":1,"e":"Pause until it is fixed: running without full coverage is not allowed. Opening anyway, covering one spot manually, or ignoring it all leave a blind spot the policy forbids."},{"q":"Each shipping box is:","o":["Unlimited in value","Capped at the set maximum value","Limited to one item","Any amount"],"a":1,"e":"Capped at the set maximum value to limit risk per box. Unlimited value or any amount defeats the cap, and a one-item limit is not the rule."},{"q":"A camera goes down during the show. You:","o":["Keep going","Pause the show; full coverage is required","Cover it with tape","Ignore it"],"a":1,"e":"Pause the show until coverage is restored; continuing, taping, or ignoring it breaks the security requirement."},{"q":"The router connection order starts with:","o":["Plug in devices by cable","Laptop to venue WiFi, then router network, then admin page","Admin page first","Random order"],"a":1,"e":"Start by connecting the laptop to venue WiFi, then the router network, then the admin page; cabling devices or random order breaks setup."},{"q":"Cameras must cover:","o":["Only the door","The scale, both sides of the table, the back table, and the entry","Only the scale","Nothing specific"],"a":1,"e":"Cover the scale, both table sides, the back table, and the entry; partial coverage fails the requirement."},{"q":"You start connecting show devices to the router by cable. The correct method is:","o":["Cable is best","Join devices by WiFi and keep the router on wall power","Use a phone hotspot","Skip the router"],"a":1,"e":"Connect devices by WiFi and keep the router on wall power; cabling, a phone hotspot, or skipping the router is not the setup."},{"q":"A box of inventory to ship should be:","o":["Stuffed and taped any way","Value-capped, taped bottom-middle-overlap, labeled city, state, box number, with tracking recorded","Unlabeled","Sent without tracking"],"a":1,"e":"Cap the value, tape bottom-middle-overlap, label city, state, and box number, and record tracking; sloppy or untracked shipping risks loss."},{"q":"Recent firearms or breakable items in a shipment are:","o":["Shipped normally","Not shipped","Shipped loose","Shipped with the coins"],"a":1,"e":"Recent firearms and breakables are not shipped; shipping them normally, loose, or with coins is against the rules."}],"comp":"Have the trainee set up the router and cameras in the correct order, demonstrate full coverage and the pause-if-a-camera-is-down rule, and state the shipping rules. Pass only on a correct, complete setup."},{"id":"m3a.3","name":"Floor Leadership and Deal Approval","passMark":85,"lessonHTML":"\n   <div class=\"outcome\"><b>What you'll be able to do</b><br>After this module you can lead the floor, approve deals within your authority, handle disputes, and close out the show cleanly.</div>\n   <h2>Morning Huddle</h2>\n   <p>Keep it short. Cover yesterday's result, today's appointments, one reminder, and one quick role-play. End with energy.</p>\n   <h2>Approving Deals</h2>\n   <ul>\n   <li>If a deal stays healthy within the pricing rules, approve it.</li>\n   <li>If it is borderline but the customer is likely to return, you may approve it and note why.</li>\n   <li>If it breaks the rules, do not approve it; pivot to consignment.</li>\n   <li>Unusual or rare items go to the numismatist or specialist regardless of size.</li>\n   <li>Deals above your authority go up to leadership.</li>\n   </ul>\n   <h2>Disputes and Crowd Control</h2>\n   <p>Stay calm. Use the camera footage to walk a customer through exactly what happened; transparency settles most disputes. On busy days, greet and set wait-time expectations so no one feels ignored. Document any incident in the team channel.</p>\n   <h2>Closing the Show</h2>\n   <p>Stop taking new customers near the end, complete the final count, ship the final boxes with tracking, settle the venue, and post a short show summary to the team.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>Approvals follow the rules, not the moment. Borderline calls get documented. Disputes get solved with the footage, not argument. Every approval and incident is logged so the whole picture stays visible.</div>\n   <div class=\"takeaways\"><h3>Key Takeaways</h3><ul>\n   <li>Keep the morning huddle short: yesterday, today, one reminder, one role-play, energy.</li>\n   <li>Approve deals that stay within the rules; document borderline ones; reject rule-breaking and pivot to consignment.</li>\n   <li>Unusual or rare items go to the numismatist or specialist regardless of size.</li>\n   <li>Deals above your authority go up to leadership.</li>\n   <li>Solve disputes calmly using the camera footage.</li>\n   <li>On busy days, greet and set wait-time expectations.</li>\n   <li>Close the show: stop new customers, final count, ship with tracking, settle the venue, post a summary.</li>\n   </ul></div>","test":[{"q":"The morning huddle should be:","o":["An hour long","Short: yesterday, today, one reminder, one role-play","Skipped","A lecture"],"a":1,"e":"Keep the huddle short and energetic; an hour, a lecture, or skipping it all drain or lose the team."},{"q":"A deal that stays within the pricing rules is:","o":["Rejected","Approved","Escalated always","Ignored"],"a":1,"e":"A rule-compliant deal is approved; rejecting, always escalating, or ignoring it wastes a clean deal."},{"q":"A borderline deal with a likely repeat customer can be:","o":["Never approved","Approved with a note explaining why","Approved silently","Reported to police"],"a":1,"e":"You may approve and document the reason; never approving is too rigid, approving silently hides the call, and police make no sense."},{"q":"A deal that breaks the rules should be:","o":["Approved anyway","Rejected, then pivot to consignment","Hidden","Doubled"],"a":1,"e":"Reject it and pivot to consignment; approving anyway or doubling it breaks the rules, and hiding it is dishonest."},{"q":"Unusual or rare items go to:","o":["The trash","The numismatist or specialist","The customer","No one"],"a":1,"e":"Route unusual or rare items to the numismatist or specialist; the trash, the customer, or 'no one' could destroy or miss value."},{"q":"Deals above your authority go:","o":["Nowhere","Up to leadership","To a peer","To the customer"],"a":1,"e":"Escalate above-authority deals to leadership; 'nowhere', a peer, or the customer cannot approve them."},{"q":"How do you settle most disputes?","o":["Argue","Use the camera footage to walk them through it","Refund everything","Call the police first"],"a":1,"e":"Use the camera footage to walk them through it; arguing escalates, refunding everything is no fix, and police are a last resort."},{"q":"On busy days you should:","o":["Ignore the wait","Greet and set wait-time expectations","Lock the door","Turn people away"],"a":1,"e":"Greet and set honest wait times; ignoring the wait, locking the door, or turning people away loses leads and goodwill."},{"q":"Incidents are:","o":["Forgotten","Documented in the team channel","Kept secret","Posted publicly"],"a":1,"e":"Document incidents in the team channel; forgetting, keeping them secret, or posting publicly are all wrong."},{"q":"Closing the show includes:","o":["Leaving early","Final count, ship with tracking, settle venue, post a summary","Nothing","Only a summary"],"a":1,"e":"Closing is the final count, shipping with tracking, settling the venue, and a summary; leaving early, doing nothing, or only a summary leaves it unfinished."},{"q":"Approvals follow:","o":["The mood of the moment","The rules","The customer's demand","Luck"],"a":1,"e":"Approvals follow the rules, not the mood of the moment, the customer's demand, or luck."},{"q":"A deal stays within the pricing rules. You:","o":["Reject it","Approve it","Escalate it always","Ignore it"],"a":1,"e":"Approve it: a rule-compliant deal is exactly what your authority is for. Rejecting or always escalating wastes a clean deal, and ignoring it leaves the buyer waiting."},{"q":"An unusual rare item comes to the floor. You:","o":["Price it fast","Route it to the numismatist or specialist regardless of size","Reject it","Melt it"],"a":1,"e":"Route it to the specialist regardless of size: rare items are easy to misjudge. Pricing fast risks a costly miss, rejecting loses it, and melting could destroy real value."},{"q":"A deal above your authority should be:","o":["Approved by you","Escalated to leadership","Rejected","Ignored"],"a":1,"e":"Escalated to leadership, since it is beyond your approval limit. Approving it yourself oversteps, and rejecting or ignoring it loses a deal that leadership might want."},{"q":"A customer disputes what happened at the table. You:","o":["Argue with them","Stay calm and use the camera footage to walk them through it","Refund random cash","Call the police first"],"a":1,"e":"Stay calm and use the footage: transparency settles most disputes. Arguing escalates, refunding random cash is not a fix, and police are a last resort, not the first move."},{"q":"As floor lead, you approve a deal by:","o":["Trusting the buyer blindly","Checking it follows pricing and MAX Face","Approving everything","Approving nothing"],"a":1,"e":"Approve by checking pricing and MAX Face; blind trust, approve-all, or approve-none are not leadership."},{"q":"A buyer brings a borderline deal for approval. You:","o":["Reject it outright","Review it against the rules and approve or send to consignment","Approve to be nice","Ignore them"],"a":1,"e":"Review against the rules and approve or route to consignment; outright rejection, niceness, or ignoring fail the floor-lead role."},{"q":"Floor leadership mainly means:","o":["Doing only your own deals","Keeping the team on-process and protecting margins","Talking the most","Avoiding decisions"],"a":1,"e":"It means keeping the team on-process and protecting margins; not just your own deals, talking, or avoiding decisions."},{"q":"A buyer brings a deal that exceeds MAX Face. As floor lead you:","o":["Approve it","Decline the buy and route to consignment","Look away","Pay the difference"],"a":1,"e":"Decline the over-MAX buy and route to consignment; approving, ignoring, or paying the difference breaks the ceiling."},{"q":"A buyer is off-process on the floor. You:","o":["Ignore it","Coach them back on-process","Fire them on the spot","Take their deals"],"a":1,"e":"Coach them back on-process; ignoring, firing on the spot, or taking their deals is not leadership."},{"q":"Approving a deal means confirming it:","o":["Looks profitable to you","Follows pricing and MAX Face","Is fast","Has a happy customer"],"a":1,"e":"Approval confirms it follows pricing and MAX Face; a gut feel, speed, or mood is not the standard."},{"q":"As floor lead your job is to protect:","o":["Only your own deals","Margin and process across the team","Your break time","The schedule only"],"a":1,"e":"Protect margin and process across the team; it is not just your deals, your breaks, or the schedule."}],"comp":"Give the trainee sample deals to approve or decline and a floor scenario to lead. Pass only if approvals follow pricing and MAX Face and they keep the team on-process."},{"id":"m3a.4","name":"Roadshow Numbers (P&L)","passMark":85,"lessonHTML":"\n   <div class=\"outcome\"><b>What you'll be able to do</b><br>After this module you can build a simple show profit and loss and write a useful after-action review.</div>\n   <h2>The Simple P&L</h2>\n   <ul>\n   <li><strong>Revenue:</strong> the resale value of everything bought.</li>\n   <li><strong>Cost of goods:</strong> what you actually paid sellers.</li>\n   <li><strong>Gross profit:</strong> revenue minus cost of goods.</li>\n   <li><strong>Direct expenses:</strong> venue, marketing, payroll, travel, supplies, shipping.</li>\n   <li><strong>Net result:</strong> gross profit minus direct expenses.</li>\n   </ul>\n   <p>Flag any expense that runs well over its budget.</p>\n   <h2>After-Action Review</h2>\n   <p>Within a day or two of the show, write a short review: what worked, what did not (with the real reason), anything unusual, and recommendations for the next show in that area. Include the P&L summary.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>Report the real numbers, including the parts that did not go well. The review is most valuable when it is honest; it feeds directly into planning the next show.</div>\n   <div class=\"takeaways\"><h3>Key Takeaways</h3><ul>\n   <li>Revenue is the resale value of everything bought.</li>\n   <li>Cost of goods is what you paid sellers.</li>\n   <li>Gross profit is revenue minus cost of goods.</li>\n   <li>Net result is gross profit minus direct expenses (venue, marketing, payroll, travel, supplies, shipping).</li>\n   <li>Flag expenses that run well over budget.</li>\n   <li>Write a short, honest after-action review within a day or two, including the P&L summary.</li>\n   </ul></div>","test":[{"q":"Revenue in the show P&L is:","o":["Cash on hand","The resale value of everything bought","Profit","The venue cost"],"a":1,"e":"Revenue is the resale value of what was bought; cash on hand is a balance, profit is after costs, and the venue is an expense."},{"q":"Cost of goods is:","o":["The venue cost","What you actually paid sellers","Marketing","Travel"],"a":1,"e":"Cost of goods is what you paid sellers; venue, marketing, and travel are expenses, not cost of goods."},{"q":"Gross profit equals:","o":["Revenue plus cost of goods","Revenue minus cost of goods","Cost minus revenue","Revenue times two"],"a":1,"e":"Gross profit is revenue minus cost of goods; adding them, reversing them, or doubling revenue is not the formula."},{"q":"Net result equals:","o":["Gross profit minus direct expenses","Revenue minus nothing","Cost of goods only","Gross profit plus expenses"],"a":0,"e":"Net result is gross profit minus direct expenses; revenue alone, cost of goods alone, or adding expenses back is wrong."},{"q":"Which is a direct expense?","o":["Resale value","Venue cost","Coin rarity","Customer mood"],"a":1,"e":"Venue cost is a direct expense; resale value is revenue, and coin rarity and customer mood are not expenses."},{"q":"You should flag expenses that:","o":["Are on budget","Run well over budget","Are small","Are paid"],"a":1,"e":"Flag expenses that run well over budget; on-budget, small, or already-paid items do not need flagging."},{"q":"When is the after-action review written?","o":["A month later","Within a day or two of the show","Never","Before the show"],"a":1,"e":"Write it within a day or two while fresh; a month later loses accuracy, never skips the learning, and before the show there is nothing to review."},{"q":"The review should include:","o":["Only wins","What worked, what did not with the real reason, anything unusual, recommendations","Only the P&L","Nothing"],"a":1,"e":"Include wins, losses with the real reason, anything unusual, and recommendations; only wins, only the P&L, or nothing is incomplete."},{"q":"The review is most valuable when it is:","o":["Short on detail","Honest, including what went wrong","All positive","Hidden"],"a":1,"e":"It is most valuable when honest about what went wrong; thin detail, all-positive, or hidden makes it useless."},{"q":"The review feeds into:","o":["The trash","Planning the next show","Nothing","Marketing only"],"a":1,"e":"The review feeds planning the next show; not the trash, nothing, or marketing only."},{"q":"An expense runs well over budget. You:","o":["Hide it","Flag it","Ignore it","Pay it quietly"],"a":1,"e":"Flag it so it can be understood and controlled. Hiding, ignoring, or quietly paying a big overage lets the same problem repeat."},{"q":"The after-action review is written:","o":["A month later","Within a day or two of the show","Never","Before the show"],"a":1,"e":"Within a day or two, while the details are fresh and useful for the next show. A month later loses accuracy, never skips the learning, and before the show there is nothing to review."},{"q":"The review is most useful when it is:","o":["All positive","Honest, including what went wrong","Just the P&L","Hidden"],"a":1,"e":"Honest, including what went wrong, because that is what improves the next show. All-positive hides problems, the P&L alone is only numbers, and a hidden review helps no one."},{"q":"A show profit and loss subtracts from gross:","o":["Nothing","Travel, venue, shipping, staffing, marketing, and lead costs","Only rent","Only payroll"],"a":1,"e":"A show P&L subtracts travel, venue, shipping, staffing, marketing, and lead costs; not nothing or a single line."},{"q":"Lead-referrer costs:","o":["Do not matter","Reduce net profit before any bonus is calculated","Increase net","Are ignored"],"a":1,"e":"Lead costs reduce net before bonus; they clearly matter and do not increase net or get ignored."},{"q":"A show with high gross but heavy costs:","o":["Always nets well","May net little; watch the P&L, not just gross","Cannot happen","Needs no review"],"a":1,"e":"High gross with heavy costs can net little, so watch the P&L; it is not always profitable or unreviewable."},{"q":"To improve net profit, you:","o":["Only chase volume","Raise margin per deal and control costs","Spend more on everything","Ignore costs"],"a":1,"e":"Improve net by raising margin and controlling costs; volume alone, more spending, or ignoring costs do not."},{"q":"Reviewing the P&L after each show lets you:","o":["Feel good","Find and fix what hurt margin next time","Skip planning","Avoid numbers"],"a":1,"e":"The review lets you fix margin issues next time; it is not just morale, and it does not replace planning or avoid numbers."},{"q":"Bonuses and step-ups are calculated on:","o":["Gross revenue","Net profit","Number of customers","Hours worked"],"a":1,"e":"They are calculated on net profit, not gross, headcount, or hours."},{"q":"Two shows have equal gross but one nets more because:","o":["Luck","Lower costs and higher margin per deal","More customers","Longer hours"],"a":1,"e":"Lower costs and higher margin drive better net at equal gross; luck, headcount, or hours are not the reason."},{"q":"Lead-referrer fees hit:","o":["Gross only","Net before any bonus","Nothing","A separate budget"],"a":1,"e":"Referrer fees reduce net before bonus; they are not gross-only, irrelevant, or off-budget."},{"q":"To read a show's true health, look at:","o":["Gross alone","Net profit","Customer count","Hours worked"],"a":1,"e":"Net profit shows true health; gross alone, headcount, or hours can mislead."}],"comp":"Have the trainee build or read a show profit and loss from sample numbers, including lead and travel costs. Pass only if the math is right and they can explain what drove net profit."},{"id":"m3a.5","name":"Solo Shows and Promotion","passMark":85,"lessonHTML":"\n   <div class=\"outcome\"><b>What you'll be able to do</b><br>After this module you know exactly what it takes to be certified as a Roadshow Sales Manager.</div>\n   <h2>Run Shows Solo</h2>\n   <p>Lead two shows back to back on your own, hitting the net result target and keeping full camera coverage, strong reviews, and clean shipping.</p>\n   <h2>The Promotion Gate</h2>\n   <ul>\n   <li>Enough consistent time in the role.</li>\n   <li>Two solo shows that hit the net result target.</li>\n   <li>Healthy margins on show deals.</li>\n   <li>No rule or compliance issues.</li>\n   <li>Full camera coverage every show day.</li>\n   <li>Strong customer reviews each show.</li>\n   <li>Clean shipping with no errors.</li>\n   </ul>\n   <p>Leadership certifies based on the numbers and your after-action reviews.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>Certification is earned on results across two real solo shows, not on a single good day. The standard is consistency you can repeat.</div>\n   <div class=\"takeaways\"><h3>Key Takeaways</h3><ul>\n   <li>Lead two solo shows back to back hitting the net result target.</li>\n   <li>Maintain full camera coverage, strong reviews, and clean shipping.</li>\n   <li>The gate also requires consistent time, healthy margins, and no rule or compliance issues.</li>\n   <li>Leadership certifies based on the numbers and your after-action reviews.</li>\n   <li>Certification is about repeatable consistency, not one good day.</li>\n   </ul></div>","test":[{"q":"How many solo shows are required?","o":["One","Two back to back","Three","Five"],"a":1,"e":"Two solo shows back to back prove consistency; one is too few, and three or five is more than required."},{"q":"Camera coverage during solo shows must be:","o":["Partial","Full every show day","Optional","Off"],"a":1,"e":"Coverage must be full every show day; partial, optional, or off leaves gaps the standard forbids."},{"q":"Shipping during the gate must be:","o":["Fast only","Clean with no errors","Cheap","Skipped"],"a":1,"e":"Shipping must be clean with no errors; fast-only, cheap, or skipped does not meet the bar."},{"q":"Solo shows must hit the:","o":["Review target only","Net result target","Camera target only","Nothing"],"a":1,"e":"Hit the net result target, the bottom-line measure; reviews and cameras are separate gates, and 'nothing' is not the standard."},{"q":"Reviews each show must be:","o":["Ignored","Strong","Negative","Optional"],"a":1,"e":"Reviews each show must be strong; ignored, negative, or optional fails the gate."},{"q":"Who certifies the promotion?","o":["A peer","Leadership","HR only","The venue"],"a":1,"e":"Leadership certifies on the numbers and reviews; a peer, HR alone, or the venue cannot."},{"q":"Certification is based on:","o":["One good day","Results across two real solo shows","Tenure alone","A single review"],"a":1,"e":"Certification is based on results across two real solo shows; one good day, tenure, or a single review does not prove repeatability."},{"q":"A gate item is no:","o":["Reviews","Rule or compliance issues","Sales","Shipping"],"a":1,"e":"The gate is no rule or compliance issues; reviews, sales, and shipping are things you want, not things you want zero of."},{"q":"Margins on show deals must be:","o":["Negative","Healthy","Ignored","Hidden"],"a":1,"e":"Margins must be healthy; negative, ignored, or hidden margins fail."},{"q":"Leadership also reviews your:","o":["Lunch logs","After-action reviews","Commute","Phone bill"],"a":1,"e":"Leadership also reviews your after-action reviews; lunch logs, your commute, and your phone bill are irrelevant."},{"q":"How many solo shows are required for certification?","o":["One","Two back to back","Three","Five"],"a":1,"e":"Two back to back, to prove repeatable consistency rather than one good day. One is not enough to prove it, and three or five is more than the standard requires."},{"q":"Certification requires how many solo shows?","o":["One","Two back to back with strong numbers","Five","None"],"a":1,"e":"Two back-to-back solo shows with strong numbers are required; one, five, or none is not the standard."},{"q":"Compliance issues allowed to certify:","o":["A few","None","Some","Many"],"a":1,"e":"None are allowed; a few, some, or many all fail the gate."},{"q":"One great show is not enough because:","o":["It never happens","Two back to back proves repeatable consistency","Leadership is strict for no reason","Shows do not matter"],"a":1,"e":"Two back-to-back shows prove repeatable consistency, which one good day does not."},{"q":"After-action reviews show leadership that you:","o":["Can talk well","Can read and fix your own numbers","Are popular","Showed up"],"a":1,"e":"They show you can read and fix your own numbers; not that you talk well, are popular, or merely attended."},{"q":"A solo show with strong numbers but a rule violation:","o":["Still certifies","Fails the gate; compliance must be clean","Counts double","Is overlooked"],"a":1,"e":"A rule violation fails the gate regardless of numbers; it does not still certify, count double, or get overlooked."},{"q":"Solo shows required to certify:","o":["One","Two back to back","Four","None"],"a":1,"e":"Two back-to-back solo shows are required; one, four, or none is not the standard."},{"q":"The promotion is certified by:","o":["A peer","Leadership, on numbers and reviews","HR alone","The crew"],"a":1,"e":"Leadership certifies on numbers and reviews; a peer, HR alone, or the crew cannot."},{"q":"One strong show is insufficient because certification needs:","o":["Just one good day","Repeatable consistency across two shows","A big single deal","A long tenure"],"a":1,"e":"It needs repeatable consistency across two shows, not one day, one deal, or tenure."},{"q":"A rule violation on an otherwise strong show:","o":["Is fine","Fails the gate","Counts double","Is ignored"],"a":1,"e":"A violation fails the gate regardless of strong numbers."},{"q":"After-action reviews demonstrate that you:","o":["Talk well","Can read and fix your own numbers","Are liked","Were present"],"a":1,"e":"They show you can read and fix your numbers, not that you talk well, are liked, or attended."},{"q":"Your two solo shows were strong, but one had an unrecorded check. Certification:","o":["Proceeds","Is blocked until compliance is clean","Counts as one show","Is automatic"],"a":1,"e":"An unrecorded check is a compliance issue that blocks certification until it is clean; strong numbers do not override it."},{"q":"Leadership reviews your solo results by looking at:","o":["Your attendance","The numbers and your after-action reviews","Your popularity","Your tenure"],"a":1,"e":"They review the numbers and your after-action reviews; attendance, popularity, and tenure are not the basis."},{"q":"Two shows are required rather than one to prove:","o":["Luck","Repeatable consistency","Stamina","Loyalty"],"a":1,"e":"Two shows prove repeatable consistency, not luck, stamina, or loyalty."}],"comp":"Verify the trainee has run the required two solo shows back to back with strong numbers and a clean compliance record, and can present the after-action reviews. Pass only on verified real results."}]},{"id":"tier3b","n":"IIIB","name":"Local Office Manager","sub":"5 modules","modules":[{"id":"m3b.1","name":"Office Operations","passMark":85,"lessonHTML":"\n   <div class=\"outcome\"><b>What you'll be able to do</b><br>After this module you can open and close the office, manage walk-in flow, and keep inventory secure, step by step.</div>\n   <h2>Daily Open</h2>\n   <ol>\n   <li>Disarm the alarm, lights and air on.</li>\n   <li>Power the cameras, scale, monitor, printer, and tablet.</li>\n   <li>Confirm the cameras are live.</li>\n   <li>Confirm yesterday's close was reconciled.</li>\n   <li>Print transaction sheets and stock the customer area.</li>\n   <li>Unlock the inventory and confirm the count matches.</li>\n   <li>Post an open confirmation to the team channel.</li>\n   </ol>\n   <h2>Daily Close</h2>\n   <ol>\n   <li>Stop new appointments before closing time.</li>\n   <li>Complete the final count and reconcile to zero difference.</li>\n   <li>Lock the inventory; leave the cameras running.</li>\n   <li>Arm the alarm and post a close confirmation with the final count.</li>\n   </ol>\n   <h2>Walk-In Flow</h2>\n   <p>Greet and have them sign in. Ask what they brought so you can estimate how long it will take. Protect scheduled appointments; if a walk-in must wait, set a clear, honest wait time or offer to come back.</p>\n   <h2>Inventory Security</h2>\n   <p>Ship items out on a regular schedule and when value reaches the set level. Do not let on-site value climb past the cap; if it does, ship promptly.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>Open and close the same way every day and reconcile to zero. Consistent routines and a clean count are how problems get caught early and inventory stays safe.</div>\n   <div class=\"takeaways\"><h3>Key Takeaways</h3><ul>\n   <li>Open: disarm, power and confirm cameras, check yesterday's close, print sheets, unlock and verify inventory, post an open confirmation.</li>\n   <li>Close: stop new appointments, final count to zero difference, lock inventory, leave cameras on, arm alarm, post a close confirmation.</li>\n   <li>Walk-ins: greet, sign in, ask what they brought, protect scheduled appointments, set honest wait times.</li>\n   <li>Ship on a schedule and when value reaches the set level; never let on-site value pass the cap.</li>\n   <li>Reconcile to zero every day.</li>\n   </ul></div>","test":[{"q":"What is done first at open?","o":["Print sheets","Disarm the alarm and turn on lights and air","Lock inventory","Final count"],"a":1,"e":"First disarm the alarm and power up; printing sheets, locking inventory, and the final count are not the opening step."},{"q":"Before the first customer you confirm:","o":["The coffee","The cameras are live","The weather","The mail"],"a":1,"e":"Confirm the cameras are live before the first customer; the coffee, weather, and mail are not the safety check."},{"q":"At close, the final count should reconcile to:","o":["Within fifty dollars","Zero difference","Any number","Twenty dollars"],"a":1,"e":"The count must reconcile to zero; off by fifty or twenty dollars, or 'any number', means money is unaccounted for."},{"q":"Cameras at close are:","o":["Turned off","Left running","Unplugged","Covered"],"a":1,"e":"Leave the cameras running so inventory stays watched; turning them off, unplugging, or covering them creates a blind spot."},{"q":"For a walk-in you first:","o":["Price items","Greet and have them sign in","Send them away","Ignore the schedule"],"a":1,"e":"Greet a walk-in and have them sign in first; pricing items, sending them away, or ignoring the schedule comes before you even know what they have."},{"q":"Why ask what a walk-in brought?","o":["To reject them","To estimate how long it will take","To charge a fee","No reason"],"a":1,"e":"Ask what they brought to estimate time and manage flow; not to reject them, charge a fee, or for no reason."},{"q":"A walk-in during a scheduled appointment should:","o":["Bump the appointment","Get an honest wait time or an offer to return","Be turned away","Be ignored"],"a":1,"e":"A walk-in during an appointment gets an honest wait time or an offer to return; bumping the appointment, turning them away, or ignoring them is wrong."},{"q":"Inventory is shipped:","o":["Never","On a regular schedule and when value reaches the set level","Once a year","Only when asked"],"a":1,"e":"Ship inventory on a regular schedule and at the set value level; never, once a year, or only when asked lets risk build."},{"q":"If on-site value passes the cap you:","o":["Leave it","Ship promptly","Hide it","Buy more"],"a":1,"e":"Ship promptly when on-site value passes the cap; leaving it, hiding it, or buying more pushes you further over the safe limit."},{"q":"You post confirmations to the team channel:","o":["Never","At open and at close","Only at open","Only at close"],"a":1,"e":"Post confirmations at both open and close; never, open-only, or close-only leaves a gap."},{"q":"At open you verify the inventory count:","o":["Never","Matches yesterday's close","Is zero","Is ignored"],"a":1,"e":"Verify the count matches yesterday's close; it is not 'never', zero, or ignored."},{"q":"The first thing at open is:","o":["Print sheets","Disarm the alarm, power up, and confirm cameras are live","Lock inventory","Final count"],"a":1,"e":"Disarm, power up, and confirm cameras are live before anything else. Printing sheets comes after, inventory is unlocked at open not locked, and the final count is a closing task."},{"q":"A walk-in arrives during a scheduled appointment. You:","o":["Bump the appointment","Protect the appointment; give an honest wait time or offer to return","Turn the walk-in away","Ignore the schedule"],"a":1,"e":"Protect the scheduled appointment and set an honest wait time or offer to return. Bumping the appointment punishes the person who planned ahead, turning the walk-in away loses a lead, and ignoring the schedule creates chaos."},{"q":"On-site value passes the cap. You:","o":["Leave it","Ship promptly","Hide it","Buy more"],"a":1,"e":"Ship promptly to bring on-site value back under the cap and limit risk. Leaving it, hiding it, or buying more all push the office further past the safe limit."},{"q":"The daily open includes:","o":["Just unlocking the door","Securing inventory, prepping the floor, and readiness checks","Counting cash only","Nothing set"],"a":1,"e":"The open is securing inventory, prepping the floor, and readiness checks; not just the door, cash only, or improvised."},{"q":"A walk-in arrives. You:","o":["Send them away","Sign them in, check the CRM, and route them to a buyer","Quote a price at the door","Ignore them"],"a":1,"e":"Sign in, check the CRM, and route to a buyer; sending away, door-quoting, or ignoring loses the lead."},{"q":"Inventory security means:","o":["Leaving it on the counter","Controlled, logged access, never left exposed","Trusting everyone","No tracking"],"a":1,"e":"Security is controlled, logged access with nothing left exposed; the others invite loss."},{"q":"The daily close includes:","o":["Just locking up","Reconciling, securing inventory, and logging the day","Leaving early","Nothing set"],"a":1,"e":"The close is reconciling, securing inventory, and logging the day; not just locking up or leaving."},{"q":"A walk-in with no appointment is:","o":["Turned away","Still signed in and entered as a lead","Ignored","Charged a fee"],"a":1,"e":"They are still signed in and entered as a lead; turning away, ignoring, or charging is wrong."},{"q":"A well-run office depends on:","o":["Improvising daily","Consistent open and close routines","One person doing everything","Skipping reconciliation"],"a":1,"e":"Consistent routines run the office; improvising, one-person dependence, or skipping reconciliation break it."},{"q":"A walk-in arrives with no appointment. You:","o":["Turn them away","Sign them in, check the CRM, and route them to a buyer","Quote at the door","Ignore them"],"a":1,"e":"Sign in, check the CRM, and route to a buyer; turning away, door-quoting, or ignoring loses the lead."},{"q":"Inventory is kept:","o":["On the counter","Secured with controlled, logged access","Wherever convenient","Unlocked"],"a":1,"e":"Inventory is secured with controlled, logged access; the other options invite loss."}],"comp":"Have the trainee open and close the office, manage a mock walk-in (sign in, check CRM, route), and demonstrate inventory security. Pass only on a correct open/close and secure handling."},{"id":"m3b.2","name":"Local Marketing and Reviews","passMark":85,"lessonHTML":"\n   <div class=\"outcome\"><b>What you'll be able to do</b><br>After this module you can keep the office's online presence strong, collect reviews steadily, and handle a bad review the right way.</div>\n   <h2>Online Presence</h2>\n   <p>Post to the office's business profile on a regular weekly schedule using the marketing lead's content. Consistent posting keeps the office visible in local search.</p>\n   <h2>Collecting Reviews</h2>\n   <p>Ask for a review in person on every closed deal. If it is missed, follow up by message soon after. Keep a steady flow of named reviews; volume keeps the rating strong.</p>\n   <h2>Handling a Bad Review</h2>\n   <p>A low review should alert both you and leadership quickly. Look up the customer, draft a calm response, get leadership's approval before posting, then call the customer and try to make it right. A respectful, prompt response protects the rating more than arguing ever could.</p>\n   <h2>Partnerships</h2>\n   <p>Build local referral relationships (for example with estate attorneys and similar professionals). Track who refers and focus on the partners who actually send business.</p>\n   <div class=\"standard\"><b>Operating Standard</b><br>Ask for the review in person on every closed deal, and never post a public response to a bad review without leadership's approval first. Volume of good reviews and a careful response to bad ones is what protects the rating.</div>\n   <div class=\"takeaways\"><h3>Key Takeaways</h3><ul>\n   <li>Post to the business profile on a regular weekly schedule using marketing's content.</li>\n   <li>Ask for a review in person on every closed deal; follow up by message if missed.</li>\n   <li>A steady volume of named reviews keeps the rating strong.</li>\n   <li>A bad review alerts you and leadership; draft a calm response and get approval before posting.</li>\n   <li>Call the customer and try to make it right.</li>\n   <li>Build and track local referral partnerships; focus on partners who send business.</li>\n   </ul></div>","test":[{"q":"How often do you post to the business profile?","o":["Never","On a regular weekly schedule","Once a year","Hourly"],"a":1,"e":"Post on a regular weekly schedule; never goes dark, once a year is too rare, and hourly is overkill."},{"q":"Whose content do you use for posts?","o":["Random images","The marketing lead's content","Competitor content","None"],"a":1,"e":"Use the marketing lead's content; random images, competitor content, or none would stray off-brand."},{"q":"When do you ask for a review?","o":["Never","In person on every closed deal","Only by email","Once a month"],"a":1,"e":"Ask in person on every closed deal, when goodwill is highest; never, email-only, or once a month leaves reviews uncollected."},{"q":"If an in-person review is missed you:","o":["Forget it","Follow up by message soon after","Wait a year","Give up"],"a":1,"e":"Follow up by message soon after; forgetting it, waiting a year, or giving up loses the review."},{"q":"What keeps the rating strong?","o":["One review","A steady volume of named reviews","No reviews","Hiding reviews"],"a":1,"e":"A steady volume of named reviews keeps it strong; one review is fragile, and no reviews or hiding them leaves it weak."},{"q":"A bad review should alert:","o":["Only you","You and leadership quickly","No one","The customer only"],"a":1,"e":"A bad review should alert both you and leadership quickly; you-only, no one, or the customer-only delays the response."},{"q":"Before posting a response to a bad review you:","o":["Post immediately","Get leadership's approval","Delete the review","Argue"],"a":1,"e":"Get leadership approval before posting, since a public reply represents the office; posting immediately, deleting, or arguing can backfire."},{"q":"After approval you:","o":["Do nothing","Call the customer and try to make it right","Block them","Post again"],"a":1,"e":"After approval, call the customer to make it right; doing nothing, blocking them, or posting again does not resolve it."},{"q":"What protects the rating more than arguing?","o":["Nothing","A respectful, prompt response","Deleting reviews","Ignoring them"],"a":1,"e":"A respectful, prompt response protects the rating; nothing, deleting reviews, or ignoring them does not."},{"q":"With referral partners you should:","o":["Treat all equally forever","Track who refers and focus on those who send business","Pay everyone","Avoid them"],"a":1,"e":"Track referrals and focus on the partners who send business; treating all equally forever, paying everyone, or avoiding them ignores results."},{"q":"You post to the business profile:","o":["Never","On a regular weekly sche
